<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Game Hub</title>
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#8f111d" />
  <style>
    :root{
      --bg:#f5f6f8;
      --surface:#ffffff;
      --surface-2:#f8fafc;
      --ink:#101828;
      --muted:#667085;
      --line:#e4e7ec;
      --brand:#b4232f;
      --brand-dark:#821522;
      --brand-soft:#fff1f2;
      --good:#15803d;
      --warning:#b45309;
      --bad:#dc2626;
      --navy:#111827;
      --shadow:0 18px 48px rgba(16,24,40,.12);
      --shadow-soft:0 8px 24px rgba(16,24,40,.08);
      --radius:20px;
      --radius-sm:14px;
      --tap:48px;
    }
    *{box-sizing:border-box}
    html{scroll-behavior:smooth}
    body{
      margin:0;
      min-height:100vh;
      font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
      color:var(--ink);
      background:
        radial-gradient(900px 420px at -8% -10%,rgba(239,68,68,.17),transparent 65%),
        radial-gradient(850px 420px at 108% -14%,rgba(99,102,241,.13),transparent 65%),
        var(--bg);
    }
    button,input,select,textarea{font:inherit}
    button{touch-action:manipulation}
    [hidden]{display:none!important}

    .topbar{
      position:sticky;
      top:0;
      z-index:80;
      color:#fff;
      background:linear-gradient(115deg,#7f1420 0%,#b4232f 52%,#7c1730 100%);
      box-shadow:0 12px 32px rgba(55,9,16,.25);
      padding-top:env(safe-area-inset-top);
    }
    .topbar-inner{
      min-height:72px;
      max-width:1320px;
      margin:0 auto;
      padding:10px 18px;
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:16px;
    }
    .brand{display:flex;align-items:center;gap:12px;min-width:190px}
    .brand-mark{
      width:46px;height:46px;border-radius:16px;display:grid;place-items:center;
      background:rgba(255,255,255,.13);border:1px solid rgba(255,255,255,.25);
      box-shadow:0 10px 26px rgba(0,0,0,.22);font-size:23px;
    }
    .brand-title{font-size:1.08rem;font-weight:900;letter-spacing:.01em}
    .brand-sub{font-size:.76rem;color:#fecdd3;margin-top:1px}
    .main-nav{
      display:flex;align-items:center;gap:4px;padding:4px;border-radius:999px;
      background:rgba(17,24,39,.18);border:1px solid rgba(255,255,255,.16);
    }
    .nav-btn{
      border:0;background:transparent;color:#ffe4e6;cursor:pointer;border-radius:999px;
      padding:9px 15px;font-weight:800;font-size:.88rem;white-space:nowrap;transition:.18s ease;
    }
    .nav-btn:hover{background:rgba(255,255,255,.12);color:#fff}
    .nav-btn.active{background:#fff;color:#111827;box-shadow:0 5px 16px rgba(0,0,0,.18)}
    .header-actions{display:flex;align-items:center;justify-content:flex-end;gap:8px;min-width:250px}
    .header-btn{
      min-height:40px;border-radius:999px;border:1px solid rgba(255,255,255,.26);
      background:rgba(17,24,39,.16);color:#fff;padding:8px 12px;font-weight:800;
      cursor:pointer;display:inline-flex;align-items:center;gap:7px;position:relative;
    }
    .header-btn:hover{background:rgba(255,255,255,.13)}
    .count-bubble{
      min-width:20px;height:20px;padding:0 6px;border-radius:999px;background:#fff;color:var(--brand);
      display:inline-grid;place-items:center;font-size:.72rem;font-weight:900;
    }
    .daily-counts{display:inline-flex;align-items:center;gap:4px}
    .count-bubble.daily-user-count{background:#22c55e;color:#052e16}
    .count-bubble.daily-guest-count{background:#facc15;color:#422006}
    .pulse{animation:pulse .65s ease 2}
    @keyframes pulse{50%{transform:scale(1.12);box-shadow:0 0 0 7px rgba(255,255,255,.14)}}

    .dropdown-wrap{position:relative}
    .dropdown{
      position:absolute;right:0;top:calc(100% + 10px);width:min(380px,92vw);max-height:480px;
      overflow:auto;background:#fff;color:var(--ink);border:1px solid var(--line);border-radius:18px;
      box-shadow:0 24px 60px rgba(16,24,40,.24);z-index:100;
    }
    .dropdown-head{
      position:sticky;top:0;z-index:2;padding:13px 15px;border-bottom:1px solid var(--line);
      background:rgba(255,255,255,.96);backdrop-filter:blur(10px);display:flex;align-items:center;
      justify-content:space-between;gap:12px;font-weight:900;
    }
    .dropdown-body{padding:8px}
    .dropdown-empty{padding:28px 14px;text-align:center;color:var(--muted)}
    .invite-item,.member-item{
      border:1px solid var(--line);border-radius:14px;padding:11px;margin:7px;background:#fff;
    }
    .invite-top{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
    .invite-title{font-weight:900}.invite-meta{color:var(--muted);font-size:.79rem;margin-top:4px}
    .mini-actions{display:flex;gap:7px;margin-top:10px;justify-content:flex-end}

    .shell{max-width:1320px;margin:0 auto;padding:22px 18px 94px}
    .view{display:none}.view.active{display:block}

    .hero-banner{
      min-height:238px;border-radius:28px;overflow:hidden;position:relative;color:#fff;
      background:#111827;box-shadow:var(--shadow);margin-bottom:22px;
    }
    .featured-track{
      min-height:inherit;display:flex;transition:transform .58s cubic-bezier(.22,.72,.18,1);
      will-change:transform;
    }
    .featured-slide{
      --hero-a:#741524;--hero-b:#b4232f;
      min-width:100%;min-height:238px;padding:34px;display:flex;align-items:flex-end;
      position:relative;overflow:hidden;background:
        radial-gradient(460px 250px at 80% 20%,rgba(255,255,255,.18),transparent 65%),
        linear-gradient(120deg,var(--hero-a),var(--hero-b));
    }
    .featured-slide::before{
      content:"";position:absolute;inset:0;opacity:.35;pointer-events:none;
      background-image:linear-gradient(30deg,rgba(255,255,255,.08) 12%,transparent 12.5%,transparent 87%,rgba(255,255,255,.08) 87.5%,rgba(255,255,255,.08)),linear-gradient(150deg,rgba(255,255,255,.06) 12%,transparent 12.5%,transparent 87%,rgba(255,255,255,.06) 87.5%);
      background-size:80px 140px;
    }
    .featured-carousel{touch-action:pan-y;user-select:none}
    .featured-arrow{
      position:absolute;z-index:5;top:18px;width:42px;height:42px;border:1px solid rgba(255,255,255,.38);
      border-radius:50%;background:rgba(17,24,39,.42);color:#fff;display:grid;place-items:center;
      cursor:pointer;font-size:1.35rem;line-height:1;backdrop-filter:blur(8px);
      box-shadow:0 8px 22px rgba(0,0,0,.2);
    }
    .featured-arrow:hover{background:rgba(17,24,39,.7)}
    .featured-arrow.prev{right:66px}.featured-arrow.next{right:16px}
    .featured-dots{
      position:absolute;z-index:6;right:24px;bottom:18px;display:flex;align-items:center;gap:7px;
      padding:7px 9px;border-radius:999px;background:rgba(17,24,39,.38);backdrop-filter:blur(8px);
    }
    .featured-dot{
      width:8px;height:8px;padding:0;border:0;border-radius:999px;background:rgba(255,255,255,.5);
      cursor:pointer;transition:width .22s ease,background .22s ease;
    }
    .featured-dot.active{width:24px;background:#fff}
    .hero-copy{position:relative;z-index:2;max-width:680px}
    .featured-slide.has-art .hero-copy{max-width:min(680px,62%)}
    .hero-art{
      position:absolute;z-index:1;right:clamp(18px,5vw,72px);top:12px;bottom:0;
      width:min(38%,430px);display:flex;align-items:flex-end;justify-content:center;
      pointer-events:none;
    }
    .hero-art img{
      display:block;max-width:100%;max-height:100%;object-fit:contain;
      filter:drop-shadow(0 22px 28px rgba(0,0,0,.38));
    }
    .eyebrow{text-transform:uppercase;letter-spacing:.14em;font-size:.72rem;font-weight:900;color:#fecdd3}
    .hero-title{font-size:clamp(2rem,5vw,3.8rem);line-height:.95;margin:9px 0 11px;font-weight:950;letter-spacing:-.045em}
    .hero-desc{max-width:620px;color:#fff1f2;line-height:1.55;margin:0 0 20px}
    .hero-actions{display:flex;gap:10px;flex-wrap:wrap}

    .section-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin:22px 0 12px}
    .section-title{font-size:1.38rem;font-weight:950;letter-spacing:-.025em}
    .section-sub{color:var(--muted);font-size:.88rem;margin-top:4px}

    .btn{
      min-height:42px;border:1px solid var(--brand);border-radius:12px;padding:9px 14px;
      background:var(--brand);color:#fff;font-weight:850;cursor:pointer;transition:.16s ease;
      box-shadow:0 8px 18px rgba(180,35,47,.22);display:inline-flex;align-items:center;
      justify-content:center;gap:7px;
    }
    .btn:hover{background:var(--brand-dark);transform:translateY(-1px)}
    .btn:active{transform:none}.btn:disabled{opacity:.5;cursor:not-allowed;transform:none;box-shadow:none}
    .btn.secondary{background:#fff;color:var(--ink);border-color:var(--line);box-shadow:none}
    .btn.secondary:hover{background:var(--surface-2);border-color:#d0d5dd}
    .btn.ghost-light{background:rgba(255,255,255,.12);border-color:rgba(255,255,255,.45);box-shadow:none}
    .btn.danger{background:#fff;color:var(--bad);border-color:#fecaca;box-shadow:none}
    .btn.small{min-height:34px;padding:7px 10px;font-size:.78rem;border-radius:10px}
    .btn.block{width:100%}

    .card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow-soft)}
    .card-pad{padding:18px}
    .toolbar{
      padding:14px;display:grid;grid-template-columns:minmax(220px,1.7fr) repeat(3,minmax(135px,.7fr)) auto;
      gap:10px;align-items:center;margin-bottom:16px;
    }
    .field,.select,.textarea{
      width:100%;min-height:44px;border:1px solid #d0d5dd;border-radius:12px;background:#fff;
      padding:10px 12px;outline:none;color:var(--ink);transition:.16s ease;
    }
    .textarea{min-height:92px;resize:vertical}
    .field:focus,.select:focus,.textarea:focus{border-color:#fda4af;box-shadow:0 0 0 4px rgba(244,63,94,.12)}
    .label{display:block;font-size:.79rem;font-weight:850;color:#475467;margin:0 0 6px}
    .form-grid{display:grid;grid-template-columns:1fr 1fr;gap:13px}
    .form-row{margin-bottom:13px}
    .help{font-size:.76rem;color:var(--muted);margin-top:5px}

    .multi-layout{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:18px;align-items:start}
    .online-world-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));gap:14px;margin-bottom:26px}
    .online-world-card{
      --game:#0f766e;position:relative;overflow:hidden;min-height:218px;padding:19px 19px 17px 23px;
      border:1px solid var(--line);border-radius:20px;background:
        radial-gradient(280px 170px at 102% -8%,color-mix(in srgb,var(--game) 18%,transparent),transparent 68%),
        var(--surface);box-shadow:var(--shadow-soft);display:flex;flex-direction:column;gap:13px;transition:.18s ease;
    }
    .online-world-card:hover{transform:translateY(-3px);box-shadow:0 18px 36px rgba(16,24,40,.13);border-color:#d0d5dd}
    .online-world-card::before{content:"";position:absolute;left:0;top:0;bottom:0;width:6px;background:var(--game)}
    .online-world-head{display:flex;align-items:flex-start;gap:12px}
    .online-world-copy{min-width:0;flex:1}
    .online-world-title{font-size:1.05rem;font-weight:950;line-height:1.2}
    .online-world-desc{margin-top:5px;color:var(--muted);font-size:.82rem;line-height:1.45}
    .online-world-status{
      display:inline-flex;align-items:center;gap:7px;width:max-content;max-width:100%;padding:6px 10px;
      border:1px solid #abefc6;border-radius:999px;background:#ecfdf3;color:#027a48;font-size:.71rem;font-weight:900;
    }
    .online-world-status::before{content:"";width:8px;height:8px;flex:0 0 auto;border-radius:50%;background:#22c55e;box-shadow:0 0 0 4px rgba(34,197,94,.13)}
    .online-world-badges{display:flex;flex-wrap:wrap;gap:7px}
    .online-world-actions{margin-top:auto;display:flex;justify-content:flex-end}
    .online-world-actions .btn{min-height:48px;min-width:156px}
    .lobby-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:14px}
  </style>
</head>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Game Hub</title>
</head>
<body>
  <script>
    (async()=>{
      try{
        const response=await fetch("./lobby-core.html",{cache:"no-store"});
        if(!response.ok)throw new Error(`Could not load Game Hub core (${response.status}).`);
        let html=await response.text();
        const gamesMarker='const GAMES = [';
        const circuitboundEntry='{key:"circuitbound",title:"Circuitbound",emoji:"⚙️⚡",desc:"Build programmable machines from conductive blocks, signals, motors, gears, pistons, conveyors, winches, and linked structures.",route:"/game/circuitbound.html",category:"Builder",modes:["single"],featured:true},';
        if(html.includes(gamesMarker)&&!html.includes('key:"circuitbound"')){
          html=html.replace(gamesMarker,`${gamesMarker}\n      ${circuitboundEntry}`);
        }
        const patch='<script src="./lobby-catalog-organization.js" defer><\/script>';
        html=html.includes("</body>")?html.replace("</body>",patch+"</body>"):html+patch;
        document.open();
        document.write(html);
        document.close();
      }catch(error){
        console.error("Game Hub loader failed",error);
        document.body.innerHTML='<main style="font-family:system-ui;padding:32px"><h1>Game Hub could not load</h1><p>Refresh the page to try again.</p></main>';
      }
    })();
  </script>
</body>
</html>

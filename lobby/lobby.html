<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Cat’N Mice · Arcade Nexus</title>
  <script src="./lobby-showcase.js?v=6"></script>
  <script src="./lobby-library.js?v=11"></script>
  <script src="./lobby-flagships.js?v=3"></script>
  <script src="./lobby-arcade.js?v=2"></script>
</head>
<body>
  <script>
    (async()=>{
      try{
        const response=await fetch("./lobby-core.html",{cache:"no-store"});
        if(!response.ok)throw new Error(`Could not load Game Hub core (${response.status}).`);
        let html=await response.text();
        const gamesMarker='const GAMES = [';
        const catEdition={title:"Cat & Mouse",hostRoute:"/game/catandmouse/edition/?host=1",localEditionRoute:"/game/catandmouse/edition/download.html"};
        const truthGames=[
          {key:"lastsignal",title:"Last Signal",emoji:"🏹",imagePath:"/lobby/assets/game-tiles/lastsignal.jpg",desc:"Survive a first-person wilderness arena. Hunt, craft and build against 23 bots, or join a player-hosted match on desktop or mobile.",route:"https://sean-pereksta.github.io/Truth/games/last-signal/",singleRoute:"https://sean-pereksta.github.io/Truth/games/last-signal/#play",multiplayerRoute:"https://sean-pereksta.github.io/Truth/games/last-signal/#lobbies",localEditionRoute:"/hub/download.html",category:"Survival",modes:["single","multi"],launchMode:"matchmaking",guestMultiplayer:true,singleLabel:"Play in Browser",joinLabel:"Browse Lobbies",onlineStatus:"Player-hosted arenas",badges:["Up to 8 players"],featured:false},
          {key:"acornrally",title:"Acorn Rally",emoji:"🏁",imagePath:"/lobby/assets/game-tiles/acorn-rally-v2.webp",desc:"Race eight woodland drivers across forest, canyon, and coastal courses. Drift through time trials, share a split screen, or join friends in a private room.",route:"https://sean-pereksta.github.io/Truth/games/acorn-rally/",multiplayerRoute:"https://sean-pereksta.github.io/Truth/games/acorn-rally/?room=join",localEditionRoute:"https://sean-pereksta.github.io/Truth/games/acorn-rally/?download=pc",localEditionLabel:"PC Host Download",category:"Racing",modes:["single","multi"],launchMode:"matchmaking",guestMultiplayer:true,singleLabel:"Play in Browser",joinLabel:"Multiplayer",onlineStatus:"Online and local racing",badges:["Up to 8 racers","Windows host"],featured:false},
          {key:"bannerlands",title:"Bannerlands · The War of Crowns",emoji:"🏰",imagePath:"/lobby/assets/game-tiles/bannerlands-v2.webp",desc:"Command armies, conquer an isometric battlefield, and unite the realm in a war of rival houses.",route:"https://sean-pereksta.github.io/Truth/games/bannerlands/",category:"Strategy",modes:["single","multi"],liveLobbyGame:"bannerlands",hostRoute:"https://sean-pereksta.github.io/Truth/games/bannerlands/?host=1",localEditionRoute:"https://sean-pereksta.github.io/Truth/games/bannerlands/download.html",featured:false},
          {key:"monstermallexpanded",title:"Monster Mall — Expanded Edition",emoji:"🛍️",imagePath:"/lobby/assets/game-tiles/monster-mall-expanded-v2.webp",desc:"Survive a deserted 3D shopping mall after hours. Face five difficulty levels with keyboard, touch, or controller controls.",route:"https://sean-pereksta.github.io/Truth/games/monster-mall-expanded/",category:"Survival",modes:["single"],featured:false},
          {key:"pacmanblackout",title:"Pac-Man: Blackout",emoji:"👻",imagePath:"/lobby/assets/game-tiles/pacman-blackout-v2.webp",desc:"The maze is watching. Build a base, command units, and fight through fog of war in a Pac-Man strategy game with four AI difficulties.",route:"https://sean-pereksta.github.io/Truth/games/pacman/",category:"Strategy",modes:["single"],featured:false},
          {key:"pirates",title:"Pirates — Crown of the Tides",emoji:"🏴‍☠️",imagePath:"/lobby/assets/game-tiles/pirates-v2.webp",desc:"Sail the seas, trade for fortune, battle rival ships, and board enemy decks in a pirate adventure.",route:"https://sean-pereksta.github.io/Truth/games/pirates/",category:"Adventure",modes:["single"],featured:false},
          {key:"academystandards",title:"Academy Standards · The Banner Trial",emoji:"🏳️",imagePath:"/lobby/assets/game-tiles/academy-standards-v2.webp",desc:"Command your students, capture rival banners, and unite ten houses in a tactical academy contest.",route:"https://sean-pereksta.github.io/Truth/games/academy-standards/",category:"Strategy",modes:["single"],featured:false},
          {key:"operationwhiskerfall",title:"Operation Whiskerfall · MeowQuest",emoji:"🐈",imagePath:"/lobby/assets/game-tiles/operation-whiskerfall-v2.webp",desc:"Explore and liberate animal kingdoms in an open-world action adventure. Play solo or with a second player on the same device.",route:"https://sean-pereksta.github.io/Truth/games/operation-whiskerfall/",category:"Adventure",modes:["single"],featured:false}
        ];
        // Register Truth-hosted games before the shared library builds its tiles.
        for(const game of [...truthGames].reverse()){
          if(html.includes(gamesMarker)&&!html.includes(`key:"${game.key}"`)&&!html.includes(`"key":"${game.key}"`)){
            html=html.replace(gamesMarker,`${gamesMarker}\n      ${JSON.stringify(game)},`);
          }
        }
        const featuredGameKeys=new Set(["warrealms","arcanewilds","chesswarlord","chesswarlords","spacetyrants","roguecards","ironthrone"]);
        const circuitboundEntry='{key:"circuitbound",title:"Circuitbound",emoji:"⚙️⚡",desc:"Build programmable machines from conductive blocks, signals, motors, gears, pistons, conveyors, winches, and linked structures.",route:"/game/circuitbound.html",category:"Builder",modes:["single"],featured:false},';
        const mtgEntry='{key:"mtgcatalog",title:"MTG Catalog & Deck Builder",emoji:"🃏💰",desc:"Browse Magic: The Gathering cards and current prices, build decks, estimate total value, and analyze lands and mana curve.",route:"/game/MTG_Catalog_Deck_Builder.html",category:"Apps",modes:["single"],featured:false},';
        const fantasyEntry='{key:"fantasyfootball",title:"Fantasy Football Command Center",emoji:"🏈📊",desc:"Build and track your fantasy football draft with live player status, rankings, roster construction, stacks, comparisons, and draft intelligence.",route:"/game/Fantasy_Draft_Command_Center.html",category:"Apps",modes:["single"],featured:false},';
        const receiverWindowQbEntry='{key:"receiverwindowqb",title:"Receiver Window QB",emoji:"🏈",desc:"Build a receiving corps in an endless football franchise. Train athleticism, hands, size and jukes; earn cash on wins and losses; relive big throws with ball-cam replays. Local and cloud saves.",route:"/game/receiver-window-qb.html",category:"Sports",modes:["single"],featured:false},';
        const quipClashEntry='{key:"quipclash",title:"Quip Clash",emoji:"💬⚡",imagePath:"/game/quip-clash/assets/quip-clash.svg",desc:"Write outrageous answers, vote for your favorites, and battle for the biggest laugh. Two prompts each, double-point round two, and a triple-point finale. Play together on your phones with 4–12 account holders.",route:"/game/quip-clash.html",multiplayerRoute:"/game/quip-clash.html",joinLabel:"Play with Friends",category:"Party",modes:["multi"],launchMode:"lobby",minPlayers:4,maxPlayers:12,autoRedirect:true,autoUsername:true,requiresUser:true,featured:false},';
        const monkeyTrailsEntry='{key:"monkeytrails",title:"Monkey Trails · Wild Companions",emoji:"🐒🧭",imagePath:"/game/monkey-trails/tile.svg",desc:"Turn a walk into an adventure: collect 60 animated monkeys, lead a team of three, discover elemental supplies, and hunt eight extraordinary Ultras on your own safe route. Tactical team battles, a permanent sanctuary, and encrypted saves.",route:"/game/monkey-trails.html",category:"Adventure",modes:["single"],featured:false},';
        // Trash Tactics lobby tile.
        const trashTacticsEntry='{key:"trashtactics",title:"Trash Tactics",emoji:"♻️✂️",imagePath:"/game/trash-tactics/assets/lobby-tile.jpg",desc:"Command painted cut-out armies, defend high-ground bases, and outmaneuver rivals in solo skirmishes or online 1v1 matches.",route:"/game/trash-tactics/index.html",multiplayerRoute:"/game/trash-tactics/?online=1",hostRoute:"/game/trash-tactics/?online=1&host=1",localEditionRoute:"/game/trash-tactics/download.html",joinLabel:"Browse Lobbies",onlineStatus:"Online 1v1",category:"Strategy",modes:["single","multi"],launchMode:"matchmaking",badges:["Casual PvP","Ranked Ladder"],featured:false},';
        if(html.includes(gamesMarker)&&!html.includes('key:"trashtactics"')){
          html=html.replace(gamesMarker,`${gamesMarker}\n      ${trashTacticsEntry}`);
        }
        // End Trash Tactics lobby tile.
        if(html.includes(gamesMarker)&&!html.includes('key:"monkeytrails"')){
          html=html.replace(gamesMarker,`${gamesMarker}\n      ${monkeyTrailsEntry}`);
        }
        if(html.includes(gamesMarker)&&!html.includes('key:"circuitbound"')){
          html=html.replace(gamesMarker,`${gamesMarker}\n      ${circuitboundEntry}`);
        }
        if(html.includes(gamesMarker)&&!html.includes('key:"mtgcatalog"')){
          html=html.replace(gamesMarker,`${gamesMarker}\n      ${mtgEntry}`);
        }
        if(html.includes(gamesMarker)&&!html.includes('key:"fantasyfootball"')){
          html=html.replace(gamesMarker,`${gamesMarker}\n      ${fantasyEntry}`);
        }
        if(html.includes(gamesMarker)&&!html.includes('key:"receiverwindowqb"')){
          html=html.replace(gamesMarker,`${gamesMarker}\n      ${receiverWindowQbEntry}`);
        }
        if(html.includes(gamesMarker)&&!html.includes('key:"quipclash"')){
          html=html.replace(gamesMarker,`${gamesMarker}\n      ${quipClashEntry}`);
        }
        html=html.replace(/const GAMES = \[([\s\S]*?)\n\s*\];/,gamesBlock=>{
          return gamesBlock.replace(/\{key:"([^"]+)"[^\n]*\}/g,(entry,key)=>{
            const shouldFeature=featuredGameKeys.has(key);
            if(/featured:(?:true|false)/.test(entry)){
              return entry.replace(/featured:(?:true|false)/,`featured:${shouldFeature}`);
            }
            return entry.replace(/\}$/,`,featured:${shouldFeature}}`);
          });
        });
        html=html.replace(/\{key:"cat",[^\n]*\}/,record=>record
          .replace('desc:"Classic multiplayer chase."','desc:"Gather cheese, build a fortress, and survive the Cat in painted battlefields."')
          .replace('modes:["multi"]',`modes:["single","multi"],liveLobbyGame:"catandmouse",paintedTile:"/game/catandmouse/edition/art/title-v1.webp",singleRoute:"/game/catandmouse/edition/index.html",hostRoute:"${catEdition.hostRoute}",localEditionRoute:"${catEdition.localEditionRoute}"`));
        // Run inside the existing loader so every injected game participates.
        html=globalThis.GameHubLibrary.upgradeHtml(html);
        // A presentation failure must not prevent the existing hub from opening.
        if(globalThis.GameHubFlagships){
          try{html=globalThis.GameHubFlagships.upgradeHtml(html);}
          catch(error){console.warn("Flagship layout unavailable; using the original hub",error);}
        }
        if(globalThis.GameHubArcade){
          try{html=globalThis.GameHubArcade.upgradeHtml(html);}
          catch(error){console.warn("Arcade layout unavailable; using the existing hub",error);}
        }
        const escapeHtml=value=>value.replace(/[&"<>]/g,c=>({"&":"&amp;",'"':"&quot;","<":"&lt;",">":"&gt;"}[c]));
        const hostButton=game=>globalThis.GameHubLibrary.hostButton(game,escapeHtml);
        const liveLobbies=`<section id="live-lobbies" class="card live-lobbies" aria-labelledby="live-lobbies-title">
          <div class="live-lobbies-head">
            <div><h2 id="live-lobbies-title">Live Lobbies</h2><p>Join a room hosted by another player.</p></div>
            <div class="live-lobbies-filters" role="group" aria-label="Filter live lobbies">
              <button type="button" data-live-filter="all" aria-pressed="true">All Games</button>
              <button type="button" data-live-filter="catandmouse" aria-pressed="false">Cat &amp; Mouse</button>
              <button type="button" data-live-filter="bannerlands" aria-pressed="false">Bannerlands</button>
            </div>
          </div>
          <div class="live-lobbies-games">
            <section data-live-section="catandmouse" aria-labelledby="live-lobbies-cat"><div class="live-lobbies-game-head"><h3 id="live-lobbies-cat">Cat &amp; Mouse</h3>${hostButton(catEdition)}</div><p data-live-status role="status">Checking the directory…</p><ul data-live-rooms></ul></section>
            <section data-live-section="bannerlands" aria-labelledby="live-lobbies-banner"><div class="live-lobbies-game-head"><h3 id="live-lobbies-banner">Bannerlands</h3>${hostButton(truthGames.find(game=>game.key==="bannerlands"))}</div><p data-live-status role="status">Checking the directory…</p><ul data-live-rooms></ul></section>
          </div>
        </section>`;
        const main='<main class="shell" id="mainContent" tabindex="-1">';
        if(!html.includes('id="live-lobbies"')){
          html=html.replace(main,main+liveLobbies)
            .replace("</head>",'<link rel="stylesheet" href="./live-lobbies.css?v=3"><script type="module" src="./live-lobbies.mjs?v=3"><\/script></head>');
        }
        const desktopDownload=`<aside class="desktop-hub-download" aria-labelledby="desktop-hub-heading">
          <img src="/lobby/assets/catnmice-mark.svg" alt="" width="52" height="52">
          <div><h2 id="desktop-hub-heading">Take Catnmice to your desktop</h2>
            <p>Install offline games and join your usual lobbies with Catnmice Game Hub for Windows.</p></div>
          <a href="/hub/download.html" target="_top">Download Game Hub <span>Windows x64 ↓</span></a>
        </aside>`;
        html=html.replace(main,main+desktopDownload).replace('</head>','<link rel="stylesheet" href="/hub/download-panel.css"></head>');
        const patch=html.includes('catnmice-arcade:v1')?'':'<script src="./lobby-catalog-organization.js?v=6" defer><\/script>';
        html=html.includes("</body>")?html.replace("</body>",patch+"</body>"):html+patch;
        document.open();
        document.write(html);
        document.close();
      }catch(error){
        console.error("Game Hub loader failed",error);
        document.body.innerHTML='<main style="font-family:system-ui;padding:32px"><h1>Game Hub could not load</h1><p>Refresh the page to try again.</p></main>';
      }
    })();
  </script>
</body>
</html>

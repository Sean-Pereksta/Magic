<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Cat’N Mice · Arcade Nexus</title>
  <script src="./lobby-showcase.js?v=3"></script>
  <script src="./lobby-library.js?v=2"></script>
  <script src="./lobby-flagships.js?v=2"></script>
</head>
<body>
  <script>
    (async()=>{
      try{
        const response=await fetch("./lobby-core.html",{cache:"no-store"});
        if(!response.ok)throw new Error(`Could not load Game Hub core (${response.status}).`);
        let html=await response.text();
        const gamesMarker='const GAMES = [';
        const featuredGameKeys=new Set(["warrealms","arcanewilds","chesswarlord","chesswarlords","spacetyrants","roguecards","ironthrone"]);
        const circuitboundEntry='{key:"circuitbound",title:"Circuitbound",emoji:"⚙️⚡",desc:"Build programmable machines from conductive blocks, signals, motors, gears, pistons, conveyors, winches, and linked structures.",route:"/game/circuitbound.html",category:"Builder",modes:["single"],featured:false},';
        const mtgEntry='{key:"mtgcatalog",title:"MTG Catalog & Deck Builder",emoji:"🃏💰",desc:"Browse Magic: The Gathering cards and current prices, build decks, estimate total value, and analyze lands and mana curve.",route:"/game/MTG_Catalog_Deck_Builder.html",category:"Apps",modes:["single"],featured:false},';
        const fantasyEntry='{key:"fantasyfootball",title:"Fantasy Football Command Center",emoji:"🏈📊",desc:"Build and track your fantasy football draft with live player status, rankings, roster construction, stacks, comparisons, and draft intelligence.",route:"/game/Fantasy_Draft_Command_Center.html",category:"Apps",modes:["single"],featured:false},';
        const receiverWindowQbEntry='{key:"receiverwindowqb",title:"Receiver Window QB",emoji:"🏈",desc:"Build a receiving corps in an endless football franchise. Train athleticism, hands, size and jukes; earn cash on wins and losses; relive big throws with ball-cam replays. Local and cloud saves.",route:"/game/receiver-window-qb.html",category:"Sports",modes:["single"],featured:false},';
        const quipClashEntry='{key:"quipclash",title:"Quip Clash",emoji:"💬⚡",imagePath:"/game/quip-clash/assets/quip-clash.svg",desc:"Write outrageous answers, vote for your favorites, and battle for the biggest laugh. Two prompts each, double-point round two, and a triple-point finale. Play together on your phones with 4–12 account holders.",route:"/game/quip-clash.html",multiplayerRoute:"/game/quip-clash.html",joinLabel:"Play with Friends",category:"Party",modes:["multi"],launchMode:"lobby",minPlayers:4,maxPlayers:12,autoRedirect:true,autoUsername:true,requiresUser:true,featured:false},';
        const monkeyTrailsEntry='{key:"monkeytrails",title:"Monkey Trails · Wild Companions",emoji:"🐒🧭",imagePath:"/game/monkey-trails/tile.svg",desc:"Turn a walk into an adventure: collect 60 animated monkeys, lead a team of three, discover elemental supplies, and hunt eight extraordinary Ultras on your own safe route. Tactical team battles, a permanent sanctuary, and encrypted saves.",route:"/game/monkey-trails.html",category:"Adventure",modes:["single"],featured:false},';
        if(html.includes(gamesMarker)&&!html.includes('key:"monkeytrails"')){
          html=html.replace(gamesMarker,`${gamesMarker}\n      ${monkeyTrailsEntry}`);
        }
        if(html.includes(gamesMarker)&&!html.includes('key:"circuitbound"')){
          html=html.replace(gamesMarker,`${gamesMarker}\n      ${circuitboundEntry}`);
        }
        if(html.includes(gamesMarker)&&!html.includes('key:"mtgcatalog"')){
          html=html.replace(gamesMarker,`${gamesMarker}\n      ${mtgEntry}`);
        }
        if(html.includes(gamesMarker)&&!html.includes('key:"fantasyfootball"')){
          html=html.replace(gamesMarker,`${gamesMarker}\n      ${fantasyEntry}`);
        }
        if(html.includes(gamesMarker)&&!html.includes('key:"receiverwindowqb"')){
          html=html.replace(gamesMarker,`${gamesMarker}\n      ${receiverWindowQbEntry}`);
        }
        if(html.includes(gamesMarker)&&!html.includes('key:"quipclash"')){
          html=html.replace(gamesMarker,`${gamesMarker}\n      ${quipClashEntry}`);
        }
        html=html.replace(/const GAMES = \[([\s\S]*?)\n\s*\];/,gamesBlock=>{
          return gamesBlock.replace(/\{key:"([^"]+)"[^\n]*\}/g,(entry,key)=>{
            const shouldFeature=featuredGameKeys.has(key);
            if(/featured:(?:true|false)/.test(entry)){
              return entry.replace(/featured:(?:true|false)/,`featured:${shouldFeature}`);
            }
            return entry.replace(/\}$/,`,featured:${shouldFeature}}`);
          });
        });
        // Run inside the existing loader so every injected game participates.
        html=globalThis.GameHubLibrary.upgradeHtml(html);
        // A presentation failure must not prevent the existing hub from opening.
        if(globalThis.GameHubFlagships){
          try{html=globalThis.GameHubFlagships.upgradeHtml(html);}
          catch(error){console.warn("Flagship layout unavailable; using the original hub",error);}
        }
        const patch='<script src="./lobby-catalog-organization.js?v=4" defer><\/script>';
        html=html.includes("</body>")?html.replace("</body>",patch+"</body>"):html+patch;
        document.open();
        document.write(html);
        document.close();
      }catch(error){
        console.error("Game Hub loader failed",error);
        document.body.innerHTML='<main style="font-family:system-ui;padding:32px"><h1>Game Hub could not load</h1><p>Refresh the page to try again.</p></main>';
      }
    })();
  </script>
</body>
</html>

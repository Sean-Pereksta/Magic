name: Arcane Wilds homestead validation

on:
  push:
    branches: [feature/arcane-wilds-hearthglade]
  pull_request:
    paths:
      - 'game/arcane-wilds/**'
      - 'game/arcane-wilds.html'
      - '.github/workflows/arcane-homestead-validation.yml'

permissions:
  contents: read

concurrency:
  group: arcane-homestead-${{ github.ref }}
  cancel-in-progress: true

jobs:
  regressions:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /game/arcane-wilds/
            /game/arcane-wilds.html
            /firestore.rules
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci --ignore-scripts --no-audit --no-fund
        working-directory: game/arcane-wilds
      - name: Arcane Wilds regression suite
        run: npm test
        working-directory: game/arcane-wilds
      - name: Package reproducible regression workspace
        if: always()
        run: tar -czf /tmp/arcane-regression-workspace.tgz game/arcane-wilds game/arcane-wilds.html firestore.rules
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: arcane-regression-workspace
          path: /tmp/arcane-regression-workspace.tgz
          retention-days: 2

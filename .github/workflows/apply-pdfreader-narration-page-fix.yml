name: Apply PDF narration page fix

on:
  push:
    branches:
      - agent/pdfreader-natural-page-autoplay-fix
    paths:
      - '.github/workflows/apply-pdfreader-narration-page-fix.yml'
      - 'scripts/apply_pdfreader_narration_page_fix.py'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Check out only the reader patch files
        uses: actions/checkout@v4
        with:
          ref: agent/pdfreader-natural-page-autoplay-fix
          fetch-depth: 1
          sparse-checkout: |
            game/pdfreader.html
            scripts/apply_pdfreader_narration_page_fix.py
            .github/workflows/apply-pdfreader-narration-page-fix.yml
          sparse-checkout-cone-mode: false

      - name: Apply guarded PDF reader fix
        run: python3 scripts/apply_pdfreader_narration_page_fix.py

      - name: Validate module syntax and behavior markers
        run: |
          python3 - <<'PY'
          import re
          from pathlib import Path
          text = Path('game/pdfreader.html').read_text(encoding='utf-8')
          match = re.search(r'<script type="module">(.*?)</script>', text, re.S)
          if not match:
              raise SystemExit('module script not found')
          Path('/tmp/pdfreader-module.mjs').write_text(match.group(1), encoding='utf-8')
          required = [
              'const dtype = "fp32";',
              'Loading next page',
              'normalized before playback',
              'renderSerial: 0',
              'forceRender = false',
          ]
          for marker in required:
              if marker not in text:
                  raise SystemExit(f'missing marker: {marker}')
          PY
          node --check /tmp/pdfreader-module.mjs

      - name: Commit direct reader fix and remove one-shot helpers
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm scripts/apply_pdfreader_narration_page_fix.py .github/workflows/apply-pdfreader-narration-page-fix.yml
          git add game/pdfreader.html
          git commit -m "Fix PDF narration page loading and WASM audio"
          git push origin agent/pdfreader-natural-page-autoplay-fix

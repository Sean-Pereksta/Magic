name: TurnCraft regression checks
on:
  pull_request:
    paths: ['game/turncraft.html', 'game/turncraft/**', 'game/turncraft-lobby.html', 'firestore.rules', 'firebase.turncraft-test.json', 'graphics/turncraft/**', 'units/medic-healing.webp', 'effects/medic-healing.webp', '.github/workflows/turncraft.yml']
  push:
    branches: [main]
    paths: ['game/turncraft.html', 'game/turncraft/**', 'game/turncraft-lobby.html', 'firestore.rules', 'firebase.turncraft-test.json', 'graphics/turncraft/**', 'units/medic-healing.webp', 'effects/medic-healing.webp', '.github/workflows/turncraft.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
        working-directory: game/turncraft
      - run: npx playwright install --with-deps chromium
        working-directory: game/turncraft
      - run: npm test
        working-directory: game/turncraft
      - run: npm run test:warfare
        working-directory: game/turncraft
  cloud:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm install --ignore-scripts
      - run: npx firebase emulators:exec --project demo-turncraft --config firebase.turncraft-test.json --only firestore "node game/turncraft/tests/profile-store.emulator.cjs && node game/turncraft/tests/lobby-store.emulator.cjs && node game/turncraft/tests/turncraft-rules.emulator.cjs"

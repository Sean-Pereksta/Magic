name: TurnCraft regression checks
on:
  pull_request:
    paths: ['game/turncraft.html', 'game/turncraft/**', 'graphics/turncraft/**', '.github/workflows/turncraft.yml']
  push:
    branches: [main]
    paths: ['game/turncraft.html', 'game/turncraft/**', 'graphics/turncraft/**', '.github/workflows/turncraft.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
        working-directory: game/turncraft
      - run: npx playwright install --with-deps chromium
        working-directory: game/turncraft
      - run: npm test
        working-directory: game/turncraft
      - run: npm run test:warfare
        working-directory: game/turncraft

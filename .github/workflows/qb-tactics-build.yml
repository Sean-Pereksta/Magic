name: QB tactics branch integration
on:
  push:
    branches: [feat/qb-audible-sets-strength-blocking]
    paths: [game/receiver-window-qb/tactics-build.cjs]
permissions:
  contents: write
jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/qb-audible-sets-strength-blocking
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply guarded source integration
        run: node game/receiver-window-qb/tactics-build.cjs
      - name: Syntax and regressions
        run: |
          node --check game/receiver-window-qb/game.js
          node --check game/receiver-window-qb/tactics.js
          git diff --check
          node --test game/receiver-window-qb/*.test.cjs 2>&1 | tee /tmp/qb-tactics-tests.txt
      - name: Publish test output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qb-tactics-validation
          path: |
            /tmp/qb-tactics-tests.txt
            game/receiver-window-qb/game.js
      - name: Commit verified integration and remove one-shot tooling
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm .github/workflows/qb-tactics-build.yml game/receiver-window-qb/tactics-build.cjs
          git add game/receiver-window-qb game/receiver-window-qb.html .github/workflows/qb-tactics-build.yml
          git commit -m 'Integrate physical audibles and strength blocking; verify QB regressions'
          git push origin HEAD:feat/qb-audible-sets-strength-blocking

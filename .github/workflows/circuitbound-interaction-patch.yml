name: Circuitbound interaction patch

on:
  push:
    branches:
      - feature/circuitbound-doors-ladders-ledges-menu
    paths:
      - scripts/patch-circuitbound-interactions.cjs
      - .github/workflows/circuitbound-interaction-patch.yml

permissions:
  contents: write

concurrency:
  group: circuitbound-interaction-patch
  cancel-in-progress: true

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out Circuitbound files
        uses: actions/checkout@v4
        with:
          ref: feature/circuitbound-doors-ladders-ledges-menu
          fetch-depth: 1
          sparse-checkout: |
            game/circuitbound.html
            game/circuitbound
            package.json
            scripts/patch-circuitbound-interactions.cjs
            .github/workflows/circuitbound-interaction-patch.yml
          sparse-checkout-cone-mode: false
      - name: Apply interaction patch
        run: node scripts/patch-circuitbound-interactions.cjs
      - name: Initialize ledge drop state
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('game/circuitbound/app.js')
          source = path.read_text()
          anchor = "  const camera={x:0,y:0,shake:0},keys={};"
          declaration = "  let ledgeDrop=0;"
          if declaration not in source:
              if anchor not in source:
                  raise SystemExit('ledge drop state anchor missing')
              source = source.replace(anchor, anchor + "\n" + declaration, 1)
              path.write_text(source)
          PY
      - name: Syntax check
        run: node --check game/circuitbound/app.js
      - name: Run Circuitbound tests
        run: npm run test:circuitbound
      - name: Commit finished game changes
        run: |
          rm -f scripts/patch-circuitbound-interactions.cjs .github/workflows/circuitbound-interaction-patch.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Add Circuitbound doors ladders ledges and fabricator filters"
            git push origin HEAD:feature/circuitbound-doors-ladders-ledges-menu
          fi

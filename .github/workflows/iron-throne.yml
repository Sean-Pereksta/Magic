name: Iron Throne strategy and diplomacy

on:
  pull_request:
    paths:
      - 'game/iron-throne/**'
      - 'lobby/**'
      - 'firestore.rules'
      - 'firebase.iron-throne-test.json'
      - '.github/workflows/iron-throne.yml'
  push:
    branches: [main]
    paths:
      - 'game/iron-throne/**'
      - 'lobby/**'
      - 'firestore.rules'
      - 'firebase.iron-throne-test.json'
      - '.github/workflows/iron-throne.yml'

permissions:
  contents: read

jobs:
  rules:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm run test:iron-throne
      - run: node --experimental-vm-modules --test lobby/tests/lobby-library.test.cjs
  firebase-browser:
    runs-on: ubuntu-latest
    # Chromium/OS downloads can consume several minutes before the browser suite.
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: game/iron-throne/tests/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - run: npm ci --prefix game/iron-throne/tests
      - run: npx playwright install --with-deps chromium
        working-directory: game/iron-throne/tests
      - run: node game/iron-throne/tests/strategic-map-browser.mjs
      - run: node game/iron-throne/tests/formal-proposal-browser.mjs
      - run: node game/iron-throne/tests/alliance-council-browser.mjs
      - run: node game/iron-throne/tests/council-diagnostics-browser.mjs
      - run: node game/iron-throne/tests/trade-package-browser.mjs
      - run: npm run test:iron-throne:online
      - run: npm run test:iron-throne:browser
      - run: npm run test:iron-throne:command-browser
      - run: node game/iron-throne/tests/relationships-browser.mjs
      - run: npm run test:iron-throne:founding-browser
      - run: npm run test:iron-throne:intelligence-browser
      - run: npm run test:iron-throne:naval-browser
      - run: node game/iron-throne/tests/distance-boarding-browser.mjs

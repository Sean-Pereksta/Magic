name: Iron Throne strategy and diplomacy

on:
  pull_request:
    paths:
      - 'game/iron-throne/**'
      - 'lobby/**'
      - '.github/workflows/iron-throne.yml'
  push:
    branches: [main]
    paths:
      - 'game/iron-throne/**'
      - '.github/workflows/iron-throne.yml'

permissions:
  contents: read

jobs:
  rules:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm run test:iron-throne
      - run: node --experimental-vm-modules --test lobby/tests/lobby-library.test.cjs

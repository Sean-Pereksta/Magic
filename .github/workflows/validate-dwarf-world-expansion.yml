name: Validate Dwarf World Living Mountain

on:
  pull_request:
    paths:
      - 'game/DwarfWorld.html'
      - 'game/DwarfWorld-core.html'
      - 'game/dwarf-world/**'
      - '.github/workflows/validate-dwarf-world-expansion.yml'
  push:
    branches:
      - feature/dwarf-world-fortress-command-expansion
      - main
    paths:
      - 'game/DwarfWorld.html'
      - 'game/DwarfWorld-core.html'
      - 'game/dwarf-world/**'
      - '.github/workflows/validate-dwarf-world-expansion.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check saves, production, navigation, world behavior and loaders
        run: node --test game/dwarf-world/*.test.mjs

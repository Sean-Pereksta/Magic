        run: |
          from pathlib import Path

          card_path = Path("game/warrealms-pack/warrealms-cards.js")
          test_path = Path("game/warrealms/tests/card-validator.test.mjs")
          text = card_path.read_text(encoding="utf-8")
          tests = test_path.read_text(encoding="utf-8")

          if 'id: "vaultshell_lamb"' in text:
              raise SystemExit("Evolution families are already present")

          text = text.replace(
              "export const WAR_REALMS_CARD_VERSION = 20;",
              "export const WAR_REALMS_CARD_VERSION = 21;",
              1,
          )

          anchor = "  // ==========================================================\n  // CAMPAIGN-ONLY ENGINE PROOF ASSETS"

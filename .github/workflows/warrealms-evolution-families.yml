name: Add War Realms evolution families

on:
  push:
    branches:
      - agent/warrealms-evolution-families
    paths:
      - .github/workflows/warrealms-evolution-families.yml

permissions:
  contents: write

jobs:
  add-evolution-families:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/warrealms-evolution-families

      - name: Add Vaultshell, Gravegnaw, Oathhorn, and Pactcoil families

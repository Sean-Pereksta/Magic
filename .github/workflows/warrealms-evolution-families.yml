name: Add War Realms evolution families

on:
  push:
    branches:
      - agent/warrealms-evolution-families
    paths:
      - .github/workflows/warrealms-evolution-families.yml

permissions:
  contents: write

jobs:
  add-evolution-families:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/warrealms-evolution-families
          sparse-checkout: |
            game/warrealms
            game/warrealms-pack/warrealms-cards.js
            game/warrealms-pack/evolution-families.fragment.js
          sparse-checkout-cone-mode: false

      - name: Insert evolution families
        shell: python
        run: |
          from pathlib import Path

          card_path = Path("game/warrealms-pack/warrealms-cards.js")
          fragment_path = Path("game/warrealms-pack/evolution-families.fragment.js")
          test_path = Path("game/warrealms/tests/card-validator.test.mjs")

          text = card_path.read_text(encoding="utf-8")
          fragment = fragment_path.read_text(encoding="utf-8")
          tests = test_path.read_text(encoding="utf-8")

          if 'id: "vaultshell_lamb"' not in text:
              version_old = "export const WAR_REALMS_CARD_VERSION = 20;"
              version_new = "export const WAR_REALMS_CARD_VERSION = 21;"
              if version_old not in text:
                  raise SystemExit("Expected card version anchor not found")
              text = text.replace(version_old, version_new, 1)

              anchor = "  // ==========================================================\n  // CAMPAIGN-ONLY ENGINE PROOF ASSETS"
              if anchor not in text:
                  raise SystemExit("Card insertion anchor not found")
              text = text.replace(anchor, fragment + anchor, 1)

          tests = tests.replace(
              "assert.equal(pack.COLLECTIBLE_CARDS.length, 417);",
              "assert.equal(pack.COLLECTIBLE_CARDS.length, 421);",
              1,
          )
          tests = tests.replace(
              "assert.equal(heatTransforms.length, 24);",
              "assert.equal(heatTransforms.length, 36);",
              1,
          )

          expected = [
              "vaultshell_lamb", "monastery_world_tortoise",
              "gravegnaw_imp", "perfected_hunger",
              "oathhorn_foundling", "mountain_splitter_khan",
              "pactcoil_abyss_hatchling", "riteclaw_apex_serpent",
              "coffincoil_soulbroker", "altar_crowned_worldeater",
              "sepulcher_crown_archfiend"
          ]
          missing = [card_id for card_id in expected if f'id: "{card_id}"' not in text]
          if missing:
              raise SystemExit(f"Missing generated evolution cards: {missing}")

          if "assert.equal(pack.COLLECTIBLE_CARDS.length, 421);" not in tests:
              raise SystemExit("Collectible-card count assertion was not updated")
          if "assert.equal(heatTransforms.length, 36);" not in tests:
              raise SystemExit("Heat-transform count assertion was not updated")

          card_path.write_text(text, encoding="utf-8")
          test_path.write_text(tests, encoding="utf-8")

      - name: Run War Realms tests
        run: node --test game/warrealms/tests/*.test.mjs

      - name: Commit generated evolution expansion
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add game/warrealms-pack/warrealms-cards.js game/warrealms/tests/card-validator.test.mjs
          if git diff --cached --quiet; then
            echo "Evolution expansion already applied"
            exit 0
          fi
          git commit -m "Add four War Realms evolution families"
          git push origin HEAD:agent/warrealms-evolution-families

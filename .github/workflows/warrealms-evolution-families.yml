          if missing:
              raise SystemExit(f"Card insertion failed: {missing}")

          if "assert.equal(pack.COLLECTIBLE_CARDS.length, 421);" not in tests:
              raise SystemExit("Collectible count assertion was not updated")
          if "assert.equal(heatTransforms.length, 36);" not in tests:
              raise SystemExit("Heat transform count assertion was not updated")

          card_path.write_text(text, encoding="utf-8")
          test_path.write_text(tests, encoding="utf-8")

      - name: Run War Realms tests
        run: node --test game/warrealms/tests/*.test.mjs

      - name: Commit generated evolution expansion
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add game/warrealms-pack/warrealms-cards.js game/warrealms/tests/card-validator.test.mjs
          git commit -m "Add four War Realms evolution families"
          git push

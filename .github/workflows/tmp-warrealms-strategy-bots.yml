name: Temporary War Realms strategy bot patch

on:
  push:
    branches:
      - warrealms/summoning-ascendents-bastion-fleet-bots

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            game/warrealms/
            game/warrealms.html
            game/warrealms-pack/
            .github/workflows/tmp-warrealms-strategy-bots.yml
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fix patch locator and apply strategy bot patch
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('game/warrealms/patch-strategy-bots.py')
          text = path.read_text(encoding='utf-8')
          start = text.index('native_pattern = re.compile(')
          end = text.index('\n\n# Native helper scoring', start)
          replacement = '''strategy_table_start = html.index('  const BOT_STRATEGIES = Object.freeze({')
          marketeer_start = html.index('    marketeer: Object.freeze({', strategy_table_start)
          strategy_table_end = html.index('\\n  });', marketeer_start)
          if '    summoning: Object.freeze({' in html[strategy_table_start:strategy_table_end]:
              raise RuntimeError('Native BOT_STRATEGIES already contains Summoning')
          html = html[:strategy_table_end] + ',\\n' + native_strategies.lstrip('\\n') + html[strategy_table_end:]'''
          path.write_text(text[:start] + replacement + text[end:], encoding='utf-8')
          PY
          python game/warrealms/patch-strategy-bots.py
      - name: Remove temporary patch machinery
        run: |
          rm game/warrealms/patch-strategy-bots.py
          rm .github/workflows/tmp-warrealms-strategy-bots.yml
      - name: Run War Realms tests
        run: node --test tests/*.test.mjs
        working-directory: game/warrealms
      - name: Commit generated changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add game/warrealms.html game/warrealms/ui game/warrealms/tests game/warrealms/patch-strategy-bots.py .github/workflows/tmp-warrealms-strategy-bots.yml
          git commit -m "Add Summoning Ascendents Bastion and Fleet bots"
          git push origin HEAD:warrealms/summoning-ascendents-bastion-fleet-bots

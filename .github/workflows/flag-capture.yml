name: Flag Capture strategy checks
on:
  pull_request:
    paths: ['game/Flag.html', 'game/flag-capture/**', 'lobby/lobby.html', 'lobby/lobby-core.html', 'lobby/lobby-library.js', 'lobby/lobby-showcase.js', 'lobby/assets/game-artwork.*', 'lobby/assets/**/flag-riftbound-v2.webp', 'lobby/tests/flag-capture-catalog.test.cjs', '.github/workflows/flag-capture.yml']
  push:
    paths: ['game/Flag.html', 'game/flag-capture/**', 'lobby/lobby.html', 'lobby/lobby-core.html', 'lobby/lobby-library.js', 'lobby/lobby-showcase.js', 'lobby/assets/game-artwork.*', 'lobby/assets/**/flag-riftbound-v2.webp', 'lobby/tests/flag-capture-catalog.test.cjs', '.github/workflows/flag-capture.yml']
permissions:
  contents: read
jobs:
  strategy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /game/Flag.html
            /game/flag-capture/
            /lobby/*.js
            /lobby/*.html
            /lobby/assets/game-artwork.js
            /lobby/assets/game-artwork.json
            /lobby/assets/game-tiles/flag-riftbound-v2.webp
            /lobby/assets/game-thumbnails/flag-riftbound-v2.webp
            /lobby/assets/game-heroes/flag-riftbound-v2.webp
            /lobby/tests/flag-capture-catalog.test.cjs
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --check game/flag-capture/app.mjs
      - run: node --test game/flag-capture/*.test.mjs lobby/tests/flag-capture-catalog.test.cjs

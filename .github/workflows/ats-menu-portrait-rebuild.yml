# Temporary, branch-scoped workflow to generate the tracked 97 MB standalone
# HTML game from its modular source. Remove after the build commit is created.
name: Build ATS menu portrait branch
on:
  push:
    branches:
      - fix/apes-menu-tribe-portrait-20261012
permissions:
  contents: write
jobs:
  bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build the distributable
        run: node game/apes-together-strong/build.cjs
      - name: Commit the generated standalone game
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add game/apes-together-strong.html
          if ! git diff --cached --quiet; then
            git commit -m "Rebuild Apes Together Strong for tribe menu portrait"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

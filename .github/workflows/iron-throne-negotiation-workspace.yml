name: Iron Thrones negotiation workspace

on:
  pull_request:
    paths:
      - '.github/workflows/iron-throne-negotiation-workspace.yml'

permissions:
  contents: write

concurrency:
  group: iron-throne-negotiation-workspace
  cancel-in-progress: false

jobs:
  source:
    if: github.head_ref == 'codex/iron-thrones-trade-persuasion' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/iron-thrones-trade-persuasion
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /game/iron-throne/
            /lobby/
            /package.json
            /firestore.rules
            /firebase.iron-throne-test.json
            /.github/workflows/iron-throne-negotiation-workspace.yml
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply exact locally tested patch
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        shell: python
        run: |
          import base64, hashlib, lzma, os, pathlib, subprocess
          assert subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip() == os.environ['EXPECTED_HEAD'], 'Branch changed; reconcile before applying.'
          encoded = '''
          
          
          
          '''
          patch = lzma.decompress(base64.b64decode(encoded))
          assert hashlib.sha256(patch).hexdigest() == 'f7b48f9338950d9e34d99beb6c5320a62b00d850cbdc49fabbf6aefcc3e35264'
          path = pathlib.Path('/tmp/iron-trade.patch'); path.write_bytes(patch)
          subprocess.run(['git','apply','--check','--unidiff-zero',str(path)],check=True)
          subprocess.run(['git','apply','--unidiff-zero',str(path)],check=True)
          hashes = {
            'game/iron-throne/SPEC.md':'dab0ab8c31553b6e02c3ce69dd9da515ce34c97c',
            'game/iron-throne/diplomacy.mjs':'7cfae71b0110b4c9bcdd50e20537955395ddb778',
            'game/iron-throne/fog.mjs':'c3a474703a59345761c6dceb2d89ecd06c6223cb',
            'game/iron-throne/living.mjs':'59c02939ad730deb691fc812715f82b2c2319814',
            'game/iron-throne/multiplayer-state.mjs':'ff28f2476d09ead697e4b29f015f7ad72b7878f8',
            'game/iron-throne/proposal-followup.mjs':'e0a7c92e91120761c24744e7beda6a3ca11a6ce1',
            'game/iron-throne/tests/trade-negotiation.test.mjs':'b897cd36f91797c6cdb173145b2bf6bb84b4e280',
            'game/iron-throne/trade-economy.mjs':'12b52efb9505d0a7517aab2fd8da95cb117efd47',
            'game/iron-throne/trade-negotiation.mjs':'49f6bf818a030d5f493f80411327e23431b5d371',
            'game/iron-throne/trade.mjs':'a5d68256409a2d36034350b2344424ac33316d64',
            'game/iron-throne/worker/worker.mjs':'facecdcc73003602664e6b00f48b169154abd8b4'
          }
          for file, expected in hashes.items():
            assert subprocess.check_output(['git','hash-object',file],text=True).strip() == expected, file
          subprocess.run(['git','diff','--check'],check=True)
      - name: Verify focused negotiation and existing diplomacy tests
        run: node --test game/iron-throne/tests/trade-negotiation.test.mjs game/iron-throne/tests/living.test.mjs game/iron-throne/tests/alliance-council.test.mjs game/iron-throne/tests/fog-worlds.test.mjs game/iron-throne/tests/session.test.mjs game/iron-throne/tests/conversation-context.test.mjs game/iron-throne/tests/gemini-reply.test.mjs | tee /tmp/iron-focused.log
      - name: Push verified implementation and remove temporary workspace
        run: |
          git rm .github/workflows/iron-throne-negotiation-workspace.yml
          git add game/iron-throne
          git config user.name 'ChatGPT'
          git config user.email 'noreply@openai.com'
          git commit -m "Implement interest-led trade negotiation and bounded persuasion"
          git push origin HEAD:codex/iron-thrones-trade-persuasion
          git rev-parse HEAD > /tmp/iron-implementation-commit.txt
      - name: Run complete rule regression suite
        continue-on-error: true
        run: node --test game/iron-throne/tests/*.test.mjs | tee /tmp/iron-full.log
      - name: Package verification logs and missing local source assets
        if: always()
        run: |
          mkdir -p /tmp/iron-verification
          cp /tmp/iron-*.log /tmp/iron-implementation-commit.txt /tmp/iron-verification/ 2>/dev/null || true
          git ls-files -- game/iron-throne | grep -E '\.(svg|toml)$' > /tmp/extra-source.txt
          tar -czf /tmp/iron-verification/source-assets.tar.gz -T /tmp/extra-source.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: iron-throne-negotiation-verification
          path: /tmp/iron-verification/
          retention-days: 3

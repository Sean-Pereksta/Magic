name: Apply TurnCraft mobile direct controls

on:
  push:
    branches:
      - fix/turncraft-mobile-controls
    paths:
      - '.github/workflows/apply-turncraft-mobile-controls.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/turncraft-mobile-controls

      - name: Patch TurnCraft mobile controls
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('game/turncraft.html')
          text = path.read_text(encoding='utf-8')

          def replace_once(old, new, label):
              global text
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected exactly one match, found {count}')
              text = text.replace(old, new, 1)

          replace_once(
              '<meta name="turncraft-build" content="strategic-warfare-expansion-worker-balance-2026-09-13" />',
              '<meta name="turncraft-build" content="strategic-warfare-expansion-worker-balance-mobile-direct-controls-2026-09-13" />',
              'build marker',
          )

          replace_once(
              '<div id="hintLine">Click a unit, then a highlighted tile. Press X for attack mode, B for building actions, Esc to cancel.</div>',
              '<div id="hintLine">Tap a troop, then tap open ground to move. Hold + drag to box-select. Select a building and use Rally to set its destination.</div>',
              'initial hint',
          )

          replace_once(
              '<div class="helpItem"><b>Camera and selection</b><small>Drag to pan, use WASD or arrows, and wheel or pinch to zoom. F or Focus Selected returns to your selection. Shift-drag selects a group; double-tap selects visible units of one type.</small></div>',
              '<div class="helpItem"><b>Camera and selection</b><small>Drag immediately to pan, use WASD or arrows, and wheel or pinch to zoom. On touch, press and hold briefly, then drag to box-select friendly troops. Shift-drag still box-selects on desktop, and double-tap selects visible units of one type.</small></div>',
              'camera help',
          )

          replace_once(
              '<div class="helpItem"><b>Touch orders</b><small>Tap to select, choose Move, Mine, Attack, Build, or an ability, then tap its target. Dragging never issues an order. Cancel Order or Escape clears targeting. X arms Attack.</small></div>',
              '<div class="helpItem"><b>Touch orders</b><small>Tap a troop to select it, then tap open ground to move immediately — no Move button required. Tap another friendly unit to change selection. Use Attack, Mine, Build, abilities, or a building\'s Rally button only when those explicit modes are needed.</small></div>',
              'touch help',
          )

          replace_once(
              '<div class="helpItem"><b>Group orders</b><small>After multi-selecting, choose Move Group then a destination, or Attack Group then an enemy. Hold a numbered group button to assign your selection; tap it to recall.</small></div>',
              '<div class="helpItem"><b>Group orders</b><small>After multi-selecting, tap open ground to move the whole formation immediately. Use Attack Group or Attack Move when you specifically want a combat order. Hold a numbered group button to assign your selection; tap it to recall.</small></div>',
              'group help',
          )

          replace_once(
              "selectionOrder.textContent='Click any battlefield tile to move the whole group toward it. Targeted abilities fire from every ready matching unit.';",
              "selectionOrder.textContent='Tap or click open ground to move the whole group immediately. Targeted abilities fire from every ready matching unit.';",
              'group selection summary',
          )

          replace_once(
              "function renderCommandButtons(){commandButtons.innerHTML='';abilityButtons.innerHTML='';",
              "function directTapMoveUi(){return matchMedia('(pointer:coarse)').matches||innerWidth<=760||(innerHeight<=520&&innerWidth>innerHeight)}\nfunction renderCommandButtons(){commandButtons.innerHTML='';abilityButtons.innerHTML='';",
              'direct move UI helper',
          )

          replace_once(
              "add(commandButtons,'Move Group',()=>{interactionMode='move';interactionPayload=null;legalTiles=[];refreshUI(true)},!units.some(unit=>!unit.siegeMode),interactionMode==='move',`${readyMoves.length}/${units.length} ready`);",
              "if(!directTapMoveUi())add(commandButtons,'Move Group',()=>{interactionMode='move';interactionPayload=null;legalTiles=[];refreshUI(true)},!units.some(unit=>!unit.siegeMode),interactionMode==='move',`${readyMoves.length}/${units.length} ready`);",
              'mobile group move button',
          )

          replace_once(
              "add(commandButtons,'Move',()=>{interactionMode='move';interactionPayload=null;refreshLegalTiles();refreshUI(true)},!mine||e.siegeMode,interactionMode==='move',e.siegeMode?'Sieged':moveCd>0?`${fmtCd(moveCd)} · queues`:'Any tile');",
              "if(!directTapMoveUi())add(commandButtons,'Move',()=>{interactionMode='move';interactionPayload=null;refreshLegalTiles();refreshUI(true)},!mine||e.siegeMode,interactionMode==='move',e.siegeMode?'Sieged':moveCd>0?`${fmtCd(moveCd)} · queues`:'Any tile');",
              'mobile single move button',
          )

          old_pointer = """// Touch taps select. A command must be armed before a touch can issue orders.
          let touchGesture=false,pointerButton=0;
          const cameraKeys=new Set();let zoomTween=null;
          function editingField(target){return target?.isContentEditable||/INPUT|SELECT|TEXTAREA/.test(target?.tagName||'')}
          function resetPointers(){activePointers.clear();pinch=null;dragging=false;selectionBox=null;clearSelectionHold();document.body.classList.remove('selection-active');canvas.classList.remove('dragging')}
          canvas.addEventListener('pointerdown',e=>{
           if(!gameStarted)return;zoomTween=null;canvas.setPointerCapture(e.pointerId);activePointers.set(e.pointerId,{x:e.clientX,y:e.clientY});
           if(activePointers.size>1){touchGesture=true;selectionBox=null;dragging=false;const [a,b]=activePointers.values();const cx=(a.x+b.x)/2,cy=(a.y+b.y)/2;pinch={dist:Math.max(1,Math.hypot(a.x-b.x,a.y-b.y)),zoom:cam.zoom,wx:(cx+cam.x)/cam.zoom,wy:(cy+cam.y)/cam.zoom};return}
           touchGesture=false;pointerButton=e.button;dragging=true;pointerMoved=false;dragStart={x:e.clientX,y:e.clientY,cx:cam.x,cy:cam.y};
           selectionBox=e.shiftKey&&e.pointerType!=='touch'?{startX:e.clientX,startY:e.clientY,endX:e.clientX,endY:e.clientY,active:true}:null;canvas.classList.add('dragging');
          });
          canvas.addEventListener('pointermove',e=>{
           hoverTile=screenToTile(e.clientX,e.clientY);if(!activePointers.has(e.pointerId))return;activePointers.set(e.pointerId,{x:e.clientX,y:e.clientY});
           if(pinch&&activePointers.size>=2){const [a,b]=activePointers.values(),cx=(a.x+b.x)/2,cy=(a.y+b.y)/2;cam.zoom=clamp(pinch.zoom*Math.hypot(a.x-b.x,a.y-b.y)/pinch.dist,MIN_ZOOM,MAX_ZOOM);cam.x=pinch.wx*cam.zoom-cx;cam.y=pinch.wy*cam.zoom-cy;clampCam();return}
           if(!dragging||touchGesture)return;const dx=e.clientX-dragStart.x,dy=e.clientY-dragStart.y;if(Math.hypot(dx,dy)>7)pointerMoved=true;
           if(selectionBox){selectionBox.endX=e.clientX;selectionBox.endY=e.clientY;return}
           if(pointerMoved){cam.x=dragStart.cx-dx;cam.y=dragStart.cy-dy;clampCam()}
          });
          canvas.addEventListener('pointerup',e=>{
           if(!activePointers.has(e.pointerId))return;activePointers.delete(e.pointerId);
           if(touchGesture){if(!activePointers.size)resetPointers();return}
           if(selectionBox&&pointerMoved)selectUnitsInBox(selectionBox);
           else if(!pointerMoved&&pointerButton===0){if(e.pointerType==='touch'&&!interactionMode){const t=screenToTile(e.clientX,e.clientY),unit=inBounds(t.x,t.y)?selectableEntityAt(t.x,t.y,false):null;if(unit){const previous=lastCanvasTap;lastCanvasTap={at:nowMs(),entityId:unit.id};if(previous.entityId===unit.id&&nowMs()-previous.at<360)selectVisibleType(unit);else selectEntity(unit)}}else handlePolishTap(e.clientX,e.clientY)}
           resetPointers();
          });"""

          new_pointer = """// Touch uses direct selection and movement. Hold briefly, then drag to box-select.
          let touchGesture=false,pointerButton=0;
          const SELECTION_HOLD_MS=300,POINTER_DRAG_THRESHOLD=7;
          const cameraKeys=new Set();let zoomTween=null;
          function editingField(target){return target?.isContentEditable||/INPUT|SELECT|TEXTAREA/.test(target?.tagName||'')}
          function resetPointers(){activePointers.clear();pinch=null;dragging=false;selectionBox=null;clearSelectionHold();document.body.classList.remove('selection-active');canvas.classList.remove('dragging')}
          function armTouchSelectionBox(e){
           if(e.pointerType!=='touch'||e.button!==0)return;
           const pointerId=e.pointerId,startX=e.clientX,startY=e.clientY;
           clearSelectionHold();
           selectionHoldTimer=setTimeout(()=>{
            selectionHoldTimer=null;
            if(!dragging||touchGesture||pinch||pointerMoved||activePointers.size!==1||!activePointers.has(pointerId))return;
            selectionBox={startX,startY,endX:startX,endY:startY,active:true};
            document.body.classList.add('selection-active');
            canvas.classList.remove('dragging');
           },SELECTION_HOLD_MS);
          }
          canvas.addEventListener('pointerdown',e=>{
           if(!gameStarted)return;zoomTween=null;canvas.setPointerCapture(e.pointerId);activePointers.set(e.pointerId,{x:e.clientX,y:e.clientY});
           if(activePointers.size>1){clearSelectionHold();touchGesture=true;selectionBox=null;dragging=false;const [a,b]=activePointers.values();const cx=(a.x+b.x)/2,cy=(a.y+b.y)/2;pinch={dist:Math.max(1,Math.hypot(a.x-b.x,a.y-b.y)),zoom:cam.zoom,wx:(cx+cam.x)/cam.zoom,wy:(cy+cam.y)/cam.zoom};return}
           touchGesture=false;pointerButton=e.button;dragging=true;pointerMoved=false;dragStart={x:e.clientX,y:e.clientY,cx:cam.x,cy:cam.y};
           selectionBox=e.shiftKey&&e.pointerType!=='touch'?{startX:e.clientX,startY:e.clientY,endX:e.clientX,endY:e.clientY,active:true}:null;
           if(selectionBox)document.body.classList.add('selection-active');else armTouchSelectionBox(e);
           canvas.classList.add('dragging');
          });
          canvas.addEventListener('pointermove',e=>{
           hoverTile=screenToTile(e.clientX,e.clientY);if(!activePointers.has(e.pointerId))return;activePointers.set(e.pointerId,{x:e.clientX,y:e.clientY});
           if(pinch&&activePointers.size>=2){clearSelectionHold();const [a,b]=activePointers.values(),cx=(a.x+b.x)/2,cy=(a.y+b.y)/2;cam.zoom=clamp(pinch.zoom*Math.hypot(a.x-b.x,a.y-b.y)/pinch.dist,MIN_ZOOM,MAX_ZOOM);cam.x=pinch.wx*cam.zoom-cx;cam.y=pinch.wy*cam.zoom-cy;clampCam();return}
           if(!dragging||touchGesture)return;const dx=e.clientX-dragStart.x,dy=e.clientY-dragStart.y,distance=Math.hypot(dx,dy);
           if(selectionBox){if(distance>POINTER_DRAG_THRESHOLD)pointerMoved=true;selectionBox.endX=e.clientX;selectionBox.endY=e.clientY;return}
           if(distance>POINTER_DRAG_THRESHOLD){pointerMoved=true;clearSelectionHold()}
           if(pointerMoved){cam.x=dragStart.cx-dx;cam.y=dragStart.cy-dy;clampCam()}
          });
          canvas.addEventListener('pointerup',e=>{
           if(!activePointers.has(e.pointerId))return;activePointers.delete(e.pointerId);
           if(touchGesture){if(!activePointers.size)resetPointers();return}
           if(selectionBox?.active){if(pointerMoved)selectUnitsInBox(selectionBox)}
           else if(!pointerMoved&&pointerButton===0)handlePolishTap(e.clientX,e.clientY);
           resetPointers();
          });"""

          replace_once(old_pointer, new_pointer, 'pointer controls')

          replace_once(
              "if(e.kind==='structure'&&(STRUCTURES[e.type]?.produces?.length||STRUCTURES[e.type]?.larvaEvery))polishButton('Rally',()=>{interactionMode='rally';refreshUI(true)})",
              "if(e.kind==='structure'&&(STRUCTURES[e.type]?.produces?.length||STRUCTURES[e.type]?.larvaEvery||STRUCTURES[e.type]?.base))polishButton('Rally',()=>{interactionMode='rally';refreshUI(true)})",
              'rally button eligibility',
          )

          replace_once(
              ":'Hold and drag to box-select. Double-click or double-tap a unit to select all visible units of that type.'}",
              ":'Tap or click open ground to move selected troops immediately. Hold + drag to box-select on touch; Shift-drag on desktop.'}",
              'selection hint',
          )

          replace_once(
              ":'Drag to pan · Wheel/pinch to zoom · WASD/arrows pan · F focuses · Shift-drag selects · Touch: select, choose an order, then tap its target.'};",
              ":'Drag to pan · Wheel/pinch to zoom · Tap/click open ground to move selected troops · Hold + drag box-selects on touch · Shift-drag on desktop · Buildings use Rally.'};",
              'polish control hint',
          )

          path.write_text(text, encoding='utf-8')
          PY

      - name: Validate TurnCraft control patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          text = Path('game/turncraft.html').read_text(encoding='utf-8')
          checks = {
              'direct touch dispatch': "else if(!pointerMoved&&pointerButton===0)handlePolishTap(e.clientX,e.clientY);",
              'long press selection': 'const SELECTION_HOLD_MS=300,POINTER_DRAG_THRESHOLD=7;',
              'selection box activation': "document.body.classList.add('selection-active');",
              'mobile move button suppression': "if(!directTapMoveUi())add(commandButtons,'Move'",
              'mobile group move suppression': "if(!directTapMoveUi())add(commandButtons,'Move Group'",
              'building rally': "STRUCTURES[e.type]?.larvaEvery||STRUCTURES[e.type]?.base",
              'direct move help': 'Tap a troop to select it, then tap open ground to move immediately',
          }
          for label, needle in checks.items():
              if needle not in text:
                  raise SystemExit(f'Missing validation: {label}')
          if "e.pointerType==='touch'&&!interactionMode" in text:
              raise SystemExit('Legacy touch-selection-only bypass still present')
          match = re.search(r'<script type="module">(.*?)</script>', text, re.S)
          if not match:
              raise SystemExit('Could not locate TurnCraft module script')
          Path('/tmp/turncraft.mjs').write_text(match.group(1), encoding='utf-8')
          PY
          node --check /tmp/turncraft.mjs

      - name: Commit tested mobile controls
        shell: bash
        run: |
          rm -f .github/workflows/apply-turncraft-mobile-controls.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix TurnCraft mobile movement and selection controls"
          git push origin HEAD:fix/turncraft-mobile-controls

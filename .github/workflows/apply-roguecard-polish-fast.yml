name: Apply Tiny Troops polish fast

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-roguecard-polish-fast.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Patch roguecard.html through GitHub API
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          python - <<'PY'
          import os, json, base64, urllib.request
          repo=os.environ['REPO']; token=os.environ['GH_TOKEN']
          path='game/roguecard.html'
          url=f'https://api.github.com/repos/{repo}/contents/{path}'
          headers={'Authorization':f'Bearer {token}','Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28','User-Agent':'tiny-troops-polish'}
          req=urllib.request.Request(url,headers=headers)
          with urllib.request.urlopen(req) as r: data=json.load(r)
          text=base64.b64decode(data['content']).decode('utf-8')
          css='<link rel="stylesheet" href="roguecard-polish.css?v=20260813">'
          js='<script src="roguecard-polish.js?v=20260813"></script>'
          if css not in text:
              if '</head>' not in text: raise SystemExit('missing </head>')
              text=text.replace('</head>',css+'</head>',1)
          if js not in text:
              if '</body>' not in text: raise SystemExit('missing </body>')
              text=text.replace('</body>',js+'</body>',1)
          if css in base64.b64decode(data['content']).decode('utf-8') and js in base64.b64decode(data['content']).decode('utf-8'):
              print('Already wired; no update needed')
              raise SystemExit(0)
          payload=json.dumps({'message':'Polish Tiny Troops battle UI','content':base64.b64encode(text.encode()).decode(),'sha':data['sha'],'branch':'main'}).encode()
          req=urllib.request.Request(url,data=payload,headers={**headers,'Content-Type':'application/json'},method='PUT')
          with urllib.request.urlopen(req) as r: out=json.load(r)
          print('Updated roguecard.html:',out['commit']['sha'])
          PY

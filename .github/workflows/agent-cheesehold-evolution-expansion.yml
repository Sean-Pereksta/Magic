          evolve_block = r'''function facingBuilding(dirIndex=player?.lastDir){if(!player||dirIndex==null)return null;const d=DIRS[dirIndex];return buildAt(player.gx+d.x,player.gy+d.y)}
          function levelHp(type,level){const base=BUILDINGS[type].hp*game.mods.buildingHp*((type==='wall'||type==='superwall')?game.mods.wallHp:1);return Math.round(base*(1+(level-1)*.48*game.mods.upgradeBoost));}

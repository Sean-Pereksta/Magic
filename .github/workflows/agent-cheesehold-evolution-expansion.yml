          begin_round = r'''function beginRound(first=false){for(const b of buildings)disposeObject(b.mesh);for(const c of cheeses)disposeObject(c.mesh);for(const e of enemies)disposeObject(e.mesh);for(const b of bullets)disposeObject(b.mesh);if(cat)disposeObject(cat.mesh);if(player)disposeObject(player.mesh);buildings=[];cheeses=[];enemies=[];bullets=[];cat=null;player=null;game.mutator=ROUND_MUTATORS[(game.round-1)%ROUND_MUTATORS.length];game.cheese+=first?0:game.mods.roundCheese;buildArena(game.round);spawnPlayer();spawnCat();ui.themeSub.textContent='Round '+game.round+' · '+game.mutator.name+' · Boss: '+game.boss.name;for(let i=0;i<7;i++)spawnCheese();game.nextMinion=game.time+3.2;game.nextCheese=game.time+2.5;game.pendingRound=false;showMsg(first?'SURVIVE':'ROUND '+game.round,game.boss.name+' · '+game.boss.desc+' · cap '+enemyCap());updateSelected();}'''

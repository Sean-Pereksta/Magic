          update_buildings = r'''function updateBuildings(dt){const targets=enemies.filter(e=>!e.dead).concat(cat&&!cat.dead?[cat]:[]);for(const b of buildings){if(b.dead)continue;const es=buildingEvoStats(b);if(game.mods.repairRate)b.hp=Math.min(b.maxHp,b.hp+game.mods.repairRate*dt);if(es.repairAura&&game.time>=(b.repairNext||0)){b.repairNext=game.time+.5;for(const other of buildings)if(!other.dead&&dist(b,other)<=3.2)other.hp=Math.min(other.maxHp,other.hp+es.repairAura*.5)}if(b.bar)updateHealthBar(b.bar,b.hp,b.maxHp,b.mesh);if(b.hitFlashUntil&&game.time>=b.hitFlashUntil){b.hitFlashUntil=0;setBuildingHitFlash(b,false)}

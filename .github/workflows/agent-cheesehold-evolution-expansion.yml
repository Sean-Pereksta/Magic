          function spawnCat(){let spots=[[1,1],[19,15],[1,15],[19,1]],s=spots[(game.round-1)%spots.length];while(terrain.has(K(s[0],s[1])))s=[s[0]+1,s[1]];const boss=BOSS_VARIANTS[(game.round-1)%BOSS_VARIANTS.length],hp=(260+game.round*120)*(game.mutator?.catHp||1)*boss.hp,dmg=(14+game.round*1.8)*boss.damage,move=Math.max(.14,(.52-game.round*.012)*boss.move),mesh=catMesh();styleBossMesh(mesh,boss);game.boss=boss;cat={type:'cat',boss,gx:s[0],gy:s[1],mesh,hp,maxHp:hp,damage:dmg,baseMove:move,attackEvery:.7,nextMove:0,nextAttack:0,moving:null,dead:false,bounty:10+game.round*2,slow:0,poisonUntil:0,poisonTick:0,eaten:new Set(),wall:1.2*boss.wall,attackAnim:null,baseScale:mesh.scale.clone(),special:null,nextAbility:game.time+(game.round>=2?6.8:999),abilityCursor:0};cat.bar=healthBar(1.35);cat.bar.position.y=1.62;cat.mesh.add(cat.bar);cat.mesh.position.copy(worldPos(cat.gx,cat.gy));entityGroup.add(cat.mesh);}'''

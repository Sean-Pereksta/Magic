           else if(type==='turret'){const base=new THREE.Mesh(new THREE.CylinderGeometry(.4+.025*(level-1),.46+.025*(level-1),.28,14),material(0x485463,.48,.55));base.position.y=.14;g.add(base);const pivot=new THREE.Group();pivot.position.y=.5;g.add(pivot);const head=box(.5+.05*(level-1),.38+.04*(level-1),.5,d.color,.36,.6);pivot.add(head);let barrels=(game.mods.twinBarrel||level>=3)?[-.11,.11]:[0];if(evolution==='gatling')barrels=[-.18,0,.18];if(evolution==='scatter')barrels=[-.24,0,.24];if(evolution==='sniper')barrels=[0];const gunLen=(evolution==='sniper'?1.08:.72)+.08*(level-1);for(const bx of barrels){const gun=box(evolution==='gatling'?.09:.11,.13,gunLen,evolution==='sniper'?0xe8f8ff:level>=2?0xbaf5ff:0xd8f5ff,.32,.7);gun.position.set(bx,.04,gunLen*.58);pivot.add(gun)}const muzzle=new THREE.Object3D();muzzle.position.set(0,.04,gunLen+.18);pivot.add(muzzle);if(level>=2||evolution==='sniper'){const sight=sphere(evolution==='sniper'?.1:.08,0x9ae9ff,10);sight.material.emissive.setHex(0x71dfff);sight.material.emissiveIntensity=2;sight.position.set(0,.24,.12);pivot.add(sight)}g.userData.turretPivot=pivot;g.userData.muzzle=muzzle}
           else if(type==='tesla'){const base=new THREE.Mesh(new THREE.CylinderGeometry(.38,.45,.25,14),material(0x46515f,.46,.55));base.position.y=.13;g.add(base);const mast=box(.14,.72+.08*(level-1),.14,d.color,.3,.75);mast.position.y=.55;g.add(mast);const pivot=new THREE.Group();pivot.position.y=.67;g.add(pivot);const orbCount=1+(level>=3?1:0)+(game.mods.stormCore?1:0)+(evolution==='storm'?1:0);for(let i=0;i<orbCount;i++){const orb=sphere(.18,d.color,14);orb.material.emissive.setHex(d.color);orb.material.emissiveIntensity=2.5;orb.position.set((i-(orbCount-1)/2)*.28,.45+(i%2)*.13,0);pivot.add(orb)}const emitter=box(.1,.1,.48+.08*(level-1),0xe7fdff,.28,.7);emitter.position.set(0,.45,.28);pivot.add(emitter);const muzzle=new THREE.Object3D();muzzle.position.set(0,.45,.58+.08*(level-1));pivot.add(muzzle);g.userData.turretPivot=pivot;g.userData.muzzle=muzzle}

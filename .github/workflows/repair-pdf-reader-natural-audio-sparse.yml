name: Repair PDF Reader Natural Audio Sparse

on:
  push:
    branches:
      - fix/pdf-reader-natural-audio-silence-v2

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Check out only the PDF reader
        uses: actions/checkout@v4
        with:
          ref: fix/pdf-reader-natural-audio-silence-v2
          fetch-depth: 1
          filter: blob:none
          sparse-checkout: |
            game/pdfreader.html
            .github/workflows/repair-pdf-reader-natural-audio-sparse.yml
          sparse-checkout-cone-mode: false

      - name: Patch silent natural narration
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("game/pdfreader.html")
          text = path.read_text(encoding="utf-8")

          function_start = text.index("    function naturalSamplesFrom(rawAudio) {")
          function_end = text.index("\n    async function playNaturalBuffer(", function_start)

          replacement = r'''    function naturalSamplesFrom(rawAudio) {
              const source = rawAudio?.data ?? rawAudio?.audio;
              let samples;
              if (source instanceof Float32Array) {
                samples = source;
              } else if (ArrayBuffer.isView(source)) {
                samples = Float32Array.from(source);
              } else if (Array.isArray(source)) {
                samples = Float32Array.from(source);
              } else {
                throw new Error("The natural voice engine returned no PCM audio samples.");
              }

              if (samples.length < 800) {
                throw new Error("The natural voice engine returned an empty or truncated audio buffer.");
              }

              let peak = 0;
              let sumSquares = 0;
              const sampledMagnitudes = [];
              const analysisStride = Math.max(1, Math.floor(samples.length / 50000));

              for (let index = 0; index < samples.length; index += 1) {
                const sample = samples[index];
                if (!Number.isFinite(sample)) {
                  throw new Error("The natural voice engine returned non-finite audio samples.");
                }
                const absolute = Math.abs(sample);
                peak = Math.max(peak, absolute);
                sumSquares += sample * sample;
                if (index % analysisStride === 0) sampledMagnitudes.push(absolute);
              }

              const rms = Math.sqrt(sumSquares / samples.length);
              if (peak < 0.00001 || rms < 0.000001) {
                throw new Error("The natural voice engine returned silent audio.");
              }

              // A single corrupt ONNX/WASM spike must not turn the entire passage
              // effectively silent. Scale against the body of the waveform instead.
              sampledMagnitudes.sort((a, b) => a - b);
              const percentileIndex = Math.min(
                sampledMagnitudes.length - 1,
                Math.max(0, Math.floor((sampledMagnitudes.length - 1) * 0.995))
              );
              const robustPeak = sampledMagnitudes[percentileIndex] || peak;

              let output = samples;
              if (peak > 1.05) {
                if (peak > 1e15) {
                  throw new Error("The natural voice engine returned numerically corrupted audio.");
                }

                // Integer-like PCM gets brought into Web Audio range. If only a few
                // samples are bad, keep normal gain and clip those isolated spikes.
                const gain = robustPeak > 1.05 ? 0.92 / robustPeak : 1;
                const normalized = new Float32Array(samples.length);
                for (let index = 0; index < samples.length; index += 1) {
                  normalized[index] = Math.max(-0.98, Math.min(0.98, samples[index] * gain));
                }
                output = normalized;

                console.warn("Natural narration returned hot PCM; robustly normalized before playback.", {
                  peak,
                  rms,
                  robustPeak,
                  gain,
                  samples: samples.length,
                });
              }

              // Check the exact samples that will reach Web Audio. The previous code
              // only checked before normalization, so it could create an inaudible
              // buffer and still treat playback as successful.
              let outputPeak = 0;
              let outputSumSquares = 0;
              for (let index = 0; index < output.length; index += 1) {
                const sample = output[index];
                outputPeak = Math.max(outputPeak, Math.abs(sample));
                outputSumSquares += sample * sample;
              }
              let outputRms = Math.sqrt(outputSumSquares / output.length);

              if (outputRms > 0 && outputRms < 0.015 && outputPeak > 0.0001) {
                const boost = Math.min(12, 0.06 / outputRms);
                const boosted = new Float32Array(output.length);
                outputPeak = 0;
                outputSumSquares = 0;
                for (let index = 0; index < output.length; index += 1) {
                  const sample = Math.max(-0.98, Math.min(0.98, output[index] * boost));
                  boosted[index] = sample;
                  outputPeak = Math.max(outputPeak, Math.abs(sample));
                  outputSumSquares += sample * sample;
                }
                output = boosted;
                outputRms = Math.sqrt(outputSumSquares / output.length);
              }

              if (outputPeak < 0.001 || outputRms < 0.0015) {
                throw new Error(
                  `Natural voice produced inaudible PCM after normalization (peak ${outputPeak.toExponential(2)}, RMS ${outputRms.toExponential(2)}).`
                );
              }

              return output;
            }
          '''

          text = text[:function_start] + replacement + text[function_end:]

          playback_start = text.index(
              "    async function playNaturalBuffer(rawAudio, chunk, model, chunkStart, session) {",
              function_start,
          )
          active_line = '      if (!state.speech.active || session !== state.speech.session) return "stopped";'
          active_pos = text.index(active_line, playback_start)
          insert_at = active_pos + len(active_line)
          context_guard = r'''

              // Long local model generation can leave Web Audio suspended again.
              // Do not call silent playback a success unless the context is running.
              if (context.state === "suspended") await context.resume();
              if (context.state !== "running") {
                throw new Error(`Natural narration audio context is ${context.state}, not running.`);
              }'''
          text = text[:insert_at] + context_guard + text[insert_at:]

          path.write_text(text, encoding="utf-8")

          workflow = Path(".github/workflows/repair-pdf-reader-natural-audio-sparse.yml")
          if workflow.exists():
              workflow.unlink()
          PY

      - name: Verify patch
        shell: bash
        run: |
          grep -q "robustly normalized before playback" game/pdfreader.html
          grep -q "Natural narration audio context is" game/pdfreader.html
          python3 - <<'PY'
          from pathlib import Path
          text = Path("game/pdfreader.html").read_text(encoding="utf-8")
          start = text.rfind("<script")
          body = text.find(">", start)
          end = text.find("</script>", body)
          if start < 0 or body < 0 or end < 0:
              raise SystemExit("Could not isolate final inline script")
          Path("/tmp/pdfreader-inline.js").write_text(text[body + 1:end], encoding="utf-8")
          PY
          node --check /tmp/pdfreader-inline.js

      - name: Commit repaired reader
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix silent natural PDF narration"
          git push origin HEAD:fix/pdf-reader-natural-audio-silence-v2

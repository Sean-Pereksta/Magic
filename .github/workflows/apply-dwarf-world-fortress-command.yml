name: Apply Dwarf World fortress command expansion

on:
  push:
    branches:
      - feature/dwarf-world-fortress-command
    paths:
      - '.github/workflows/apply-dwarf-world-fortress-command.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/dwarf-world-fortress-command
          fetch-depth: 0

      - name: Rebuild expansion sources
        shell: bash
        run: |
          set -euo pipefail
          cat game/.dwfx-payload-*.b64 | base64 -d > /tmp/dwfx.tar.gz
          tar -xzf /tmp/dwfx.tar.gz -C game/dwarf-world
          node game/dwarf-world/sync-fortress-expansion.mjs

      - name: Validate expansion and integrated core
        shell: bash
        run: |
          set -euo pipefail
          node --check game/dwarf-world/fortress-expansion.js
          node game/dwarf-world/fortress-expansion.test.mjs
          python3 - <<'PY'
          import re
          from pathlib import Path
          text = Path('game/DwarfWorld-core.html').read_text(encoding='utf-8')
          scripts = re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>', text, flags=re.S | re.I)
          if not scripts:
              raise SystemExit('No inline Dwarf World script found')
          Path('/tmp/dwarf-world-core.js').write_text('\n'.join(scripts), encoding='utf-8')
          PY
          node --check /tmp/dwarf-world-core.js

      - name: Commit generated game update
        shell: bash
        run: |
          set -euo pipefail
          rm -f game/.dwfx-payload-*.b64
          rm -f .github/workflows/apply-dwarf-world-fortress-command.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No generated changes to commit."
            exit 0
          fi
          git commit -m "Expand Dwarf World fortress command systems"
          git push origin HEAD:feature/dwarf-world-fortress-command

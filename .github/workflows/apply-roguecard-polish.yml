name: Apply Tiny Troops polish

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-roguecard-polish.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Inject polish assets into roguecard
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('game/roguecard.html')
          s = p.read_text(encoding='utf-8')
          css = '<link rel="stylesheet" href="roguecard-polish.css?v=20260813">'
          js = '<script src="roguecard-polish.js?v=20260813"></script>'
          if css not in s:
              if '</head>' not in s:
                  raise SystemExit('Could not find </head> in roguecard.html')
              s = s.replace('</head>', css + '</head>', 1)
          if js not in s:
              if '</body>' not in s:
                  raise SystemExit('Could not find </body> in roguecard.html')
              s = s.replace('</body>', js + '</body>', 1)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit updated game file
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add game/roguecard.html
          if git diff --cached --quiet; then
            echo "roguecard.html already wired"
            exit 0
          fi
          git commit -m "Polish Tiny Troops battle UI"
          git push origin HEAD:main

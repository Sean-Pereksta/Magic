            name: "Ruin-Tusk Veteran",
            image: "ruin_tusk_veteran.png",
            faction: "green",
            cost: 5,
            shop_cost: 90,
            type: "ship",
            sigil: "⬢",
            effect: { combat: 3, combatAgainstBases: 5 },
            ally: { combat: 3 },
            text: "Gain 3 Combat and 5 additional Combat that can be spent against Bases.",
            allyText: "Gain 3 additional Combat.",

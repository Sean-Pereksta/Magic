          text = text.replace(marker, marker + cards, 1)
          path.write_text(text, encoding="utf-8")

      - name: Validate generated card pack
        shell: bash
        run: |
          node --check game/warrealms-pack/warrealms-cards.js
          python - <<'PY'
          from pathlib import Path
          text = Path('game/warrealms-pack/warrealms-cards.js').read_text(encoding='utf-8')
          ids = [
              'causality_smuggler','sequence_parasite','vacancy_engine','null_court_arbiter','archive_roads_not_taken',
              'last_light_basilica','keystone_penitent','sanctuary_chorus','aegis_accountant','pilgrim_high_archive',
              'war_drum_nest','gorge_raider','ruin_tusk_veteran','siegebound_encampment','warhost_avalanche_fort',
              'soul_ledger','ashen_probate','grave_advocate','void_mortgage','inheritance_engine'
          ]
          missing = [card_id for card_id in ids if f'id: "{card_id}"' not in text]
          if missing:
              raise SystemExit(f'Missing cards: {missing}')
          if 'export const WAR_REALMS_CARD_VERSION = 19;' not in text:
              raise SystemExit('Card pack version was not bumped to 19')
          if text.count('id: "warhost_avalanche_fort"') != 1:
              raise SystemExit('Warhost Avalanche-Fort must exist exactly once')
          print(f'Validated {len(ids)} system-combo card definitions')
          PY

      - name: Remove one-shot workflow and commit expansion
        shell: bash
        run: |
          rm .github/workflows/apply-warrealms-card-system-combos.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add game/warrealms-pack/warrealms-cards.js .github/workflows/apply-warrealms-card-system-combos.yml
          git commit -m "Expand Warrealms with system-combo cards"
          git push
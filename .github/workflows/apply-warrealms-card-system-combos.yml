name: Apply Warrealms system-combo card expansion

on:
  push:
    branches:
      - agent/warrealms-card-system-combos
    paths:
      - .github/workflows/apply-warrealms-card-system-combos.yml

permissions:
  contents: write

jobs:
  apply-card-pack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/warrealms-card-system-combos

      - name: Insert system-combo cards
        shell: python
        run: |
          from pathlib import Path

          path = Path("game/warrealms-pack/warrealms-cards.js")
          text = path.read_text(encoding="utf-8")

          marker = "export const CARDS = Object.freeze([\n"
          if marker not in text:
              raise SystemExit("Could not find Warrealms CARDS marker")
          if 'id: "causality_smuggler"' in text:
              raise SystemExit("Expansion already present")

          text = text.replace(
              "export const WAR_REALMS_CARD_VERSION = 18;",
              "export const WAR_REALMS_CARD_VERSION = 19;",
              1,
          )

          cards = r'''  // ==========================================================
          // SYSTEM-COMBO EXPANSION — sequencing, reactions, attachments,
          // persistent engines, siege evolution, sacrifice recursion

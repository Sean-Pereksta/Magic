name: Catnmice Game Hub for Windows
on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish tested Windows files to the Catnmice download page
        type: boolean
        default: false
      truth_revision:
        description: Truth commit to build (defaults to its current main)
        required: false
  push:
    branches: [main]
  schedule:
    - cron: '17 */6 * * *'
  pull_request:
    paths: ['desktop-hub/**','.github/workflows/catnmice-game-hub.yml']
  repository_dispatch:
    types: [catnmice-truth-release]
permissions:
  contents: read
concurrency:
  group: catnmice-windows-${{ github.event.pull_request.number || 'release' }}
  cancel-in-progress: false
jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      build: ${{ steps.revisions.outputs.build }}
      publish: ${{ steps.revisions.outputs.publish }}
      truth: ${{ steps.revisions.outputs.truth }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          sparse-checkout: desktop-hub/build
      - name: Check Magic and Truth for new revisions
        id: revisions
        env:
          GH_TOKEN: ${{ github.token }}
          MANUAL_PUBLISH: ${{ inputs.publish }}
          AUTO_PUBLISH: ${{ vars.CATNMICE_AUTO_PUBLISH }}
          TRUTH_REVISION: ${{ inputs.truth_revision || github.event.client_payload.truth_sha }}
        run: node desktop-hub/build/plan-release.cjs
  windows:
    needs: plan
    if: needs.plan.outputs.build == 'true'
    runs-on: windows-2025
    defaults:
      run:
        working-directory: desktop-hub
        shell: pwsh
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: Sean-Pereksta/Truth
          ref: ${{ needs.plan.outputs.truth }}
          path: truth-source
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24.19.0'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Build library and games from the release commits
        run: |
          git config --global core.autocrlf false
          node content/build-catalog.mjs .. ../truth-source
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $lastSignal = Join-Path $env:RUNNER_TEMP 'last-signal-build'
          & ../truth-source/games/last-signal/Build-Windows.ps1 -Destination $lastSignal
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          & ../truth-source/games/last-signal/tests/Install-SoftwareGraphics.ps1 -GameDirectory $lastSignal
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python content/build-packs.py .. ../truth-source --last-signal-build "$lastSignal"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          node content/build-catalog.mjs .. ../truth-source
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          node content/check-routes.mjs route-checks.json
      - name: Install locked build tools
        run: |
          npm ci --no-audit --no-fund
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          npm ci --prefix desktop/provenance --omit=dev --ignore-scripts --no-audit --no-fund
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          node node_modules/electron/install.js
      - name: Test launcher and services
        run: |
          npm test
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $env:CAT_EDITION_ROOT=(Resolve-Path ../game/catandmouse/edition).Path
          $env:BANNERLANDS_ROOT=(Resolve-Path ../truth-source/games/bannerlands).Path
          npm install --prefix "$env:CAT_EDITION_ROOT" --omit=dev --omit=optional --ignore-scripts --no-audit --no-fund
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          node services/prepare-cat.mjs "$env:CAT_EDITION_ROOT"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $env:HUB_LONG_MATCH='1'
          node --test services/service.test.mjs services/desktop-authorization.test.mjs services/engine.test.mjs services/complete-match.test.mjs
      - name: Build the GitHub update manifest
        if: needs.plan.outputs.publish == 'true'
        env:
          TRUTH_SHA: ${{ needs.plan.outputs.truth }}
          HUB_UPDATE_PRIVATE_KEY: ${{ secrets.HUB_UPDATE_PRIVATE_KEY }}
        run: |
          python build/component_archives.py channel
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          node build/release.cjs channel release-config.json
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          "HUB_RELEASE_CONFIG=$pwd/release-config.json" >> $env:GITHUB_ENV
      - name: Use the optional Windows publisher certificate
        if: needs.plan.outputs.publish == 'true'
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          if (!$env:WINDOWS_CERTIFICATE -and !$env:WINDOWS_CERTIFICATE_PASSWORD) { return }
          if (!$env:WINDOWS_CERTIFICATE -or !$env:WINDOWS_CERTIFICATE_PASSWORD) { throw 'Complete the optional Windows certificate configuration.' }
          $certFile = Join-Path $env:RUNNER_TEMP 'catnmice-signing.pfx'
          [IO.File]::WriteAllBytes($certFile,[Convert]::FromBase64String($env:WINDOWS_CERTIFICATE))
          $pass = ConvertTo-SecureString $env:WINDOWS_CERTIFICATE_PASSWORD -AsPlainText -Force
          try { $cert = Import-PfxCertificate -FilePath $certFile -CertStoreLocation Cert:\CurrentUser\My -Password $pass } finally { Remove-Item -LiteralPath $certFile -Force }
          $signer = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" | Sort-Object FullName -Descending | Select-Object -First 1
          if (!$cert.Thumbprint -or !$signer) { throw 'A Windows signing identity and signtool are required for publication.' }
          "CATNMICE_SIGN_THUMBPRINT=$($cert.Thumbprint)" >> $env:GITHUB_ENV
          "SIGNTOOL_PATH=$($signer.FullName)" >> $env:GITHUB_ENV
      - name: Package and test the installed launcher
        run: |
          node build/package.cjs
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $install = Join-Path $env:RUNNER_TEMP hub-install
          $setup = Start-Process -FilePath dist/Catnmice-Game-Hub-Setup.exe -ArgumentList "/S",("/TESTROOT=`""+$install+"`"") -PassThru -Wait
          if ($setup.ExitCode) { throw "Setup failed $($setup.ExitCode)" }
          node build/check-installed-release.cjs "$install" test/fixtures/catnmice-build-7/github-stable.json test/fixtures/catnmice-build-7/github-stable.sigstore.json
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          node build/smoke.cjs "$install/Catnmice Game Hub.exe" "$env:RUNNER_TEMP/hub-qa-profile" --offline-all
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          node build/check-online.cjs "$install/Catnmice Game Hub.exe" "$env:RUNNER_TEMP/hub-qa-online"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          if ($env:CATNMICE_SIGN_THUMBPRINT -and (Get-AuthenticodeSignature dist/Catnmice-Game-Hub-Setup.exe).Status -ne 'Valid') { throw 'Invalid setup signature.' }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Catnmice-Game-Hub-Windows-x64
          path: |
            desktop-hub/dist/Catnmice-Game-Hub-Setup.exe
            desktop-hub/route-checks.json
            desktop-hub/channel/
          if-no-files-found: error
  release:
    needs: [plan, windows]
    if: needs.plan.outputs.publish == 'true' && github.ref == 'refs/heads/main' && github.repository == 'Sean-Pereksta/Magic'
    environment: catnmice-production
    runs-on: windows-2025
    permissions:
      contents: write
      attestations: write
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          sparse-checkout: |
            desktop-hub/build
            desktop-hub/desktop/provenance
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: Catnmice-Game-Hub-Windows-x64
          path: publish
      - name: Attest the update manifest with GitHub
        id: manifest
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: publish/channel/github-stable.json
          create-storage-record: false
      - name: Attest the Windows installer with GitHub
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: publish/dist/Catnmice-Game-Hub-Setup.exe
          create-storage-record: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24.19.0'
      - name: Install the launcher's release verifier
        shell: pwsh
        run: npm ci --prefix desktop-hub/desktop/provenance --omit=dev --ignore-scripts --no-audit --no-fund
      - name: Stage the signed update proof
        shell: pwsh
        env:
          MANIFEST_BUNDLE: ${{ steps.manifest.outputs.bundle-path }}
        run: Copy-Item -LiteralPath $env:MANIFEST_BUNDLE -Destination publish/channel/github-stable.sigstore.json
      - name: Verify with the installed Windows launcher and publish the download
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TRUTH_SHA: ${{ needs.plan.outputs.truth }}
        run: |
          node desktop-hub/desktop/provenance/verify.cjs publish/channel/github-stable.json publish/channel/github-stable.sigstore.json
          gh attestation verify publish/channel/github-stable.json --bundle publish/channel/github-stable.sigstore.json \
            --repo "$GH_REPO" --signer-workflow "$GH_REPO/.github/workflows/catnmice-game-hub.yml" \
            --source-ref refs/heads/main --source-digest "$GITHUB_SHA" --deny-self-hosted-runners
          bash desktop-hub/build/publish-release.sh

name: Quip Clash
on:
  pull_request:
    paths: ['game/quip-clash/**', 'game/quip-clash.html', 'lobby/**', 'firestore.rules', 'firebase.quip-clash-test.json', '.github/workflows/quip-clash.yml']
  push:
    branches: [main]
    paths: ['game/quip-clash/**', 'game/quip-clash.html', 'lobby/**', 'firestore.rules', 'firebase.quip-clash-test.json', '.github/workflows/quip-clash.yml']
jobs:
  game:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            game/quip-clash
            lobby
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: node --test game/quip-clash/tests/core.test.mjs game/quip-clash/tests/state.test.mjs lobby/tests/quip-clash-lobby.test.cjs
      - run: npm install --no-audit --no-fund
      - run: npm run test:quip-clash:rules

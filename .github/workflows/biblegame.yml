name: Bible game multiplayer

on:
  pull_request:
    paths:
      - 'game/biblegame-multiplayer.html'
      - 'game/biblegame-tests/**'
      - 'game/biblegame-concepts.js'
      - 'firestore.rules'
      - 'firebase.biblegame-test.json'
      - 'package.json'
      - '.github/workflows/biblegame.yml'
  push:
    branches: [main]
    paths:
      - 'game/biblegame-multiplayer.html'
      - 'game/biblegame-tests/**'
      - 'game/biblegame-concepts.js'
      - 'firestore.rules'
      - 'firebase.biblegame-test.json'
      - 'package.json'
      - '.github/workflows/biblegame.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  multiplayer:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /game/biblegame-multiplayer.html
            /game/biblegame-concepts.js
            /game/biblegame-tests/
            /firestore.rules
            /firebase.biblegame-test.json
            /package.json
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm install --ignore-scripts --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - run: npm run test:biblegame
      - run: npm run test:biblegame:rules

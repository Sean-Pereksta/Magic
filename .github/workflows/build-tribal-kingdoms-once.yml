name: Build Tribal Kingdoms standalone
on:
  push:
    branches: [codex/apes-tribal-kingdoms]
    paths: [.github/workflows/build-tribal-kingdoms-once.yml]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/apes-tribal-kingdoms
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Regenerate verified offline game
        run: |
          node game/apes-together-strong/build.cjs
          node game/apes-together-strong/build.cjs --check
          test "$(git hash-object game/apes-together-strong.html)" = b5e1441a9aef5fb0af9a3972db57ecb54aeca26b
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/build-tribal-kingdoms-once.yml
          git add game/apes-together-strong.html
          git commit -m "Regenerate tested Tribal Kingdoms standalone game"
          git push origin HEAD:codex/apes-tribal-kingdoms

name: Apply Bible RPG verse echo main

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/apply-bible-rpg-verse-echo-main.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Add fading successful verse display
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('game/biblegame.html')
          text = path.read_text(encoding='utf-8')
          if 'id="verseEcho"' in text:
              raise SystemExit('Verse echo is already present')

          text = text.replace(
              '  .combat-box{position:absolute;',
              '  .verse-echo{position:absolute;z-index:7;left:50%;top:19%;width:min(78%,620px);transform:translate(-50%,10px);text-align:center;pointer-events:none;opacity:0;text-shadow:0 3px 10px rgba(0,0,0,.95),0 0 24px rgba(139,92,246,.28)}.verse-echo.active{animation:verseEcho 2.8s ease-out forwards}.verse-echo-ref{font-size:.74rem;letter-spacing:.13em;text-transform:uppercase;font-weight:1000;color:#fde68a;margin-bottom:6px}.verse-echo-text{font-family:Georgia,serif;font-size:clamp(1.05rem,2.5vw,1.55rem);font-weight:700;line-height:1.42;color:#fff}\n  .combat-box{position:absolute;',
              1
          )
          text = text.replace(
              '  @keyframes enemyHit{',
              '  @keyframes verseEcho{0%{opacity:0;transform:translate(-50%,12px) scale(.98)}12%{opacity:1;transform:translate(-50%,0) scale(1)}68%{opacity:.96;transform:translate(-50%,-4px) scale(1)}100%{opacity:0;transform:translate(-50%,-18px) scale(1.02)}}@keyframes enemyHit{',
              1
          )
          text = text.replace(
              '    <div class="battlefield" id="battlefield">\n      <div class="battle-top">',
              '    <div class="battlefield" id="battlefield">\n      <div class="verse-echo" id="verseEcho" aria-live="polite"><div class="verse-echo-ref" id="verseEchoRef"></div><div class="verse-echo-text" id="verseEchoText"></div></div>\n      <div class="battle-top">',
              1
          )
          text = text.replace(
              'function rpgAttack(){if(!rpg||rpg.dead||!rpg.enemy)return;',
              'function showVerseEcho(v){const echo=$("verseEcho");if(!echo||!v)return;$("verseEchoRef").textContent=displayRef(v);$("verseEchoText").textContent=v.text;echo.classList.remove("active");void echo.offsetWidth;echo.classList.add("active")}\nfunction rpgAttack(){if(!rpg||rpg.dead||!rpg.enemy)return;',
              1
          )
          success = 'input.value="";input.focus();pulseFighter("enemyFighter");'
          if success not in text:
              raise SystemExit('Successful RPG attack hook not found')
          text = text.replace(success, 'showVerseEcho(v);input.value="";input.focus();pulseFighter("enemyFighter");', 1)
          text = text.replace(
              '  @media(max-width:570px){.shell{padding:9px}',
              '  @media(max-width:570px){.verse-echo{top:16%;width:90%}.verse-echo-text{font-size:1rem}.shell{padding:9px}',
              1
          )

          required = ['id="verseEcho"','@keyframes verseEcho','function showVerseEcho(v)','showVerseEcho(v);input.value']
          missing = [x for x in required if x not in text]
          if missing:
              raise SystemExit(f'Missing verse echo pieces: {missing}')
          path.write_text(text, encoding='utf-8')
          PY

          rm -f .github/workflows/apply-bible-rpg-verse-echo-main.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add game/biblegame.html .github/workflows/apply-bible-rpg-verse-echo-main.yml
          git commit -m "Show fading verse text on successful RPG attacks"
          git push origin HEAD:main

# trigger

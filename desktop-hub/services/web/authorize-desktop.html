<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' https://www.gstatic.com; connect-src 'self' https://hub.catnmice.com https://*.googleapis.com; frame-src https://bible-game-246c0.firebaseapp.com; style-src 'self'; base-uri 'none'; form-action 'none'">
<link rel="stylesheet" href="desktop-auth.css"><title>Authorize your launcher · Catnmice</title></head>
<body><main><a href="/lobby/lobby.html" target="_blank" rel="noopener noreferrer">Open Catnmice library</a>
<h1>Authorize your launcher</h1><p>Approving signs the Windows launcher into the Catnmice account shown below. It can use this account’s profile, saves and ranked identity. Enter the code shown on your own launcher.</p>
<p id="account">Checking your Catnmice profile…</p><button id="refresh" type="button" class="secondary" hidden>Check signed-in profile</button>
<form id="consent" hidden><label for="code">Code from your launcher</label><input id="code" type="text" required autocomplete="off" autocapitalize="characters" spellcheck="false" placeholder="XXXX-XXXX" minlength="8" maxlength="9" pattern="[A-Za-z2-9]{4}-?[A-Za-z2-9]{4}">
<div class="actions"><button id="approve" type="submit">Authorize this launcher</button><button id="deny" type="button" class="secondary">Deny request</button></div></form>
<p id="status" role="status" aria-live="polite"></p></main><script type="module" src="authorize-desktop.mjs"></script></body></html>

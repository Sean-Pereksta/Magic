<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data: https:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'">
  <title>Library · Catnmice Game Hub</title>
  <link rel="icon" href="art/catnmice-mark.svg">
  <link rel="stylesheet" href="hub.css">
  <script defer src="icons.js"></script>
  <script defer src="hub.js"></script>
</head>
<body>
  <a class="skip" href="#main">Skip to content</a>
  <aside class="rail">
    <button class="brand" data-go="Library" aria-label="Catnmice Game Hub home"><img src="art/catnmice-mark.svg" alt=""><span>CATNMICE<small>GAME HUB</small></span></button>
    <nav id="navigation" aria-label="Main navigation"></nav>
    <div class="rail-bottom"><button id="rail-login" class="rail-login" data-action="account" data-mode="login">Log In</button><button class="profile-link" data-action="accounts" aria-label="Manage player profiles" title="Manage player profiles"><span class="avatar" id="rail-avatar"></span><span class="profile-text"><strong id="username">Guest</strong><small id="profile-type">Local profile</small></span><span data-icon="chevrons" class="profile-arrow"></span></button></div>
  </aside>
  <main id="main" tabindex="-1">
    <header class="header"><div class="heading"><span class="heading-mark" aria-hidden="true"></span><h1 id="page-title">Library</h1></div>
      <div class="header-end"><label class="search"><span data-icon="search"></span><input id="search" type="search" placeholder="Search games" aria-label="Search all games"><kbd>/</kbd></label>
      <span class="connection" id="connection">Connecting</span></div>
    </header>
    <div id="view" aria-busy="true"><p class="notice" role="status">Opening your library…</p></div>
  </main>
  <dialog id="dialog"><div id="dialog-body"></div></dialog>
  <div id="status" role="status" aria-live="polite"></div>
  <noscript>Enable JavaScript to open the game library.</noscript>
</body>
</html>

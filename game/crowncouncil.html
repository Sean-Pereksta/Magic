<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>⚔️ Faction Forge (2P)</title>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<style>
  :root{
    --bg:#ffffff; --ink:#0f172a; --muted:#64748b; --line:#d1d5db;
    --shadow:0 10px 30px rgba(2,6,23,.18);
    --cell:64px; /* bigger tiles for closer view */
    --gap:4px;

    /* team fills kept around but unused now (rank colors used instead) */
    --p0bg:#ffdbe0;
    --p1bg:#dbe7ff;

    /* darker, solid rank colors */
    --rank1:#166534;  /* dark green */
    --rank2:#a16207;  /* dark amber/gold */
    --rank3:#991b1b;  /* dark red */

    /* team colors for HP bars */
    --team0:#ef4444;  /* red */
    --team0b:#dc2626; /* darker red */
    --team1:#3b82f6;  /* blue */
    --team1b:#2563eb; /* darker blue */
  }
  *{box-sizing:border-box}
  body{
    margin:0;
    background:
      radial-gradient(circle at top,#ffffff 0,#f8fafc 55%,#eef2f7 100%);
    color:#0f172a;
    font-family:ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,Arial;
  }

  .topbar{
    position:sticky; top:0; z-index:30;
    background:linear-gradient(90deg,#020617,#020617,#0f172a);
    border-bottom:1px solid rgba(148,163,184,.35);
    padding:8px 12px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
    box-shadow:0 12px 30px rgba(15,23,42,.65);
  }
  .row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .badge{
    display:inline-flex;
    gap:8px;
    align-items:center;
    padding:6px 12px;
    border-radius:999px;
    background:rgba(15,23,42,.9);
    border:1px solid rgba(148,163,184,.4);
    box-shadow:0 6px 18px rgba(15,23,42,.55);
    font-weight:700;
    font-size:.85rem;
    color:#e5e7eb;
    backdrop-filter:blur(10px);
  }
  .badge.p0{border-color:#f97373;background:linear-gradient(135deg,rgba(248,113,113,.22),rgba(15,23,42,.95));}
  .badge.p1{border-color:#60a5fa;background:linear-gradient(135deg,rgba(96,165,250,.22),rgba(15,23,42,.95));}
  .badge.phase{background:rgba(15,23,42,.95);border-style:dashed;border-color:rgba(148,163,184,.7);}
  .badge.timer{background:rgba(15,23,42,.95);}

  .btn{
    appearance:none;
    border-radius:999px;
    padding:8px 12px;
    font-weight:700;
    cursor:pointer;
    border:1px solid rgba(148,163,184,.5);
    background:#111827;
    color:#e5e7eb;
    font-size:.85rem;
    display:inline-flex;
    align-items:center;
    gap:6px;
  }
  .btn.ghost{background:rgba(15,23,42,.8);}
  .btn:hover{border-color:#38bdf8;}

  .viewport{
    position:relative;
    width:100%;
    height:calc(100dvh - 70px);
    border-top:1px solid rgba(15,23,42,.2);
    border-radius:18px 18px 0 0;
    overflow:hidden;
    background:linear-gradient(180deg,#ffffff,#f8fafc);
    cursor:grab;
    user-select:none;
    touch-action:none;
  }
  .viewport:active{ cursor:grabbing; }
  .canvas{ position:absolute; left:0; top:0; transform-origin:0 0; will-change:transform; }

  .cells{
    position:relative;
    display:grid;
    grid-template-columns:repeat(var(--w),var(--cell));
    grid-auto-rows:var(--cell);
    gap:var(--gap);
    padding:10px;
  }
  .cells::before{
    content:"";
    position:absolute;
    inset:10px;
    background:
      linear-gradient(180deg, rgba(59,130,246,.14) 0 49.4%, rgba(255,255,255,0) 49.4% 50.6%, rgba(239,68,68,.14) 50.6% 100%);
    pointer-events:none;
    z-index:2;
  }
  .cells::after{
    content:"";
    position:absolute;
    left:10px; right:10px;
    top:50%;
    height:2px;
    transform:translateY(-50%);
    background:linear-gradient(90deg, rgba(148,163,184,0), rgba(148,163,184,.6), rgba(148,163,184,0));
    z-index:2;
    pointer-events:none;
  }
  .unit-layer{ position:absolute; inset:10px; pointer-events:none; z-index:12; }
  .vu{ position:absolute; width:var(--cell); height:var(--cell); pointer-events:none; will-change:transform,opacity; }
  .vu.big{ overflow:hidden; }
  .vu.fading{ opacity:0; transition:opacity 220ms ease-out; }
  .cell{
    width:var(--cell);height:var(--cell);
    border-radius:12px;
    background:linear-gradient(145deg,#284e3a,#2c5d45 58%,#244936);
    border:1px solid rgba(15,23,42,.28);
    position:relative;
    overflow:hidden;
    box-shadow:0 1px 0 rgba(255,255,255,.08) inset, 0 1px 3px rgba(15,23,42,.2);
  }
  .cell.tile-a{ background:linear-gradient(145deg,#294f3b,#2f6147 58%,#264d38); }
  .cell.tile-b{ background:linear-gradient(145deg,#244736,#2a5842 58%,#214130); }
  .cell.tile-c{ background:linear-gradient(145deg,#2f5640,#35684d 58%,#2a513c); }
  .cell.side-top{ border-color:rgba(59,130,246,.2); }
  .cell.side-bottom{ border-color:rgba(239,68,68,.2); }
  .cell.center-divider{
    box-shadow:0 -1px 0 rgba(148,163,184,.32) inset, 0 1px 0 rgba(148,163,184,.32) inset;
  }
  .cell.multi-origin{ z-index:8; }
  .cell.big-footprint-debug{
    outline:2px solid rgba(251,191,36,.9);
    outline-offset:-3px;
    box-shadow:0 0 0 999px rgba(251,191,36,.12) inset, 0 0 14px rgba(251,191,36,.35) inset;
  }

  /* Layers (z-index order): under(0) < ground fx(1) < unit(3) < hp(4) < status(6) */
  .under{
    position:absolute; inset:0; z-index:0;
    opacity:1 !important;
    mix-blend-mode:screen !important;
    filter:brightness(1.05) saturate(1.1);
  }
  .unit{ position:absolute; inset:0; display:grid; place-items:center; font-size:26px; z-index:3; pointer-events:none; }
  .unit.attacking{ animation:unitAttack .35s ease-out; }
  .unit.casting{ animation:unitCast .5s ease-out; }
  .unit .troop-art{
    --base-team:rgba(148,163,184,.86);
    --base-team-soft:rgba(148,163,184,.28);
    --base-rim:rgba(226,232,240,.7);
    --base-level-rim:rgba(255,255,255,.36);
    --base-w:76%;
    --base-h:18%;
    --base-left:12%;
    --base-bottom:7%;
    --base-shadow:0 3px 8px rgba(2,6,23,.65), 0 0 12px var(--base-team-soft);
    --base-glow:0 0 0 rgba(255,255,255,0);
    position:relative;
    display:block;
    width:88%;
    height:88%;
    filter:drop-shadow(0 0 7px rgba(0,0,0,.55)) var(--hp-filter, drop-shadow(0 0 0 transparent)) var(--level-filter, drop-shadow(0 0 0 transparent));
    isolation:isolate;
    overflow:visible;
  }
  .unit .troop-art::before,
  .unit .troop-art::after{
    content:"";
    position:absolute;
    left:var(--base-left);
    bottom:var(--base-bottom);
    width:var(--base-w);
    height:var(--base-h);
    border-radius:50%;
    pointer-events:none;
  }
  .unit .troop-art::before{
    z-index:0;
    background:radial-gradient(ellipse at center, rgba(2,6,23,.66) 0 42%, rgba(2,6,23,.2) 66%, rgba(2,6,23,0) 78%);
    box-shadow:var(--base-shadow);
  }
  .unit .troop-art::after{
    z-index:1;
    border:2px solid var(--base-rim);
    background:
      radial-gradient(ellipse at center, transparent 44%, var(--base-team-soft) 49%, transparent 66%),
      linear-gradient(90deg, transparent 0 16%, var(--base-team) 34%, var(--base-level-rim) 50%, var(--base-team) 66%, transparent 84%);
    box-shadow:0 0 0 1px rgba(2,6,23,.72), inset 0 0 7px rgba(255,255,255,.24), var(--base-glow);
    opacity:.98;
  }
  .unit .troop-art svg{ position:relative; z-index:2; }
  .unit .troop-art .troop-image{position:relative;z-index:2;display:block;width:100%;height:100%;object-fit:contain;object-position:center;pointer-events:none;user-select:none;-webkit-user-drag:none}
  .unit.big .troop-art .troop-image,.unit.big.troop-golem .troop-art .troop-image{position:absolute;inset:0;width:100%;height:100%;object-fit:fill}
  .unit::before{
    content:"";
    position:absolute;
    width:72%;
    height:18%;
    left:14%;
    bottom:5%;
    border-radius:50%;
    background:radial-gradient(ellipse at center, rgba(2,6,23,.35), rgba(2,6,23,0) 72%);
    z-index:-1;
  }
  .unit::after{ display:none; }
  .unit.big{ inset:0; width:100%; height:100%; place-items:stretch; }
  .unit.big .troop-art{
    width:100%;
    height:100%;
    overflow:hidden;
    --base-w:70%;
    --base-h:14%;
    --base-left:15%;
    --base-bottom:8%;
  }
  .unit svg{ width:100%; height:100%; overflow:visible; }
  .unit .stroke{ stroke:rgba(15,23,42,.95); stroke-width:2; }
  @keyframes unitAttack{
    0%{ transform:translateY(0) scale(1); }
    40%{ transform:translateY(-2px) scale(1.12); }
    100%{ transform:translateY(0) scale(1); }
  }
  @keyframes unitCast{
    0%{ transform:scale(1); filter:brightness(1); }
    50%{ transform:scale(1.08); filter:brightness(1.35); }
    100%{ transform:scale(1); filter:brightness(1); }
  }
  .unit.team0{
    filter:drop-shadow(0 0 1px rgba(15,23,42,.95)) drop-shadow(0 0 4px var(--team0)) drop-shadow(0 0 1px var(--team0b));
  }
  .unit.team1{
    filter:drop-shadow(0 0 1px rgba(15,23,42,.95)) drop-shadow(0 0 4px var(--team1)) drop-shadow(0 0 1px var(--team1b));
  }
  .unit.team0 .troop-art{
    --base-team:rgba(239,68,68,.95);
    --base-team-soft:rgba(248,113,113,.34);
    --base-rim:rgba(248,113,113,.92);
  }
  .unit.team1 .troop-art{
    --base-team:rgba(59,130,246,.95);
    --base-team-soft:rgba(96,165,250,.34);
    --base-rim:rgba(96,165,250,.92);
  }
  .unit.roleTank .troop-art,
  .unit.roleTankSupport .troop-art,
  .unit.roleToxicTank .troop-art,
  .unit.roleBruiser .troop-art,
  .unit.roleMelee .troop-art,
  .unit.roleAssassin .troop-art,
  .unit.roleAmbush .troop-art{
    --base-w:82%;
    --base-h:20%;
    --base-left:9%;
    --base-shadow:0 5px 11px rgba(2,6,23,.78), 0 0 14px var(--base-team-soft), inset 0 0 8px rgba(2,6,23,.42);
  }
  .unit.roleRanged .troop-art,
  .unit.roleSplash .troop-art,
  .unit.roleAcidRanged .troop-art{
    --base-w:68%;
    --base-h:12%;
    --base-left:16%;
    --base-bottom:8%;
    --base-shadow:0 2px 5px rgba(2,6,23,.58), 0 0 8px var(--base-team-soft);
  }
  .unit.roleSupport .troop-art,
  .unit.roleCaster .troop-art,
  .unit.roleControl .troop-art,
  .unit.roleBuilder .troop-art,
  .unit.roleSpawner .troop-art{
    --base-w:74%;
    --base-h:18%;
    --base-left:13%;
    --base-shadow:0 3px 8px rgba(2,6,23,.58), 0 0 18px var(--base-team-soft);
    --base-glow:0 0 15px var(--base-team-soft);
  }
  .unit.roleSwarm .troop-art,
  .unit.roleExplosive .troop-art{
    --base-w:56%;
    --base-h:11%;
    --base-left:22%;
    --base-bottom:10%;
    --base-shadow:0 2px 5px rgba(2,6,23,.52), 0 0 6px var(--base-team-soft);
  }
  .unit.roleGiant .troop-art{
    --base-w:76%;
    --base-h:16%;
    --base-left:12%;
    --base-bottom:9%;
    --base-shadow:0 7px 16px rgba(2,6,23,.85), 0 0 18px var(--base-team-soft), inset 0 0 12px rgba(2,6,23,.5);
  }
  .unit.lvl2 .troop-art{
    --base-level-rim:rgba(226,232,240,.9);
    --base-rim:rgba(226,232,240,.95);
    --base-glow:0 0 10px rgba(203,213,225,.65);
  }
  .unit.lvl2 .troop-art::after{ border-width:3px; }
  .unit.lvl3::before{ background:radial-gradient(circle at 50% 100%, rgba(251,191,36,.45), rgba(245,158,11,.05) 68%, transparent 74%); }
  .unit.lvl3 .troop-art{
    --base-level-rim:rgba(254,240,138,.98);
    --base-rim:rgba(251,191,36,.98);
    --base-glow:0 0 18px rgba(251,191,36,.9), 0 0 9px rgba(245,158,11,.9) inset;
    --level-filter:drop-shadow(0 0 10px rgba(251,191,36,.8)) drop-shadow(0 0 6px rgba(245,158,11,.45));
  }
  .unit.lvl3 .troop-art::after{ border-width:3px; }

  .unit .troop-art{
    transform-origin:50% 72%;
    will-change:transform,opacity;
    animation-delay:var(--idle-delay, 0ms);
  }
  .unit.delayA{ --idle-delay:-180ms; }
  .unit.delayB{ --idle-delay:-640ms; }
  .unit.delayC{ --idle-delay:-1120ms; }
  .unit.delayD{ --idle-delay:-1680ms; }
  .unit.attacking .troop-art,
  .unit.casting .troop-art{
    animation:none !important;
    opacity:1;
    transform:translate3d(0,0,0) scale(1) rotate(0deg);
  }
  .unit.idleBobMedium .troop-art{ animation:idleBobMedium 2.7s ease-in-out infinite; }
  .unit.idleBobFast .troop-art{ animation:idleBobFast 1.75s ease-in-out infinite; }
  .unit.idleHeavyPulse .troop-art{ animation:idleHeavyPulse 3.2s ease-in-out infinite; }
  .unit.idleCasterFloat .troop-art{ animation:idleCasterFloat 3.4s ease-in-out infinite; }
  .unit.idleSwarmJitter .troop-art{ animation:idleSwarmJitter .72s steps(2,end) infinite; }
  .unit.idleMechanicalPulse .troop-art{ animation:idleMechanicalPulse 2.55s ease-in-out infinite; }
  .unit.idleAim .troop-art{ animation:idleAim 3.1s ease-in-out infinite; transform-origin:50% 78%; }
  .unit.idleElectricPulse .troop-art{ animation:idleElectricPulse 2.2s ease-in-out infinite; }
  .unit.idlePhaseFloat .troop-art{ animation:idlePhaseFloat 3.8s ease-in-out infinite; }
  .unit.idleGiantPulse .troop-art{ animation:idleGiantPulse 4.4s ease-in-out infinite; }
  .unit.idleCrawlPulse .troop-art{ animation:idleCrawlPulse 2.4s ease-in-out infinite; }
  .unit.idleTailSway .troop-art{ animation:idleTailSway 2.9s ease-in-out infinite; transform-origin:48% 76%; }
  .unit.idleDangerPulse .troop-art{ animation:idleDangerPulse 1.55s ease-in-out infinite; }
  .unit.idleBubblePulse .troop-art{ animation:idleBubblePulse 2.65s ease-in-out infinite; }
  .unit.idleBroodPulse .troop-art{ animation:idleBroodPulse 3.5s ease-in-out infinite; }
  .unit.idleSnakeSway .troop-art{ animation:idleSnakeSway 2.25s ease-in-out infinite; transform-origin:52% 76%; }
  .unit.idleDarkFloat .troop-art{ animation:idleDarkFloat 3.7s ease-in-out infinite; }
  .unit.idleBurrowWiggle .troop-art{ animation:idleBurrowWiggle 1.9s ease-in-out infinite; transform-origin:50% 82%; }

  @keyframes idleBobMedium{
    0%,100%{ transform:translate3d(0,0,0); }
    50%{ transform:translate3d(0,-2px,0); }
  }
  @keyframes idleBobFast{
    0%,100%{ transform:translate3d(0,0,0); }
    45%{ transform:translate3d(0,-3px,0); }
  }
  @keyframes idleHeavyPulse{
    0%,100%{ transform:translate3d(0,0,0) scale(1); opacity:1; }
    50%{ transform:translate3d(0,-1px,0) scale(1.012); opacity:.98; }
  }
  @keyframes idleCasterFloat{
    0%,100%{ transform:translate3d(0,0,0); }
    50%{ transform:translate3d(0,-3px,0); }
  }
  @keyframes idleSwarmJitter{
    0%,100%{ transform:translate3d(0,0,0); }
    25%{ transform:translate3d(1px,-1px,0); }
    50%{ transform:translate3d(-1px,0,0); }
    75%{ transform:translate3d(1px,1px,0); }
  }
  @keyframes idleMechanicalPulse{
    0%,100%{ transform:translate3d(0,0,0) scale(1); opacity:1; }
    50%{ transform:translate3d(0,-1px,0) scale(1.018); opacity:.99; }
  }
  @keyframes idleAim{
    0%,100%{ transform:translate3d(0,0,0) rotate(0deg); }
    50%{ transform:translate3d(0,-1px,0) rotate(.7deg); }
  }
  @keyframes idleElectricPulse{
    0%,100%{ transform:translate3d(0,0,0) scale(1); opacity:1; }
    45%{ transform:translate3d(0,-2px,0) scale(1.018); opacity:.94; }
    52%{ transform:translate3d(1px,-1px,0) scale(1.012); opacity:1; }
  }
  @keyframes idlePhaseFloat{
    0%,100%{ transform:translate3d(0,0,0) scale(1); opacity:.96; }
    50%{ transform:translate3d(0,-3px,0) scale(1.012); opacity:1; }
  }
  @keyframes idleGiantPulse{
    0%,100%{ transform:translate3d(0,0,0) scale(1); opacity:1; }
    50%{ transform:translate3d(0,0,0) scale(1.01); opacity:.985; }
  }
  @keyframes idleCrawlPulse{
    0%,100%{ transform:translate3d(0,0,0) scale(1); }
    50%{ transform:translate3d(0,1px,0) scale(1.012,.992); }
  }
  @keyframes idleTailSway{
    0%,100%{ transform:translate3d(0,0,0) rotate(0deg); }
    50%{ transform:translate3d(0,-1px,0) rotate(1.1deg); }
  }
  @keyframes idleDangerPulse{
    0%,100%{ transform:translate3d(0,0,0) scale(1); opacity:1; }
    50%{ transform:translate3d(0,-1px,0) scale(1.025); opacity:.94; }
  }
  @keyframes idleBubblePulse{
    0%,100%{ transform:translate3d(0,0,0) scale(1); }
    50%{ transform:translate3d(0,-2px,0) scale(1.018,.988); }
  }
  @keyframes idleBroodPulse{
    0%,100%{ transform:translate3d(0,0,0) scale(1); opacity:1; }
    50%{ transform:translate3d(0,-1px,0) scale(1.018); opacity:.985; }
  }
  @keyframes idleSnakeSway{
    0%,100%{ transform:translate3d(0,0,0) rotate(0deg); }
    50%{ transform:translate3d(1px,-1px,0) rotate(1.4deg); }
  }
  @keyframes idleDarkFloat{
    0%,100%{ transform:translate3d(0,0,0); opacity:.97; }
    50%{ transform:translate3d(0,-3px,0); opacity:1; }
  }
  @keyframes idleBurrowWiggle{
    0%,100%{ transform:translate3d(0,0,0) rotate(0deg); }
    35%{ transform:translate3d(-1px,1px,0) rotate(-.8deg); }
    70%{ transform:translate3d(1px,0,0) rotate(.8deg); }
  }
  @media (prefers-reduced-motion: reduce){
    .unit .troop-art{ animation-duration:8s !important; animation-iteration-count:infinite; }
    .unit.idleSwarmJitter .troop-art{ animation:none; }
  }

  .card.legendary{ border-color:rgba(251,191,36,.95); box-shadow:0 0 0 1px rgba(245,158,11,.9) inset, 0 10px 25px rgba(245,158,11,.32); }
  .card .legendaryLine{ color:#fef08a; font-weight:800; margin-top:6px; letter-spacing:.2px; }
  .card .legendaryDesc{ color:#fde68a; font-size:12px; line-height:1.35; margin-top:4px; }

  .hp{
    position:absolute;left:6px;right:6px;bottom:4px;height:7px;border-radius:999px;
    background:rgba(15,23,42,.9);overflow:hidden;z-index:4;
    box-shadow:0 0 0 1px rgba(15,23,42,.85),0 0 18px rgba(15,23,42,.9) inset;
  }
  .hp.big{
    left:6px;
    right:6px;
    width:auto;
    bottom:4px;
  }
  /* default (fallback) fill is green; team classes override it */
  .hp>i{
    display:block;height:100%;
    background:linear-gradient(90deg,#22c55e,#16a34a);
    box-shadow:0 0 18px rgba(34,197,94,.6);
    transition: width 160ms linear;
  }
  /* team-colored HP fills */
  .hp>i.team0{ background:linear-gradient(90deg,var(--team0),var(--team0b)); box-shadow:0 0 18px rgba(248,113,113,.7); }
  .hp>i.team1{ background:linear-gradient(90deg,var(--team1),var(--team1b)); box-shadow:0 0 18px rgba(96,165,250,.7); }

  .status{
    position:absolute;
    top:4px;
    right:4px;
    display:flex;
    gap:2px;
    font-size:11px;
    z-index:6;
    pointer-events:none;
  }
  .status span{
    text-shadow:0 1px 2px rgba(0,0,0,.7);
  }

  .hitflash{ position:absolute; inset:0; background:rgba(248,250,252,.55); animation:flash .16s ease; pointer-events:none; z-index:2 }
  @keyframes flash{ from{opacity:.9} to{opacity:0} }
  .dmg{
    position:absolute; left:50%; top:40%; transform:translate(-50%,-50%);
    font-weight:900; font-size:12px; color:#f97373; text-shadow:0 1px 0 rgba(15,23,42,.7);
    animation:dmg 600ms ease-out forwards; pointer-events:none; z-index:5;
  }
  @keyframes dmg{
    0%{opacity:0; transform:translate(-50%,-40%) scale(.9)}
    10%{opacity:1;}
    100%{opacity:0; transform:translate(-50%,-100%) scale(1)}
  }
  .cell.hit-pulse::after{
    content:"";
    position:absolute;
    inset:10%;
    border-radius:10px;
    border:2px solid rgba(248,113,113,.75);
    animation:cellPulse .26s ease-out;
    pointer-events:none;
    z-index:5;
  }
  .cell.heal-pulse::after{
    content:"";

function timestampMs(value){
  if (!value) return 0;
  if (typeof value === "number") return value;
  if (typeof value.toMillis === "function") return value.toMillis();
  if (typeof value.seconds === "number") return value.seconds * 1000 + Math.floor((value.nanoseconds||0)/1e6);
  const parsed = Date.parse(value);
  return Number.isFinite(parsed) ? parsed : 0;
}
function lobbySessionKey(lob, players){
  const explicit = lob && (lob.crownCouncilSessionId || lob.gameInstanceId || lob.matchId || lob.sessionId || lob.launchId);
  if (explicit) return String(explicit);
  const started = timestampMs(lob && (lob.gameStartedAt || lob.startedAt || lob.matchStartedAt || lob.createdAt));
  if (started) return gameId + ":" + started;
  return gameId + ":" + String((lob && lob.host) || "") + ":" + (players||[]).join("|");
}

/* -------- transactional state creation / stale-match reset (host only) -------- */
async function ensureStateExists(lobbyData){
  if (isLocalPractice() || isSecureMode() || didEnsure || ensureInFlight || !isHost || disposed) return;
  ensureInFlight = true;
  try {
    const lob = lobbyData || {};
    const players = Array.isArray(lob.players) ? lob.players.slice(0, 2) : [];
    const sessionKey = lobbySessionKey(lob, players);

    await runTransaction(db, async (tx)=>{
      const stSnap = await tx.get(stateRef);
      const existing = stSnap.exists() ? stSnap.data() : null;
      const staleSchema = !!(existing && existing.schemaVersion !== 2);
      const staleSession = !!(existing && existing.sessionKey && existing.sessionKey !== sessionKey);
      const stalePlayers = !!(existing && !samePlayers(existing.players, players) && !["waiting","asset-loading","faction-select"].includes(existing.phase));
      const completedMatch = !!(existing && existing.phase === "game-over");
      const shouldReset = !existing || staleSchema || staleSession || stalePlayers || completedMatch;

      if (!shouldReset) {
        tx.update(stateRef, {
          hostClientId: clientInstanceId,
          hostLeaseUntil: Date.now() + 30000
        });
        return;
      }

      const seededMMR=[1000,1000];
      for (let i=0;i<2;i++){
        const name=players[i];
        if (!name) continue;
        const userSnap=await tx.get(doc(db,"users",name));
        if (!userSnap.exists()) continue;
        const val=Number(userSnap.data()?.crowncouncilElo);
        if (Number.isFinite(val) && val>0) seededMMR[i]=Math.round(val);
      }

      tx.set(stateRef, newMatchState(players, seededMMR, sessionKey));
      tx.set(battleRef, Object.assign(battleEmpty(), {
        schemaVersion:2,
        sessionKey:sessionKey,
        battleTickId:0,
        updatedAt:Date.now()
      }));
    });
    didEnsure = true;
  } catch (e) {
    console.error("ensureStateExists failed", e);
  } finally {
    ensureInFlight = false;
  }
}

function archetypesForKey(key){
  return TROOP_ARCHETYPES[key] || [];
}
function normalizeTag(t){
  return String(t||"").toLowerCase().replace(/[^a-z0-9]+/g," ").trim();
}
function evaluateDraftFit(meta, enemyRoster){
  const strong = (meta.strongAgainst||[]).map(normalizeTag);
  const weak = (meta.weakAgainst||[]).map(normalizeTag);
  let score=0;
  for (const ek of enemyRoster){
    const em = TROOP_COUNTERS[ek];
    const etags = [em?.archetype, ...(archetypesForKey(ek).map(k=>COUNTER_ARCHETYPES[k]?.label||""))].filter(Boolean).map(normalizeTag);
    if (etags.some(t=>strong.some(s=>s && (t.includes(s) || s.includes(t))))) score += 1;
    if (etags.some(t=>weak.some(w=>w && (t.includes(w) || w.includes(t))))) score -= 1;
  }
  if (score >= 2) return "Good into enemy army";
  if (score <= -1) return "Risky pick";
  return "";
}
function rosterSummary(roster){
  const out = { front:0, back:0, tank:0, swarm:0, assassin:0, splash:0, sustain:0, antiHeal:0, trueDamage:0, armor:0, damage:0 };
  for (const entry of (roster||[])){
    const t = TROOPS[entry.type];
    if (!t) continue;
    const cnt = Math.max(1, entry.count|0);
    const tags = archetypesForKey(entry.type);
    if (t.role==="front") out.front += cnt; else out.back += cnt;
    if (tags.includes("tank")) out.tank += cnt;
    if (tags.includes("swarm")) out.swarm += cnt;
    if (tags.includes("assassin")) out.assassin += cnt;
    if (tags.includes("splash")) out.splash += cnt;
    if (tags.includes("sustain")) out.sustain += cnt;
    if (entry.type==="carrion") out.antiHeal += cnt;
    if (t.trueDamage) out.trueDamage += cnt;
    out.armor += ((t.base && t.base.armor) ? t.base.armor : 0) * cnt;
    out.damage += ((t.base && t.base.dmg) ? t.base.dmg : 0) * cnt;
  }
  return out;
}
function evaluateDraftCard(card, myRoster, enemyRoster, myRelics, enemyRelics) {
  let score = 0;
  const labels = [];
  const reasons = [];
  const mine = rosterSummary(myRoster);
  const enemy = rosterSummary(enemyRoster);
  const own = (myRoster||[]).find(r=>r.type===card.key);
  const addLabel = (l)=>{ if (!labels.includes(l) && labels.length < 2) labels.push(l); };
  const addReason = (txt)=>{ if (!reasons.includes(txt) && reasons.length < 3) reasons.push(txt); };

  if (card.type==="troop"){
    const troop = TROOPS[card.key] || {};
    const meta = TROOP_COUNTERS[card.key] || {};
    const tags = archetypesForKey(card.key);
    const frontlineLow = mine.front <= 1;
    const manySameRole = (troop.role==="front" ? mine.front : mine.back) >= 5;
    if (meta.strongAgainst && enemyRoster.some(e => (meta.strongAgainst||[]).some(s => normalizeTag(s).includes(normalizeTag(TROOPS[e.type]?.name||""))))) { score += 1; addLabel("Strong Counter"); }
    if (tags.includes("splash") && enemy.swarm >= 2){ score += 3; addLabel("Anti-Swarm"); addReason("Good pick: enemy has swarm pressure."); }
    if (tags.includes("assassin") && enemy.back >= 2){ score += 3; addLabel("Protects Backline"); addReason("Good pick: enemy relies on backline/support units."); }
    if (troop.trueDamage && (enemy.tank >= 2 || enemy.armor >= 4)){ score += 3; addLabel("Anti-Tank"); addReason("Good pick: enemy has armored/tank units."); }
    if (tags.includes("sustain") && mine.tank >= 2){ score += 2; addReason("Good sustain fit for your frontline-heavy roster."); }
    if (card.key==="carrion" && enemyRoster.some(e=>["medic","wardmaker","carrion"].includes(e.type))){ score += 2; addReason("Anti-heal value vs enemy sustain core."); }
    if (troop.role==="front" && frontlineLow){ score += 2; addLabel("Needs Frontline"); addReason("Adds frontline to protect fragile backline."); }
    if (mine.damage < 12 && (troop.base?.dmg||0) >= 6){ score += 2; addReason("Adds needed damage to your current build."); }
    if (own && (own.lvl||1)===2 && LEGENDARY_ABILITIES[card.key]){ score += 3; addLabel("Legendary Setup"); addReason("Great setup: upgrades toward Legendary."); }
    if (own && ((meta.bestWith||[]).length>0)){ score += 2; addLabel("Completes Combo"); addReason("Doubles a unit that already has support/synergy."); }
    if ((meta.bestWith||[]).some(n => (myRoster||[]).some(r => normalizeTag(TROOPS[r.type]?.name||"").includes(normalizeTag(n))))){ score += 2; addLabel("Build Around"); addReason("Completes synergy pieces already in your roster."); }

    if (enemy.assassin >= 2 && troop.role==="back" && (troop.base?.hp||0) <= 10){ score -= 3; addReason("Risky: enemy assassins punish fragile backline."); }
    if (manySameRole){ score -= 2; addReason("Risky: too many units in the same role."); }
    if ((meta.weakAgainst||[]).length && enemyRoster.some(e => (meta.weakAgainst||[]).some(w => normalizeTag(w).includes(normalizeTag(TROOPS[e.type]?.name||""))))){ score -= 2; addReason("Enemy roster already has tools that counter this pick."); }
    if (mine.front===0 && troop.role!=="front"){ score -= 3; addReason("Risky: no frontline yet."); }
    if ((mine.swarm===0 && enemy.swarm>=2 && !tags.includes("splash")) || (mine.trueDamage===0 && enemy.tank>=2 && !troop.trueDamage)){ score -= 1; }
  } else {
    const relicText = normalizeTag(card.name+" "+(card.desc||""));
    const isSustainRelic = relicText.includes("heal") || relicText.includes("ward");
    const isAssassinRelic = relicText.includes("dash") || relicText.includes("leap") || relicText.includes("assassin");
    if (isSustainRelic && mine.tank >= 2){ score += 1; addReason("Relic/tactic supports your frontline sustain plan."); }
    if (isAssassinRelic && mine.assassin >= 1){ score += 1; addReason("Relic/tactic enhances your dive tools."); }
    if ((isSustainRelic && mine.tank===0) || (isAssassinRelic && mine.assassin===0)){ score -= 2; addReason("Relic/tactic does not fit current army."); }
  }
  if (score <= -2) addLabel("Risky Pick");
  return { score, labels, reasons };
}

  const collection=state?.collections?.[side]||state?.profiles?.[side];
  const unlocked=Array.isArray(collection?.unlocked)?collection.unlocked:Object.keys(collection?.troops||{}).filter(k=>collection.troops[k].unlocked);
  const deck=FFDecks.deckForState(state,side);
  const availableTypes=(deck?.troops||[]).filter(key=>TROOPS[key]&&(!TROOPS[key].unlockable||unlocked.includes(key)));
  return FFDraft.createDraftPack({roster,faction,deck,availableTypes,troops:TROOPS,evolutions:state?.evolutions?.[side]||{},comboEnhancements:state?.comboEnhancements?.[side]||[],ownedRelics:state?.relics?.[side]||[],ownedTactics:state?.tactics?.[side]||[],formation:state?.formations?.[side]},Math.random);
}

function applyPickToState(data, sideKey, pick){
  if (!pick || !sideKey) return;
  if(FFDraft.applyDraftPick(data,sideKey,pick))return;
  const roster = data.roster || (data.roster = {p0:[],p1:[]});
  if (!roster.p0) roster.p0 = [];
  if (!roster.p1) roster.p1 = [];
  const relics = data.relics || (data.relics = {p0:[],p1:[]});
  if (!relics.p0) relics.p0 = [];
  if (!relics.p1) relics.p1 = [];
  const tactics = data.tactics || (data.tactics = {p0:[],p1:[]});
  if (!tactics.p0) tactics.p0 = [];
  if (!tactics.p1) tactics.p1 = [];
  const formations = data.formations || (data.formations = {p0:"balanced",p1:"balanced"});
  if (!formations.p0) formations.p0 = "balanced";
  if (!formations.p1) formations.p1 = "balanced";
  if (pick.type==="troop") rosterAdd(roster[sideKey], pick.key, 1);
  else if (pick.type==="special"){
    if(pick.special==="double") rosterDoubleOneSpecific(roster[sideKey], pick.for);
    if(pick.special==="upgrade") rosterUpgradeOneSpecific(roster[sideKey], pick.for);
  } else if (pick.type==="relic"){
    if (!relics[sideKey].includes(pick.key)) relics[sideKey].push(pick.key);
  } else if (pick.type==="tactic"){
    tactics[sideKey].push(pick.key);
  } else if (pick.type==="formation"){
    formations[sideKey] = pick.key || "balanced";
  }
}

/* Roster ops */
function rosterAdd(roster, type, inc){
  const incVal = (typeof inc === "number" ? inc : 1);
  const f=roster.find(r=>r.type===type);
  if (f) f.count+=incVal;
  else roster.push({type:type, lvl:1, count:incVal});
}
function rosterDoubleOneSpecific(roster, type){
  const f=roster.find(r=>r.type===type);
  if(!f) return;
  const add = Math.max(1,f.count);
  f.count += add;
}
function rosterUpgradeOneSpecific(roster, type){
  const f=roster.find(r=>r.type===type && (r.lvl||1)<3);
  if(!f) return;
  f.lvl = (f.lvl||1)+1;
}

function frontBlocked(u, units){
  const dir = (u.p===0? -1 : +1);
  const nx = u.x, ny = u.y + dir;
  for (let k=0;k<units.length;k++){
    const o=units[k];
    if (o.p === u.p) continue;
    const os = unitSize(o);
    const blocks = nx>=o.x && nx<o.x+os && ny>=o.y && ny<o.y+os;
    if (blocks && TROOPS[o.type] && TROOPS[o.type].role === "front") return true;
  }
  return false;
}

function broodTick(st, now){

/* ward shields vs ranged */
function tilesOnLine(x1,y1,x2,y2){
  const tiles=[];
  const dx=x2-x1, dy=y2-y1;
  const steps = Math.max(Math.abs(dx), Math.abs(dy));
  if (steps===0){
    tiles.push({x:Math.round(x1),y:Math.round(y1)});
    return tiles;
  }
  const sx=dx/steps, sy=dy/steps;
  let x=x1, y=y1;
  for(let i=0;i<=steps;i++){
    tiles.push({x:Math.round(x), y:Math.round(y)});
    x+=sx; y+=sy;
  }
  return tiles;
}
function unitCenter(u){
  return { x: u.x + (unitSize(u)-1)/2, y: u.y + (unitSize(u)-1)/2 };
}
function applyWardShields(attacker, target, rawDmg, field){
  const a=unitCenter(attacker),b=unitCenter(target),path=tilesOnLine(a.x,a.y,b.x,b.y),now=Date.now();
  const ward=(field.wards||[]).find(w=>w.hp>0&&w.until>now&&(w.disabledUntil||0)<=now&&
    (w.p==null||w.p===target.p)&&path.some(pt=>pt.x===w.x&&pt.y===w.y));
  if(!ward||rawDmg<=0)return rawDmg;
  const piercing=['marksman','railbreaker','phaser','storm'].includes(attacker.type);
  const absorbed=Math.min(rawDmg,piercing?1:Math.min(2,ward.shieldReduce??2),ward.hp);
  ward.hp-=absorbed;return Math.max(0,rawDmg-absorbed);
}

/* Painting board — BY RANK color */
function paint(units, field){
  const total = W * H;
  const now = Date.now();
  const paintUnits = (units && units.length) ? units : ((field && field.units) || []);
  const poisonSet = new Set();
  const toxicSet = new Set();
  const acidSet = new Set();
  const wardSet = new Set();

  (field.poison||[]).forEach(p=>{ if (p.until > now) poisonSet.add(idx(p.x,p.y)); });
  (field.toxic||[]).forEach(t=>{ if (t.until > now) toxicSet.add(idx(t.x,t.y)); });
  (field.acid||[]).forEach(a=>{ if (a.until > now) acidSet.add(idx(a.x,a.y)); });
  (field.wards||[]).forEach(w=>{ if (w.until > now && w.hp > 0) wardSet.add(idx(w.x,w.y)); });

  for (let i = 0; i < total; i++){
    const d = cellsEl.children[i];
    if (!d) continue;
    d.classList.remove("multi-origin", "big-footprint-debug");
    const terrainKey = (poisonSet.has(i)?"1":"0") + (toxicSet.has(i)?"1":"0") + (acidSet.has(i)?"1":"0") + (wardSet.has(i)?"1":"0");
    if (lastCellTerrainKey.get(i) === terrainKey) continue;
    lastCellTerrainKey.set(i, terrainKey);
    d.querySelector(".poison")?.remove();
    d.querySelector(".toxic")?.remove();
    d.querySelector(".acid")?.remove();
    d.querySelector(".ward")?.remove();

    if (terrainKey[0] === "1") { const el=document.createElement("div"); el.className="poison"; d.appendChild(el); }
    if (terrainKey[1] === "1") { const el=document.createElement("div"); el.className="toxic"; d.appendChild(el); }
    if (terrainKey[2] === "1") { const el=document.createElement("div"); el.className="acid"; d.appendChild(el); }
    if (terrainKey[3] === "1") { const el=document.createElement("div"); el.className="ward"; d.appendChild(el); }
  }

  for (let i=0;i<paintUnits.length;i++){
    const u = paintUnits[i];
    const s = unitSize(u);
    const color = (rankColor(u.lvl||1).trim() || "#22c55e");
    for (let yy=0; yy<s; yy++) for (let xx=0; xx<s; xx++){
      const d = cellsEl.children[idx(u.x+xx, u.y+yy)]; if (!d) continue;
      const under = d.querySelector(".under"); if (!under) continue;
      under.style.background = "radial-gradient(circle at top,"+color+","+color+")";
      if (DEBUG_BIG_UNIT_FOOTPRINT && s===2) d.classList.add("big-footprint-debug");
    }
    const d0 = cellsEl.children[idx(u.x, u.y)]; if (!d0) continue;
    d0.classList.toggle("multi-origin", s===2);
  }
}

function getStatusIcons(u, now, field){

/* Ranged helpers & AI */
function nearestEnemy(u,units,field){
  const wards = field.wards || [];
  let best=null, bd=1e9;
  function consider(obj,isWard){
    if (obj.p === u.p) return;
    if (obj.hp <= 0) return;
    const d = rectDistance(u, obj);
    if (d < bd){ bd=d; best=obj; }
  }

  for(let i=0;i<units.length;i++) consider(units[i],false);
  for(let i=0;i<wards.length;i++){
    const w=wards[i];
    if (!w.shoot) continue;
    consider(w,true);
  }
  return best;
}
function strongestArmorTargetInRange(u, units){
  const strongVs = (u.strongVs || []).length ? u.strongVs : unitStrongVs(u.type);
  if (!strongVs.length) return null;
  const range = (u.range||1);
  let best=null, bd=1e9;
  for (let i=0;i<units.length;i++){
    const v = units[i];
    if (!v || v.p===u.p || v.hp<=0) continue;
    const d = rectDistance(u, v);
    if (d > range) continue;
    const armorType = v.armorType || armorTypeFor(v.type, v);
    if (!strongVs.includes(armorType)) continue;
    if (d < bd){ bd=d; best=v; }
  }
  return best;
}
function targetPressure(targetId, units, team){
  if (!targetId) return 0;

    if (ally && ally.p===team && ally.hp>0 && ally.targetId===targetId) count++;

}
function chooseBalancedEnemy(u, units, field, preferRanged){

    if (!v || v.p===u.p || v.hp<=0) continue;
    if (preferRanged && !(TROOPS[v.type] && TROOPS[v.type].role==="back")) continue;
    const d=rectDistance(u,v);
    const pressure=targetPressure(v.id,units,u.p);
    const wounded=(1-(v.hp/Math.max(1,v.maxhp)));
    candidates.push({v:v, score:d*10 + pressure*2.5 - wounded*1.5});
  }
  for (const w of (field.wards||[])){
    if (!w || w.p===u.p || w.hp<=0 || !w.shoot) continue;
    const id=w.id || ("ward:"+w.x+":"+w.y);
    const d=rectDistance(u,w);
    candidates.push({v:w, score:d*10 + targetPressure(id,units,u.p)*2.5 + 3});
  }
  if (!candidates.length && preferRanged) return chooseBalancedEnemy(u,units,field,false);
  if (!candidates.length) return null;
  candidates.sort((a,b)=>a.score-b.score);
  const chosen=candidates[0].v;
  u.targetId = chosen.id || ("ward:"+chosen.x+":"+chosen.y);
  return chosen;
}

/* wards heal/shoot */
function wardsHeal(st, now){
  const wards = st.field.wards || [];
  for (let i=0;i<wards.length;i++){
    const w = wards[i];
    if (!w.heal || w.hp<=0 || w.until<=now) continue;
    if (w.disabledUntil && w.disabledUntil > now) continue;
    if (now < (w.nextHeal||0)) continue;

    let tgt = null, minRatio = 1.01;
    for (let j=0;j<st.field.units.length;j++){
      const v = st.field.units[j];
      if (v.hp<=0 || now<(v.nextWardHealing||0)) continue;
      if (w.p!=null && v.p !== w.p) continue;
      const d = rectDistance(w, v);
      if (d <= (w.hRange||3)){
        const r = v.hp / v.maxhp;
        if (r < 1 && r < minRatio){ minRatio = r; tgt = v; }
      }
    }
    if (!tgt) continue;

    const raw = Math.max(1, w.hAmt|0);
    const amt = Math.max(1, Math.round(raw * healScale(tgt, now)));
    tgt.hp = Math.min(tgt.maxhp, tgt.hp + amt);
    tgt.nextWardHealing=now+2500;
    forgeCombatHooks(st).event({kind:"heal",unitType:"wardmaker",x:w.x,y:w.y,targetX:tgt.x,targetY:tgt.y,targetId:tgt.id,at:now,amount:amt});

    w.nextHeal = now + (w.hCd || 1500);
  }
}

function wardsShoot(st, now){
  const wards = st.field.wards || [];
  for (let i=0;i<wards.length;i++){
    const w = wards[i];
    if (!w.shoot || w.hp<=0 || w.until<=now) continue;
    if (w.disabledUntil && w.disabledUntil > now) continue;
    if (now < (w.next||0)) continue;

    const maxT = w.maxTargets || 1;
    const cand = [];
    for (let j=0;j<st.field.units.length;j++){
      const v = st.field.units[j];
      if (v.hp<=0) continue;
      if (w.p!=null && v.p===w.p) continue;
      const d = rectDistance(w, v);
      if (d <= (w.wRange||3)) cand.push({v:v,d:d});
    }
    if (!cand.length) continue;
    cand.sort((a,b)=>a.d-b.d);
    const targets = cand.slice(0, maxT).map(c=>c.v);

    for (let j=0;j<targets.length;j++){
      const tgt = targets[j];

      const raw = w.wDmg || 1;
      const dmg = reduceDamageForTarget(raw, tgt, st.field);
      applyDamage(tgt, dmg, st);
    }
    w.next = now + (w.wCd || 1400);
  }
}

function healAction(u, st, now){

  const allies = st.field.units.filter(v=>v.p===u.p && v.id!==u.id && v.hp>0);
  if (!allies.length) return false;
  let target=null, minRatio=1.01;
  for(let i=0;i<allies.length;i++){
    const a = allies[i];
    const dist = rectDistance(u, a);
    if (dist <= (u.healRange||2)){
      const r = a.hp/a.maxhp;
      if (r < minRatio){ minRatio = r; target=a; }
    }
  }
  if (!target) return false;
  const raw = Math.max(1, u.healAmt|0)+(u.arcaneBatteryReady?1:0);
  u.arcaneBatteryReady=false;
  const amt = Math.max(1, Math.round(raw * healScale(target, now)));
  target.hp = Math.min(target.maxhp, target.hp + amt);
  u.animType="cast";u.animUntil=now+320;forgeCombatHooks(st).event({kind:"heal",unitType:u.type,sourceId:u.id,targetId:target.id,x:u.x,y:u.y,targetX:target.x,targetY:target.y,at:now});

}

  if (inside(tx,ty)){
    const isShooter = !!u.wardShooter;
    const isL3Architect = (u.type === "architect" && (u.lvl||1) >= 3);

    const opts = isShooter
      ? {
          p:u.p,
          shoot:true,
          wDmg:(u.wardDmg||2),
          wRange:(u.wardRange||3),
          wCd:(u.wardCdShoot||u.wardCd||1400),
          multi:isL3Architect,
          maxTargets:isL3Architect ? 3 : 1
        }
      : {
          p:u.p,
          heal:true,
          hAmt:(u.wardHealAmt||2),
          hRange:(u.wardHealRange||3),
          hCd:(u.wardHealCd||1500)
        };

    const wardHp = (u.firstWardBoost ? (u.wardHp||2)+2 : (u.wardHp||2))+(u.arcaneBatteryReady?2:0);
    if (placeWard(st, tx, ty, wardHp, u.wardDur||6000, opts)){
      u.arcaneBatteryReady=false;
      if (u.firstWardBoost){
        const allies = st.field.units.filter(v=>v.p===u.p && v.hp>0 && (Math.abs(v.x-tx)+Math.abs(v.y-ty)<=2));
        for (const a of allies) a.hp = Math.min(a.maxhp, a.hp + 1);
        u.firstWardBoost = false;
      }
      u.nextWard = now + (u.wardCd||1700);
      return true;
    }
  }
  return false;
}

function applyDamage(victim, dmg, st){
  dmg=Math.max(0,Number(dmg)||0);
  const now=Date.now(),beforeHp=Math.max(0,victim.hp);
  // Clamp before absorption so several sources cannot absorb more than four.
  if((victim.comboShieldUntil||0)>now)victim.comboShield=Math.min(victim.comboShield||0,Math.max(0,FFUnits.COMBAT_LIMITS.shieldCapacity-((victim.startShieldUntil||0)>now?victim.startShield||0:0)));
  const beforeShield=((victim.startShieldUntil||0)>now?victim.startShield||0:0)+((victim.comboShieldUntil||0)>now?victim.comboShield||0:0);
  if((victim.startShieldUntil||0)>now&&(victim.startShield||0)>0){const absorbed=Math.min(dmg,victim.startShield);victim.startShield-=absorbed;dmg-=absorbed;}
  dmg=FFUnits.absorbForgeShield(victim,dmg,now);
  const afterShield=((victim.startShieldUntil||0)>now?victim.startShield||0:0)+((victim.comboShieldUntil||0)>now?victim.comboShield||0:0);
  if(beforeShield>afterShield)forgeCombatHooks(st).event({kind:"shield-hit",unitType:victim.type,sourceId:victim.id,targetId:victim.id,x:victim.x,y:victim.y,targetX:victim.x,targetY:victim.y,amount:beforeShield-afterShield,at:now});
  if(dmg>0)victim.lastDamagedAt = now;
  if (victim.legendary && victim.type==="defiler" && victim.plagueReady && victim.hp > 0 && (victim.hp-dmg) <= Math.floor(victim.maxhp*0.35)){
    addToxicSplash(st, victim.x, victim.y, 4500, victim.p);
    victim.plagueReady = false;
  }
  victim.hp -= dmg;
  if(dmg>0)forgeCombatHooks(st).event({kind:"hit",unitType:victim.type,sourceId:victim.id,targetId:victim.id,x:victim.x,y:victim.y,targetX:victim.x,targetY:victim.y,amount:Math.min(beforeHp,dmg),at:now});
  const actualDamage=Math.min(beforeHp,dmg);
  FFUnits.noteForgeDamage(victim,actualDamage,st,now,forgeCombatHooks(st));
  if(beforeHp>0&&victim.hp<=0)forgeCombatHooks(st).event({kind:"death",unitType:victim.type,p:victim.p,sourceId:victim.id,x:victim.x,y:victim.y,at:now});
  return actualDamage;
}
function splash(units, field, x,y,dmg,srcP,kn,strong,opts){
  const hitIds = new Set();
  for(let dy=-1;dy<=1;dy++){
    for(let dx=-1;dx<=1;dx++){
      const nx=x+dx, ny=y+dy; if(!inside(nx,ny)) continue;
      const hit=units.find(o=>o.p!==srcP && o.hp>0 && nx>=o.x && nx<o.x+unitSize(o) && ny>=o.y && ny<o.y+unitSize(o));
      if(hit && hit.id!==opts?.excludeId && !hitIds.has(hit.id)){
        hitIds.add(hit.id);
        const attacker=opts&&opts.attacker;
        const marked=attacker?FFUnits.markedDamageBonus(attacker,hit,(opts&&opts.now)||Date.now(),{field:field},{distance:rectDistance}):0;
        const armorRound=attacker&&attacker.antiArmorRounds&&armorTypeFor(hit.type,hit)==="armored"?1:0;
        const rd = reduceDamageForTarget(dmg+marked, hit, field, {...opts,attacker,secondary:true});
        applyDamage(hit, rd, {field:field});
        if(kn) tryKnock(x,y,hit,units,strong);
      }
    }
  }
}
function tryKnock(cx,cy,t,units,strong){
  if (t.firstKnockImmune){ t.firstKnockImmune = false; return; }
  const tcx=t.x+(unitSize(t)-1)/2, tcy=t.y+(unitSize(t)-1)/2;
  const dx=Math.sign(tcx-cx), dy=Math.sign(tcy-cy);
  let steps = strong ? 2 : 1;
  while(steps>0){
    const nx=t.x+dx, ny=t.y+dy;
    if (canMoveTo(t, units, nx, ny)){ t.x=nx; t.y=ny; steps--; } else break;
  }
}
function chainLightning(units, field, startTarget, srcP, hops, dmg, opts){
  let cur = startTarget; let left=hops; const hit=new Set();
  while(cur && left>0){
    const attacker=opts&&opts.attacker;
    const marked=attacker?FFUnits.markedDamageBonus(attacker,cur,(opts&&opts.now)||Date.now(),{field:field},{distance:rectDistance}):0;
    const armorRound=attacker&&attacker.antiArmorRounds&&armorTypeFor(cur.type,cur)==="armored"?1:0;
    applyDamage(cur, reduceDamageForTarget(dmg+marked, cur, field, {...opts,attacker}), {field:field});
    hit.add(cur.id);
    let cand=null,bd=1e9;
    for(let i=0;i<units.length;i++){
      const v=units[i];
      if(v.p===srcP || v.hp<=0 || hit.has(v.id)) continue;
      const d=rectDistance(cur, v);
      if(d<=2 && d<bd){ bd=d; cand=v; }
    }
    cur=cand; left--;
  }
}
function attack(u, t, now, st){
  if (u.illusion || (u.statusShockUntil||0)>now) return true;
  const effRange = (u.rangeDebuffUntil && u.rangeDebuffUntil > now) ? Math.max(1,(u.range||1)-1) : (u.range||1);
  const inRange = rectDistance(u,t) <= effRange;
  if (!inRange) return false;
  if (now < (u.nextAtk||0)) return true;
  const forgeAttack=FFUnits.attackForgeUnit(u,t,now,st,forgeCombatHooks(st));
  if (forgeAttack!==null) return forgeAttack;

  const ranged = (u.range||1) > 1;
  u.animUntil = now + 320;
  u.animType = troopBodyClass(u.type) === "caster" ? "cast" : "attack";
  const firstSpellBoost=u.arcaneBatteryReady&&!u.ward&&troopBodyClass(u.type)==="caster"?1:0;
  if(firstSpellBoost)u.arcaneBatteryReady=false;

  function deal(victim, raw, isRanged){
    const protectedTarget=victim;
    victim=FFUnits.interceptTarget(u,victim,st.field.units,now,{distance:rectDistance});
    if(victim!==protectedTarget)forgeCombatHooks(st).event({kind:"shield",unitType:victim.type,sourceId:victim.id,targetId:protectedTarget.id,x:victim.x,y:victim.y,targetX:protectedTarget.x,targetY:protectedTarget.y,at:now});
    let dmg=(raw|0)+firstSpellBoost+FFUnits.markedDamageBonus(u,victim,now,st,{distance:rectDistance});
    if(u.legendary&&u.type==="rifleman"&&victim.lastDamagedAt)dmg+=1;
    if(u.legendary&&u.type==="miner"&&!u.minerProc&&(victim.range>1||isSupportUnit(victim))){dmg+=1;victim.bindUntil=Math.max(victim.bindUntil||0,now+450);u.minerProc=true;}
    if(isRanged)dmg=applyWardShields(u,victim,dmg,st.field);
    const result=FFUnits.calculateCounterDamage(u,victim,dmg,{now,auraReduce:auraDamageReduceFor(victim,st.field),ignoreArmor:!!u.trueDamage});
    const actualDamage=applyDamage(victim,result.damage,st);
    if(result.penetration>0&&(victim.armor||0)>0)forgeCombatHooks(st).event({kind:"precision-hit",unitType:u.type,sourceId:u.id,targetId:victim.id,x:u.x,y:u.y,targetX:victim.x,targetY:victim.y,amount:actualDamage,at:now});
    if(u.acid&&victim.hp>0){victim.corrosionUntil=Math.max(victim.corrosionUntil||0,now+3500);victim.woundUntil=Math.max(victim.woundUntil||0,now+2200);}
    FFUnits.siphonAfterDamage(u,victim,actualDamage,now,st,forgeCombatHooks(st));
  }

  const attackOrigin={x:u.x,y:u.y},attackImpact=nearestPointOnRectToUnit(t,u);
  const attackHealth=new Map(st.field.units.filter(v=>v.p!==u.p&&v.hp>0).map(v=>[v.id,{id:v.id,x:v.x,y:v.y,hp:v.hp}]));
  if (u.kamikaze){
    deal(t, u.dmg, ranged);

    if (u.splash1){
      const sd = Math.max(1, Math.floor(u.dmg * 0.6));
      const impact = nearestPointOnRectToUnit(t, u);
      splash(st.field.units, st.field, Math.round(impact.x), Math.round(impact.y), sd, u.p, true, false, {ignoreArmor:!!u.trueDamage,attacker:u,now:now,excludeId:t.id});
    }
    if (u.paints) paintPoison(st, u.x, u.y, 7000, u.p);

    u.hp = 0;
    forgeCombatHooks(st).event({kind:"death",unitType:u.type,p:u.p,sourceId:u.id,x:u.x,y:u.y,at:now});

  } else if (u.type === "vrocket"){

    deal(t, u.dmg, true);
    const sd = Math.max(1, Math.floor(u.dmg * (u.legendary ? 0.75 : 0.6)));
    const impact = nearestPointOnRectToUnit(t, u);
    splash(st.field.units, st.field, Math.round(impact.x), Math.round(impact.y), sd, u.p, true, false, {ignoreArmor:!!u.trueDamage,attacker:u,now:now,excludeId:t.id});

  } else if (u.chain3){

    chainLightning(st.field.units, st.field, t, u.p, (u.chainHops||(u.legendary?4:3)), u.dmg+firstSpellBoost, {ignoreArmor:!!u.trueDamage,attacker:u,now:now,excludeId:t.id});

  } else if (u.type === "roach" && (u.lvl||1) >= 3){

    deal(t, u.dmg, true);
    paintPoison(st, t.x, t.y, 5000, u.p);

  } else if (u.acid){

    deal(t, u.dmg, true);
    addAcid(st, t.x, t.y, u.acidDur || TROOPS[u.type].base.acidDur || 3500);

  } else {

    deal(t, u.dmg, ranged);
    const strong = !!u.strongKnock;
    if (u.splash1){
      const sd = Math.max(1, Math.floor(u.dmg * 0.6));
      const impact = nearestPointOnRectToUnit(t, u);
      splash(st.field.units, st.field, Math.round(impact.x), Math.round(impact.y), sd, u.p, !!u.knock, strong, {ignoreArmor:!!u.trueDamage,attacker:u,now:now,excludeId:t.id});
    }
    if (u.toxicSplash){
      addToxicSplash(st, t.x, t.y, 7000, u.p);
    }

    if (u.type === "storm" && (u.lvl||1) >= 3 && t.hp > 0){
      const shockDur = 1200;
      t.slowUntil = Math.max(t.slowUntil||0, now + shockDur);
      t.statusShockUntil = Math.max(t.statusShockUntil||0, now + shockDur);
    }
  }

  if (u.antiSupport && t.hp > 0 && isSupportUnit(t)){
    const bonus = Math.max(1, u.supportBonus||3);
    applyDamage(t, bonus, st);
  }
  if (u.executePct && t.hp > 0 && t.hp <= Math.floor(t.maxhp * u.executePct)){
    applyDamage(t, Math.min(t.hp,u.legendary?3:2), st);
  }
  if (u.empShock && t.hp > 0){
    applyShockDebuff(st, t, now, u.shockDur || 1500);
    if (u.legendary){
      for (const w of (st.field.wards||[])){
        if ((w.p==null || w.p!==u.p) && Math.abs(w.x-t.x)+Math.abs(w.y-t.y)<=2) w.disabledUntil = Math.max(w.disabledUntil||0, now + 1400);
      }
    }
  }
  if (u.bind && t.hp > 0){
    const bd = u.bindDur || 1200;
    t.bindUntil = Math.max(t.bindUntil||0, now + bd);
    t.statusShockUntil = Math.max(t.statusShockUntil||0, now + bd);

  }
  if (u.wound && t.hp > 0){
    const wd = u.woundDur || 2400;
    t.woundUntil = Math.max(t.woundUntil||0, now + wd);

  }
  if(u.poisonedBlades&&(u.range||1)<=1&&t.hp>0)t.woundUntil=Math.max(t.woundUntil||0,now+1000);
  if (u.suppress && t.hp > 0){
    t.slowUntil  = Math.max(t.slowUntil||0, now + (u.suppressDur || 900));
    t.slowFactor = u.slowFactor || 2;
    if (u.legendary) t.rangeDebuffUntil = Math.max(t.rangeDebuffUntil||0, t.slowUntil||0);
  }

  const attackTargets=st.field.units.filter(v=>attackHealth.has(v.id)&&v.hp<attackHealth.get(v.id).hp).map(v=>{const before=attackHealth.get(v.id);return {id:v.id,x:before.x,y:before.y,amount:Math.min(before.hp,before.hp-v.hp)}});
  u.lastAttackDamage=attackTargets.reduce((sum,hit)=>sum+hit.amount,0);
  forgeCombatHooks(st).event({kind:"attack",unitType:u.type,battleRank:u.lvl,sourceId:u.id,targetId:t.id,x:attackOrigin.x,y:attackOrigin.y,targetX:attackImpact.x,targetY:attackImpact.y,radius:u.splash1?1:0,targets:attackTargets,at:now,ttl:1000});
  FFUnits.afterForgeAttack(u,t,now,st,forgeCombatHooks(st));
  u.nextAtk = now + FFUnits.attackCooldown(u,now,st,{distance:rectDistance});
  return true;
}

/* MMR helpers */
function calcMMRChange(st, winnerName){
  const mmr = st.mmr || [1000,1000];
  const players = st.players || [];
  const idxWin = players.indexOf(winnerName);
  if (idxWin < 0) return { mmr:mmr, delta:[0,0] };
  const idxLose = idxWin === 0 ? 1 : 0;

  const base = 25;
  const diff = (mmr[idxLose] - mmr[idxWin]) || 0;
  const factor = 1 + diff / 4000;
  const gain = Math.max(10, Math.round(base * factor));

  const next = [mmr[0], mmr[1]];
  next[idxWin]  = mmr[idxWin]  + gain;
  next[idxLose] = Math.max(0, mmr[idxLose] - gain);

  const delta = [0,0];
  delta[idxWin]  = gain;
  delta[idxLose] = -gain;

  return { mmr:next, delta:delta };
}

let hostTick=null, battleTick=null;

function sanitizeFirestoreValue(value){
  if (value === undefined) return undefined;
  if (value === null) return null;
  if (Array.isArray(value)){
    return value.map(sanitizeFirestoreValue).filter(v=>v!==undefined);
  }
  if (typeof value === "object"){
    const out={};
    for (const [key,val] of Object.entries(value)){
      const clean=sanitizeFirestoreValue(val);
      if (clean!==undefined) out[key]=clean;
    }
    return out;
  }
  if (typeof value === "number" && !Number.isFinite(value)) return 0;
  return value;
}
function compactUnitForSync(unit){
  const timerZeroKeys = new Set([
    "nextAtk","nextHeal","nextWard","nextStep","nextBurrow","nextBrood","nextRegen",
    "slowUntil","bindUntil","woundUntil","rangeDebuffUntil","statusShockUntil","statusPoisonUntil","statusAcidUntil",
    "_poisonTick","_toxicTick","_acidTick"
  ]);
  const out={};
  for (const [key,val] of Object.entries(unit||{})){
    if (val===undefined || val===null || val===false) continue;
    if (val===0 && timerZeroKeys.has(key)) continue;
    const clean=sanitizeFirestoreValue(val);
    if (clean!==undefined) out[key]=clean;
  }
  return out;
}
function pruneBattleField(field, now){
  field.syncedFx=(field.syncedFx||[]).filter(ev=>(ev.createdAt||0)+Math.min(5000,Math.max(1400,ev.ttl||ev.duration||0))>now).slice(-96);
  field.poison=(field.poison||[]).filter(v=>(v.until||0)>now);
  field.toxic=(field.toxic||[]).filter(v=>(v.until||0)>now);
  field.acid=(field.acid||[]).filter(v=>(v.until||0)>now);
  field.wards=(field.wards||[]).filter(v=>(v.until||0)>now && v.hp>0);
}
function makeBattlePayload(field, battleTickId){
  const cleanField=field||fieldEmpty();
  return sanitizeFirestoreValue({
    schemaVersion:3,
    sessionKey:(S&&S.sessionKey)||undefined,
    battleTickId:battleTickId|0,
    width:cleanField.width||W,height:cleanField.height||H,
    unitGroups:FFDecks.encodeBattleUnits((cleanField.units||[]).map(compactUnitForSync),S),
    temporalFields:cleanField.temporalFields||[],
    comboFields:cleanField.comboFields||[],
    poison:cleanField.poison||[],
    toxic:cleanField.toxic||[],
    acid:cleanField.acid||[],
    wards:(cleanField.wards||[]).map(sanitizeFirestoreValue),
    syncedFx:(cleanField.syncedFx||[]).slice(-96).map(sanitizeFirestoreValue),
    startedAt:cleanField.startedAt||hostBattleStartedAt||Date.now(),
    suddenDeathTickAt:cleanField.suddenDeathTickAt||0,
    updatedAt:Date.now()
  });
}
function readBattlePayload(payload){
  const field=Object.assign(battleEmpty(),payload||{});

async function flushBattlePublishQueue(){
  if(isLocalPractice()){if(queuedBattlePayload){B=readBattlePayload(queuedBattlePayload);queuedBattlePayload=null;upsertVisualUnitsFromBattle(B);}return;}
  if (battlePublishInFlight || disposed) return;
  battlePublishInFlight=true;
  try{
    while (queuedBattlePayload && !disposed){
      const payload=queuedBattlePayload;
      queuedBattlePayload=null;
      await setDoc(battleRef,payload);
    }
  }catch(e){
    console.error("battle publish failed",e);
  }finally{
    battlePublishInFlight=false;
    if (queuedBattlePayload && !disposed) flushBattlePublishQueue();
  }
}
function queueBattlePublish(payload){
  queuedBattlePayload=payload;
  flushBattlePublishQueue();
}
async function publishBattleNow(payload){
  queuedBattlePayload=payload;
  await flushBattlePublishQueue();
  while (battlePublishInFlight) await new Promise(resolve=>setTimeout(resolve,20));
}

function hasHostLease(){
  if (isSecureMode() || executionMode === "menu") return false;
  if (!isHost) return false;

async function claimExpiredHostLease(){
  const now=Date.now();
  if (!isHost || disposed || now-lastLeaseClaimAttemptAt<5000) return false;
  lastLeaseClaimAttemptAt=now;
  try{
    let claimed=false;
    await runTransaction(db,async(tx)=>{
      const snap=await tx.get(stateRef);
      if (!snap.exists()) return;
      const data=snap.data();
      if (data.hostClientId===clientInstanceId || (data.hostLeaseUntil||0)<=now){
        tx.update(stateRef,{hostClientId:clientInstanceId,hostLeaseUntil:now+30000});
        claimed=true;
      }
    });
    return claimed;
  }catch(e){
    console.warn("host lease claim failed",e);
    return false;
  }
}

function startHostLoops(){
  if (hostTick || !hasHostLease() || disposed) return;
  hostTick=setInterval(processHostPhase,HOST_PHASE_MS);
  processHostPhase();
}

function applySuddenDeath(st,now){
  tickCampaignHazards(st,now);
  const field=st.field;
  const started=field.startedAt||hostBattleStartedAt||now;
  if ((now-started)<SUDDEN_DEATH_MS) return;
  if (now<(field.suddenDeathTickAt||0)) return;
  const level=1+Math.floor((now-started-SUDDEN_DEATH_MS)/18000);
  for (const u of field.units||[]){
    if (!u || u.hp<=0) continue;
    u.hp-=level;
    u.statusShockUntil=Math.max(u.statusShockUntil||0,now+800);
  }
  field.suddenDeathTickAt=now+SUDDEN_DEATH_TICK_MS;
  hostSuddenDeathAt=now;
}
function resolveRoundLoser(st,had0,had1,preTickHealth){
  if (had0 && !had1) return 1;
  if (!had0 && had1) return 0;
  if (!had0 && !had1){
    if (preTickHealth[0]!==preTickHealth[1]) return preTickHealth[0]<preTickHealth[1]?0:1;
    return (hostBattleTickId%2===0)?0:1;
  }
  return null;
}

/* ----------- Local authoritative battle loop ----------- */
async function runBattle(initialField){
  if (!hasHostLease() || disposed || battleTick || battleStartInFlight) return;
  battleStartInFlight=true;
  try{
    if (initialField){
      hostBattleState=Object.assign(fieldEmpty(),deepClone(initialField));
    }else if (!hostBattleState){
      if (B && (B.unitGroups||Array.isArray(B.units) && B.units.length)){
        hostBattleState=Object.assign(fieldEmpty(),readBattlePayload(deepClone(B)));
      }else{
        const snap=await getDoc(battleRef); // one recovery read, not a repeating poll
        hostBattleState=Object.assign(fieldEmpty(),snap.exists()?readBattlePayload(deepClone(snap.data())):fieldEmpty());
      }
    }
    if (!hasHostLease() || !S || S.phase!=="battle" || disposed) return;
    hostBattleState.units=FFDecks.sanitizeBattleUnits(hostBattleState.units,S);
    syncBattleDimensions(hostBattleState);
    hostBattleStartedAt=hostBattleState.startedAt||Date.now();
    hostBattleState.startedAt=hostBattleStartedAt;
    hostBattleTickId=Number.isFinite(hostBattleState.battleTickId)?hostBattleState.battleTickId:(Number.isFinite(B&&B.battleTickId)?B.battleTickId:0);
  }finally{
    battleStartInFlight=false;
  }

  let lastLogic=0;
  let lastPublishAt=0;
  let lastPublishedSignature=battleFieldSignature(hostBattleState);

  const advanceBattle=async()=>{
    if (battleTickBusy || disposed) return;
    battleTickBusy=true;
    try{
      if (!hasHostLease() || !S || S.phase!=="battle"){
        if (battleTick){clearInterval(battleTick);battleTick=null;}
        hostBattleState=null;
        return;
      }
      const st=deepClone(S);
      st.field=hostBattleState;
      const units=st.field.units||[];
      const now=Date.now();
      const preTickHealth=[0,0];
      for (const u of units) if (u&&u.hp>0) preTickHealth[u.p]=(preTickHealth[u.p]||0)+u.hp;
      const doLogic=(now-lastLogic)>=LOGIC_MS;

      if (doLogic){
        lastLogic=now;
        pruneBattleField(st.field,now);
        applyTerrain(st.field,units);
        for (let i=0;i<units.length;i++) blinkIfNeeded(units[i],units,st);
        wardsHeal(st,now);
        wardsShoot(st,now);
        broodTick(st,now);
        FFUnits.tickForgeAbilities(st,now,forgeCombatHooks(st));
        applySuddenDeath(st,now);
      }

      const ordered=FFUnits.combatTurnOrder(units,now,st.field);
      for (let i=0;i<ordered.length;i++){
        const u=ordered[i];
        if (!u || u.hp<=0) continue;
        if (doLogic){
          healAction(u,st,now);
          wardAction(u,st,now);
          applyVguardRegen(u,st,now);
        }
        if(doLogic)FFUnits.keepFiringDistance(u,units,now,forgeCombatHooks(st));
        const t=pickTarget(u,units,st.field);
        if (!t) continue;
        const attacked=attack(u,t,now,st);
        if (!attacked && doLogic && canStepNow(u,now)){
          const slowed=(u.slowUntil&&u.slowUntil>now);
          const bound=(u.bindUntil&&u.bindUntil>now);
          const steps=bound?0:(slowed?1:PACE.moveSteps);
          for (let step=0;step<steps;step++){
            const t2=pickTarget(u,units,st.field);
            if (!t2) break;
            if (u.burrow) attemptBurrow(u,units,st,now);
            if (u.viperLeap && isBacklineUnit(t2) && rectDistance(u,t2)>1){
              if (attemptViperLeap(u,units,st)){
                if (rectDistance(u,t2)<=(u.range||1)) attack(u,t2,now,st);
                continue;
              }
            }
            stepToward(u,t2,units);
            if (rectDistance(u,t2)<=(u.range||1)){
              attack(u,t2,now,st);
              break;
            }
          }
        }
      }

      if (doLogic){
        const dead=st.field.units.filter(u=>u.hp<=0);
        for (const u of dead){
          FFUnits.noteForgeDeath(u,st,now,{distance:rectDistance});
          if (u.paints){
            paintPoison(st,u.x,u.y,7000,u.p);
            pushSyncedFx(st.field,fxBurst(u.x,u.y),now);
          }
        }
        st.field.units=st.field.units.filter(u=>u.hp>0);
        pruneBattleField(st.field,now);
      }
      hostBattleState=st.field;
      applyHostBattleVisual(hostBattleState);

      const alive0=st.field.units.some(u=>u.p===0&&u.hp>0);
      const alive1=st.field.units.some(u=>u.p===1&&u.hp>0);
      if (!alive0 || !alive1){
        if (battleTick){clearInterval(battleTick);battleTick=null;}
        hostBattleTickId+=1;
        await publishBattleNow(makeBattlePayload(st.field,hostBattleTickId));
        const loser=resolveRoundLoser(st,alive0,alive1,preTickHealth);
        const lives=(st.lives||[4,4]).slice();
        lives[loser]=Math.max(0,lives[loser]-1);
        if(isLocalPractice()&&st.soloProgress&&loser===1){
          // A stable match/round receipt survives a refresh or uncertain save.
          saveSoloRoundWin(st,8-lives[0]-lives[1]);
        }
        const players=st.players||[];
        let winnerName=null;
        if (lives[0]===0&&players.length>1) winnerName=players[1];
        if (lives[1]===0&&players.length>0) winnerName=players[0];
        hostBattleState=null;

        if (winnerName){
          // Competitive ratings and collectible rewards are written by the
          // authenticated authoritative service only. Legacy hosted games are practice.
          await writeStatePatch({lives,phase:"game-over",phaseEndsAt:0,winner:winnerName,
            mmr:st.mmr||[1000,1000],mmrChange:[0,0],eloCommitted:false,endedAt:Date.now()});
        }else{
          const loserKey=pKey(loser),winnerKey=pKey(1-loser);
          const roster=st.roster||{p0:[],p1:[]};
          if(!roster.p0)roster.p0=[]; if(!roster.p1)roster.p1=[];
          await writeStatePatch({
            lives:lives,phase:"loser-bonus",phaseEndsAt:Date.now()+10000,
            selections:{p0:[],p1:[]},
            currentPacks:(()=>{
              const packs={p0:[],p1:[]};
              packs[loserKey]=packFor(roster[loserKey],st.factions?.[loserKey]||"Helions",loserKey,st);
              packs[winnerKey]=[]; return packs;
            })(),
            draftIndex:0,bonusFor:loserKey
          });
        }
        return;
      }

      const nowPublish=Date.now();
      const nextSig=battleFieldSignature(hostBattleState);
      const changed=nextSig!==lastPublishedSignature;
      const heartbeat=(nowPublish-lastPublishAt)>=BATTLE_HEARTBEAT_MS;
      if ((changed && (nowPublish-lastPublishAt)>=BATTLE_PUBLISH_MS) || heartbeat){
        hostBattleTickId+=1;
        const payload=makeBattlePayload(hostBattleState,hostBattleTickId);
        queueBattlePublish(payload);
        lastPublishedSignature=nextSig;
        lastPublishAt=nowPublish;
      }
    }catch(e){
      console.error("battle simulation failed",e);
    }finally{
      battleTickBusy=false;
    }
  };

  battleTick=setInterval(advanceBattle,SIMULATION_MS);
  advanceBattle();
}

  $("overlay").style.opacity=performance.now()<battlePresentationUntil?"0":"";$("cardRow").style.visibility=performance.now()<battlePresentationUntil?"hidden":"";

  const p0n=(S && S.players && S.players[0]) || "P0";

/* -------- transactional player actions -------- */
async function chooseDeck(value){
  const checked=FFDecks.validateDeck(value,{unlockedTypes:unlockedForgeKeys(),troops:TROOPS});
  if(!S||!checked.valid)throw new Error(checked.errors.join(' '));
  const deck=checked.deck,fac=deck.faction;
  if(isSecureMode()){
    if(secureRequestBusy)return;secureRequestBusy=true;
    try{await adoptSecureResponse(await progression.joinPvp({lobbyId:gameId,faction:fac,deck,ranked:requestedRanked}));startSecurePolling();}
    catch(error){expansionUI?.notify(error.message);}
    finally{secureRequestBusy=false;}return;
  }
  if(isLocalPractice()){
    if(S.phase!=="faction-select"||S.factions.p0)return;
    const enemyFaction=localOpponent?.faction||ALL_FACTIONS[Math.floor(Math.random()*3)];
    await writeStatePatch({factions:{p0:fac,p1:enemyFaction},decks:{p0:deck,p1:S.decks?.p1||FFDecks.starterDeck(enemyFaction)}});return;
  }
  const sk=pKey(meIndex);
  try{
    await runTransaction(db, async (tx)=>{
      const snap = await tx.get(stateRef);
      if (!snap.exists()) return;
      const data = snap.data();
      const currentFaction = data && data.factions && data.factions[sk];
      if (currentFaction) return;
      const phase = data.phase;
      if (phase !== "faction-select") return;
      const newFacs = data.factions || {p0:null,p1:null};
      newFacs[sk] = fac;
      const decks=data.decks||{p0:null,p1:null};decks[sk]=deck;
      tx.update(stateRef, { factions: newFacs,decks });
    });
  }catch(e){
    console.error("chooseDeck failed", e);
  }
}
async function chooseFaction(fac){return chooseDeck(FFDecks.starterDeck(fac));}
async function chooseCard(i){
  if(!S) return;
  const activePack=S.currentPacks?.[pKey(meIndex)]||[];
  if(!Number.isInteger(i)||i<0||i>=activePack.length)return;
  const chosenCard=activePack[i],priorRoster=deepClone(S.roster?.[pKey(meIndex)]||[]);
  const announce=()=>expansionUI?.announceBattleUpgrade(chosenCard,priorRoster,{faction:S?.factions?.[pKey(meIndex)],evolutions:S?.evolutions?.[pKey(meIndex)]||{},comboEnhancements:S?.comboEnhancements?.[pKey(meIndex)]||[],tier:forgeProfile?.troops?.[chosenCard.for]?.forgeTier||1});
  if(isSecureMode()){
    if(secureRequestBusy)return;secureRequestBusy=true;
    try{await adoptSecureResponse(await progression.pick(secureSession.id,i,{sequence:secureSession.revision}));announce();}
    catch(error){expansionUI?.notify(error.message);}
    finally{secureRequestBusy=false;}return;
  }
  if(isLocalPractice()){
    const di=S.draftIndex|0,selections=deepClone(S.selections||{p0:[],p1:[]});
    if(selections.p0[di]!=null)return;selections.p0[di]=i;
    await writeStatePatch({selections});announce();return;
  }
  const di=S.draftIndex|0;
  const sk=pKey(meIndex);
  try{
    await runTransaction(db, async (tx)=>{
      const snap = await tx.get(stateRef);
      if (!snap.exists()) return;
      const data = snap.data();
      if (data.phase!=="draft" && data.phase!=="draft-after" && data.phase!=="loser-bonus") return;

      const selections = data.selections || {p0:[],p1:[]};
      if (!selections.p0) selections.p0 = [];
      if (!selections.p1) selections.p1 = [];

      const curSel = selections[sk][di];
      if (curSel!=null) return;

      const pack = (data.currentPacks && data.currentPacks[sk]) ? data.currentPacks[sk] : [];
      if (!pack || !pack.length) return;

      selections[sk][di] = i;
      tx.update(stateRef, { selections: selections });
    });
    announce();
  }catch(e){
    console.error("chooseCard failed", e);
  }
}

/* Shared presentation helpers are also used by local and secure replays. */
let seenEffectIds=new Set();
let prevBattleForLocalFx = null;

function renderLocalFxFromBattleDiff(prevBattle, nextBattle){
  const prevUnits = new Map(((prevBattle&&prevBattle.units)||[]).map(u=>[u.id,u]));
  const nextUnits = new Map(((nextBattle&&nextBattle.units)||[]).map(u=>[u.id,u]));
  for (const u of nextUnits.values()){
    const prev = prevUnits.get(u.id);
    if (!prev) continue;
    if (u.hp < prev.hp){
      flashAt(u.x, u.y, prev.hp - u.hp);
      if (!(nextBattle.syncedFx||[]).some(ev=>ev.targetId===u.id))emitLocalEffect(fxImpact(u.x, u.y));
    } else if (u.hp > prev.hp){
      emitLocalEffect(fxHeal(prev.x, prev.y, u.x, u.y));
    }
  }
  for (const prev of prevUnits.values()){
    if (!nextUnits.has(prev.id)){
      if(!(nextBattle.syncedFx||[]).some(ev=>ev.kind==="death"&&ev.sourceId===prev.id))emitLocalEffect({id:"death-"+prev.id,type:"combat",kind:"death",unitType:prev.type,x:prev.x,y:prev.y,ttl:800});
    }
  }
}

function renderSyncedFxEvents(list){
  for (let i=0;i<list.length;i++){
    const ev=list[i];
    if (!ev || !ev.id || seenEffectIds.has(ev.id)) continue;
    seenEffectIds.add(ev.id);
    emitLocalEffect(Object.assign({ttl:620}, ev));
    if(seenEffectIds.size>4096)seenEffectIds.delete(seenEffectIds.values().next().value);
  }
}

function enqueueBattleSnapshot(snapshot){
  snapshot=readBattlePayload(snapshot);
  const tickId = Number.isFinite(snapshot && snapshot.battleTickId) ? snapshot.battleTickId : -1;
  battleSnapshotBuffer.push({
    battleTickId: tickId,
    receivedAt: Date.now(),
    width:snapshot.width||8,height:snapshot.height||16,
    units: Array.isArray(snapshot.units) ? snapshot.units : [],
    poison: Array.isArray(snapshot.poison) ? snapshot.poison : [],
    toxic: Array.isArray(snapshot.toxic) ? snapshot.toxic : [],
    acid: Array.isArray(snapshot.acid) ? snapshot.acid : [],
    wards: Array.isArray(snapshot.wards) ? snapshot.wards : [],
    syncedFx: Array.isArray(snapshot.syncedFx) ? snapshot.syncedFx : [],
    temporalFields:Array.isArray(snapshot.temporalFields)?snapshot.temporalFields:[],
    comboFields:Array.isArray(snapshot.comboFields)?snapshot.comboFields:[],
    startedAt: Number.isFinite(snapshot.startedAt) ? snapshot.startedAt : 0,
    suddenDeathTickAt: Number.isFinite(snapshot.suddenDeathTickAt) ? snapshot.suddenDeathTickAt : 0,
    sessionKey: snapshot.sessionKey || null,
    updatedAt: Number.isFinite(snapshot.updatedAt) ? snapshot.updatedAt : 0
  });
  battleSnapshotBuffer.sort((a,b)=>a.battleTickId-b.battleTickId || a.receivedAt-b.receivedAt);
  while (battleSnapshotBuffer.length > BATTLE_BUFFER_MAX) battleSnapshotBuffer.shift();
  const newestTick = battleSnapshotBuffer.length ? battleSnapshotBuffer[battleSnapshotBuffer.length-1].battleTickId : -1;
  for (let i=battleSnapshotBuffer.length-2; i>=0; i--){
    const snap = battleSnapshotBuffer[i];
    if ((newestTick - snap.battleTickId) > BATTLE_BUFFER_MAX + 2) battleSnapshotBuffer.splice(i,1);
  }
}

function pickBufferedBattleSnapshot(){
  if (!battleSnapshotBuffer.length) return null;
  const now = Date.now();
  const targetTime = now - BATTLE_BUFFER_MS;
  let pick = battleSnapshotBuffer[0];
  for (let i=0;i<battleSnapshotBuffer.length;i++){
    const snap = battleSnapshotBuffer[i];
    if (snap.receivedAt <= targetTime) pick = snap;
    else break;
  }
  const newest = battleSnapshotBuffer[battleSnapshotBuffer.length-1];

function configureBattleListener(){

  if (hasHostLease()){

  profileLoadVersion++;profileConnectionFailed=false;authConnectionError=null;
  progression?.dispose();progression=null;progressIdentity=null;profileLoadPromise=null;
  unsubscribeLobby?.();unsubscribeLobby=null;unsubscribeState?.();unsubscribeState=null;unsubscribeBattle?.();unsubscribeBattle=null;listenersStarted=false;
  returnToForgeMenu();forgeProfile=defaultForgeProfile();expansionUI?.refresh();
}
function connectGuestProfile(){
  if(anonymousSignIn)return anonymousSignIn;
  startupError=null;updateAssetGate();
  anonymousSignIn=signInAnonymously(auth).catch(error=>{
    console.error("Anon sign-in failed",error);authConnectionError=profileConnectionError(error);authConnectionStatus=authConnectionError.message;profileConnectionFailed=true;
    initializeExpansion().then(()=>{
      if(gameId)showStartupError(new Error("Unable to connect your profile. Check your connection and retry."));
      else if(expansionUI?.view==="menu")expansionUI.refresh();
    }).catch(showStartupError);
    throw authConnectionError;
  }).finally(()=>{anonymousSignIn=null;});
  return anonymousSignIn;
}
initializeExpansion().catch(showStartupError);
onAuthStateChanged(auth, (user) => {
  finishInitialAuth(user);
  // The first callback runs after Firebase restores persisted credentials.
  // Creating the fallback earlier can replace a durable account on reload.
  if (!user) {
    if(progressIdentity)clearForgeIdentity();
    connectGuestProfile().catch(()=>{});
    return;
  }
  restoreExpansionProfile(user).catch(error=>{if(gameId)showStartupError(error);else{console.error("Forge profile failed",error);expansionUI?.notify(error.message);}});
},error=>{
  finishInitialAuth(null);profileConnectionFailed=true;authConnectionError=profileConnectionError(error);authConnectionStatus=authConnectionError.message;expansionUI?.refresh();
});

// A login/logout in the hub must never keep the previous account's open game.
function refreshHubProfile(event){
  if(event.type==="storage"&&event.key!=="gh.username")return;
  const selected=storedHubUsername();if(selected===launchHubUsername)return;
  progression?.dispose();progression=null;resetActiveRuntime();
  const target=new URL(location.href);
  if(selected)target.searchParams.set("username",selected);
  else target.searchParams.delete("username");
  target.searchParams.set("mode","solo");target.searchParams.delete("gameId");
  location.replace(target.href);
}
window.addEventListener("storage",refreshHubProfile);
window.addEventListener("focus",refreshHubProfile);
document.addEventListener("visibilitychange",()=>{if(!document.hidden)refreshHubProfile({type:"visibilitychange"});});

const cardInfoModal = $("cardInfoModal");
if (cardInfoModal){
  cardInfoModal.addEventListener("pointerdown", (event)=>{ event.stopPropagation(); });
  cardInfoModal.addEventListener("click", (event)=>{
    if (event.target === cardInfoModal) closeCardInfoModal();
  });
  const closeBtn = cardInfoModal.querySelector(".cardInfoClose");
  if (closeBtn) closeBtn.onclick = closeCardInfoModal;
}

$("forgeMenuBtn").onclick=()=>expansionUI?.showMenu();

/* Fullscreen */
$("fsBtn").onclick = async ()=>{
  try{
    if (!document.fullscreenElement) await document.documentElement.requestFullscreen();
    else await document.exitFullscreen();
  }catch(e){
    console.warn(e);
  }
};

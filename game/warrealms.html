<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#080b10" />
  <title>War Realms</title>
  <style>
    html,body{width:100%;height:100%;margin:0;background:#07090d;color:#f5f7fb;font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
    body{display:grid;place-items:center}.load{width:min(390px,92vw);padding:22px;border:1px solid #364250;border-radius:15px;background:#10161d;text-align:center}
    h1{font-size:22px;letter-spacing:.12em;text-transform:uppercase;margin:0 0 7px}i{font-style:normal;color:#f0c93a}p{font-size:10px;line-height:1.5;color:#a8b2bf}
    .spin{width:28px;height:28px;margin:14px auto;border:3px solid #26313c;border-top-color:#e5c43c;border-radius:50%;animation:spin .8s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
    pre{white-space:pre-wrap;text-align:left;color:#ff9aa5;font-size:11px}
  </style>
</head>
<body>
  <div class="load"><h1><i>◆</i> War Realms</h1><p>Preparing purge and outpost rules…</p><div class="spin"></div><pre id="error"></pre></div>
  <script>
  (async()=>{
    const CORE_URL="https://raw.githubusercontent.com/Sean-Pereksta/Magic/ff2f5064a572f6886213d1309463504e89ad4059/game/warrealms.html";
    let text=await fetch(CORE_URL,{cache:"force-cache"}).then(r=>{if(!r.ok)throw new Error(`Core game request failed (${r.status})`);return r.text()});

    function replaceExact(oldValue,newValue,label,expected=1){
      const count=text.split(oldValue).length-1;
      if(count!==expected)throw new Error(`${label}: expected ${expected} match${expected===1?"":"es"}, found ${count}`);
      text=text.split(oldValue).join(newValue);
    }
    function replaceCard(id,line){
      const pattern=new RegExp(`^\\s*\\{id:"${id}".*$`,"m"),match=text.match(pattern);
      if(!match)throw new Error(`Red card definition not found: ${id}`);
      text=text.replace(pattern,line);
    }

    replaceExact('const GAME_VERSION=2,DECK_SIZE=50,MAX_COPIES=4;','const GAME_VERSION=3,DECK_SIZE=50,MAX_COPIES=4;','game version');
    replaceExact('<span id="scrapRes" class="resource scrap">✕ 0</span>','<span id="scrapRes" class="resource scrap" title="Purge your own cards">✕ 0</span>\n        <span id="marketScrapRes" class="resource scrap" title="Scrap a War Market card">▧ 0</span>','resource display');
    replaceExact('<button id="playAllBtn" class="cmdBtn playAll">Play all</button>\n        <button id="endTurnBtn" class="cmdBtn primary">End turn</button>','<button id="playAllBtn" class="cmdBtn playAll">Play all</button>\n        <button id="purgeBtn" class="cmdBtn">Purge</button>\n        <button id="endTurnBtn" class="cmdBtn primary">End turn</button>','purge button');

    replaceCard('ash_initiate','      {id:"ash_initiate",name:"Ash Initiate",faction:"red",cost:1,type:"ship",sigil:"✦",effect:{trade:1},ally:{purge:1},scrap:{combat:3},text:"Gain 1 trade.",allyText:"Purge 1 card from your hand, draw pile, or discard pile.",scrapText:"Scrap: gain 3 combat."},');
    replaceCard('blood_channeler','      {id:"blood_channeler",name:"Blood Channeler",faction:"red",cost:2,type:"ship",sigil:"♢",effect:{combat:2,purge:1},ally:{trade:1},scrap:{draw:1},text:"Gain 2 combat and gain 1 purge.",allyText:"Gain 1 trade.",scrapText:"Scrap: draw 1 card."},');
    replaceCard('grave_bargain','      {id:"grave_bargain",name:"Grave Bargain",faction:"red",cost:3,type:"ship",sigil:"☠",effect:{trade:2,combat:2,purge:1,scrapMarket:1},ally:{},text:"Gain 2 trade, 2 combat, 1 purge, and scrap 1 market card.",allyText:""},');
    replaceCard('obsidian_altar','      {id:"obsidian_altar",name:"Obsidian Altar",faction:"red",cost:3,type:"base",defense:4,sigil:"⛧",effect:{trade:1},ally:{combat:2,purge:1},scrap:{combat:5},text:"Gain 1 trade.",allyText:"Gain 2 combat and 1 purge.",scrapText:"Sacrifice: gain 5 combat."},');
    replaceCard('soul_furnace','      {id:"soul_furnace",name:"Soul Furnace",faction:"red",cost:5,type:"base",defense:5,outpost:true,sigil:"◐",effect:{combat:3,purge:1},ally:{scrapMarket:1},scrap:{heal:5,combat:3},text:"Outpost. Gain 3 combat and 1 purge.",allyText:"Scrap 1 market card.",scrapText:"Sacrifice: gain 5 authority and 3 combat."},');
    replaceCard('eclipse_archon','      {id:"eclipse_archon",name:"Eclipse Archon",faction:"red",cost:7,type:"ship",sigil:"◒",effect:{combat:7,draw:1,purge:2},ally:{combat:3},scrap:{combat:5,heal:5},text:"Gain 7 combat, draw 1, and gain 2 purge.",allyText:"Gain 3 combat.",scrapText:"Scrap: gain 5 combat and 5 authority."},');
    replaceCard('coin_curse','      {id:"coin_curse",name:"Coin Curse",faction:"red",cost:1,type:"ship",sigil:"¤",effect:{combat:1},ally:{purge:1},scrap:{trade:3},text:"Gain 1 combat.",allyText:"Gain 1 purge.",scrapText:"Scrap: gain 3 trade."},');
    replaceCard('bone_appraiser','      {id:"bone_appraiser",name:"Bone Appraiser",faction:"red",cost:2,type:"ship",sigil:"☠",effect:{trade:2,purge:1},ally:{combat:1},scrap:{trade:2,combat:2},text:"Gain 2 trade and gain 1 purge.",allyText:"Gain 1 combat.",scrapText:"Scrap: gain 2 trade and 2 combat."},');
    replaceCard('hexed_portal','      {id:"hexed_portal",name:"Hexed Portal",faction:"red",cost:3,type:"base",defense:4,sigil:"◌",effect:{trade:1,combat:1},ally:{scrapMarket:1,purge:1},scrap:{draw:1},text:"Gain 1 trade and 1 combat.",allyText:"Gain 1 purge and scrap 1 market card.",scrapText:"Sacrifice: draw 1 card."},');
    replaceCard('death_tithe','      {id:"death_tithe",name:"Death Tithe",faction:"red",cost:4,type:"ship",sigil:"†",effect:{combat:4,heal:2,purge:1},ally:{trade:2},scrap:{trade:4},text:"Gain 4 combat, 2 authority, and 1 purge.",allyText:"Gain 2 trade.",scrapText:"Scrap: gain 4 trade."},');
    replaceCard('void_auctioneer','      {id:"void_auctioneer",name:"Void Auctioneer",faction:"red",cost:6,type:"ship",sigil:"◍",effect:{trade:3,combat:3,purge:1,scrapMarket:1},ally:{draw:1,purge:1},scrap:{trade:5,combat:3},text:"Gain 3 trade, 3 combat, 1 purge, and scrap 1 market card.",allyText:"Draw 1 card and gain 1 purge.",scrapText:"Scrap: gain 5 trade and 3 combat."}');

    replaceExact('if(e.stun)parts.push(`Disable ${e.stun}`);if(e.scrapMarket)parts.push(`Scrap row ${e.scrapMarket}`);','if(e.stun)parts.push(`Disable ${e.stun}`);if(e.purge)parts.push(`Purge ${e.purge}`);if(e.scrapMarket)parts.push(`Scrap row ${e.scrapMarket}`);','purge rules summary');
    replaceExact('stun:0,scrapMarket:0,discardPenalty:0','stun:0,purge:0,scrapMarket:0,discardPenalty:0','player purge state');
    replaceExact('p.stun+=(e.stun||0);p.scrapMarket+=(e.scrapMarket||0);','p.stun+=(e.stun||0);p.purge+=(e.purge||0);p.scrapMarket+=(e.scrapMarket||0);','apply purge effect');
    replaceExact('p.trade=0;p.combat=0;p.stun=0;p.scrapMarket=0;','p.trade=0;p.combat=0;p.stun=0;p.purge=0;p.scrapMarket=0;','purge resets',2);

    replaceExact('function refillMarket(game){while(game.tradeRow.length<5&&game.marketDeck.length)game.tradeRow.push(game.marketDeck.pop())}','function refillMarket(game){while(game.tradeRow.length<5&&game.marketDeck.length)game.tradeRow.push(game.marketDeck.pop())}\n    function purgeableCount(p){return (p?.hand?.length||0)+(p?.draw?.length||0)+(p?.discard?.length||0)}\n    function bestAIPurge(p){\n      let best=null;\n      for(const zone of ["discard","draw","hand"]){\n        for(const id of p[zone]||[]){\n          const c=CARDS[id]||STARTERS[id],score=id==="viper"?0:id==="scout"?1:10+(c?.cost||0);\n          if(!best||score<best.score)best={zone,id,score};\n        }\n      }\n      return best;\n    }','purge helpers');

    replaceExact('        case"SCRAP_MARKET":{\n          if(p.scrapMarket<1)return"No market scrap available.";','        case"PURGE_OWN":{\n          if(p.purge<1)return"No purge available.";\n          const zone=["hand","draw","discard"].includes(action.zone)?action.zone:"",id=String(action.id||"");\n          if(!zone)return"Invalid purge zone.";\n          const index=p[zone].indexOf(id),c=CARDS[id]||STARTERS[id];if(index<0||!c)return"That card is no longer available to purge.";\n          p[zone].splice(index,1);p.purge--;game.scrapped.push({id,ownerId:p.id,ownerName:p.name,source:zone});\n          const zoneName=zone==="hand"?"hand":zone==="draw"?"draw pile":"discard pile";addLog(game,`${p.name} purged ${c.name} from their ${zoneName}.`);break;\n        }\n        case"SCRAP_MARKET":{\n          if(p.scrapMarket<1)return"No market scrap available.";','purge reducer action');

    replaceExact('const index=target.bases.findIndex(x=>x.instance===action.instance),base=target.bases[index],c=base&&CARDS[base.id];if(!c)return"That base is gone.";\n          if(p.combat<c.defense)return`You need ${c.defense} combat.`;','const index=target.bases.findIndex(x=>x.instance===action.instance),base=target.bases[index],c=base&&CARDS[base.id];if(!c)return"That base is gone.";\n          if(target.bases.some(b=>CARDS[b.id]?.outpost)&&!c.outpost)return"Destroy that realm\'s outpost before attacking its other bases.";\n          if(p.combat<c.defense)return`You need ${c.defense} combat.`;','strict outpost targeting');

    replaceExact('          while(p.hand.length)playCard(game,p,0);\n          while(p.scrapMarket>0&&game.tradeRow.length){','          while(p.hand.length)playCard(game,p,0);\n          while(p.purge>0&&purgeableCount(p)){const choice=bestAIPurge(p);if(!choice)break;reduce(game,{type:"PURGE_OWN",zone:choice.zone,id:choice.id},p.id)}\n          while(p.scrapMarket>0&&game.tradeRow.length){','AI purge use');
    replaceExact('const canAct=isMyTurn()&&mine()?.combat>0&&p.id!==mine()?.id&&!p.eliminated&&!p.left;','const canAct=isMyTurn()&&mine()?.combat>0&&p.id!==mine()?.id&&!p.eliminated&&!p.left&&!p.bases.some(b=>CARDS[b.id]?.outpost);','player attack outpost lock');
    replaceExact('$("#scrapRes").textContent=`✕ ${m?.scrapMarket||0}`;','$("#scrapRes").textContent=`✕ ${m?.purge||0}`;$("#marketScrapRes").textContent=`▧ ${m?.scrapMarket||0}`;','purge resource rendering');
    replaceExact('$("#playAllBtn").disabled=!isMyTurn()||!m?.hand.length||actionBusy;$("#endTurnBtn").disabled=!isMyTurn()||actionBusy;','$("#playAllBtn").disabled=!isMyTurn()||!m?.hand.length||actionBusy;$("#purgeBtn").disabled=!isMyTurn()||!(m?.purge>0)||!purgeableCount(m)||actionBusy;$("#endTurnBtn").disabled=!isMyTurn()||actionBusy;','purge button rendering');

    replaceExact('    function openMarketDetail(index){','    function openPurgeChooser(){\n      const p=mine();if(!isMyTurn()||!p?.purge){toast("No purge available.");return}\n      const zoneLabels={hand:"Hand",draw:"Draw pile",discard:"Discard pile"},sections=[];\n      for(const zone of ["hand","draw","discard"]){\n        const counts=(p[zone]||[]).reduce((a,id)=>(a[id]=(a[id]||0)+1,a),{}),cards=Object.entries(counts).map(([id,count])=>{\n          const c=CARDS[id]||STARTERS[id];return c?`<button class="catalogItem ${c.faction}" data-purge-zone="${zone}" data-purge-id="${id}"><div class="miniArt">${c.sigil}</div><div><div class="catalogName">${escapeHtml(c.name)}${count>1?` ×${count}`:""}</div><div class="catalogRule">Permanently remove one from your ${zoneLabels[zone].toLowerCase()}.</div></div><b>✕</b></button>`:"";\n        }).join("");\n        if(cards)sections.push(`<h3 style="font-size:10px;margin:10px 0 5px">${zoneLabels[zone]}</h3><div class="catalog">${cards}</div>`);\n      }\n      $("#detailTitle").textContent=`Purge a card · ${p.purge} available`;$("#detailSubtitle").textContent="Umbral Covenant deck thinning";\n      $("#detailBody").innerHTML=sections.join("")||\'<p class="emptyBases">No cards are available to purge.</p>\';$("#detailOverlay").classList.remove("hidden");\n      $("#detailBody").querySelectorAll("[data-purge-zone]").forEach(btn=>btn.addEventListener("click",()=>{$("#detailOverlay").classList.add("hidden");perform({type:"PURGE_OWN",zone:btn.dataset.purgeZone,id:btn.dataset.purgeId})}));\n    }\n    function openMarketDetail(index){','purge chooser UI');

    replaceExact('      const actions=[];if(isMyTurn()&&mine().combat>=c.defense)actions.push(`<button data-base-act="attack">Destroy for ⚔ ${c.defense}</button>`);\n      if(isMyTurn()&&mine().stun>0)actions.push(`<button data-base-act="stun">Disable base</button>`);','      const actions=[],protectedByOutpost=owner.bases.some(b=>CARDS[b.id]?.outpost)&&!c.outpost;\n      if(protectedByOutpost&&isMyTurn())actions.push(\'<button disabled>Protected by an outpost</button>\');\n      else if(isMyTurn()&&mine().combat>=c.defense)actions.push(`<button data-base-act="attack">Destroy for ⚔ ${c.defense}</button>`);\n      if(isMyTurn()&&mine().stun>0)actions.push(`<button data-base-act="stun">Disable base</button>`);','outpost detail lock');
    replaceExact('$("#playAllBtn").addEventListener("click",()=>perform({type:"PLAY_ALL"}));\n    $("#endTurnBtn").addEventListener("click",()=>perform({type:"END"}));','$("#playAllBtn").addEventListener("click",()=>perform({type:"PLAY_ALL"}));\n    $("#purgeBtn").addEventListener("click",openPurgeChooser);\n    $("#endTurnBtn").addEventListener("click",()=>perform({type:"END"}));','purge button handler');
    replaceExact('<p><b>Hold the corners.</b> Bases remain in front of each realm and trigger again at the start of their owner\'s turns. Outposts must be destroyed before that player can take damage.</p><p><b>Faction identities.</b> Yellow alien technology disrupts and disables. Blue priesthood restores authority and builds economy. Green orcs create direct, brutal combat. Red sorcerers sacrifice their own cards and erase cards from the market.</p>','<p><b>Hold the corners.</b> Bases remain in front of each realm and trigger again at the start of their owner\'s turns. Outposts have taunt: while any outpost remains, combat cannot target that realm or its ordinary bases.</p><p><b>Faction identities.</b> Yellow alien technology disrupts and disables. Blue priesthood restores authority and builds economy. Green orcs create direct, brutal combat. Red sorcerers specialize in purge, permanently thinning cards from their own hand, draw pile, or discard pile; they also sacrifice cards and erase cards from the market.</p>','help rules');

    const required=['const GAME_VERSION=3','case"PURGE_OWN"','data-purge-zone','id="purgeBtn"','id="marketScrapRes"','Protected by an outpost','Outposts have taunt'];
    const missing=required.filter(token=>!text.includes(token));if(missing.length)throw new Error(`Patched game validation failed: ${missing.join(", ")}`);
    if((text.match(/purge:1/g)||[]).length<8)throw new Error('Patched game validation failed: red purge effects are missing');

    document.open();document.write(text);document.close();
  })().catch(error=>{console.error(error);const el=document.getElementById('error');if(el)el.textContent=`Unable to load War Realms.\n${error.message}`});
  </script>
</body>
</html>

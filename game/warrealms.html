<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#080b10" />
  <title>War Realms</title>
  <style>
    html,body{width:100%;height:100%;margin:0;background:#07090d;color:#f5f7fb;font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
    body{display:grid;place-items:center}.load{width:min(390px,92vw);padding:22px;border:1px solid #364250;border-radius:15px;background:#10161d;text-align:center}
    h1{font-size:22px;letter-spacing:.12em;text-transform:uppercase;margin:0 0 7px}i{font-style:normal;color:#f0c93a}p{font-size:10px;line-height:1.5;color:#a8b2bf}
    .spin{width:28px;height:28px;margin:14px auto;border:3px solid #26313c;border-top-color:#e5c43c;border-radius:50%;animation:spin .8s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
    pre{white-space:pre-wrap;text-align:left;color:#ff9aa5;font-size:11px}
  </style>
</head>
<body>
  <div class="load"><h1><i>◆</i> War Realms</h1><p>Preparing the armory and shared War Market…</p><div class="spin"></div><pre id="error"></pre></div>
  <script type="module">
  const CORE_URL="https://raw.githubusercontent.com/Sean-Pereksta/Magic/ff2f5064a572f6886213d1309463504e89ad4059/game/warrealms.html";
  const PACK_PARTS=["./warrealms-pack/pack.00","./warrealms-pack/pack.01","./warrealms-pack/pack.02"];
  const decoder=new TextDecoder();

  function readTarString(bytes,start,length){
    const end=Math.min(bytes.length,start+length);let stop=start;
    while(stop<end&&bytes[stop]!==0)stop++;
    return decoder.decode(bytes.slice(start,stop)).trim();
  }
  function unpackTar(bytes){
    const files=new Map();let offset=0;
    while(offset+512<=bytes.length){
      const name=readTarString(bytes,offset,100);if(!name)break;
      const size=parseInt(readTarString(bytes,offset+124,12),8)||0,start=offset+512;
      files.set(name,decoder.decode(bytes.slice(start,start+size)));
      offset=start+Math.ceil(size/512)*512;
    }
    return files;
  }
  async function loadPatchModules(){
    if(typeof DecompressionStream!=="function")throw new Error("This browser needs DecompressionStream support to open War Realms.");
    const parts=await Promise.all(PACK_PARTS.map(async path=>{const response=await fetch(path,{cache:"force-cache"});if(!response.ok)throw new Error(`Patch package request failed (${response.status})`);return response.text()}));
    const binary=atob(parts.join("").replace(/\s/g,"")),compressed=Uint8Array.from(binary,char=>char.charCodeAt(0));
    const stream=new Blob([compressed]).stream().pipeThrough(new DecompressionStream("gzip"));
    const files=unpackTar(new Uint8Array(await new Response(stream).arrayBuffer()));
    const importFile=async name=>{const source=files.get(name);if(!source)throw new Error(`Patch module missing: ${name}`);return import(URL.createObjectURL(new Blob([source],{type:"text/javascript"})))};
    return Promise.all([importFile("game/warrealms-rules-patch.js"),importFile("game/warrealms-economy-patch.js")]);
  }

  try{
    const [[rules,economy],response]=await Promise.all([loadPatchModules(),fetch(CORE_URL,{cache:"force-cache"})]);
    if(!response.ok)throw new Error(`Core game request failed (${response.status})`);
    let text=await response.text();
    text=rules.applyWarRealmsRules(text);
    text=economy.applyWarRealmsEconomy(text);
    document.open();document.write(text);document.close();
  }catch(error){
    console.error(error);const el=document.getElementById("error");if(el)el.textContent=`Unable to load War Realms.\n${error.message}`;
  }
  </script>
</body>
</html>

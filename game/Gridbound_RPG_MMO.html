<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>Gridbound Realms</title>
<style>
html,body{margin:0;width:100%;height:100%;background:#07100d;color:#f3fff6;font-family:Inter,system-ui,Segoe UI,Arial,sans-serif;overflow:hidden}
#patchLoader{position:fixed;inset:0;display:grid;place-items:center;background:radial-gradient(circle at 50% 36%,#10251d,#07100d 58%);padding:24px;text-align:center}
#patchCard{width:min(520px,calc(100vw - 36px));padding:24px;border:1px solid rgba(229,255,235,.18);border-radius:20px;background:rgba(9,17,15,.94);box-shadow:0 24px 80px rgba(0,0,0,.55)}
#patchCard h1{margin:0 0 8px;font-size:28px}#patchCard p{margin:0;color:#a9bbb0;font-weight:700;line-height:1.45}
</style>
</head>
<body>
<div id="patchLoader"><div id="patchCard"><h1>Gridbound Realms</h1><p id="patchStatus">Preparing the living realm…</p></div></div>
<script>
(async()=>{
  const status=document.getElementById('patchStatus');
  try{
    const [coreResponse,patchResponse]=await Promise.all([
      fetch('./Gridbound_RPG_MMO_core.html',{cache:'no-cache'}),
      fetch('./gridbound-alive-world-patch.js',{cache:'no-cache'})
    ]);
    if(!coreResponse.ok)throw new Error(`Core realm ${coreResponse.status}`);
    if(!patchResponse.ok)throw new Error(`Alive World patch ${patchResponse.status}`);
    let html=await coreResponse.text();
    const patch=await patchResponse.text();
    const replacements=[
      ['const BASIC_MOVE_COOLDOWN = 360;','const BASIC_MOVE_COOLDOWN = 460;'],
      ['const HEARTBEAT_MS = 3500;','const HEARTBEAT_MS = 5000;'],
      ['const CONTROLLER_TICK_MS = 220;','const CONTROLLER_TICK_MS = 280;'],
      ['const ARENA_CONTROLLER_TICK_MS = 120;','const ARENA_CONTROLLER_TICK_MS = 150;'],
      ['const ROOM_STATE_WRITE_MS = 650;','const ROOM_STATE_WRITE_MS = 850;'],
      ['const ARENA_ROOM_STATE_WRITE_MS = 160;','const ARENA_ROOM_STATE_WRITE_MS = 220;'],
      ['const ATTACK_DELAY_NOTICE_MS = 700;','const ATTACK_DELAY_NOTICE_MS = 1050;'],
      ['const ATTACK_DESYNC_NOTICE_MS = 1500;','const ATTACK_DESYNC_NOTICE_MS = 2400;'],
      ['const INTERPOLATION_MS = 140;','const INTERPOLATION_MS = 420;']
    ];
    for(const [before,after] of replacements){
      if(!html.includes(before))throw new Error(`Gridbound core changed: missing ${before}`);
      html=html.replace(before,after);
    }
    const bootAnchor='\nboot();\n})();';
    if(!html.includes(bootAnchor))throw new Error('Gridbound core changed: boot injection point not found');
    html=html.replace(bootAnchor,`\n${patch}\nboot();\n})();`);
    status.textContent='Opening the living realm…';
    document.open();document.write(html);document.close();
  }catch(error){
    console.error('[Gridbound] Alive World loader failed',error);
    status.textContent=`Could not prepare the realm: ${error?.message||error}`;
  }
})();
</script>
</body>
</html>

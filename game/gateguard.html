<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <title>The Last Five</title>

  <style>
    :root {
      --black: #111111;
      --white: #ffffff;
      --red: #c91919;
      --red-soft: #ffe9e9;
      --red-strong: #ffd0d0;
      --green: #157a36;
      --green-soft: #e8f6ec;
      --gray: #ececec;
      --muted: #707070;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
      background: var(--white);
      color: var(--black);
      font-family:
        ui-monospace,
        SFMono-Regular,
        Menlo,
        Monaco,
        Consolas,
        "Liberation Mono",
        monospace;
      overscroll-behavior: none;
    }

    body {
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding:
        max(10px, env(safe-area-inset-top))
        max(7px, env(safe-area-inset-right))
        max(10px, env(safe-area-inset-bottom))
        max(7px, env(safe-area-inset-left));
    }

    button {
      font: inherit;
      color: inherit;
      touch-action: manipulation;
    }

    .game {
      width: min(96vw, 680px);
      user-select: none;
    }

    .topbar {
      height: 34px;
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      font-size: 13px;
      letter-spacing: 0.05em;
    }

    .round {
      justify-self: start;
    }

    .score {
      justify-self: end;
      color: var(--muted);
    }

    .squad {
      justify-self: center;
      display: flex;
      gap: 6px;
      align-items: center;
    }

    .squad-dot {
      width: 9px;
      height: 9px;
      border: 1.5px solid var(--black);
      border-radius: 50%;
      background: var(--white);
    }

    .squad-dot.wounded {
      background: var(--red);
      border-color: var(--red);
    }

    .squad-dot.lost {
      border-color: #c6c6c6;
      background: #c6c6c6;
    }

    .board {
      width: 100%;
      aspect-ratio: 1;
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      grid-template-rows: repeat(7, 1fr);
      border: 2px solid var(--black);
      background: var(--white);
      position: relative;
      isolation: isolate;
    }

    .intent-layer {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 2;
      pointer-events: none;
      overflow: visible;
    }

    .cell {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      min-width: 0;
      min-height: 0;
      border: 0;
      border-right: 1px solid var(--black);
      border-bottom: 1px solid var(--black);
      padding: 0;
      background: var(--white);
      cursor: pointer;
      overflow: visible;
      z-index: 1;
    }

    .cell:nth-child(7n) {
      border-right: 0;
    }

    .cell:nth-last-child(-n + 7) {
      border-bottom: 0;
    }

    .cell.legal {
      background: var(--green-soft);
    }

    .cell.legal::before {
      content: "";
      position: absolute;
      inset: 11%;
      border: 2px solid var(--green);
      pointer-events: none;
      z-index: 1;
    }

    .cell.legal.move-target::before {
      inset: auto;
      width: 18%;
      aspect-ratio: 1;
      border: 0;
      border-radius: 50%;
      background: var(--green);
    }

    .cell.preview-friendly {
      background: var(--green-soft);
    }

    .cell.preview-friendly::after {
      content: "";
      position: absolute;
      inset: 5%;
      border: 3px solid var(--green);
      pointer-events: none;
      z-index: 1;
    }

    .cell.preview-hostile {
      background: var(--red-soft);
    }

    .cell.preview-hostile::after {
      content: "";
      position: absolute;
      inset: 5%;
      border: 3px solid var(--red);
      pointer-events: none;
      z-index: 1;
    }

    .cell.enemy-danger {
      background: var(--red-soft);
    }

    .cell.enemy-danger::after {
      content: "";
      position: absolute;
      inset: 8%;
      border: 2px solid rgba(201, 25, 25, 0.68);
      pointer-events: none;
      z-index: 0;
    }

    .cell.enemy-marked {
      background-image:
        radial-gradient(
          circle,
          rgba(201, 25, 25, 0.32) 1.4px,
          transparent 1.6px
        );
      background-size: 9px 9px;
    }

    .cell.enemy-explode {
      background: var(--red-strong);
    }

    .cell.enemy-route::before {
      content: "";
      position: absolute;
      width: 10%;
      aspect-ratio: 1;
      border-radius: 50%;
      background: var(--black);
      opacity: 0.34;
      z-index: 0;
    }

    .cell.forced-destination {
      background-image:
        linear-gradient(
          45deg,
          transparent 42%,
          rgba(201, 25, 25, 0.55) 42%,
          rgba(201, 25, 25, 0.55) 48%,
          transparent 48%
        ),
        linear-gradient(
          -45deg,
          transparent 42%,
          rgba(201, 25, 25, 0.55) 42%,
          rgba(201, 25, 25, 0.55) 48%,
          transparent 48%
        );
    }

    .beacon {
      width: 22%;
      aspect-ratio: 1;
      border: 2px solid var(--black);
      transform: rotate(45deg);
      position: absolute;
      opacity: 0.25;
      z-index: 0;
    }

    .unit {
      width: 72%;
      aspect-ratio: 1;
      position: relative;
      z-index: 4;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
    }

    .piece-image {
      width: 100%;
      height: 100%;
      display: block;
      object-fit: contain;
      border-radius: 50%;
      background: var(--white);
      pointer-events: none;
    }

    .piece-fallback {
      width: 100%;
      height: 100%;
      border: 2px solid var(--black);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--white);
      font-weight: 700;
      font-size: clamp(14px, 3vw, 24px);
    }

    .hero.selected {
      outline: 4px solid var(--green);
      outline-offset: 1px;
    }

    .hero.acted {
      opacity: 0.4;
      filter: grayscale(1);
    }

    .hero.incoming-hit {
      opacity: 1;
      filter: none;
    }

    .hero.incoming-hit::before {
      content: "";
      position: absolute;
      inset: -15%;
      z-index: -1;
      border: 4px solid var(--red);
      border-radius: 50%;
      background: rgba(201, 25, 25, 0.16);
      box-shadow:
        0 0 0 3px rgba(255, 255, 255, 0.92),
        0 0 18px 8px rgba(201, 25, 25, 0.72);
      pointer-events: none;
      animation: incoming-hit-pulse 850ms ease-in-out infinite;
    }

    .hero.incoming-hit.acted .piece-image,
    .hero.incoming-hit.acted .piece-fallback {
      opacity: 0.48;
      filter: grayscale(1);
    }

    .hero.rally-source::before,
    .hero.rally-eligible::before,
    .hero.rally-reactivated::before {
      content: "";
      position: absolute;
      inset: -12%;
      z-index: -1;
      border: 3px solid var(--green);
      border-radius: 50%;
      box-shadow: 0 0 14px 5px rgba(21, 122, 54, 0.42);
      pointer-events: none;
      animation: rally-pulse 1050ms ease-in-out infinite;
    }

    .hero.incoming-hit.rally-source::before,
    .hero.incoming-hit.rally-eligible::before,
    .hero.incoming-hit.rally-reactivated::before {
      border-color: var(--red);
      background: rgba(201, 25, 25, 0.16);
      box-shadow:
        0 0 0 3px rgba(255, 255, 255, 0.92),
        0 0 18px 8px rgba(201, 25, 25, 0.72);
      animation: incoming-hit-pulse 850ms ease-in-out infinite;
    }

    @keyframes incoming-hit-pulse {
      0%,
      100% {
        transform: scale(0.96);
        opacity: 0.58;
      }

      50% {
        transform: scale(1.08);
        opacity: 1;
      }
    }

    @keyframes rally-pulse {
      0%,
      100% {
        transform: scale(0.98);
        opacity: 0.55;
      }

      50% {
        transform: scale(1.05);
        opacity: 0.95;
      }
    }

    .enemy {
      outline: 3px solid var(--red);
      outline-offset: 0;
      border-radius: 12%;
      background: var(--white);
    }

    .enemy.commanded {
      box-shadow: 0 0 0 4px var(--black);
    }

    .spawn-ghost {
      width: 62%;
      aspect-ratio: 1;
      position: relative;
      z-index: 4;
      opacity: 0.45;
      border: 2px dashed var(--red);
      border-radius: 12%;
      background: var(--white);
      padding: 3%;
    }

    .spawn-ghost img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      border-radius: 50%;
    }

    .health-pips {
      position: absolute;
      left: 50%;
      bottom: -10%;
      transform: translateX(-50%);
      display: flex;
      gap: 3px;
      z-index: 8;
      padding: 2px 3px;
      background: rgba(255, 255, 255, 0.95);
      border-radius: 8px;
      pointer-events: none;
    }

    .health-pip {
      width: clamp(5px, 1.25vw, 8px);
      aspect-ratio: 1;
      border: 1px solid var(--black);
      border-radius: 50%;
      background: var(--white);
    }

    .health-pip.filled {
      background: var(--black);
    }

    .health-pip.last {
      background: var(--red);
      border-color: var(--red);
    }

    .order-mark,
    .intent-mark,
    .cooldown-mark,
    .status-mark,
    .incoming-hit-mark,
    .rally-mark {
      position: absolute;
      z-index: 9;
      pointer-events: none;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--white);
      line-height: 1;
      font-weight: 700;
    }

    .order-mark {
      left: -12%;
      top: -12%;
      width: 21px;
      height: 21px;
      border: 1.5px solid var(--black);
      border-radius: 50%;
      font-size: 10px;
    }

    .intent-mark {
      right: -12%;
      top: -12%;
      width: 21px;
      height: 21px;
      border: 1.5px solid var(--red);
      color: var(--red);
      border-radius: 50%;
      font-size: 11px;
    }

    .cooldown-mark {
      right: -10%;
      bottom: -12%;
      min-width: 21px;
      height: 21px;
      padding: 0 4px;
      border: 1.5px solid var(--black);
      border-radius: 50%;
      font-size: 10px;
    }

    .status-mark {
      left: -10%;
      bottom: -12%;
      width: 20px;
      height: 20px;
      border: 1.5px solid var(--green);
      color: var(--green);
      border-radius: 50%;
      font-size: 11px;
    }

    .incoming-hit-mark {
      right: -18%;
      top: -18%;
      min-width: 30px;
      height: 20px;
      padding: 0 4px;
      border: 1.5px solid var(--red);
      border-radius: 10px;
      background: var(--red);
      color: var(--white);
      font-size: 9px;
      letter-spacing: 0.04em;
    }

    .rally-mark {
      left: -16%;
      top: -16%;
      width: 22px;
      height: 22px;
      border: 1.5px solid var(--green);
      border-radius: 50%;
      color: var(--green);
      font-size: 13px;
    }

    .piece-info-button {
      position: absolute;
      left: 50%;
      top: -21%;
      z-index: 14;
      width: 22px;
      height: 22px;
      transform: translateX(-50%);
      display: flex;
      align-items: center;
      justify-content: center;
      border: 1.5px solid var(--black);
      border-radius: 50%;
      padding: 0;
      background: var(--white);
      color: var(--black);
      box-shadow: 0 1px 0 rgba(0, 0, 0, 0.18);
      font-size: 12px;
      font-weight: 700;
      line-height: 1;
      cursor: pointer;
      touch-action: manipulation;
    }

    .piece-info-button:hover,
    .piece-info-button:focus-visible {
      background: var(--black);
      color: var(--white);
      outline: 2px solid var(--white);
      outline-offset: 1px;
    }

    .unit-line {
      min-height: 38px;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 12px;
      line-height: 1.3;
      text-align: center;
      color: var(--muted);
      letter-spacing: 0.05em;
      padding: 4px 6px 0;
    }

    .controls {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 6px;
      margin-top: 7px;
    }

    .control {
      min-height: 45px;
      border: 1.5px solid var(--black);
      background: var(--white);
      cursor: pointer;
      border-radius: 0;
      font-weight: 700;
      letter-spacing: 0.02em;
      font-size: 12px;
    }

    .control.active {
      border-color: var(--green);
      color: var(--green);
      box-shadow: inset 0 -4px 0 var(--green);
    }

    .control:disabled {
      color: #aaaaaa;
      border-color: #cecece;
      cursor: default;
      box-shadow: none;
    }

    .control.primary {
      grid-column: 1 / -1;
      background: var(--black);
      color: var(--white);
    }

    .control.special-ready {
      border-color: var(--green);
      color: var(--green);
    }

    .board.flash {
      animation: flash 150ms ease-in-out;
    }

    @keyframes flash {
      0% {
        filter: invert(0);
      }

      50% {
        filter: invert(0.92);
      }

      100% {
        filter: invert(0);
      }
    }

    .overlay {
      position: fixed;
      inset: 0;
      z-index: 30;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 18px;
      background: rgba(255, 255, 255, 0.97);
    }

    .overlay.show {
      display: flex;
    }

    .overlay-inner {
      width: min(94vw, 720px);
    }

    .overlay-title {
      text-align: center;
      margin: 0 0 18px;
      font-size: clamp(18px, 4vw, 30px);
      letter-spacing: 0.12em;
      font-weight: 700;
    }

    .cards {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 10px;
    }

    .card {
      min-height: 190px;
      border: 2px solid var(--black);
      background: var(--white);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 16px 12px;
      cursor: pointer;
    }

    .card-symbol {
      font-size: 31px;
      margin-bottom: 14px;
      line-height: 1;
    }

    .card-name {
      font-size: 14px;
      font-weight: 700;
      letter-spacing: 0.08em;
      margin-bottom: 11px;
    }

    .card-text {
      font-size: 12px;
      line-height: 1.45;
      color: #555555;
    }

    .loading-panel,
    .gameover {
      width: min(92vw, 600px);
      text-align: center;
      background: var(--white);
    }

    .loading-title {
      margin: 0 0 20px;
      letter-spacing: 0.18em;
      font-size: clamp(22px, 5vw, 38px);
    }

    .loading-icons {
      display: grid;
      grid-template-columns: repeat(7, minmax(0, 1fr));
      gap: 8px;
      margin: 0 auto 18px;
      max-width: 560px;
    }

    .loading-icon {
      aspect-ratio: 1;
      width: 100%;
      object-fit: contain;
      border: 1px solid var(--black);
      border-radius: 50%;
      opacity: 0.28;
      transition: opacity 120ms ease;
    }

    .loading-icon.loaded {
      opacity: 1;
    }

    .loading-icon.failed {
      opacity: 0.1;
    }

    .loading-track {
      height: 8px;
      border: 1.5px solid var(--black);
      max-width: 440px;
      margin: 0 auto 16px;
      background: var(--white);
    }

    .loading-fill {
      width: 0;
      height: 100%;
      background: var(--black);
      transition: width 120ms linear;
    }

    .begin-button,
    .restart {
      min-width: 180px;
      min-height: 48px;
      border: 2px solid var(--black);
      background: var(--black);
      color: var(--white);
      font-weight: 700;
      cursor: pointer;
    }

    .begin-button:disabled {
      background: var(--white);
      color: #aaaaaa;
      border-color: #cccccc;
    }

    .gameover {
      border: 2px solid var(--black);
      padding: 30px 20px;
    }

    .gameover-number {
      font-size: clamp(42px, 14vw, 88px);
      font-weight: 700;
      line-height: 1;
      margin-bottom: 10px;
    }

    .gameover-label {
      font-size: 12px;
      color: var(--muted);
      margin-bottom: 26px;
      letter-spacing: 0.12em;
    }

    .piece-info-overlay {
      z-index: 50;
      background: rgba(255, 255, 255, 0.92);
      backdrop-filter: blur(3px);
    }

    .piece-info-dialog {
      position: relative;
      width: min(90vw, 680px);
      max-height: min(86vh, 760px);
      max-height: min(86dvh, 760px);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      border: 2px solid var(--black);
      background: var(--white);
      box-shadow: 12px 12px 0 rgba(17, 17, 17, 0.14);
    }

    .piece-info-close {
      position: absolute;
      right: 12px;
      top: 12px;
      z-index: 3;
      min-width: 82px;
      min-height: 38px;
      border: 1.5px solid var(--black);
      background: var(--black);
      color: var(--white);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.08em;
      cursor: pointer;
    }

    .piece-info-scroll {
      overflow-y: auto;
      overscroll-behavior: contain;
      scrollbar-gutter: stable;
      padding: 22px 24px 28px;
      -webkit-overflow-scrolling: touch;
    }

    .piece-info-header {
      min-height: 124px;
      display: grid;
      grid-template-columns: 118px minmax(0, 1fr);
      gap: 18px;
      align-items: start;
      padding-right: 92px;
      margin-bottom: 20px;
    }

    .piece-info-portrait {
      width: 118px;
      aspect-ratio: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 2px solid var(--black);
      background: var(--white);
      padding: 8px;
    }

    .piece-info-portrait.enemy-portrait {
      border-color: var(--red);
      box-shadow: inset 0 0 0 3px var(--red-soft);
    }

    .piece-info-portrait.hero-portrait {
      border-color: var(--green);
      box-shadow: inset 0 0 0 3px var(--green-soft);
    }

    .piece-info-portrait .piece-image,
    .piece-info-portrait .piece-fallback {
      width: 100%;
      height: 100%;
    }

    .piece-info-kicker {
      margin: 3px 0 6px;
      color: var(--muted);
      font-size: 10px;
      letter-spacing: 0.14em;
    }

    .piece-info-title {
      margin: 0 0 8px;
      font-size: clamp(22px, 5vw, 34px);
      line-height: 1;
      letter-spacing: 0.08em;
    }

    .piece-info-subtitle {
      margin: 0;
      color: #4f4f4f;
      font-size: 12px;
      line-height: 1.45;
    }

    .piece-info-section {
      padding: 15px 0;
      border-top: 1.5px solid var(--black);
    }

    .piece-info-section:first-child {
      border-top-width: 2px;
    }

    .piece-info-section-title {
      margin: 0 0 11px;
      font-size: 11px;
      letter-spacing: 0.12em;
    }

    .piece-info-list {
      display: grid;
      gap: 9px;
      margin: 0;
      padding: 0;
      list-style: none;
    }

    .piece-info-list li {
      position: relative;
      padding-left: 17px;
      color: #373737;
      font-size: 12px;
      line-height: 1.5;
    }

    .piece-info-list li::before {
      content: "•";
      position: absolute;
      left: 0;
      color: var(--black);
      font-weight: 700;
    }

    .piece-info-empty {
      margin: 0;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.5;
    }

    .piece-info-callout {
      padding: 12px 14px;
      border-left: 4px solid var(--red);
      background: var(--red-soft);
      color: #5f1111;
      font-size: 12px;
      line-height: 1.5;
    }

    .piece-info-callout.safe {
      border-left-color: var(--green);
      background: var(--green-soft);
      color: #124d24;
    }

    @media (max-width: 520px) {
      body {
        padding-left: 4px;
        padding-right: 4px;
      }

      .game {
        width: min(99vw, 680px);
      }

      .controls {
        gap: 4px;
      }

      .control {
        min-height: 43px;
        font-size: 10px;
      }

      .cards {
        grid-template-columns: 1fr;
      }

      .card {
        min-height: 116px;
      }

      .loading-icons {
        grid-template-columns: repeat(5, minmax(0, 1fr));
        max-width: 390px;
      }

      .unit {
        width: 70%;
      }

      .unit-line {
        min-height: 43px;
        font-size: 10px;
      }

      .piece-info-button {
        top: -24%;
        width: 21px;
        height: 21px;
        font-size: 11px;
      }

      .piece-info-overlay {
        padding:
          max(7px, env(safe-area-inset-top))
          max(7px, env(safe-area-inset-right))
          max(7px, env(safe-area-inset-bottom))
          max(7px, env(safe-area-inset-left));
      }

      .piece-info-dialog {
        width: 100%;
        max-height: 94vh;
        max-height: 94dvh;
        box-shadow: none;
      }

      .piece-info-close {
        right: 8px;
        top: 8px;
        min-width: 68px;
        min-height: 34px;

  <script>

    const ASSET_FILES = [
      ...Object.values(HERO_DATA).map((item) => item.image),
      ...Object.values(ENEMY_DATA).map((item) => item.image)
    ];

    const boardEl = document.getElementById("board");
    const intentLayer = document.getElementById("intentLayer");
    const roundLabel = document.getElementById("roundLabel");
    const squadStatus = document.getElementById("squadStatus");
    const enemyCount = document.getElementById("enemyCount");

    const attackButton = document.getElementById("attackButton");

    const loadingIcons = document.getElementById("loadingIcons");
    const loadingFill = document.getElementById("loadingFill");
    const beginButton = document.getElementById("beginButton");

    const upgradeOverlay = document.getElementById("upgradeOverlay");
    const upgradeCards = document.getElementById("upgradeCards");

    const finalRound = document.getElementById("finalRound");
    const restartButton = document.getElementById("restartButton");

    const pieceInfoOverlay =

    const pieceInfoDialog =

    const pieceInfoScroll =

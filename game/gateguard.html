    const pieceInfoPortrait =
      document.getElementById("pieceInfoPortrait");

    const pieceInfoKicker =
      document.getElementById("pieceInfoKicker");

    const pieceInfoTitle =
      document.getElementById("pieceInfoTitle");

    const pieceInfoSubtitle =
      document.getElementById("pieceInfoSubtitle");

    const pieceInfoBody =
      document.getElementById("pieceInfoBody");

    const assetStatus = new Map();

    const hoverCapable = window.matchMedia(
      "(hover: hover) and (pointer: fine)"
    ).matches;

    let cells = [];
    let nextId = 1;
    let seed = (Date.now() ^ 0x9e3779b9) >>> 0;
    let selectedHeroId = null;
    let actionMode = "move";
    let previewTarget = null;
    let previewLocked = false;
    let pendingBanner = null;
    let pieceInfoReturnFocus = null;
    let game = null;

    function random() {
      seed ^= seed << 13;
      seed ^= seed >>> 17;
      seed ^= seed << 5;

      return (seed >>> 0) / 4294967296;
    }

    function randomInt(max) {
      return Math.floor(random() * max);
    }

    function shuffle(items) {
      const copy = items.slice();

      for (let index = copy.length - 1; index > 0; index -= 1) {
        const replacement = randomInt(index + 1);

        [copy[index], copy[replacement]] = [
          copy[replacement],
          copy[index]
        ];
      }

      return copy;
    }

    function key(row, column) {
      return `${row},${column}`;
    }

    function inside(row, column) {
      return (
        row >= 0 &&
        row < SIZE &&
        column >= 0 &&
        column < SIZE
      );
    }

    function manhattan(first, second) {
      return (
        Math.abs(first.r - second.r) +
        Math.abs(first.c - second.c)
      );
    }

    function sameCell(first, second) {
      return first.r === second.r && first.c === second.c;
    }

    function createBoard() {
      for (const oldCell of boardEl.querySelectorAll(".cell")) {
        oldCell.remove();
      }

      cells = [];

      for (let row = 0; row < SIZE; row += 1) {
        for (let column = 0; column < SIZE; column += 1) {
          const cell = document.createElement("div");

          cell.className = "cell";
          cell.tabIndex = 0;
          cell.dataset.r = String(row);
          cell.dataset.c = String(column);
          cell.setAttribute("role", "gridcell");
          cell.setAttribute(
            "aria-label",
            `Row ${row + 1}, column ${column + 1}`
          );

          cell.addEventListener("click", onCellClick);
          cell.addEventListener("pointerenter", onCellEnter);
          cell.addEventListener("pointerleave", onCellLeave);
          cell.addEventListener(
            "keydown",
            (event) => {
              if (
                event.target === cell &&
                (
                  event.key === "Enter" ||
                  event.key === " "
                )
              ) {
                event.preventDefault();
                cell.click();
              }
            }
          );

          boardEl.insertBefore(cell, intentLayer);
          cells.push(cell);
        }
      }
    }

    function loadAssets() {
      loadingIcons.innerHTML = "";

      let completed = 0;

      const jobs = ASSET_FILES.map(
        (file) =>
          new Promise((resolve) => {
            const icon = document.createElement("img");

            icon.className = "loading-icon";
            icon.alt = "";
            icon.src = ASSET_ROOT + file;

            loadingIcons.appendChild(icon);

            const finish = (success) => {
              assetStatus.set(file, success);

              icon.classList.add(
                success ? "loaded" : "failed"
              );

              completed += 1;

              loadingFill.style.width =
                `${(completed / ASSET_FILES.length) * 100}%`;

              resolve();
            };

            icon.addEventListener(
              "load",
              () => finish(true),
              { once: true }
            );

            icon.addEventListener(
              "error",
              () => finish(false),
              { once: true }
            );
          })
      );

      Promise.all(jobs).then(() => {
        beginButton.disabled = false;
      });
    }

    function makeHero(type, row, column) {
      return {
        id: nextId++,
        type,
        r: row,
        c: column,
        alive: true,
        maxHp: 2,
        hp: 2,
        acted: false,
        guard: 0,
        cooldown: 0,
        armor: 0,
        rallied: false,
        rallyReactivated: false
      };
    }

    function makeEnemy(type, row, column) {
      const data = ENEMY_DATA[type];

      return {
        id: nextId++,
        type,
        r: row,
        c: column,
        hp: data.hp,
        maxHp: data.hp,
        alive: true,
        stunned: 0,
        shieldBroken: false,
        bombArmed: false,
        bombTarget: null,
        commanded: false,
        plan: {
          kind: "wait"
        }
      };
    }

    function emptyUpgrades() {
      return {
        bladePower: 0,
        shieldDiagonal: false,
        spearReach: 3,
        spearFlexible: false,
        bowDiagonal: false,
        bowPierce: false,
        bannerRange: 2,
        counter: false,
        cooldownReduction: 0,
        reserve: false,
        brace: false,
        finisher: false
      };
    }

    function newGame() {
      nextId = 1;
      selectedHeroId = null;
      actionMode = "move";
      previewTarget = null;
      previewLocked = false;
      pendingBanner = null;
      seed = (Date.now() ^ 0x9e3779b9) >>> 0;
      closePieceInfo(false);

      game = {
        round: 1,
        completedRounds: 0,
        phase: "player",

        heroes: [
          makeHero("blade", 3, 2),
          makeHero("shield", 3, 3),
          makeHero("spear", 2, 3),
          makeHero("bow", 4, 3),
          makeHero("banner", 3, 4)
        ],

        enemies: [
          makeEnemy("grunt", 0, 3),
          makeEnemy("grunt", 6, 3),
          makeEnemy("grunt", 3, 0)
        ],

        incoming: [],
        upgrades: emptyUpgrades(),
        upgradeRanks: {},
        reserveUsed: false,
        safeLines: 0,
        over: false
      };

      upgradeOverlay.classList.remove("show");
      gameOverOverlay.classList.remove("show");

      beginRound();
    }

    function aliveHeroes(state = game) {
      return state.heroes.filter((hero) => hero.alive);
    }

    function aliveEnemies(state = game) {
      return state.enemies.filter((enemy) => enemy.alive);
    }

    function heroAt(state, row, column) {
      return (
        state.heroes.find(
          (hero) =>
            hero.alive &&
            hero.r === row &&
            hero.c === column
        ) || null
      );
    }

    function enemyAt(state, row, column) {
      return (
        state.enemies.find(
          (enemy) =>
            enemy.alive &&
            enemy.r === row &&
            enemy.c === column
        ) || null
      );
    }

    function occupied(
      state,
      row,
      column,
      ignoredId = null
    ) {
      return Boolean(
        state.heroes.some(
          (hero) =>
            hero.alive &&
            hero.id !== ignoredId &&
            hero.r === row &&
            hero.c === column
        ) ||
        state.enemies.some(
          (enemy) =>
            enemy.alive &&
            enemy.id !== ignoredId &&
            enemy.r === row &&
            enemy.c === column
        )
      );
    }

    function selectedHero() {
      return (
        game?.heroes.find(
          (hero) =>
            hero.id === selectedHeroId &&
            hero.alive
        ) || null
      );
    }

    function beginRound() {
      if (game.over) {
        return;
      }

      game.phase = "player";
      game.reserveUsed = false;

      selectedHeroId = null;
      actionMode = "move";
      previewTarget = null;
      previewLocked = false;
      pendingBanner = null;

      for (const hero of game.heroes) {
        if (!hero.alive) {
          continue;
        }

        hero.acted = false;
        hero.guard = 0;
        hero.rallied = false;
        hero.rallyReactivated = false;

        if (hero.cooldown > 0) {
          hero.cooldown -= 1;
        }
      }

      for (const enemy of game.enemies) {
        if (!enemy.alive) {
          continue;
        }

        enemy.shieldBroken = false;
        enemy.commanded = false;
        enemy.plan = createEnemyPlan(game, enemy);
      }

      applyCommanderPlanning();
      assignInitiative();
      ensureFlawlessLine();
      prepareIncoming();
      render();
    }

    function chooseTargetPosition(state, enemy) {
      const candidates = aliveHeroes(state).map(
        (hero) => ({
          r: hero.r,
          c: hero.c,
          weight: hero.hp === 1 ? -0.35 : 0
        })
      );

      candidates.push({
        r: BEACON.r,
        c: BEACON.c,
        weight: 0.75
      });

      candidates.sort(
        (first, second) =>
          manhattan(enemy, first) +
          first.weight -
          (
            manhattan(enemy, second) +
            second.weight
          )
      );

      return candidates[0] || BEACON;
    }

    function lineClear(
      state,
      from,
      to,
      ignoredFirst = null,
      ignoredSecond = null
    ) {
      if (
        from.r !== to.r &&
        from.c !== to.c
      ) {
        return false;
      }

      const rowDirection = Math.sign(to.r - from.r);
      const columnDirection = Math.sign(to.c - from.c);

      let row = from.r + rowDirection;
      let column = from.c + columnDirection;

      while (
        row !== to.r ||
        column !== to.c
      ) {
        const unit =
          heroAt(state, row, column) ||
          enemyAt(state, row, column);

        if (
          unit &&
          unit.id !== ignoredFirst &&
          unit.id !== ignoredSecond
        ) {
          return false;
        }

        row += rowDirection;
        column += columnDirection;
      }

      return true;
    }

    function nearestAlignedHero(
      state,
      enemy,
      minimumRange,
      maximumRange
    ) {
      return (
        aliveHeroes(state)
          .filter((hero) => {
            const aligned =
              hero.r === enemy.r ||
              hero.c === enemy.c;

            const distance = manhattan(hero, enemy);

            return (
              aligned &&
              distance >= minimumRange &&
              distance <= maximumRange &&
              lineClear(
                state,
                enemy,
                hero,
                enemy.id,
                hero.id
              )
            );
          })
          .sort(
            (first, second) =>
              manhattan(first, enemy) -
              manhattan(second, enemy)
          )[0] || null
      );
    }

    function greedyPath(
      state,
      unit,
      target,
      maximumSteps,
      start = null
    ) {
      const path = [];

      let current = start
        ? { ...start }
        : {
            r: unit.r,
            c: unit.c
          };

      for (
        let step = 0;
        step < maximumSteps;
        step += 1
      ) {
        const options = ORTHOGONAL
          .map((delta) => ({
            r: current.r + delta.r,
            c: current.c + delta.c
          }))
          .filter((position) =>
            inside(position.r, position.c)
          )
          .filter(
            (position) =>
              !occupied(
                state,
                position.r,
                position.c,
                unit.id
              )
          )
          .sort(
            (first, second) =>
              manhattan(first, target) -
              manhattan(second, target)
          );

        if (
          !options.length ||
          manhattan(options[0], target) >=
            manhattan(current, target)
        ) {
          break;
        }

        current = options[0];
        path.push({ ...current });
      }

      return path;
    }

    function createEnemyPlan(state, enemy) {
      if (enemy.stunned > 0) {
        enemy.stunned -= 1;

        return {
          kind: "wait",
          stunned: true
        };
      }

      if (enemy.type === "commander") {
        const targetIds = aliveEnemies(state)
          .filter(
            (unit) =>
              unit.id !== enemy.id &&
              manhattan(unit, enemy) <= 2
          )
          .map((unit) => unit.id);

        if (targetIds.length) {
          return {
            kind: "command",
            targetIds
          };
        }
      }

      if (enemy.type === "bomber") {
        if (
          enemy.bombArmed &&
          enemy.bombTarget
        ) {
          return {
            kind: "explode",
            center: {
              ...enemy.bombTarget
            }
          };
        }

        const target = chooseTargetPosition(
          state,
          enemy
        );

        return {
          kind: "mark",
          center: {
            r: target.r,
            c: target.c
          }
        };
      }

      if (enemy.type === "archer") {
        const target = nearestAlignedHero(
          state,
          enemy,
          2,
          6
        );

        if (target) {
          return {
            kind: "shoot",
            target: {
              r: target.r,
              c: target.c
            }
          };
        }
      }

      if (enemy.type === "hook") {
        const target = nearestAlignedHero(
          state,
          enemy,
          2,
          5
        );

        if (target) {
          return {
            kind: "pull",
            target: {
              r: target.r,
              c: target.c
            }
          };
        }
      }

      const adjacent = aliveHeroes(state)
        .filter(
          (hero) =>
            manhattan(hero, enemy) === 1
        )
        .sort(
          (first, second) =>
            first.hp - second.hp
        )[0];

      if (adjacent) {
        if (enemy.type === "brute") {
          return {
            kind: "attackPush",
            target: {
              r: adjacent.r,
              c: adjacent.c
            }
          };
        }

        return {
          kind: "attack",
          target: {
            r: adjacent.r,
            c: adjacent.c
          }
        };
      }

      const target = chooseTargetPosition(
        state,
        enemy
      );

      const steps =
        enemy.type === "raider" ? 2 : 1;

      const path = greedyPath(
        state,
        enemy,
        target,
        steps
      );

      return path.length
        ? {
            kind:
              enemy.type === "raider"
                ? "charge"
                : "move",
            path
          }
        : {
            kind: "wait"
          };
    }

    function applyCommanderPlanning() {
      const commanders = aliveEnemies().filter(
        (enemy) =>
          enemy.type === "commander" &&
          enemy.plan.kind === "command"
      );

      for (const commander of commanders) {
        for (
          const targetId of
          commander.plan.targetIds || []
        ) {
          const target = game.enemies.find(
            (enemy) =>
              enemy.id === targetId &&
              enemy.alive
          );

          if (!target) {
            continue;
          }

          target.commanded = true;
          target.plan.commanded = true;

          if (
            ["move", "charge"].includes(
              target.plan.kind
            )
          ) {
            const currentEnd =
              target.plan.path?.length
                ? target.plan.path[
                    target.plan.path.length - 1
                  ]
                : target;

            const goal = chooseTargetPosition(
              game,
              {
                ...target,
                ...currentEnd
              }
            );

            const extra = greedyPath(
              game,
              target,
              goal,
              1,
              currentEnd
            )[0];

            if (
              extra &&
              !target.plan.path.some(
                (position) =>
                  sameCell(position, extra)
              )
            ) {
              target.plan.path.push(extra);
            }
          }
        }
      }
    }

    function assignInitiative() {
      const ordered = aliveEnemies()
        .slice()
        .sort((first, second) => {
          const firstInitiative =
            ENEMY_DATA[first.type].initiative -
            (first.commanded ? 0.5 : 0);

          const secondInitiative =
            ENEMY_DATA[second.type].initiative -
            (second.commanded ? 0.5 : 0);

          return (
            firstInitiative -
              secondInitiative ||
            first.id -
              second.id
          );
        });

      ordered.forEach((enemy, index) => {
        enemy.order = index + 1;
      });
    }

    function getMoveTargets(state, hero) {
      return ORTHOGONAL
        .map((delta) => ({
          r: hero.r + delta.r,
          c: hero.c + delta.c
        }))
        .filter(
          (position) =>
            inside(position.r, position.c) &&
            !occupied(
              state,
              position.r,
              position.c,
              hero.id
            )
        );
    }

    function firstUnitInDirection(
      state,
      origin,
      delta,
      maximumRange
    ) {
      for (
        let distance = 1;
        distance <= maximumRange;
        distance += 1
      ) {
        const row =
          origin.r +
          delta.r * distance;

        const column =
          origin.c +
          delta.c * distance;

        if (!inside(row, column)) {
          break;
        }

        const enemy = enemyAt(
          state,
          row,
          column
        );

        if (enemy) {
          return {
            enemy,
            distance,
            delta
          };
        }

        if (heroAt(state, row, column)) {
          break;
        }
      }

      return null;
    }

    function getAttackTargets(state, hero) {
      if (!hero.alive) {
        return [];
      }

      if (
        ["blade", "shield", "banner"].includes(
          hero.type
        )
      ) {
        return ORTHOGONAL
          .map((delta) =>
            enemyAt(
              state,
              hero.r + delta.r,
              hero.c + delta.c
            )
          )
          .filter(Boolean)
          .map((enemy) => ({
            r: enemy.r,
            c: enemy.c,
            enemyId: enemy.id
          }));
      }

      if (hero.type === "spear") {
        const ranges =
          state.upgrades.spearFlexible
            ? [1, 2]
            : [2];

        const targets = [];

        for (const delta of ORTHOGONAL) {
          for (const distance of ranges) {
            const row =
              hero.r +
              delta.r * distance;

            const column =
              hero.c +
              delta.c * distance;

            if (!inside(row, column)) {
              continue;
            }

            let blocked = false;

            for (
              let step = 1;
              step < distance;
              step += 1
            ) {
              if (
                occupied(
                  state,
                  hero.r + delta.r * step,
                  hero.c + delta.c * step,
                  hero.id
                )
              ) {
                blocked = true;
              }
            }

            const enemy = blocked
              ? null
              : enemyAt(
                  state,
                  row,
                  column
                );

            if (enemy) {
              targets.push({
                r: row,
                c: column,
                enemyId: enemy.id
              });
            }
          }
        }

        return targets;
      }

      if (hero.type === "bow") {
        return ORTHOGONAL
          .map((delta) =>
            firstUnitInDirection(
              state,
              hero,
              delta,
              4
            )
          )
          .filter(Boolean)
          .map((result) => ({
            r: result.enemy.r,
            c: result.enemy.c,
            enemyId: result.enemy.id,
            delta: result.delta
          }));
      }

      return [];
    }

    function getGuardTargets(hero) {
      return [
        {
          r: hero.r,
          c: hero.c,
          heroId: hero.id
        }
      ];
    }

    function getSpecialTargets(hero) {
      if (hero.type === "blade") {
        return ORTHOGONAL
          .map((delta) => ({
            r: hero.r + delta.r,
            c: hero.c + delta.c
          }))
          .filter(
            (position) =>
              inside(
                position.r,
                position.c
              ) &&
              !heroAt(
                game,
                position.r,
                position.c
              )
          );
      }

      if (hero.type === "shield") {
        return [
          {
            r: hero.r,
            c: hero.c
          },

          ...ORTHOGONAL.map((delta) => ({
            r: hero.r + delta.r,
            c: hero.c + delta.c
          }))
        ].filter(
          (position) =>
            inside(
              position.r,
              position.c
            ) &&
            !enemyAt(
              game,
              position.r,
              position.c
            )
        );
      }

      if (hero.type === "spear") {
        const targets = [];

        for (const delta of ORTHOGONAL) {
          for (
            let distance = 1;
            distance <=
              game.upgrades.spearReach;
            distance += 1
          ) {
            const row =
              hero.r +
              delta.r * distance;

            const column =
              hero.c +
              delta.c * distance;

            if (!inside(row, column)) {
              break;
            }

            const ally = heroAt(
              game,
              row,
              column
            );

            if (
              ally &&
              ally.id !== hero.id
            ) {
              break;
            }

            targets.push({
              r: row,
              c: column,
              delta,
              distance
            });

            if (
              enemyAt(
                game,
                row,
                column
              )
            ) {
              break;
            }
          }
        }

        return targets;
      }

      if (hero.type === "bow") {
        const targets = [];

        for (
          let row = 0;
          row < SIZE;
          row += 1
        ) {
          for (
            let column = 0;
            column < SIZE;
            column += 1
          ) {
            if (
              manhattan(
                hero,
                {
                  r: row,
                  c: column
                }
              ) <= 4
            ) {
              targets.push({
                r: row,
                c: column
              });
            }
          }
        }

        return targets;
      }

      if (hero.type === "banner") {
        const targets = [];

        for (
          let row = 0;
          row < SIZE;
          row += 1
        ) {
          for (
            let column = 0;
            column < SIZE;
            column += 1
          ) {
            if (
              manhattan(
                hero,
                {
                  r: row,
                  c: column
                }
              ) <= game.upgrades.bannerRange &&
              !enemyAt(
                game,
                row,
                column
              )
            ) {
              targets.push({
                r: row,
                c: column
              });
            }
          }
        }

        return targets;
      }

      return [];
    }

    function getBannerPickTargets() {
      if (!pendingBanner) {
        return [];
      }

      return pendingBanner.eligibleIds
        .map((id) =>
          game.heroes.find(
            (hero) =>
              hero.id === id &&
              hero.alive
          )
        )
        .filter(Boolean)
        .map((hero) => ({
          r: hero.r,
          c: hero.c,
          heroId: hero.id
        }));
    }

    function getActionTargets(
      hero,
      mode = actionMode
    ) {
      if (!hero || hero.acted) {
        return [];
      }

      if (mode === "move") {
        return getMoveTargets(game, hero);
      }

      if (mode === "attack") {
        return getAttackTargets(game, hero);
      }

      if (mode === "guard") {
        return getGuardTargets(hero);
      }

      if (mode === "special") {
        return hero.cooldown === 0
          ? getSpecialTargets(hero)
          : [];
      }

      if (mode === "bannerPick") {
        return getBannerPickTargets();
      }

      return [];
    }

    function bladeSweepArea(hero, target) {
      const rowDifference =
        target.r - hero.r;

      const columnDifference =
        target.c - hero.c;

      const sideFirst =
        rowDifference !== 0
          ? {
              r: target.r,
              c: target.c - 1
            }
          : {
              r: target.r - 1,
              c: target.c
            };

      const sideSecond =
        rowDifference !== 0
          ? {
              r: target.r,
              c: target.c + 1
            }
          : {
              r: target.r + 1,
              c: target.c
            };

      return [
        target,
        sideFirst,
        sideSecond
      ].filter((position) =>
        inside(position.r, position.c)
      );
    }

    function plusArea(
      center,
      includeDiagonal = false
    ) {
      const offsets = [
        {
          r: 0,
          c: 0
        },

        ...ORTHOGONAL,

        ...(includeDiagonal
          ? DIAGONAL
          : [])
      ];

      return offsets
        .map((delta) => ({
          r: center.r + delta.r,
          c: center.c + delta.c
        }))
        .filter((position) =>
          inside(position.r, position.c)
        );
    }

    function lineArea(hero, target) {
      const rowDirection =
        Math.sign(target.r - hero.r);

      const columnDirection =
        Math.sign(target.c - hero.c);

      const distance =
        manhattan(hero, target);

      const area = [];

      for (
        let step = 1;
        step <= distance;
        step += 1
      ) {
        area.push({
          r: hero.r +
            rowDirection * step,

          c: hero.c +
            columnDirection * step
        });
      }

      return area;
    }

    function getPreviewArea(
      hero,
      mode,
      target
    ) {
      if (!hero || !target) {
        return {
          friendly: [],
          hostile: []
        };
      }

      if (
        mode === "move" ||
        mode === "guard" ||
        mode === "bannerPick"
      ) {
        return {
          friendly: [target],
          hostile: []
        };
      }

      if (mode === "attack") {
        return {
          friendly: [],
          hostile: [target]
        };
      }

      if (mode !== "special") {
        return {
          friendly: [],
          hostile: []
        };
      }

      if (hero.type === "blade") {
        return {
          friendly: [],
          hostile: bladeSweepArea(
            hero,
            target
          )
        };
      }

      if (hero.type === "shield") {
        return {
          friendly: plusArea(
            target,
            game.upgrades.shieldDiagonal
          ),

          hostile: []
        };
      }

      if (hero.type === "spear") {
        return {
          friendly: [],
          hostile: lineArea(
            hero,
            target
          )
        };
      }

      if (hero.type === "bow") {
        return {
          friendly: [],
          hostile: plusArea(
            target,
            game.upgrades.bowDiagonal
          )
        };
      }

      if (hero.type === "banner") {
        return {
          friendly: plusArea(
            target,
            false
          ),

          hostile: []
        };
      }

      return {
        friendly: [],
        hostile: []
      };
    }

    function adjacentGuardian(
      state,
      target
    ) {
      return (
        state.enemies.find(
          (enemy) =>
            enemy.alive &&
            enemy.type === "guardian" &&
            enemy.id !== target.id &&
            manhattan(enemy, target) === 1
        ) || null
      );
    }

    function damageEnemy(
      state,
      enemyId,
      amount,
      sourceHero = null
    ) {
      const enemy = state.enemies.find(
        (unit) =>
          unit.id === enemyId &&
          unit.alive
      );

      if (!enemy) {
        return {
          hit: false,
          killed: false,
          blocked: false
        };
      }

      const guardian = adjacentGuardian(
        state,
        enemy
      );

      if (
        guardian &&
        !enemy.shieldBroken
      ) {
        enemy.shieldBroken = true;

        return {
          hit: false,
          killed: false,
          blocked: true
        };
      }

      let finalAmount = amount;

      if (
        sourceHero &&
        state.upgrades.finisher &&
        enemy.hp < enemy.maxHp
      ) {
        finalAmount += 1;
      }

      enemy.hp -= finalAmount;

      if (enemy.hp <= 0) {
        enemy.alive = false;

        return {
          hit: true,
          killed: true,
          blocked: false
        };
      }

      return {
        hit: true,
        killed: false,
        blocked: false
      };
    }

    function applyBasicAttack(
      state,
      hero,
      enemyId
    ) {
      const target = state.enemies.find(
        (enemy) =>
          enemy.id === enemyId &&
          enemy.alive
      );

      if (!target) {
        return;
      }

      const direction = {
        r: Math.sign(target.r - hero.r),
        c: Math.sign(target.c - hero.c)
      };

      damageEnemy(
        state,
        enemyId,
        1,
        hero
      );

      if (
        hero.type === "bow" &&
        state.upgrades.bowPierce
      ) {
        let passedTarget = false;

        for (
          let distance = 1;
          distance <= 6;
          distance += 1
        ) {
          const row =
            hero.r +
            direction.r * distance;

          const column =
            hero.c +
            direction.c * distance;

          if (!inside(row, column)) {
            break;
          }

          const enemy = enemyAt(
            state,
            row,
            column
          );

          if (enemy) {
            if (
              !passedTarget &&
              enemy.id === enemyId
            ) {
              passedTarget = true;
              continue;
            }

            if (passedTarget) {
              damageEnemy(
                state,
                enemy.id,
                1,
                hero
              );

              break;
            }
          }

          const blockingHero = heroAt(
            state,
            row,
            column
          );

          if (
            blockingHero &&
            !(
              row === hero.r &&
              column === hero.c
            )
          ) {
            break;
          }
        }
      }
    }

    function finishAction(hero) {
      hero.acted = true;
      hero.rallyReactivated = false;

      selectedHeroId = null;
      actionMode = "move";
      previewTarget = null;
      previewLocked = false;
      pendingBanner = null;

      render();
    }

    function finishSpecial(hero) {
      const base =
        HERO_DATA[hero.type].cooldown;

      hero.cooldown = Math.max(
        1,
        base -
          game.upgrades.cooldownReduction
      );

      finishAction(hero);
    }

    function executeAction(
      hero,
      mode,
      target
    ) {
      if (!hero || hero.acted) {
        return;
      }

      if (mode === "move") {
        hero.r = target.r;
        hero.c = target.c;

        finishAction(hero);
        return;
      }

      if (mode === "attack") {
        const enemy = enemyAt(
          game,
          target.r,
          target.c
        );

        if (enemy) {
          applyBasicAttack(
            game,
            hero,
            enemy.id
          );
        }

        finishAction(hero);
        return;
      }

      if (mode === "guard") {
        hero.guard = Math.max(
          hero.guard,
          1
        );

        finishAction(hero);
        return;
      }

      if (mode === "bannerPick") {
        const ally = game.heroes.find(
          (unit) =>
            unit.id === target.heroId &&
            unit.alive
        );

        if (ally) {
          ally.acted = false;
          ally.rallyReactivated = true;
        }

        const banner = game.heroes.find(
          (unit) =>
            unit.id ===
              pendingBanner?.bannerId &&
            unit.alive
        );

        if (banner) {
          finishSpecial(banner);
        }

        return;
      }

      if (mode !== "special") {
        return;
      }

      const area = getPreviewArea(
        hero,
        mode,
        target
      );

      if (hero.type === "blade") {
        for (const position of area.hostile) {
          const enemy = enemyAt(
            game,
            position.r,
            position.c
          );

          if (enemy) {
            damageEnemy(
              game,
              enemy.id,
              1 +
                game.upgrades.bladePower,
              hero
            );
          }
        }

        finishSpecial(hero);
        return;
      }

      if (hero.type === "shield") {
        for (const position of area.friendly) {
          const ally = heroAt(
            game,
            position.r,
            position.c
          );

          if (ally) {
            ally.guard = Math.max(
              ally.guard,
              1
            );
          }
        }

        finishSpecial(hero);
        return;
      }

      if (hero.type === "spear") {
        for (const position of area.hostile) {
          const enemy = enemyAt(
            game,
            position.r,
            position.c
          );

          if (enemy) {
            damageEnemy(
              game,
              enemy.id,
              1,
              hero
            );

            if (enemy.alive) {
              enemy.stunned = Math.max(
                enemy.stunned,
                1
              );
            }
          }
        }

        finishSpecial(hero);
        return;
      }

      if (hero.type === "bow") {
        for (const position of area.hostile) {
          const enemy = enemyAt(
            game,
            position.r,
            position.c
          );

          if (enemy) {
            damageEnemy(
              game,
              enemy.id,
              1,
              hero
            );
          }
        }

        finishSpecial(hero);
        return;
      }

      if (hero.type === "banner") {
        const allies = [];

        for (const position of area.friendly) {
          const ally = heroAt(
            game,
            position.r,
            position.c
          );

          if (ally) {
            ally.guard = Math.max(
              ally.guard,
              1
            );

            ally.rallied = true;
            allies.push(ally);
          }
        }

        const eligible = allies.filter(
          (ally) =>
            ally.id !== hero.id &&
            ally.acted
        );

        if (!eligible.length) {
          finishSpecial(hero);
          return;
        }

        pendingBanner = {
          bannerId: hero.id,

          center: {
            r: target.r,
            c: target.c
          },

          eligibleIds: eligible.map(
            (ally) => ally.id
          )
        };

        actionMode = "bannerPick";
        previewTarget = null;
        previewLocked = false;

        render();
      }
    }

    function clonePlan(plan) {
      if (!plan) {
        return {
          kind: "wait"
        };
      }

      return {
        ...plan,

        target: plan.target
          ? { ...plan.target }
          : undefined,

        center: plan.center
          ? { ...plan.center }
          : undefined,

        path: plan.path
          ? plan.path.map(
              (position) => ({
                ...position
              })
            )
          : undefined,

        targetIds: plan.targetIds
          ? plan.targetIds.slice()
          : undefined
      };
    }

    function cloneState(source) {
      return {
        heroes: source.heroes.map(
          (hero) => ({
            ...hero
          })
        ),

        enemies: source.enemies.map(
          (enemy) => ({
            ...enemy,

            bombTarget:
              enemy.bombTarget
                ? {
                    ...enemy.bombTarget
                  }
                : null,

            plan: clonePlan(enemy.plan)
          })
        ),

        upgrades: {
          ...source.upgrades
        },

        reserveUsed:
          source.reserveUsed,

        damageEvents: 0
      };
    }

    function generateSolverActions(
      state,
      hero
    ) {
      const actions = [
        {
          kind: "wait"
        },

        {
          kind: "guard"
        }
      ];

      for (
        const target of
        getMoveTargets(state, hero)
      ) {
        actions.push({
          kind: "move",
          r: target.r,
          c: target.c
        });
      }

      for (
        const target of
        getAttackTargets(state, hero)
      ) {
        actions.push({
          kind: "attack",
          enemyId: target.enemyId
        });
      }

      return actions;
    }

    function applySolverAction(
      state,
      heroId,
      action
    ) {
      const hero = state.heroes.find(
        (unit) =>
          unit.id === heroId &&
          unit.alive
      );

      if (!hero) {
        return;
      }

      if (action.kind === "guard") {
        hero.guard = 1;
      }

      if (action.kind === "move") {
        hero.r = action.r;
        hero.c = action.c;
      }

      if (action.kind === "attack") {
        applyBasicAttack(
          state,
          hero,
          action.enemyId
        );
      }
    }

    function countFlawlessLines(limit = 10) {
      const initial = cloneState(game);

      const heroOrder = initial.heroes
        .filter((hero) => hero.alive)
        .map((hero) => hero.id);

      let count = 0;

      function search(state, index) {
        if (count >= limit) {
          return;
        }

        if (index >= heroOrder.length) {
          const result = cloneState(state);

          simulateEnemyPhase(result);

          const beaconTaken =
            result.enemies.some(
              (enemy) =>
                enemy.alive &&
                enemy.r === BEACON.r &&
                enemy.c === BEACON.c
            );

          if (
            result.damageEvents === 0 &&
            !beaconTaken &&
            result.heroes.some(
              (hero) => hero.alive
            )
          ) {
            count += 1;
          }

          return;
        }

        const hero = state.heroes.find(
          (unit) =>
            unit.id === heroOrder[index] &&
            unit.alive
        );

        if (!hero) {
          search(state, index + 1);
          return;
        }

        for (
          const action of
          generateSolverActions(state, hero)
        ) {
          if (count >= limit) {
            break;
          }

          const next = cloneState(state);

          applySolverAction(
            next,
            hero.id,
            action
          );

          search(
            next,
            index + 1
          );
        }
      }

      search(initial, 0);

      return count;
    }

    function planPressure(plan) {
      const values = {
        explode: 11,
        shoot: 10,
        attackPush: 9,
        charge: 8,
        attack: 7,
        pull: 6,
        move: 3,
        command: 2,
        mark: 1,
        wait: 0
      };

      return values[plan.kind] || 0;
    }

    function ensureFlawlessLine() {
      let safe = countFlawlessLines(10);

      if (safe > 0) {
        game.safeLines = safe;
        return;
      }

      const candidates = aliveEnemies()
        .filter(
          (enemy) =>
            enemy.plan.kind !== "wait"
        )
        .sort(
          (first, second) =>
            planPressure(second.plan) -
              planPressure(first.plan) ||
            (second.order || 0) -
              (first.order || 0)
        );

      for (const enemy of candidates) {
        enemy.plan = {
          kind: "wait",
          forced: true
        };

        safe = countFlawlessLines(10);

        if (safe > 0) {
          break;
        }
      }

      game.safeLines = Math.max(
        1,
        safe
      );
    }

    function damageHero(
      state,
      heroId,
      attackerId = null,
      melee = false
    ) {
      const hero = state.heroes.find(
        (unit) =>
          unit.id === heroId &&
          unit.alive
      );

      if (!hero) {
        return {
          blocked: false,
          killed: false
        };
      }

      if (hero.guard > 0) {
        hero.guard -= 1;

        if (hero.guard === 0) {
          hero.rallied = false;
        }

        if (
          state.upgrades.counter &&
          melee &&
          attackerId
        ) {
          const attacker =
            state.enemies.find(
              (enemy) =>
                enemy.id === attackerId &&
                enemy.alive
            );

          if (
            attacker &&
            manhattan(attacker, hero) === 1
          ) {
            damageEnemy(
              state,
              attacker.id,
              1,
              null
            );
          }
        }

        return {
          blocked: true,
          killed: false
        };
      }

      if (hero.armor > 0) {
        hero.armor -= 1;

        return {
          blocked: true,
          killed: false
        };
      }

      if (
        state.upgrades.reserve &&
        !state.reserveUsed
      ) {
        state.reserveUsed = true;

        return {
          blocked: true,
          killed: false
        };
      }

      hero.hp -= 1;

      state.damageEvents =
        (state.damageEvents || 0) + 1;

      if (hero.hp <= 0) {
        hero.alive = false;

        return {
          blocked: false,
          killed: true
        };
      }

      return {
        blocked: false,
        killed: false
      };
    }

    function pushHero(
      state,
      hero,
      enemy
    ) {
      if (state.upgrades.brace) {
        return;
      }

      const rowDirection =
        Math.sign(hero.r - enemy.r);

      const columnDirection =
        Math.sign(hero.c - enemy.c);

      const row =
        hero.r + rowDirection;

      const column =
        hero.c + columnDirection;

      if (
        inside(row, column) &&
        !occupied(
          state,
          row,
          column,
          hero.id
        )
      ) {
        hero.r = row;
        hero.c = column;
      }
    }

    function executePlan(
      state,
      enemy,
      plan
    ) {
      if (
        !enemy.alive ||
        plan.kind === "wait"
      ) {
        return;
      }

      if (plan.kind === "command") {
        return;
      }

      if (
        plan.kind === "move" ||
        plan.kind === "charge"
      ) {
        for (
          const step of plan.path || []
        ) {
          if (!enemy.alive) {
            break;
          }

          const hero = heroAt(
            state,
            step.r,
            step.c
          );

          if (hero) {
            damageHero(
              state,
              hero.id,
              enemy.id,
              true
            );

            break;
          }

          const blocker = enemyAt(
            state,
            step.r,
            step.c
          );

          if (
            blocker &&
            blocker.id !== enemy.id
          ) {
            break;
          }

          enemy.r = step.r;
          enemy.c = step.c;
        }

        return;
      }

      if (
        [
          "attack",
          "shoot",
          "attackPush"
        ].includes(plan.kind)
      ) {
        const hero = heroAt(
          state,
          plan.target.r,
          plan.target.c
        );

        if (!hero) {
          return;
        }

        const result = damageHero(
          state,
          hero.id,
          enemy.id,
          plan.kind !== "shoot"
        );

        if (
          plan.kind === "attackPush" &&
          !result.blocked &&
          hero.alive
        ) {
          pushHero(
            state,
            hero,
            enemy
          );
        }

        return;
      }

      if (plan.kind === "pull") {
        const hero = heroAt(
          state,
          plan.target.r,
          plan.target.c
        );

        if (!hero) {
          return;
        }

        const row =
          hero.r +
          Math.sign(enemy.r - hero.r);

        const column =
          hero.c +
          Math.sign(enemy.c - hero.c);

        if (
          inside(row, column) &&
          !occupied(
            state,
            row,
            column,
            hero.id
          )
        ) {
          hero.r = row;
          hero.c = column;
        }

        return;
      }

      if (plan.kind === "mark") {
        enemy.bombArmed = true;

        enemy.bombTarget = {
          ...plan.center
        };

        return;
      }

      if (plan.kind === "explode") {
        const heroIds = state.heroes
          .filter(
            (hero) =>
              hero.alive &&
              Math.abs(
                hero.r -
                plan.center.r
              ) <= 1 &&
              Math.abs(
                hero.c -
                plan.center.c
              ) <= 1
          )
          .map((hero) => hero.id);

        const enemyIds = state.enemies
          .filter(
            (unit) =>
              unit.alive &&
              Math.abs(
                unit.r -
                plan.center.r
              ) <= 1 &&
              Math.abs(
                unit.c -
                plan.center.c
              ) <= 1
          )
          .map((unit) => unit.id);

        for (const heroId of heroIds) {
          damageHero(
            state,
            heroId,
            enemy.id,
            false
          );
        }

        for (const enemyId of enemyIds) {
          damageEnemy(
            state,
            enemyId,
            2,
            null
          );
        }

        enemy.alive = false;
      }
    }

    function simulateEnemyPhase(state) {
      const ordered = state.enemies
        .filter((enemy) => enemy.alive)
        .slice()
        .sort(
          (first, second) =>
            (first.order || 999) -
            (second.order || 999)
        );

      for (const planned of ordered) {
        const enemy = state.enemies.find(
          (unit) =>
            unit.id === planned.id &&
            unit.alive
        );

        if (enemy) {
          executePlan(
            state,
            enemy,
            enemy.plan
          );
        }
      }
    }

    function availableEnemyTypes(round) {
      const types = ["grunt"];

      if (round >= 4) {
        types.push("raider");
      }

      if (round >= 7) {
        types.push("archer");
      }

      if (round >= 10) {
        types.push("brute");
      }

      if (round >= 13) {
        types.push("hook");
      }

      if (round >= 16) {
        types.push("guardian");
      }

      if (round >= 20) {
        types.push("bomber");
      }

      if (round >= 24) {
        types.push("commander");
      }

      return types;
    }

    function edgeCells() {
      const result = [];

      for (
        let index = 0;
        index < SIZE;
        index += 1
      ) {
        result.push(
          {
            r: 0,
            c: index
          },
          {
            r: SIZE - 1,
            c: index
          }
        );
      }

      for (
        let index = 1;
        index < SIZE - 1;
        index += 1
      ) {
        result.push(
          {
            r: index,
            c: 0
          },
          {
            r: index,
            c: SIZE - 1
          }
        );
      }

      return result;
    }

    function prepareIncoming() {
      const liveCount =
        aliveEnemies().length;

      const cap = Math.min(
        19,
        7 +
          Math.floor(game.round / 2)
      );

      let count = 1;

      if (game.round >= 4) {
        count = 2;
      }

      if (game.round >= 10) {
        count = 3;
      }

      if (game.round >= 22) {
        count = 4;
      }

      count = Math.max(
        0,
        Math.min(
          count,
          cap - liveCount
        )
      );

      const freeEdges = shuffle(
        edgeCells().filter(
          (position) =>
            !occupied(
              game,
              position.r,
              position.c
            )
        )
      );

      const types =
        availableEnemyTypes(game.round);

      const incoming = [];

      for (
        let index = 0;
        index < count &&
        index < freeEdges.length;
        index += 1
      ) {
        let type =
          types[randomInt(types.length)];

        if (
          ["bomber", "commander"].includes(
            type
          ) &&
          incoming.some(
            (item) => item.type === type
          )
        ) {
          type = "grunt";
        }

        incoming.push({
          ...freeEdges[index],
          type
        });
      }

      game.incoming = incoming;
    }

    function spawnIncoming() {
      for (const spawn of game.incoming) {
        if (
          !occupied(
            game,
            spawn.r,
            spawn.c
          )
        ) {
          game.enemies.push(
            makeEnemy(
              spawn.type,
              spawn.r,
              spawn.c
            )
          );
        }
      }

      game.incoming = [];
    }

    function planCellSets() {
      const danger = new Set();
      const route = new Set();
      const marked = new Set();
      const explode = new Set();
      const forced = new Set();

      for (const enemy of aliveEnemies()) {
        const plan =
          enemy.plan || {
            kind: "wait"
          };

        if (
          [
            "attack",
            "shoot",
            "attackPush",
            "pull"
          ].includes(plan.kind) &&
          plan.target
        ) {
          danger.add(
            key(
              plan.target.r,
              plan.target.c
            )
          );
        }

        if (
          ["move", "charge"].includes(
            plan.kind
          )
        ) {
          for (
            const position of
            plan.path || []
          ) {
            route.add(
              key(
                position.r,
                position.c
              )
            );
          }
        }

        if (
          ["mark", "explode"].includes(
            plan.kind
          ) &&
          plan.center
        ) {
          for (
            const position of
            plusArea(
              plan.center,
              true
            )
          ) {
            if (plan.kind === "mark") {
              marked.add(
                key(
                  position.r,
                  position.c
                )
              );
            } else {
              explode.add(
                key(
                  position.r,
                  position.c
                )
              );
            }
          }
        }

        if (
          plan.kind === "pull" &&
          plan.target
        ) {
          const row =
            plan.target.r +
            Math.sign(
              enemy.r -
              plan.target.r
            );

          const column =
            plan.target.c +
            Math.sign(
              enemy.c -
              plan.target.c
            );

          if (inside(row, column)) {
            forced.add(
              key(row, column)
            );
          }
        }

        if (
          plan.kind === "attackPush" &&
          plan.target
        ) {
          const row =
            plan.target.r +
            Math.sign(
              plan.target.r -
              enemy.r
            );

          const column =
            plan.target.c +
            Math.sign(
              plan.target.c -
              enemy.c
            );

          if (inside(row, column)) {
            forced.add(
              key(row, column)
            );
          }
        }
      }

      return {
        danger,
        route,
        marked,
        explode,
        forced
      };
    }

    function heroesHitThisEnemyTurn() {
      const threatened = new Set();

      if (game.phase !== "player") {
        return threatened;
      }

      for (const enemy of aliveEnemies()) {
        const plan =
          enemy.plan || {
            kind: "wait"
          };

        if (
          [
            "attack",
            "shoot",
            "attackPush"
          ].includes(plan.kind) &&
          plan.target
        ) {
          const target = heroAt(
            game,
            plan.target.r,
            plan.target.c
          );

          if (target) {
            threatened.add(target.id);
          }
        }

        if (
          ["move", "charge"].includes(
            plan.kind
          )
        ) {
          for (
            const position of
            plan.path || []
          ) {
            const target = heroAt(
              game,
              position.r,
              position.c
            );

            if (target) {
              threatened.add(target.id);
              break;
            }
          }
        }

        if (
          plan.kind === "explode" &&
          plan.center
        ) {
          for (const hero of aliveHeroes()) {
            if (
              Math.abs(
                hero.r - plan.center.r
              ) <= 1 &&
              Math.abs(
                hero.c - plan.center.c
              ) <= 1
            ) {
              threatened.add(hero.id);
            }
          }
        }
      }

      return threatened;
    }

    function intentSymbol(enemy) {
      const plan =
        enemy.plan || {
          kind: "wait"
        };

      if (plan.kind === "wait") {
        return plan.stunned
          ? "×"
          : "·";
      }

      if (plan.kind === "attack") {
        return "!";
      }

      if (plan.kind === "attackPush") {
        return "»";
      }

      if (plan.kind === "shoot") {
        return "→";
      }

      if (plan.kind === "pull") {
        return "↶";
      }

      if (plan.kind === "mark") {
        return "○";
      }

      if (plan.kind === "explode") {
        return "×";
      }

      if (plan.kind === "command") {
        return "+";
      }

      if (plan.kind === "charge") {
        return "»";
      }

      if (plan.kind === "move") {
        return "›";
      }

      return "·";
    }

    function render() {
      if (!game) {
        return;
      }

      const hero = selectedHero();

      const targets =
        getActionTargets(hero);

      const targetKeys = new Set(
        targets.map(
          (target) =>
            key(
              target.r,
              target.c
            )
        )
      );

      const preview = previewTarget
        ? getPreviewArea(
            hero,
            actionMode,
            previewTarget
          )
        : {
            friendly: [],
            hostile: []
          };

      const friendlyKeys = new Set(
        preview.friendly.map(
          (position) =>
            key(
              position.r,
              position.c
            )
        )
      );

      const hostileKeys = new Set(
        preview.hostile.map(
          (position) =>
            key(
              position.r,
              position.c
            )
        )
      );

      const planSets =
        planCellSets();

      const threatenedHeroes =
        heroesHitThisEnemyTurn();

      for (const cell of cells) {
        const row =
          Number(cell.dataset.r);

        const column =
          Number(cell.dataset.c);

        const cellKey =
          key(row, column);

        cell.className = "cell";
        cell.innerHTML = "";

        if (
          planSets.route.has(cellKey)
        ) {
          cell.classList.add(
            "enemy-route"
          );
        }

        if (
          planSets.danger.has(cellKey)
        ) {
          cell.classList.add(
            "enemy-danger"
          );
        }

        if (
          planSets.marked.has(cellKey)
        ) {
          cell.classList.add(
            "enemy-marked"
          );
        }

        if (
          planSets.explode.has(cellKey)
        ) {
          cell.classList.add(
            "enemy-explode"
          );
        }

        if (
          planSets.forced.has(cellKey)
        ) {
          cell.classList.add(
            "forced-destination"
          );
        }

        if (
          targetKeys.has(cellKey)
        ) {
          cell.classList.add("legal");

          if (actionMode === "move") {
            cell.classList.add(
              "move-target"
            );
          }
        }

        if (
          friendlyKeys.has(cellKey)
        ) {
          cell.classList.add(
            "preview-friendly"
          );
        }

        if (
          hostileKeys.has(cellKey)
        ) {
          cell.classList.add(
            "preview-hostile"
          );
        }

        if (
          row === BEACON.r &&
          column === BEACON.c
        ) {
          const beacon =
            document.createElement("div");

          beacon.className = "beacon";
          cell.appendChild(beacon);
        }

        const currentHero = heroAt(
          game,
          row,
          column
        );

        const enemy = enemyAt(
          game,
          row,
          column
        );

        const spawn =
          game.incoming.find(
            (item) =>
              item.r === row &&
              item.c === column
          );

        if (currentHero) {
          cell.appendChild(
            renderHero(
              currentHero,
              threatenedHeroes.has(
                currentHero.id
              )
            )
          );
        } else if (enemy) {
          cell.appendChild(
            renderEnemy(enemy)
          );
        } else if (spawn) {
          cell.appendChild(
            renderSpawn(spawn)
          );
        }
      }

      drawIntentLayer();

      roundLabel.textContent =
        String(game.round).padStart(
          2,
          "0"
        );

      enemyCount.textContent =
        String(
          aliveEnemies().length
        ).padStart(2, "0");

      renderSquad();
      renderControls();
    }

    function makePieceVisual(
      file,
      fallbackLetter,
      alternativeText
    ) {
      if (
        assetStatus.get(file) !== false
      ) {
        const image =
          document.createElement("img");

        image.className =
          "piece-image";

        image.src =
          ASSET_ROOT + file;

        image.alt =
          alternativeText;

        image.draggable = false;

        image.addEventListener(
          "error",
          () => {
            assetStatus.set(
              file,
              false
            );

            image.replaceWith(
              makeFallback(
                fallbackLetter
              )
            );
          },
          {
            once: true
          }
        );

        return image;
      }

      return makeFallback(
        fallbackLetter
      );
    }

    function makeFallback(letter) {
      const fallback =
        document.createElement("span");

      fallback.className =
        "piece-fallback";

      fallback.textContent = letter;

      return fallback;
    }

    function renderHealthPips(
      current,
      maximum
    ) {
      const wrap =
        document.createElement("span");

      wrap.className =
        "health-pips";

      for (
        let index = 1;
        index <= maximum;
        index += 1
      ) {
        const pip =
          document.createElement("span");

        pip.className =
          "health-pip";

        if (index <= current) {
          pip.classList.add("filled");
        }

        if (
          current === 1 &&
          index === 1
        ) {
          pip.classList.add("last");
        }

        wrap.appendChild(pip);
      }

      return wrap;
    }

    function formatPosition(unit) {
      return (
        `ROW ${unit.r + 1} · COLUMN ${unit.c + 1}`
      );
    }

    function heroNameAt(position) {
      if (!position) {
        return "its target";
      }

      const hero = heroAt(
        game,
        position.r,
        position.c
      );

      return hero
        ? HERO_DATA[hero.type].name
        : `row ${position.r + 1}, column ${position.c + 1}`;
    }

    function describeEnemyPlan(enemy) {
      const plan =
        enemy.plan || {
          kind: "wait"
        };

      if (plan.kind === "wait") {
        return plan.stunned
          ? "THIS TURN · Stunned. It will take no action."
          : "THIS TURN · Waiting. It has no effective action.";
      }

      if (plan.kind === "attack") {
        return (
          `THIS TURN · Attacks ${heroNameAt(plan.target)} for 1 damage.`
        );
      }

      if (plan.kind === "attackPush") {
        return (
          `THIS TURN · Attacks ${heroNameAt(plan.target)} for 1 damage, then pushes it if the hit is not blocked.`
        );
      }

      if (plan.kind === "shoot") {
        return (
          `THIS TURN · Shoots ${heroNameAt(plan.target)} for 1 damage along the red dashed line.`
        );
      }

      if (plan.kind === "pull") {
        return (
          `THIS TURN · Pulls ${heroNameAt(plan.target)} one space closer. This does not deal damage.`
        );
      }

      if (
        plan.kind === "move" ||
        plan.kind === "charge"
      ) {
        const routeLength =
          plan.path?.length || 0;

        return (
          `THIS TURN · ${plan.kind === "charge" ? "Charges" : "Moves"} ${routeLength} space${routeLength === 1 ? "" : "s"} along the black route. A hero entering that route will be hit.`
        );
      }

      if (plan.kind === "mark") {
        return (
          `THIS TURN · Marks a 3×3 blast area centered on row ${plan.center.r + 1}, column ${plan.center.c + 1}. It will detonate on the Bomber's next turn if the Bomber survives.`
        );
      }

      if (plan.kind === "explode") {
        return (
          `THIS TURN · Detonates the marked 3×3 area centered on row ${plan.center.r + 1}, column ${plan.center.c + 1}.`
        );
      }

      if (plan.kind === "command") {
        const count =
          plan.targetIds?.length || 0;

        return (
          `THIS TURN · Commands ${count} nearby enem${count === 1 ? "y" : "ies"}, extending planned movement where possible.`
        );
      }

      return "THIS TURN · Intent unknown.";
    }

    function upgradeDescription(
      upgrade,
      rank
    ) {
      if (upgrade.id === "bladePower") {
        return (
          `HEAVY EDGE${rank > 1 ? ` ×${rank}` : ""} · Sweep deals ${rank} additional damage.`
        );
      }

      if (upgrade.id === "cooldown") {
        return (
          `BATTLE RHYTHM${rank > 1 ? ` ×${rank}` : ""} · This piece's special cooldown is ${rank} round${rank === 1 ? "" : "s"} shorter.`
        );
      }

      if (upgrade.id === "reserve") {
        return (
          `LAST STAND · The first unguarded squad hit each round is blocked. It is ${game.reserveUsed ? "already spent" : "still available"} this round.`
        );
      }

      return (
        `${upgrade.name}${rank > 1 ? ` ×${rank}` : ""} · ${upgrade.text}`
      );
    }

    function heroPowerups(hero) {
      const specific = {
        blade: ["bladePower"],
        shield: ["shieldDiagonal"],
        spear: [
          "spearReach",
          "spearFlexible"
        ],
        bow: [
          "bowDiagonal",
          "bowPierce"
        ],
        banner: ["bannerRange"]
      };

      const common = [
        "counter",
        "cooldown",
        "reserve",
        "brace",
        "finisher"
      ];

      const ids = [
        ...(specific[hero.type] || []),
        ...common
      ];

      const descriptions = ids
        .map((id) => {
          const rank =
            game.upgradeRanks[id] || 0;

          if (rank <= 0) {
            return null;
          }

          const upgrade =
            UPGRADE_POOL.find(
              (item) => item.id === id
            );

          return upgrade
            ? upgradeDescription(
                upgrade,
                rank
              )
            : null;
        })
        .filter(Boolean);

      if (hero.armor > 0) {
        descriptions.push(
          `LIGHT PLATE · ${hero.armor} Armor remaining. Each Armor blocks one future hit.`
        );
      }

      if (hero.rallied && hero.guard > 0) {
        descriptions.push(
          "RALLY GUARD · Rally supplied the Guard currently protecting this piece."
        );
      }

      if (hero.rallyReactivated) {
        descriptions.push(
          "RALLY REACTIVATION · Rally returned this piece's action for the current turn."
        );
      }

      return descriptions;
    }

    function addPieceInfoSection(
      title,
      lines,
      emptyMessage = ""
    ) {
      const section =
        document.createElement("section");

      section.className =
        "piece-info-section";

      const heading =
        document.createElement("h3");

      heading.className =
        "piece-info-section-title";

      heading.textContent = title;
      section.appendChild(heading);

      if (lines.length) {
        const list =
          document.createElement("ul");

        list.className =
          "piece-info-list";

        for (const line of lines) {
          const item =
            document.createElement("li");

          item.textContent = line;
          list.appendChild(item);
        }

        section.appendChild(list);
      } else {
        const empty =
          document.createElement("p");

        empty.className =
          "piece-info-empty";

        empty.textContent =
          emptyMessage ||
          "Nothing currently applies.";

        section.appendChild(empty);
      }

      pieceInfoBody.appendChild(section);
    }

    function addPieceInfoCallout(
      text,
      safe = false
    ) {
      const callout =
        document.createElement("div");

      callout.className =
        "piece-info-callout";

      if (safe) {
        callout.classList.add("safe");
      }

      callout.textContent = text;
      pieceInfoBody.appendChild(callout);
    }

    function closePieceInfo(
      restoreFocus = true
    ) {
      if (
        !pieceInfoOverlay.classList.contains(
          "show"
        )
      ) {
        return;
      }

      pieceInfoOverlay.classList.remove(
        "show"
      );

      if (
        restoreFocus &&
        pieceInfoReturnFocus?.isConnected
      ) {
        pieceInfoReturnFocus.focus();
      }

      pieceInfoReturnFocus = null;
    }

    function openPieceInfo(
      kind,
      unit,
      trigger
    ) {
      pieceInfoReturnFocus = trigger;
      pieceInfoPortrait.innerHTML = "";
      pieceInfoBody.innerHTML = "";
      pieceInfoScroll.scrollTop = 0;

      const isHero =
        kind === "hero";

      const type = unit.type;

      const data = isHero
        ? HERO_DATA[type]
        : ENEMY_DATA[type];

      const reference = isHero
        ? HERO_REFERENCE[type]
        : ENEMY_REFERENCE[type];

      pieceInfoPortrait.className =
        `piece-info-portrait ${isHero ? "hero-portrait" : "enemy-portrait"}`;

      pieceInfoPortrait.appendChild(
        makePieceVisual(
          data.image,
          data.letter,
          `${isHero ? "Hero" : "Enemy"} ${type}`
        )
      );

      pieceInfoKicker.textContent =
        kind === "spawn"
          ? "INCOMING ENEMY"
          : isHero
            ? "SQUAD PIECE"
            : "ENEMY PIECE";

      pieceInfoTitle.textContent =
        isHero
          ? data.name
          : type.toUpperCase();

      pieceInfoSubtitle.textContent =
        reference.role;

      if (isHero) {
        const cooldown =
          unit.cooldown > 0
            ? `${unit.cooldown} round${unit.cooldown === 1 ? "" : "s"} remaining`
            : "ready";

        const threatened =
          heroesHitThisEnemyTurn().has(
            unit.id
          );

        addPieceInfoCallout(
          threatened
            ? "DANGER · An enemy plan will hit this piece when the turn ends unless the board state changes."
            : "SAFE FROM CURRENT HITS · No current enemy damage plan lands on this piece.",
          !threatened
        );

        addPieceInfoSection(
          "CURRENT STATUS",
          [
            `HEALTH · ${unit.hp}/${unit.maxHp}`,
            `ACTION · ${unit.acted ? "Already acted" : "Ready to act"}`,
            `SPECIAL · ${data.special} is ${cooldown}`,
            `DEFENSE · ${unit.guard} Guard · ${unit.armor} Armor`,
            `POSITION · ${formatPosition(unit)}`
          ]
        );

        addPieceInfoSection(
          "ABILITIES",
          reference.abilities
        );

        addPieceInfoSection(
          `SPECIAL · ${data.special}`,
          [reference.special]
        );

        addPieceInfoSection(
          "POWERUPS AFFECTING THIS PIECE",
          heroPowerups(unit),
          "No acquired or temporary powerups currently affect this piece."
        );
      } else if (kind === "spawn") {
        addPieceInfoCallout(
          "INCOMING · This piece enters after the enemy phase if its edge space remains open."
        );

        addPieceInfoSection(
          "BASE STATUS",
          [
            `HEALTH · ${data.hp}`,
            `SPAWN SPACE · ${formatPosition(unit)}`
          ]
        );

        addPieceInfoSection(
          "BEHAVIOR",
          [reference.behavior]
        );
      } else {
        const effects = [];

        if (unit.commanded) {
          effects.push(
            "COMMANDED · Its planned movement is extended by 1 space."
          );
        }

        if (unit.stunned > 0) {
          effects.push(
            "STUNNED · It will skip its next planned action."
          );
        }

        if (unit.bombArmed) {
          effects.push(
            "BOMB ARMED · Its marked area is set to detonate."
          );
        }

        if (unit.shieldBroken) {
          effects.push(
            "GUARDIAN BLOCK SPENT · Its protection from an adjacent Guardian has already been used this round."
          );
        }

        addPieceInfoCallout(
          describeEnemyPlan(unit),
          unit.plan?.kind === "wait"
        );

        addPieceInfoSection(
          "CURRENT STATUS",
          [
            `HEALTH · ${unit.hp}/${unit.maxHp}`,
            `ACTION ORDER · ${unit.order || "—"}`,
            `POSITION · ${formatPosition(unit)}`
          ]
        );

        addPieceInfoSection(
          "BEHAVIOR",
          [reference.behavior]
        );

        addPieceInfoSection(
          "CURRENT EFFECTS",
          effects,
          "No additional effects are currently modifying this enemy."
        );
      }

      pieceInfoOverlay.classList.add(
        "show"
      );

      requestAnimationFrame(() => {
        pieceInfoClose.focus();
      });
    }

    function makePieceInfoButton(
      kind,
      unit
    ) {
      const button =
        document.createElement("button");

      const isHero =
        kind === "hero";

      const name = isHero
        ? HERO_DATA[unit.type].name
        : unit.type.toUpperCase();

      button.type = "button";
      button.className =
        "piece-info-button";

      button.textContent = "?";
      button.title =
        `Open ${name} details`;

      button.setAttribute(
        "aria-label",
        `Open ${name} abilities and status`
      );

      button.addEventListener(
        "pointerdown",
        (event) => {
          event.stopPropagation();
        }
      );

      button.addEventListener(
        "click",
        (event) => {
          event.preventDefault();
          event.stopPropagation();

          openPieceInfo(
            kind,
            unit,
            button
          );
        }
      );

      return button;
    }

    function renderHero(
      hero,
      incomingHit = false
    ) {
      const data =
        HERO_DATA[hero.type];

      const unit =
        document.createElement("div");

      unit.className =
        "unit hero";

      if (
        hero.id === selectedHeroId
      ) {
        unit.classList.add("selected");
      }

      if (hero.acted) {
        unit.classList.add("acted");
      }

      if (incomingHit) {
        unit.classList.add(
          "incoming-hit"
        );
      }

      if (
        hero.type === "banner" &&
        hero.id === selectedHeroId &&
        (
          actionMode === "special" ||
          actionMode === "bannerPick"
        )
      ) {
        unit.classList.add(
          "rally-source"
        );
      }

      if (
        actionMode === "bannerPick" &&
        pendingBanner?.eligibleIds.includes(
          hero.id
        )
      ) {
        unit.classList.add(
          "rally-eligible"
        );
      }

      if (hero.rallyReactivated) {
        unit.classList.add(
          "rally-reactivated"
        );
      }

      unit.title = incomingHit
        ? `${data.name} · WILL BE HIT THIS ENEMY TURN`
        : data.name;

      unit.appendChild(
        makePieceVisual(
          data.image,
          data.letter,
          data.name
        )
      );

      unit.appendChild(
        renderHealthPips(
          hero.hp,
          hero.maxHp
        )
      );

      if (incomingHit) {
        const warning =
          document.createElement("span");

        warning.className =
          "incoming-hit-mark";

        warning.textContent = "HIT";
        warning.title =
          "An enemy will hit this unit when the turn ends.";

        unit.appendChild(warning);
      }

      if (hero.cooldown > 0) {
        const cooldown =
          document.createElement("span");

        cooldown.className =
          "cooldown-mark";

        cooldown.textContent =
          String(hero.cooldown);

        unit.appendChild(cooldown);
      }

      if (
        hero.guard > 0 ||
        hero.armor > 0
      ) {
        const status =
          document.createElement("span");

        status.className =
          "status-mark";

        status.textContent =
          hero.guard > 0
            ? "G"
            : "□";

        status.title =
          hero.guard > 0
            ? "GUARD · BLOCKS ONE HIT"
            : "ARMOR · BLOCKS ONE HIT";

        unit.appendChild(status);
      }

      if (hero.rallyReactivated) {
        const rally =
          document.createElement("span");

        rally.className =
          "rally-mark";

        rally.textContent = "↻";
        rally.title =
          "RALLY · THIS ALLY MAY ACT AGAIN";

        unit.appendChild(rally);
      }

      unit.appendChild(
        makePieceInfoButton(
          "hero",
          hero
        )
      );

      return unit;
    }

    function renderSquad() {
      squadStatus.innerHTML = "";

      for (const hero of game.heroes) {
        const dot =
          document.createElement("span");

        dot.className =
          "squad-dot";

        if (!hero.alive) {
          dot.classList.add("lost");

          );

    function renderControls() {
      const hero = selectedHero();

      const canAct = Boolean(
        hero &&
        !hero.acted &&
        game.phase === "player"
      );

      const bannerPick =
        actionMode === "bannerPick";

      moveButton.disabled =
        !canAct || bannerPick;

      attackButton.disabled =
        !canAct || bannerPick;

      guardButton.disabled =
        !canAct || bannerPick;

      specialButton.disabled =
        !canAct ||
        hero.cooldown > 0 ||
        bannerPick;

      endButton.disabled =
        game.phase !== "player" ||
        bannerPick;

      moveButton.classList.toggle(
        "active",
        actionMode === "move"
      );

      attackButton.classList.toggle(
        "active",
        actionMode === "attack"
      );

      guardButton.classList.toggle(
        "active",
        actionMode === "guard"
      );

      specialButton.classList.toggle(
        "active",
        actionMode === "special" ||
        bannerPick
      );

      specialButton.classList.toggle(
        "special-ready",
        canAct &&
        hero.cooldown === 0
      );

      if (!hero) {
        unitLine.textContent =
          game.phase === "player"

            : "";

          "SPECIAL";
        specialButton.title = "";
      } else if (bannerPick) {
        unitLine.textContent =
          "RALLY APPLIED · GREEN + ALLIES GAIN GUARD · CHOOSE 1 GLOWING ALLY TO ACT AGAIN";

        specialButton.textContent =
          "RALLY";
        specialButton.title =
          "Rally gave every ally in the green plus-shaped area Guard. Choose one ally that already acted to act again.";
      } else {
        const data =
          HERO_DATA[hero.type];

        const health =
          `${hero.hp}/${hero.maxHp}`;

        unitLine.textContent =
          hero.type === "banner"
            ? `BANNER · ${health} · RALLY: GREEN + ALLIES GAIN GUARD; ONE ACTED ALLY ACTS AGAIN`
            : `${data.name} · ${health}`;

        specialButton.textContent =
          hero.cooldown > 0
            ? `${data.special} ${hero.cooldown}`
            : data.special;

        specialButton.title =
          hero.type === "banner"
            ? "Rally: choose a plus-shaped area. Allies there gain Guard, then one ally that already acted may act again."
            : data.special;
      }
    }

    function cellCenter(position) {
      return {
        x: position.c * 100 + 50,
        y: position.r * 100 + 50
      };
    }

    function svgLine(
      from,
      to,
      options = {}
    ) {
      const start =
        cellCenter(from);

      const end =
        cellCenter(to);

      const line =
        document.createElementNS(
          "http://www.w3.org/2000/svg",
          "line"
        );

      line.setAttribute(
        "x1",
        start.x
      );

      line.setAttribute(
        "y1",
        start.y
      );

      line.setAttribute(
        "x2",
        end.x
      );

      line.setAttribute(
        "y2",
        end.y
      );

      line.setAttribute(
        "stroke",
        options.color || "#111111"
      );

      line.setAttribute(
        "stroke-width",
        options.width || "4"
      );

      line.setAttribute(
        "stroke-linecap",
        "round"
      );

      line.setAttribute(
        "opacity",
        options.opacity || "0.82"
      );

      if (options.dash) {
        line.setAttribute(
          "stroke-dasharray",
          options.dash
        );
      }

      if (options.marker) {
        line.setAttribute(
          "marker-end",
          `url(#${options.marker})`
        );
      }

      intentLayer.appendChild(line);
    }

    function drawIntentLayer() {
      intentLayer.innerHTML = `
        <defs>
          <marker
            id="arrowBlack"
            markerWidth="8"
            markerHeight="8"
            refX="6"
            refY="4"
            orient="auto"
            markerUnits="strokeWidth"
          >
            <path
              d="M0,0 L8,4 L0,8 Z"
              fill="#111111"
            ></path>
          </marker>

          <marker
            id="arrowRed"
            markerWidth="8"
            markerHeight="8"
            refX="6"
            refY="4"
            orient="auto"
            markerUnits="strokeWidth"
          >
            <path
              d="M0,0 L8,4 L0,8 Z"
              fill="#c91919"
            ></path>
          </marker>
        </defs>
      `;

      for (const enemy of aliveEnemies()) {
        const plan =
          enemy.plan || {
            kind: "wait"
          };

        if (
          ["move", "charge"].includes(
            plan.kind
          ) &&
          plan.path?.length
        ) {
          svgLine(
            enemy,
            plan.path[
              plan.path.length - 1
            ],
            {
              color: "#111111",

              width:
                plan.kind === "charge"
                  ? "6"
                  : "4",

              marker: "arrowBlack",

              dash:
                plan.kind === "charge"
                  ? "12 6"
                  : null
            }
          );
        }

        if (
          [
            "attack",
            "shoot",
            "attackPush"
          ].includes(plan.kind) &&
          plan.target
        ) {
          svgLine(
            enemy,
            plan.target,
            {
              color: "#c91919",

              width:
                plan.kind === "shoot"
                  ? "3"
                  : "5",

              marker: "arrowRed",

              dash:
                plan.kind === "shoot"
                  ? "9 5"
                  : null
            }
          );
        }

        if (
          plan.kind === "pull" &&
          plan.target
        ) {
          svgLine(
            enemy,
            plan.target,
            {
              color: "#c91919",
              width: "4",
              marker: "arrowRed",
              dash: "5 5"
            }
          );
        }

        if (
          plan.kind === "attackPush" &&
          plan.target
        ) {
          const pushTo = {
            r:
              plan.target.r +
              Math.sign(
                plan.target.r -
                enemy.r
              ),

            c:
              plan.target.c +
              Math.sign(
                plan.target.c -
                enemy.c
              )
          };

          if (
            inside(
              pushTo.r,
              pushTo.c
            )
          ) {
            svgLine(
              plan.target,
              pushTo,
              {
                color: "#c91919",
                width: "4",
                marker: "arrowRed"
              }
            );
          }
        }

        if (plan.kind === "command") {
          for (
            const targetId of
            plan.targetIds || []
          ) {
            const target =
              game.enemies.find(
                (unit) =>
                  unit.id === targetId &&
                  unit.alive
              );

            if (target) {
              svgLine(
                enemy,
                target,
                {
                  color: "#111111",
                  width: "3",
                  dash: "6 7",
                  opacity: "0.6"
                }
              );
            }
          }
        }
      }
    }

    function setActionMode(mode) {
      const hero = selectedHero();

      if (
        !hero ||
        hero.acted ||
        game.phase !== "player" ||
        actionMode === "bannerPick"
      ) {
        return;
      }

      if (
        mode === "special" &&
        hero.cooldown > 0
      ) {
        return;
      }

      actionMode = mode;
      previewTarget = null;
      previewLocked = false;

      render();
    }

    function onCellEnter(event) {
      if (
        !hoverCapable ||
        previewLocked ||
        game?.phase !== "player"
      ) {
        return;
      }

      const hero = selectedHero();

      if (!hero) {
        return;
      }

      const target = legalTargetAt(
        Number(
          event.currentTarget.dataset.r
        ),
        Number(
          event.currentTarget.dataset.c
        )
      );

      if (target) {
        previewTarget = target;
        render();
      }
    }

    function onCellLeave() {
      if (
        !hoverCapable ||
        previewLocked ||
        game?.phase !== "player"
      ) {
        return;
      }

      previewTarget = null;
      render();
    }

    function legalTargetAt(row, column) {
      const hero = selectedHero();

      if (!hero) {
        return null;
      }

      return (
        getActionTargets(hero).find(
          (target) =>
            target.r === row &&
            target.c === column
        ) || null
      );
    }

    function onCellClick(event) {
      if (
        !game ||
        game.phase !== "player" ||
        game.over
      ) {
        return;
      }

      const row = Number(
        event.currentTarget.dataset.r
      );

      const column = Number(
        event.currentTarget.dataset.c
      );

      const clickedHero = heroAt(
        game,
        row,
        column
      );

      const current = selectedHero();

      if (
        actionMode !== "bannerPick" &&
        clickedHero &&
        !clickedHero.acted &&
        (
          !current ||
          !legalTargetAt(row, column)
        )
      ) {
        selectedHeroId =
          clickedHero.id;

        actionMode = "move";
        previewTarget = null;
        previewLocked = false;
        pendingBanner = null;

        render();
        return;
      }

      if (
        !current ||
        current.acted
      ) {
        return;
      }

      const target =
        legalTargetAt(row, column);

      if (!target) {
        previewTarget = null;
        previewLocked = false;
        render();
        return;
      }

      const samePreview =
        previewTarget &&
        previewTarget.r === row &&
        previewTarget.c === column;

      if (
        !hoverCapable &&
        !samePreview
      ) {
        previewTarget = target;
        previewLocked = true;
        render();
        return;
      }

      executeAction(
        current,
        actionMode,
        target
      );
    }

    moveButton.addEventListener(
      "click",
      () => setActionMode("move")
    );

    attackButton.addEventListener(
      "click",
      () => setActionMode("attack")
    );

    guardButton.addEventListener(
      "click",
      () => setActionMode("guard")
    );

    specialButton.addEventListener(
      "click",
      () => setActionMode("special")
    );

    endButton.addEventListener(
      "click",
      endPlayerTurn
    );

    async function endPlayerTurn() {
      if (
        game.phase !== "player" ||
        game.over ||
        actionMode === "bannerPick"
      ) {
        return;
      }

      game.phase = "enemy";
      selectedHeroId = null;
      actionMode = "move";
      previewTarget = null;
      previewLocked = false;

      render();

      const ordered = aliveEnemies()
        .slice()
        .sort(
          (first, second) =>
            (first.order || 999) -
            (second.order || 999)
        );

      for (
        const plannedEnemy of ordered
      ) {
        if (game.over) {
          break;
        }

        const enemy =
          game.enemies.find(
            (unit) =>
              unit.id ===
                plannedEnemy.id &&
              unit.alive
          );

        if (!enemy) {
          continue;
        }

        executePlan(
          game,
          enemy,
          enemy.plan
        );

        render();
        flashBoard();

        await delay(115);

        checkGameOver();
      }

      if (game.over) {
        return;
      }

      spawnIncoming();

      game.enemies =
        game.enemies.filter(
          (enemy) => enemy.alive
        );

      checkGameOver();

      if (game.over) {
        return;
      }

      game.completedRounds =
        game.round;

      if (
        game.completedRounds % 5 === 0
      ) {
        showUpgradeChoices();
      } else {
        game.round += 1;
        beginRound();
      }
    }

    function delay(milliseconds) {
      return new Promise(
        (resolve) =>
          setTimeout(
            resolve,
            milliseconds
          )
      );
    }

    function flashBoard() {
      boardEl.classList.remove("flash");

      void boardEl.offsetWidth;

      boardEl.classList.add("flash");
    }

    function checkGameOver() {
      const noHeroes =
        !game.heroes.some(
          (hero) => hero.alive
        );

      const beaconTaken =
        game.enemies.some(
          (enemy) =>
            enemy.alive &&
            enemy.r === BEACON.r &&
            enemy.c === BEACON.c
        );

      if (
        noHeroes ||
        beaconTaken
      ) {
        endGame();
      }
    }

    function endGame() {
      game.over = true;
      game.phase = "over";

      finalRound.textContent =
        String(
          game.completedRounds ||
          Math.max(
            0,
            game.round - 1
          )
        );

      gameOverOverlay.classList.add(
        "show"
      );

      render();
    }

    const UPGRADE_POOL = [
      {
        id: "bladePower",
        max: 2,
        symbol: "B+",
        name: "HEAVY EDGE",
        text:
          "Sweep deals one more damage.",

        apply() {
          game.upgrades.bladePower += 1;
        }
      },

      {
        id: "shieldDiagonal",
        max: 1,
        symbol: "S+",
        name: "WIDE BULWARK",
        text:
          "Bulwark also protects diagonal spaces.",

        apply() {
          game.upgrades.shieldDiagonal =
            true;
        }
      },

      {
        id: "spearReach",
        max: 1,
        symbol: "P+",
        name: "LONG SHAFT",
        text:
          "Impale may target four spaces away.",

        apply() {
          game.upgrades.spearReach = 4;
        }
      },

      {
        id: "spearFlexible",
        max: 1,
        symbol: "P1",
        name: "SHORT GRIP",
        text:
          "Spear basic attacks may strike at range one or two.",

        apply() {
          game.upgrades.spearFlexible =
            true;
        }
      },

      {
        id: "bowDiagonal",
        max: 1,
        symbol: "W+",
        name: "WIDE VOLLEY",
        text:
          "Volley also hits diagonal spaces.",

        apply() {
          game.upgrades.bowDiagonal =
            true;
        }
      },

      {
        id: "bowPierce",
        max: 1,
        symbol: "W2",
        name: "PIERCING SHOT",
        text:
          "Bow basic attacks may hit a second enemy in line.",

        apply() {
          game.upgrades.bowPierce =
            true;
        }
      },

      {
        id: "bannerRange",
        max: 1,
        symbol: "N+",
        name: "LONG STANDARD",
        text:
          "Rally may be placed three spaces away.",

        apply() {
          game.upgrades.bannerRange = 3;
        }
      },

      {
        id: "counter",
        max: 1,
        symbol: "↺",
        name: "COUNTER",
        text:
          "A guarded adjacent attacker takes one damage.",

        apply() {
          game.upgrades.counter = true;
        }
      },

      {
        id: "cooldown",
        max: 2,
        symbol: "★",
        name: "BATTLE RHYTHM",
        text:
          "All special cooldowns become one round shorter.",

        apply() {
          game.upgrades.cooldownReduction +=
            1;
        }
      },

      {
        id: "reserve",
        max: 1,
        symbol: "◇",
        name: "LAST STAND",
        text:
          "The first unguarded hit each round is blocked.",

        apply() {
          game.upgrades.reserve = true;
        }
      },

      {
        id: "brace",
        max: 1,
        symbol: "▣",
        name: "BRACE",
        text:
          "Your warriors can no longer be pushed.",

        apply() {
          game.upgrades.brace = true;
        }
      },

      {
        id: "finisher",
        max: 1,
        symbol: "×2",
        name: "FINISHER",
        text:
          "Attacks deal one extra damage to wounded enemies.",

        apply() {
          game.upgrades.finisher = true;
        }
      },

      {
        id: "medic",
        max: 99,
        symbol: "+",
        name: "FIELD MEDIC",
        text:
          "Heal every surviving warrior to full health.",

        apply() {
          for (
            const hero of
            aliveHeroes()
          ) {
            hero.hp = hero.maxHp;
          }
        }
      },

      {
        id: "armor",
        max: 99,
        symbol: "□",
        name: "LIGHT PLATE",
        text:
          "Every surviving warrior blocks one future hit.",

        apply() {
          for (
            const hero of
            aliveHeroes()
          ) {
            hero.armor += 1;
          }
        }
      },

      {
        id: "focus",
        max: 99,
        symbol: "◎",
        name: "BATTLE FOCUS",
        text:
          "Every surviving warrior's special becomes ready.",

        apply() {
          for (
            const hero of
            aliveHeroes()
          ) {
            hero.cooldown = 0;
          }
        }
      },

      {
        id: "rescue",
        max: 99,
        symbol: "●",
        name: "RESCUE",
        text:
          "Return one lost warrior with one health.",

        available() {
          return game.heroes.some(
            (hero) => !hero.alive
          );
        },

        apply() {
          reviveOneHero();
        }
      }
    ];

    function showUpgradeChoices() {
      game.phase = "upgrade";
      selectedHeroId = null;
      actionMode = "move";
      previewTarget = null;
      pendingBanner = null;

      const options =
        getUpgradeOptions(3);

      upgradeCards.innerHTML = "";

      for (const upgrade of options) {
        const card =
          document.createElement("button");

        card.type = "button";
        card.className = "card";

        const symbol =
          document.createElement("div");

        symbol.className =
          "card-symbol";

        symbol.textContent =
          upgrade.symbol;

        const name =
          document.createElement("div");

        name.className =
          "card-name";

        name.textContent =
          upgrade.name;

        const text =
          document.createElement("div");

        text.className =
          "card-text";

        text.textContent =
          upgrade.text;

        card.append(
          symbol,
          name,
          text
        );

        card.addEventListener(
          "click",
          () =>
            chooseUpgrade(upgrade)
        );

        upgradeCards.appendChild(card);
      }

      upgradeOverlay.classList.add(
        "show"
      );

      render();
    }

    function getUpgradeOptions(count) {
      let available =
        UPGRADE_POOL.filter(
          (upgrade) => {
            const rank =
              game.upgradeRanks[
                upgrade.id
              ] || 0;

            const condition =
              typeof upgrade.available ===
              "function"
                ? upgrade.available()
                : true;

            return (
              condition &&
              rank < upgrade.max
            );
          }
        );

      if (available.length < count) {
        available = available.concat(
          UPGRADE_POOL.filter(
            (upgrade) =>
              [
                "medic",
                "armor",
                "focus"
              ].includes(upgrade.id)
          )
        );
      }

      const choices = [];

      for (
        const upgrade of
        shuffle(available)
      ) {
        if (
          !choices.some(
            (choice) =>
              choice.id === upgrade.id
          )
        ) {
          choices.push(upgrade);
        }

        if (
          choices.length >= count
        ) {
          break;
        }
      }

      return choices;
    }

    function chooseUpgrade(upgrade) {
      game.upgradeRanks[upgrade.id] =
        (
          game.upgradeRanks[
            upgrade.id
          ] || 0
        ) + 1;

      upgrade.apply();

      upgradeOverlay.classList.remove(
        "show"
      );

      game.round += 1;

      beginRound();
    }

    function reviveOneHero() {
      const fallen =
        game.heroes.find(
          (hero) => !hero.alive
        );

      if (!fallen) {
        return;
      }

      const positions = [
        {
          r: 3,
          c: 3
        },

        {
          r: 3,
          c: 2
        },

        {
          r: 3,
          c: 4
        },

        {
          r: 2,
          c: 3
        },

        {
          r: 4,
          c: 3
        },

        ...edgeCells()
      ];

      const open =
        positions.find(
          (position) =>
            inside(
              position.r,
              position.c
            ) &&
            !occupied(
              game,
              position.r,
              position.c
            )
        );

      if (!open) {
        return;
      }

      fallen.alive = true;
      fallen.hp = 1;
      fallen.acted = true;
      fallen.guard = 0;

      fallen.cooldown =
        Math.max(
          2,
          fallen.cooldown
        );

      fallen.r = open.r;
      fallen.c = open.c;
    }

    pieceInfoClose.addEventListener(
      "click",
      () => closePieceInfo()
    );

    pieceInfoOverlay.addEventListener(
      "click",
      (event) => {
        if (
          event.target === pieceInfoOverlay
        ) {
          closePieceInfo();
        }
      }
    );

    pieceInfoDialog.addEventListener(
      "keydown",
      (event) => {
        if (event.key === "Tab") {
          event.preventDefault();
          pieceInfoClose.focus();
        }
      }
    );

    document.addEventListener(
      "keydown",
      (event) => {
        if (
          event.key === "Escape" &&
          pieceInfoOverlay.classList.contains(
            "show"
          )
        ) {
          event.preventDefault();
          closePieceInfo();
        }
      }
    );

    beginButton.addEventListener(
      "click",
      () => {
        loadingOverlay.classList.remove(
          "show"
        );

        newGame();
      }
    );

    restartButton.addEventListener(
      "click",
      newGame
    );

    createBoard();
    loadAssets();
  </script>
</body>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#171717">
  <title>The Last Five</title>
  <style>
    html, body { margin: 0; min-height: 100%; background: #171717; }
    body { display: grid; min-height: 100vh; min-height: 100dvh; }
    #gameFrame { width: 100%; height: 100vh; height: 100dvh; border: 0; background: #fff; }
    #loadState {
      position: fixed; inset: 0; display: grid; place-items: center; padding: 24px;
      background: #f7f4ef; color: #171717; font: 700 13px/1.5 ui-monospace, monospace;
      text-align: center; letter-spacing: .08em;
    }
    #loadState.error { color: #a21f2b; }
  </style>
</head>
<body>
  <iframe id="gameFrame" src="gateguard-core.html" title="The Last Five tactical roguelite"></iframe>
  <div id="loadState">LOADING THE LAST FIVE…</div>
  <script>
    "use strict";
    (() => {
      const frame = document.getElementById("gameFrame");
      const status = document.getElementById("loadState");

      frame.addEventListener("load", () => {
        try {
          const documentInsideGame = frame.contentDocument;
          if (!documentInsideGame?.body) throw new Error("The game frame could not be opened.");
          const expansion = documentInsideGame.createElement("script");
          expansion.src = "gateguard-expansion.js";
          expansion.addEventListener("load", () => status.remove(), { once: true });
          expansion.addEventListener("error", () => {
            status.classList.add("error");
            status.textContent = "THE ROGUELITE EXPANSION COULD NOT LOAD";
          }, { once: true });
          documentInsideGame.body.appendChild(expansion);
        } catch (error) {
          status.classList.add("error");
          status.textContent = `THE GATE COULD NOT OPEN\n${error.message}`;
        }
      }, { once: true });
    })();
  </script>
</body>
</html>

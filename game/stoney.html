<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>🗿 Stoney’s Relic</title><link rel="stylesheet" href="./stoney-relic/style.css"></head>
<body class="player">
<div id="fog"></div>
<div class="hud">
  <div class="statusbar"><span id="connection" class="pill" role="status">Connecting…</span><span id="timer" class="pill">—</span></div>
  <div id="crown-banner" role="status" aria-live="polite">👑 Waiting for the dungeon</div>
  <div id="party" aria-label="Party location and status"></div>
  <div class="radar-label">PARTY RADAR · ♛ CROWN</div><canvas id="radar" width="200" height="230" aria-label="Teammates, crown and exit positions"></canvas>
  <div id="markers" aria-hidden="true"></div><div id="reticle"></div>
  <div class="hud-actions"><button id="fullscreen" aria-label="Toggle fullscreen">⛶ Fullscreen</button><button id="menu">Menu</button></div>
  <div id="notice" role="status" aria-live="polite" hidden></div>
</div>
<div class="controls"><div class="stick" id="move-stick" aria-label="Move joystick"><i></i><span class="stick-label">MOVE / SPRINT</span></div><div class="stick" id="look-stick" aria-label="Look joystick"><i></i><span class="stick-label">LOOK</span></div></div>
<section id="screen"><h1>🗿 Stoney’s Relic</h1><p>Signing in and synchronizing the dungeon…</p><noscript>Enable JavaScript to play this multiplayer game.</noscript></section>
<script type="module">
import('./stoney-relic/player.mjs').catch(error=>{
  const screen=document.getElementById('screen');screen.hidden=false;
  screen.textContent='Game modules could not load. Check the connection or content blocker, then reconnect. '+error.message;
  const retry=document.createElement('button');retry.textContent='Reconnect';retry.onclick=()=>location.reload();screen.append(retry);
});
</script>
</body></html>

<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#080e19"><title>🗿 Stoney’s Relic</title><link rel="stylesheet" href="./stoney/style.css"></head>
<body>
<canvas id="scene" aria-label="Stoney’s Relic dungeon"></canvas><div class="crosshair"></div><div id="markers" aria-hidden="true"></div><div id="fog"></div><div id="dead"></div>
<header class="topbar"><span class="pill">🗿 <span id="meName">Stoney’s Relic</span></span><span class="pill">📡 <span id="netText" role="status">Connecting…</span></span><span class="pill">⏱ <span id="timerText">—</span></span><button id="fullscreen" type="button" aria-label="Toggle fullscreen">⛶ Fullscreen</button><div id="crownText" class="objective" role="status" aria-live="polite">👑 Find the crown and escape together.</div></header>
<details class="team-panel" id="teamPanel" open><summary id="teamSummary">Team</summary><div class="team-list" id="teamList"></div></details>
<div class="toast" id="toast" role="status" aria-live="polite" aria-atomic="true"></div>
<section class="center" id="centerMsg"><h1 id="centerTitle">Stoney’s Relic</h1><p id="centerSub">Connecting to your lobby…</p><button class="primary" id="lockBtn" type="button" hidden>Enter the dungeon</button></section>
<div class="controls-hint">WASD / arrows · Shift sprint · Space jump · Click to look · Esc release mouse · Gold markers show the crown carrier</div>
<div class="touch-controls"><div class="stick move" id="moveStick" aria-label="Movement joystick"><div class="knob" id="moveKnob"></div></div><div class="stick look" id="lookStick" aria-label="Look joystick"><div class="knob" id="lookKnob"></div></div><div class="touch-actions"><button type="button" id="sprintBtn" aria-label="Hold to sprint">Sprint</button><button type="button" id="jumpBtn" aria-label="Jump">Jump</button></div></div>
<script type="module" src="./stoney/player.mjs"></script>
</body></html>

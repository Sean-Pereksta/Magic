<svg xmlns="http://www.w3.org/2000/svg" class="monkey-art" data-species="claypot" data-state="idle" data-stage="1" data-types="[&quot;earth&quot;]" data-signature="" data-reduced="false" viewBox="0 0 240 240" role="img" aria-label="Claypot, idle, evolution 1"><style>
.monkey-art{overflow:visible;isolation:isolate}.monkey-art .rig{transform-origin:120px 208px;animation:mt-breathe 3s ease-in-out infinite}.monkey-art .head{transform-origin:120px 112px;animation:mt-head 4s ease-in-out infinite}.monkey-art .eyes{animation:mt-blink 5.2s infinite;transform-origin:120px 104px}.monkey-art .tail{transform-origin:158px 182px;animation:mt-tail 3s ease-in-out infinite}.monkey-art .arm-l{transform-origin:90px 137px}.monkey-art .arm-r{transform-origin:150px 137px}.monkey-art .leg-l{transform-origin:105px 186px}.monkey-art .leg-r{transform-origin:135px 186px}.monkey-art .voice-pulse{animation:mt-voice 2.5s ease-out infinite}.monkey-art .breath-mist{animation:mt-mist 3s ease-out infinite}.monkey-art .cast-fx,.monkey-art .signature-fx{opacity:0;transform-origin:120px 120px}.monkey-art .ko-eyes{display:none}
.monkey-art[data-state="walk"] .rig{animation:mt-walk .55s ease-in-out infinite}.monkey-art[data-state="walk"] .arm-l,.monkey-art[data-state="walk"] .leg-r{animation:mt-stride .55s ease-in-out infinite alternate}.monkey-art[data-state="walk"] .arm-r,.monkey-art[data-state="walk"] .leg-l{animation:mt-stride .55s ease-in-out infinite alternate-reverse}
.monkey-art[data-state="attack"] .rig{animation:mt-lunge .65s ease-in-out infinite}.monkey-art[data-state="attack"] .arm-r{animation:mt-punch .65s ease-in-out infinite}.monkey-art[data-state="cast"] .arm-l{animation:mt-lift-l 1.2s ease-in-out infinite}.monkey-art[data-state="cast"] .arm-r{animation:mt-lift-r 1.2s ease-in-out infinite}.monkey-art[data-state="cast"] .cast-fx{animation:mt-cast 1.2s ease-out infinite}
.monkey-art[data-state="hit"] .rig{animation:mt-hit .5s ease-out infinite}.monkey-art[data-state="knockout"] .rig{animation:mt-ko .7s ease-out both}.monkey-art[data-state="knockout"] .eyes{display:none}.monkey-art[data-state="knockout"] .ko-eyes{display:block}.monkey-art[data-state="knockout"] .head,.monkey-art[data-state="knockout"] .tail{animation:none}
.monkey-art[data-state="victory"] .rig{animation:mt-victory 1.2s ease-in-out infinite}.monkey-art[data-state="victory"] .arm-l{animation:mt-lift-l 1.2s ease-in-out infinite}.monkey-art[data-state="victory"] .arm-r{animation:mt-lift-r 1.2s ease-in-out infinite}.monkey-art[data-state="arrival"] .rig{animation:mt-arrive 2s ease-out both}.monkey-art[data-state="arrival"] .signature-fx{animation:mt-sig 2s ease-out both}
.monkey-art[data-state="signature"] .rig{animation:mt-victory 1.8s ease-in-out infinite}.monkey-art[data-state="signature"] .arm-l{animation:mt-lift-l 1.8s ease-in-out infinite}.monkey-art[data-state="signature"] .arm-r{animation:mt-lift-r 1.8s ease-in-out infinite}.monkey-art[data-state="signature"] .signature-fx{animation:mt-sig 1.8s ease-out infinite}
.monkey-art[data-state="signature"][data-signature="coronationFlare"] .signature-fx{animation:mt-crown 1.8s ease-out infinite}.monkey-art[data-state="signature"][data-signature="worldrootSanctuary"] .signature-fx{animation:mt-root 2.4s ease-out infinite}.monkey-art[data-state="signature"][data-signature="abyssalChorus"] .signature-fx{animation:mt-chorus 2s ease-out infinite}.monkey-art[data-state="signature"][data-signature="skybreakRelay"] .signature-fx{animation:mt-sky 1.5s ease-in-out infinite}.monkey-art[data-state="signature"][data-signature="auroraReversal"] .signature-fx{animation:mt-aurora 2s ease-in-out infinite}.monkey-art[data-state="signature"][data-signature="mountainbreaker"] .signature-fx{animation:mt-mountain 1.8s ease-out infinite}.monkey-art[data-state="signature"][data-signature="eclipseFeint"] .signature-fx{animation:mt-eclipse 1.8s ease-in-out infinite}.monkey-art[data-state="signature"][data-signature="renewalChorus"] .signature-fx{animation:mt-renewal 2.3s ease-in-out infinite}
@keyframes mt-breathe{50%{transform:translateY(-2px) scaleY(1.015)}}@keyframes mt-head{50%{transform:rotate(2deg)}}@keyframes mt-blink{0%,43%,47%,100%{transform:scaleY(1)}45%{transform:scaleY(.1)}}@keyframes mt-tail{50%{transform:rotate(5deg)}}@keyframes mt-voice{0%,100%{opacity:.2}50%{opacity:.8}}@keyframes mt-mist{0%{opacity:0;transform:translateX(-4px)}50%{opacity:.6}100%{opacity:0;transform:translateX(9px) translateY(-4px)}}@keyframes mt-walk{25%{transform:translateY(-5px) rotate(-2deg)}75%{transform:translateY(-5px) rotate(2deg)}}@keyframes mt-stride{from{transform:rotate(-13deg)}to{transform:rotate(13deg)}}@keyframes mt-lunge{0%,100%{transform:translateX(0)}40%{transform:translateX(13px) rotate(4deg)}65%{transform:translateX(-4px)}}@keyframes mt-punch{0%,100%{transform:rotate(0)}40%{transform:rotate(-65deg)}}@keyframes mt-lift-l{40%,70%{transform:rotate(48deg)}}@keyframes mt-lift-r{40%,70%{transform:rotate(-48deg)}}@keyframes mt-cast{0%{opacity:0;transform:scale(.3)}45%{opacity:.9}100%{opacity:0;transform:scale(1.12)}}@keyframes mt-hit{0%,100%{transform:translateX(0)}20%{transform:translateX(-8px) rotate(-4deg);opacity:.6}40%{transform:translateX(5px)}60%{transform:translateX(-3px)}}@keyframes mt-ko{to{transform:translateY(8px) rotate(72deg) scale(.88);opacity:.7}}@keyframes mt-victory{0%,100%{transform:translateY(0)}40%{transform:translateY(-13px) rotate(-4deg)}60%{transform:translateY(-10px) rotate(4deg)}}@keyframes mt-arrive{0%{transform:translateY(-35px) scale(.5);opacity:0}65%{transform:translateY(2px) scale(1.05)}100%{transform:none;opacity:1}}@keyframes mt-sig{0%{opacity:0;transform:scale(.4)}45%{opacity:1}100%{opacity:0;transform:scale(1.15)}}@keyframes mt-crown{0%{opacity:0;transform:translateY(30px) scale(.25) rotate(-20deg)}55%{opacity:1}100%{opacity:0;transform:translateY(-7px) scale(1.1) rotate(15deg)}}@keyframes mt-root{0%{opacity:0;transform:translateY(80px) scaleY(.1)}55%{opacity:1;transform:translateY(0)}100%{opacity:0;transform:scale(1.03)}}@keyframes mt-chorus{0%{opacity:0;transform:scale(.15)}50%{opacity:.8}100%{opacity:0;transform:scale(1.25)}}@keyframes mt-sky{0%{opacity:0;transform:translateX(-35px) rotate(-20deg)}45%{opacity:1}100%{opacity:0;transform:translateX(20px) rotate(20deg)}}@keyframes mt-aurora{0%{opacity:0;transform:translateY(25px) rotate(-15deg)}50%{opacity:1;transform:translateY(-6px) rotate(12deg)}100%{opacity:0;transform:translateY(-20px)}}@keyframes mt-mountain{0%,25%{opacity:0;transform:translateY(40px) scaleY(.1)}35%{opacity:1;transform:translateY(0)}50%{transform:translateX(-3px)}60%{transform:translateX(3px)}100%{opacity:0;transform:translateY(-10px)}}@keyframes mt-eclipse{0%{opacity:0;transform:translateX(25px) rotate(20deg)}50%{opacity:1;transform:translateX(0) rotate(-15deg)}100%{opacity:0;transform:translateX(-30px) rotate(-35deg)}}@keyframes mt-renewal{0%{opacity:0;transform:translateY(35px) scaleY(.3)}50%{opacity:1;transform:translateY(0)}100%{opacity:0;transform:translateY(-20px) scale(1.05)}}
.monkey-art[data-state="signature"][data-signature="zeroHourRelay"] .signature-fx{animation:mt-zero-hour 2.2s steps(12) infinite}.monkey-art[data-state="signature"][data-signature="monolithVerdict"] .signature-fx{animation:mt-verdict 2.1s ease-out infinite}.monkey-art[data-state="signature"][data-signature="sovereignSpore"] .signature-fx{animation:mt-spore 2.6s ease-in-out infinite}.monkey-art[data-state="signature"][data-signature="rebirthTide"] .signature-fx{animation:mt-rebirth 2.3s ease-in-out infinite}
@keyframes mt-zero-hour{0%{opacity:0;transform:rotate(-180deg) scale(.5)}40%,70%{opacity:1;transform:rotate(0deg) scale(1)}100%{opacity:0;transform:rotate(90deg) scale(1.2)}}@keyframes mt-verdict{0%{opacity:0;transform:translateY(-70px) scaleX(.7)}45%{opacity:1;transform:translateY(0)}60%{transform:translateY(5px) scaleX(1.05)}100%{opacity:0;transform:translateY(0)}}@keyframes mt-spore{0%{opacity:0;transform:translateY(28px) scale(.7) rotate(-8deg)}50%{opacity:.85;transform:translateY(-6px) scale(1) rotate(8deg)}100%{opacity:0;transform:translateY(-35px) scale(1.16)}}@keyframes mt-rebirth{0%{opacity:0;transform:translateY(35px) scaleX(.3)}45%{opacity:1;transform:translateY(0) scaleX(1)}75%{opacity:.9;transform:translateY(-14px) rotate(4deg)}100%{opacity:0;transform:translateY(-30px) scaleX(1.15)}}
@media(prefers-reduced-motion:reduce){.monkey-art *{animation:none!important}.monkey-art[data-state="cast"] .cast-fx,.monkey-art[data-state="signature"] .signature-fx{opacity:.6}.monkey-art[data-state="knockout"] .rig{transform:translateY(8px) rotate(72deg) scale(.88)}}
.reduced-motion .monkey-art *,.battery-saving .monkey-art *,.reduce-motion .monkey-art *,.battery-saver .monkey-art *,.monkey-art[data-reduced="true"] *{animation:none!important}.reduced-motion .monkey-art[data-state="signature"] .signature-fx,.reduce-motion .monkey-art[data-state="signature"] .signature-fx,.monkey-art[data-reduced="true"][data-state="signature"] .signature-fx{opacity:.6}

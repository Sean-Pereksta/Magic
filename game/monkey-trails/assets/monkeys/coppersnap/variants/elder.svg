keyframes mt-chorus{0%{opacity:0;transform:scale(.15)}50%{opacity:.8}100%{opacity:0;transform:scale(1.25)}}@keyframes mt-sky{0%{opacity:0;transform:translateX(-35px) rotate(-20deg)}45%{opacity:1}100%{opacity:0;transform:translateX(20px) rotate(20deg)}}@keyframes mt-aurora{0%{opacity:0;transform:translateY(25px) rotate(-15deg)}50%{opacity:1;transform:translateY(-6px) rotate(12deg)}100%{opacity:0;transform:translateY(-20px)}}@keyframes mt-mountain{0%,25%{opacity:0;transform:translateY(40px) scaleY(.1)}35%{opacity:1;transform:translateY(0)}50%{transform:translateX(-3px)}60%{transform:translateX(3px)}100%{opacity:0;transform:translateY(-10px)}}@keyframes mt-eclipse{0%{opacity:0;transform:translateX(25px) rotate(20deg)}50%{opacity:1;transform:translateX(0) rotate(-15deg)}100%{opacity:0;transform:translateX(-30px) rotate(-35deg)}}@keyframes mt-renewal{0%{opacity:0;transform:translateY(35px) scaleY(.3)}50%{opacity:1;transform:translateY(0)}100%{opacity:0;transform:translateY(-20px) scale(1.05)}}
.monkey-art[data-state="signature"][data-signature="zeroHourRelay"] .signature-fx{animation:mt-zero-hour 2.2s steps(12) infinite}.monkey-art[data-state="signature"][data-signature="monolithVerdict"] .signature-fx{animation:mt-verdict 2.1s ease-out infinite}.monkey-art[data-state="signature"][data-signature="sovereignSpore"] .signature-fx{animation:mt-spore 2.6s ease-in-out infinite}.monkey-art[data-state="signature"][data-signature="rebirthTide"] .signature-fx{animation:mt-rebirth 2.3s ease-in-out infinite}

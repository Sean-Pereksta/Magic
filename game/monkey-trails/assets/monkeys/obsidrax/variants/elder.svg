<svg xmlns="http://www.w3.org/2000/svg" class="monkey-art" data-species="obsidrax" data-state="idle" data-stage="2" data-types="[&quot;earth&quot;,&quot;fire&quot;]" data-signature="mountainbreaker" data-reduced="false" viewBox="0 0 240 240" role="img" aria-label="Obsidrax, the Mountainbreaker, idle, evolution 2"><style>
.monkey-art{overflow:visible;isolation:isolate}.monkey-art .rig{transform-origin:120px 208px;animation:mt-breathe 3s ease-in-out infinite}.monkey-art .head{transform-origin:120px 112px;animation:mt-head 4s ease-in-out infinite}.monkey-art .eyes{animation:mt-blink 5.2s infinite;transform-origin:120px 104px}.monkey-art .tail{transform-origin:158px 182px;animation:mt-tail 3s ease-in-out infinite}.monkey-art .arm-l{transform-origin:90px 137px}.monkey-art .arm-r{transform-origin:150px 137px}.monkey-art .leg-l{transform-origin:105px 186px}.monkey-art .leg-r{transform-origin:135px 186px}.monkey-art .voice-pulse{animation:mt-voice 2.5s ease-out infinite}.monkey-art .breath-mist{animation:mt-mist 3s ease-out infinite}.monkey-art .cast-fx,.monkey-art .signature-fx{opacity:0;transform-origin:120px 120px}.monkey-art .ko-eyes{display:none}

(()=>{
'use strict';

const firebaseConfig={apiKey:"AIzaSyB7twY7z31ucB6pGA8JC_HrVMZhA8lNaJA",authDomain:"bible-game-246c0.firebaseapp.com",databaseURL:"https://bible-game-246c0-default-rtdb.firebaseio.com",projectId:"bible-game-246c0",storageBucket:"bible-game-246c0.firebasestorage.app",messagingSenderId:"959619818996",appId:"1:959619818996:web:5a9fbf492e23c765e445a1",measurementId:"G-8PR6LVKSH3"};
let online={ready:false,db:null,auth:null,uid:null,scores:[],loading:false,error:''};
function cleanName(v){ return String(v||'KNIGHT').replace(/[^a-zA-Z0-9 _.-]/g,'').trim().slice(0,16).toUpperCase() || 'KNIGHT'; }
function scoreCollection(){ return online.db.collection('lobbies').doc('one_hit_knight').collection('highscores'); }
function initOnline(){
  try{
    if(!window.firebase){ online.error='Firebase scripts blocked'; return; }
    if(!firebase.apps.length) firebase.initializeApp(firebaseConfig);
    online.auth=firebase.auth(); online.db=firebase.firestore();
    online.auth.signInAnonymously().then(cred=>{ online.uid=cred.user.uid; online.ready=true; loadLeaderboard(); }).catch(err=>{ online.error=err.message||'Online login failed'; renderLeaderboard(); });
  }catch(err){ online.error=err.message||'Online disabled'; }
}
async function loadLeaderboard(){
  if(!online.db || !online.ready) { renderLeaderboard(); return online.scores; }
  online.loading=true; renderLeaderboard();
  try{
    const snap=await scoreCollection().orderBy('score','desc').limit(10).get();
    online.scores=snap.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>(b.score||0)-(a.score||0)||((a.createdMs||0)-(b.createdMs||0)));
    online.error='';
  }catch(err){ online.error=err.message||'Could not load scores'; }

function isOnlineTopTen(score){ if(!online.ready) return false; const s=Number(score)||0; if(s<=0) return false; if(online.scores.length<10) return true; return s>(Number(online.scores[online.scores.length-1].score)||0); }
async function saveOnlineScore(name){
  if(!online.ready || !online.db) throw new Error('Online score system is not ready yet.');

  await scoreCollection().add(payload);
  await loadLeaderboard();
}
function renderLeaderboard(){
  const el=document.getElementById('leaderboard'); if(!el) return;
  const title='<h3>ONLINE TOP 10</h3>';

addScore=function(...args){uiAddScore(...args);if(stats.score>=10000&&!stats.achievements.includes('score-ten-thousand'))unlockAchievement('score-ten-thousand','GOLDEN SWORD UNLOCKED','gold-sword');};
updateHud=function(){uiHud();hud.score.innerHTML=''+fmt(stats.score)+'<span class="hudSub">SCORE</span>';hud.wave.innerHTML=''+fmt(stats.wave)+'<span class="hudSub">WAVE</span>';hud.combo.innerHTML=(stats.combo||0)+' CHAIN<span class="hudSub">'+(player.frenzy>0?'KNIGHT FRENZY':(stats.combo>0?'KEEP IT ALIVE':'FIND YOUR MOMENT'))+'</span>';hud.mode.textContent=mode==='60 SECOND'?Math.max(0,Math.ceil(stats.minuteLeft))+'s MAYHEM':mode;hud.best.textContent='BEST '+fmt(best);const buffEl=$('buffHud');if(buffEl){const buffs=Object.entries(player.buffs||{}).filter(([k,v])=>v>0).map(([k,v])=>'<span class="buffChip">'+escapeHtml(k.replace(/([A-Z])/g,' $1').toUpperCase())+' '+Math.ceil(v)+'s</span>');buffEl.innerHTML='<span class="buffChip">DASH '+(player.dashCool>0?player.dashCool.toFixed(1)+'s':'READY')+'</span>'+buffs.slice(0,5).join('');}};
async function showGameOver(){const serial=uiRunSerial;uiPaused=false;pauseButton.style.display='none';overlay.style.display='flex';const summary='<div class="eyebrow">'+(mode==='60 SECOND'&&stats.minuteLeft<=0?'TIME! WHAT A RUN.':'ONE HIT. A THOUSAND STORIES.')+'</div><h2 class="screenTitle">'+(mode==='60 SECOND'&&stats.minuteLeft<=0?'MAYHEM COMPLETE':'THE KNIGHT FALLS')+'</h2><div class="summaryGrid"><div class="summaryStat"><span>FINAL SCORE</span><strong>'+fmt(stats.score)+'</strong></div><div class="summaryStat"><span>ENEMIES DEFEATED</span><strong>'+fmt(stats.kills)+'</strong></div><div class="summaryStat"><span>HIGHEST COMBO</span><strong>'+fmt(stats.bestCombo)+'</strong></div><div class="summaryStat"><span>WAVES SURVIVED</span><strong>'+Math.max(0,stats.wave-1)+'</strong></div></div><div class="small">'+fmt(stats.perfectStrikes||0)+' PERFECT STRIKES · '+fmt(stats.bosses||0)+' BOSSES · BEST '+fmt(best)+'</div>'+(stats.achievements||[]).map(a=>'<div class="unlock">UNLOCKED · '+escapeHtml(typeof a==='string'?a:a.name||a.id)+'</div>').join('');
 showGameOverButtons(summary);arcadeAudio.play('death');await loadLeaderboard();if(serial!==uiRunSerial||running||!gameOver)return;if(isOnlineTopTen(stats.score)){const form=document.createElement('div');form.id='scoreForm';form.innerHTML='<div class="onlineNote">TOP 10 RUN! SIGN THE HALL OF FAME.</div><div class="nameBox"><input aria-label="Leaderboard name" class="nameInput" id="scoreName" maxlength="16" value="KNIGHT"><button class="btn" id="saveScoreBtn">Save Score</button></div><div class="onlineNote" id="saveNote" aria-live="polite"></div>';$('panel').insertBefore(form,$('panel').querySelector('.menuBtns'));$('saveScoreBtn').onclick=async()=>{const btn=$('saveScoreBtn'),note=$('saveNote'),name=$('scoreName').value;btn.disabled=true;note.textContent='SAVING…';try{await saveOnlineScore(name);if(serial===uiRunSerial&&form.isConnected){note.textContent='YOUR LEGEND IS SAVED.';btn.remove();}}catch(err){if(form.isConnected){btn.disabled=false;note.textContent=err.message||'Could not save. Try again.';}}};}}
function showGameOverButtons(base){$('panel').innerHTML=base+'<div class="menuBtns" style="margin-top:20px"><button class="btn" id="againBtn">Run It Back</button><button class="btn" id="menuBtn">Back to Menu</button></div>'+menuLeaderboardHtml();$('againBtn').onclick=()=>reset(mode);$('menuBtn').onclick=restoreMenu;renderLeaderboard();$('againBtn').focus();}
// Edge-triggered standard controller input; keyboard and analog touch remain available.
let gamepadPrevious={slash:false,dash:false,pause:false};
function pollGamepad(){const g=navigator.getGamepads?.()?.find?.(v=>v&&v.connected);controllerVec={x:0,y:0};if(g&&running){const current={slash:!!g.buttons[0]?.pressed,dash:!!g.buttons[1]?.pressed,pause:!!g.buttons[9]?.pressed};if(current.pause&&!gamepadPrevious.pause){if(uiPaused)resumeRun();else pauseRun();}if(!uiPaused&&!pausedForChoice){controllerVec.x=(g.buttons[15]?.pressed?1:g.buttons[14]?.pressed?-1:Math.abs(g.axes[0]||0)>.2?g.axes[0]:0);controllerVec.y=(g.buttons[13]?.pressed?1:g.buttons[12]?.pressed?-1:Math.abs(g.axes[1]||0)>.2?g.axes[1]:0);if(current.slash&&!gamepadPrevious.slash)doSlash();if(current.dash&&!gamepadPrevious.dash)doDash();}gamepadPrevious=current;}else gamepadPrevious={slash:false,dash:false,pause:false};requestAnimationFrame(pollGamepad);}pollGamepad();
const itemArt={'long-sword':'weapon.long-sword','quick-boots':'boots.gold','fast-dash':'boots.wing','loud-combo':'helmet.plume','chicken-shield':'shield.chicken','royal-score':'helmet.crown','boom-slash':'weapon.flame','magnet-crown':'helmet.magnet','ice-brand':'weapon.frost','golden-spurs':'boots.gold','giant-plume':'helmet.plume','panic-horn':'helmet.horn','vampire-gem':'armor.vampire','time-sand':'pickup.time-clock',greatsword:'weapon.greatsword',rapier:'weapon.rapier','battle-axe':'weapon.axe','war-hammer':'weapon.hammer','flame-sword':'weapon.flame','thunder-knight':'weapon.thunder','phoenix-armor':'armor.phoenix','shadow-knight':'armor.shadow','golden-knight':'armor.gold'};
addEventListener('ohk:choices',()=>{setTimeout(()=>{cards.querySelectorAll('.card').forEach((card,i)=>{card.setAttribute('role','button');card.tabIndex=0;card.setAttribute('aria-label',card.textContent);const c=document.createElement('canvas');c.width=96;c.height=80;c.className='itemPreview';c.setAttribute('aria-hidden','true');card.prepend(c);if(window.OHKRender?.preview)OHKRender.preview(c,itemArt[card.dataset.item]||'weapon.sword',{scale:1.8});const hint=document.createElement('small');hint.textContent='PRESS '+(i+1)+' TO CHOOSE';card.appendChild(hint);card.onkeydown=e=>{if(e.code==='Enter'||e.code==='Space'){e.preventDefault();card.click();}};});cards.querySelector('.card')?.focus();},0);});
addEventListener('keydown',e=>{if(pausedForChoice&&!uiPaused&&choice.style.display!=='none'&&/^Digit[123]$/.test(e.code)){e.preventDefault();cards.children[Number(e.code.slice(-1))-1]?.click();}});
// Raster interface emblems use the same included artwork as the hosted pack.
window.OHKAssets?.ready.then(()=>{const url=id=>{const sprite=OHKAssets.lookup(id);return sprite&&window.OHK_ART.images[sprite.image];},rules=[];for(const [selector,id]of [['#scoreHud','ui.score'],['#waveHud','ui.wave'],['#comboHud','ui.combo']]){const src=url(id);if(src)rules.push(selector+'::before{content:"";float:left;display:block;width:25px;height:25px;margin-right:7px;background:url('+src+') center/contain no-repeat;image-rendering:pixelated}');}for(const [selector,id]of [['.act.slash','ui.slash-button'],['.act.dash','ui.dash-button']]){const src=url(id);if(src)rules.push(selector+'{background-image:linear-gradient(#0c183a33,#0c183a33),url('+src+');background-position:center;background-size:cover;image-rendering:pixelated;text-shadow:1px 2px #000}');}if(rules.length){const sheet=document.createElement('style');sheet.textContent=rules.join('\n');document.head.appendChild(sheet);}}).catch(()=>{});

initOnline(); restoreMenu(); updateHud();
})();

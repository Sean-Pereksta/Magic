<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Trash Tactics · Knockout workshop</title><style>
*{box-sizing:border-box}body{margin:0;padding:30px;background:#ede7d2;color:#34463f;font:15px 'Trebuchet MS',sans-serif}header{max-width:1100px;margin:0 auto 22px;display:flex;gap:24px;align-items:center;flex-wrap:wrap}h1{font-size:29px;margin:0 0 6px}p{margin:0;color:#6a7866;line-height:1.5}button,input{accent-color:#378c7d}button{background:#f8f5e6;border:1px solid #9baa91;border-radius:8px;padding:10px 16px;color:#34463f;font:700 14px inherit;cursor:pointer}button:hover{background:#dce8d1}.controls{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.grid{max-width:1100px;margin:auto;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:13px}.card{background:#fbf8ec;border:1px solid #c1c9ae;border-radius:13px;overflow:hidden;box-shadow:0 3px 0 #44513a10}.card canvas{width:100%;height:180px;display:block;background:radial-gradient(ellipse at 50% 70%,#dce5cb,#f4efde 67%)}.copy{padding:13px 15px;border-top:1px solid #e6e5d4}.copy h2{font-size:15px;margin:0 0 5px}.copy p{font-size:12px}.progress{min-width:150px}#status{font-size:12px}a{color:#397d6c}@media(max-width:760px){body{padding:18px}.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.card canvas{height:150px}}@media(prefers-reduced-motion:reduce){body{scroll-behavior:auto}}
</style></head><body><header><div><h1>A proper paper knockout.</h1><p>Eleven troops. Eleven illustrated collapse sequences.<br>Painted bodies break apart, tumble, and settle into original remains.</p></div><div class="controls"><button id="pause">Pause</button><button id="replay">Replay all</button><label class="progress">Frame <input id="scrub" type="range" min="0" max="100" value="0" aria-label="Animation progress"></label><span id="status">Loading artwork…</span></div><a href="./">Back to battle</a></header><main class="grid" id="grid"></main><script type="module">
import {DEATH_TYPES,DEATH_DURATION,DEATH_FRAMES,DEATH_FRAME_SIZE,paintDeathPose,drawDeathAnimation,loadDeathArtwork,deathArtworkStatus} from './death-art.js';
const names={twig:'Twig worker',rock:'Rock',paper:'Paper',scissors:'Scissors',cd:'Flying CD',sniper:'Scissors Sniper',airplane:'Paper Airplane',mage:'Rock Mage',divider:'Paper Divider',rollingrock:'Rolling Rock',shears:'Shadow Shears'};
const beats={twig:'Trunk topples · bundle drops · leaf spins',rock:'Fracture spreads · stone chunks bounce',paper:'Sheet folds · tears flutter to the desk',scissors:'Blades separate · hinge screw tumbles',cd:'Disc falls · iridescent sectors shatter',sniper:'Legs fold · pencil rifle snaps · scope drops',airplane:'Wings buckle · folded crash landing',mage:'Hat falls · staff breaks · crystal scatters',divider:'Crown tumbles · three paper sectors collapse',rollingrock:'Heavy fracture · angular slabs settle',shears:'Dark blades split · scarf unravels'};
const cards=DEATH_TYPES.map(type=>{const node=document.createElement('article');node.className='card';node.innerHTML=`<canvas width="520" height="360" aria-label="${names[type]} knockout animation"></canvas><div class="copy"><h2>${names[type]}</h2><p>${beats[type]}</p></div>`;document.querySelector('#grid').append(node);return {type,c:node.querySelector('canvas').getContext('2d')};});
const sprites={};await Promise.allSettled(DEATH_TYPES.filter(t=>t!=='cd').map(async type=>{const img=new Image();img.src=new URL('./assets/'+type+'-icon.png',import.meta.url).href;await img.decode();sprites[type]=img;}));await loadDeathArtwork();
let playing=!matchMedia('(prefers-reduced-motion: reduce)').matches,at=0,last=performance.now();const slider=document.querySelector('#scrub'),pause=document.querySelector('#pause');
function label(){pause.textContent=playing?'Pause':'Play';}label();pause.onclick=()=>{playing=!playing;last=performance.now();label();};document.querySelector('#replay').onclick=()=>{at=0;playing=true;last=performance.now();label();};slider.oninput=()=>{playing=false;at=Number(slider.value)/100*DEATH_DURATION;label();};
function frame(now){const dt=Math.min(.05,(now-last)/1000);last=now;if(playing)at=(at+dt)%(DEATH_DURATION+1.0);const p=Math.min(.999,at/DEATH_DURATION);slider.value=Math.round(p*100);for(const {type,c} of cards){c.clearRect(0,0,520,360);c.save();c.translate(260,220);c.scale(2.1,2.1);drawDeathAnimation({artSprites:sprites,visible:()=>true,pointVisible:()=>true},c,{type:'death',entityType:type,x:0,y:0,life:(1-p)*DEATH_DURATION,total:DEATH_DURATION});c.restore();}document.querySelector('#status').textContent=deathArtworkStatus().remains?'Painted remains loaded · '+Math.min(100,Math.round(p*100))+'%':'Procedural fallback · remains loading';requestAnimationFrame(frame);}requestAnimationFrame(frame);
window.deathGallery={cards,sprites,seek(p){playing=false;at=p*DEATH_DURATION;label();},status:deathArtworkStatus,exportSheets(){return Object.fromEntries(DEATH_TYPES.map(type=>{const canvas=document.createElement('canvas');canvas.width=DEATH_FRAME_SIZE*DEATH_FRAMES;canvas.height=DEATH_FRAME_SIZE;const c=canvas.getContext('2d');for(let i=0;i<DEATH_FRAMES;i++){c.save();c.translate(i*DEATH_FRAME_SIZE+DEATH_FRAME_SIZE/2,DEATH_FRAME_SIZE*.66);paintDeathPose(c,type,i/DEATH_FRAMES,sprites[type]);c.restore();}return [type,canvas.toDataURL('image/png')];}));}};
</script></body></html>

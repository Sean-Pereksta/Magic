<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <title>The Last Five</title>
  <style>
    :root {
      --black: #111111;
      --white: #ffffff;
      --red: #d62828;
      --red-soft: #ffe7e7;
      --green: #16803a;
      --green-soft: #e6f6e9;
      --gray: #e8e8e8;
      --muted: #777777;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
      background: var(--white);
      color: var(--black);
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace;
      overscroll-behavior: none;
    }

    body {
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding: max(12px, env(safe-area-inset-top)) max(10px, env(safe-area-inset-right)) max(12px, env(safe-area-inset-bottom)) max(10px, env(safe-area-inset-left));
    }

    button {
      font: inherit;
      color: inherit;
      touch-action: manipulation;
    }

    .game {
      width: min(94vw, 620px);
      user-select: none;
    }

    .topbar {
      height: 34px;
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      font-size: 13px;
      letter-spacing: 0.04em;
    }

    .round {
      justify-self: start;
    }

    .squad {
      justify-self: center;
      display: flex;
      gap: 6px;
      align-items: center;
    }

    .squad-dot {
      width: 9px;
      height: 9px;
      border: 1.5px solid var(--black);
      border-radius: 50%;
      background: var(--white);
    }

    .squad-dot.wounded {
      background: var(--red);
      border-color: var(--red);
    }

    .squad-dot.lost {
      border-color: #c8c8c8;
      background: #c8c8c8;
    }

    .score {
      justify-self: end;
      color: var(--muted);
    }

    .board {
      width: 100%;
      aspect-ratio: 1;
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      grid-template-rows: repeat(7, 1fr);
      border: 2px solid var(--black);
      background: var(--white);
      position: relative;
    }

    .cell {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      min-width: 0;
      min-height: 0;
      border: 0;
      border-right: 1px solid var(--black);
      border-bottom: 1px solid var(--black);
      padding: 0;
      background: var(--white);
      cursor: pointer;
      overflow: hidden;
    }

    .cell:nth-child(7n) {
      border-right: 0;
    }

    .cell:nth-last-child(-n + 7) {
      border-bottom: 0;
    }

    .cell.move {
      background: var(--green-soft);
    }

    .cell.move::before {
      content: "";
      position: absolute;
      width: 18%;
      aspect-ratio: 1;
      border-radius: 50%;
      background: var(--green);
      opacity: 0.92;
    }

    .cell.attack {
      background: var(--red-soft);
    }

    .cell.attack::before {
      content: "";
      position: absolute;
      inset: 8%;
      border: 2px solid var(--red);
      pointer-events: none;
    }

    .cell.threat:not(.attack)::after {
      content: "";
      position: absolute;
      right: 7%;
      bottom: 7%;
      width: 11%;
      aspect-ratio: 1;
      border-radius: 50%;
      background: var(--red);
      opacity: 0.7;
      pointer-events: none;
    }

    .cell.marked:not(.attack) {
      background-image: radial-gradient(circle, rgba(214, 40, 40, 0.18) 1px, transparent 1px);
      background-size: 8px 8px;
    }

    .beacon {
      width: 22%;
      aspect-ratio: 1;
      border: 2px solid var(--black);
      transform: rotate(45deg);
      position: absolute;
      opacity: 0.3;
    }

    .unit {
      width: 58%;
      aspect-ratio: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      z-index: 2;
      font-weight: 700;
      font-size: clamp(13px, 3.2vw, 23px);
      line-height: 1;
    }

    .hero {
      border: 2px solid var(--black);
      border-radius: 50%;
      background: var(--white);
    }

    .hero.selected {
      outline: 3px solid var(--green);
      outline-offset: 2px;
    }

    .hero.acted {
      opacity: 0.42;
    }

    .enemy {
      color: var(--white);
      background: var(--black);
      border: 2px solid var(--black);
      border-radius: 5%;
    }

    .enemy.damaged {
      box-shadow: inset 0 0 0 3px var(--red);
    }

    .wound-mark,
    .armor-mark,
    .cooldown-mark,
    .intent-mark,
    .order-mark {
      position: absolute;
      z-index: 4;
      pointer-events: none;
      line-height: 1;
    }

    .wound-mark {
      width: 22%;
      aspect-ratio: 1;
      background: var(--red);
      border-radius: 50%;
      right: -8%;
      top: -8%;
    }

    .armor-mark {
      width: 22%;
      aspect-ratio: 1;
      border: 1.5px solid var(--black);
      background: var(--white);
      left: -8%;
      top: -8%;
      transform: rotate(45deg);
    }

    .cooldown-mark {
      right: -12%;
      bottom: -10%;
      min-width: 16px;
      height: 16px;
      border: 1px solid var(--black);
      border-radius: 50%;
      background: var(--white);
      color: var(--black);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 9px;
      font-weight: 700;
    }

    .intent-mark {
      right: -14%;
      top: -14%;
      color: var(--red);
      background: var(--white);
      border: 1px solid var(--red);
      width: 19px;
      height: 19px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      font-weight: 700;
    }

    .order-mark {
      left: 3px;
      bottom: 2px;
      color: var(--white);
      font-size: 8px;
      opacity: 0.75;
    }

    .spawn-ghost {
      width: 42%;
      aspect-ratio: 1;
      border: 2px solid var(--red);
      color: var(--red);
      background: var(--white);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: clamp(10px, 2.6vw, 18px);
      font-weight: 700;
      position: relative;
      z-index: 2;
      opacity: 0.78;
    }

    .controls {
      display: grid;
      grid-template-columns: 1fr 1.4fr 1fr;
      gap: 8px;
      margin-top: 10px;
    }

    .control {
      min-height: 46px;
      border: 1.5px solid var(--black);
      background: var(--white);
      cursor: pointer;
      border-radius: 0;
      font-weight: 700;
      letter-spacing: 0.03em;
    }

    .control:disabled {
      color: #aaaaaa;
      border-color: #c9c9c9;
      cursor: default;
    }

    .control.primary {
      background: var(--black);
      color: var(--white);
    }

    .control.special-ready {
      border-color: var(--green);
      color: var(--green);
    }

    .unit-line {
      height: 26px;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 12px;
      color: var(--muted);
      letter-spacing: 0.05em;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .flash {
      animation: flash 180ms ease-in-out;
    }

    @keyframes flash {
      0% { filter: invert(0); }
      50% { filter: invert(1); }
      100% { filter: invert(0); }
    }

    .overlay {
      position: fixed;
      inset: 0;
      z-index: 20;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 18px;
      background: rgba(255, 255, 255, 0.94);
    }

    .overlay.show {
      display: flex;
    }

    .overlay-inner {
      width: min(94vw, 720px);
    }

    .overlay-title {
      text-align: center;
      margin: 0 0 18px;
      font-size: clamp(18px, 4vw, 30px);
      letter-spacing: 0.12em;
      font-weight: 700;
    }

    .cards {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 10px;
    }

    .card {
      min-height: 190px;
      border: 2px solid var(--black);
      background: var(--white);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 16px 12px;
      cursor: pointer;
    }

    .card-symbol {
      font-size: 31px;
      margin-bottom: 14px;
      line-height: 1;
    }

    .card-name {
      font-size: 14px;
      font-weight: 700;
      letter-spacing: 0.08em;
      margin-bottom: 11px;
    }

    .card-text {
      font-size: 12px;
      line-height: 1.45;
      color: #555555;
    }

    .gameover {
      text-align: center;
      border: 2px solid var(--black);
      padding: 30px 20px;
      background: var(--white);
    }

    .gameover-number {
      font-size: clamp(42px, 14vw, 88px);
      font-weight: 700;
      line-height: 1;
      margin-bottom: 10px;
    }

    .gameover-label {
      font-size: 12px;
      color: var(--muted);
      margin-bottom: 26px;
      letter-spacing: 0.12em;
    }

    .restart {
      min-width: 160px;
      min-height: 48px;
      border: 2px solid var(--black);
      background: var(--black);
      color: var(--white);
      font-weight: 700;
      cursor: pointer;
    }

    @media (max-width: 520px) {
      body {
        padding-left: 6px;
        padding-right: 6px;
      }

      .game {
        width: min(98vw, 620px);
      }

      .controls {
        gap: 6px;
      }

      .control {
        min-height: 44px;
        font-size: 12px;
      }

      .cards {
        grid-template-columns: 1fr;
      }

      .card {
        min-height: 118px;
      }
    }

    @media (orientation: landscape) and (max-height: 700px) {
      body {
        padding-top: 5px;
        padding-bottom: 5px;
      }

      .game {
        width: min(76vh, 620px);
      }

      .topbar {
        height: 24px;
      }

      .controls {
        margin-top: 6px;
      }

      .control {
        min-height: 36px;
      }

      .unit-line {
        height: 20px;
      }
    }
  </style>
</head>
<body>
  <main class="game" aria-label="The Last Five tactical board game">
    <div class="topbar">
      <div class="round" id="roundLabel">01</div>
      <div class="squad" id="squadStatus" aria-label="Squad status"></div>
      <div class="score" id="enemyCount">00</div>
    </div>

    <div class="board" id="board" role="grid" aria-label="Seven by seven battle board"></div>

    <div class="unit-line" id="unitLine">SELECT A UNIT</div>

    <div class="controls">
      <button class="control" id="guardButton" type="button" disabled>GUARD</button>
      <button class="control" id="specialButton" type="button" disabled>SPECIAL</button>
      <button class="control primary" id="endButton" type="button">END</button>
    </div>
  </main>

  <div class="overlay" id="upgradeOverlay" aria-modal="true" role="dialog">
    <div class="overlay-inner">
      <h1 class="overlay-title">CHOOSE ONE</h1>
      <div class="cards" id="upgradeCards"></div>
    </div>
  </div>

  <div class="overlay" id="gameOverOverlay" aria-modal="true" role="dialog">
    <div class="gameover">
      <div class="gameover-number" id="finalRound">0</div>
      <div class="gameover-label">ROUNDS SURVIVED</div>
      <button class="restart" id="restartButton" type="button">RESTART</button>
    </div>
  </div>

  <script>
    "use strict";

    const SIZE = 7;
    const BEACON = { r: 3, c: 3 };
    const ORTHOGONAL = [
      { r: -1, c: 0 },
      { r: 1, c: 0 },
      { r: 0, c: -1 },
      { r: 0, c: 1 }
    ];

    const HERO_DATA = {
      blade:  { letter: "B", name: "BLADE",  special: "CLEAVE" },
      shield: { letter: "D", name: "SHIELD", special: "FORTRESS" },
      spear:  { letter: "P", name: "SPEAR",  special: "PIN" },
      bow:    { letter: "A", name: "BOW",    special: "PIERCE" },
      banner: { letter: "N", name: "BANNER", special: "RALLY" }
    };

    const ENEMY_DATA = {
      grunt:    { letter: "G", hp: 1, initiative: 4 },
      raider:   { letter: "R", hp: 1, initiative: 2 },
      archer:   { letter: "A", hp: 1, initiative: 6 },
      brute:    { letter: "B", hp: 2, initiative: 5 },
      hook:     { letter: "H", hp: 1, initiative: 1 },
      guardian: { letter: "D", hp: 2, initiative: 3 },
      bomber:   { letter: "O", hp: 1, initiative: 7 }
    };

    const boardEl = document.getElementById("board");
    const roundLabel = document.getElementById("roundLabel");
    const squadStatus = document.getElementById("squadStatus");
    const enemyCount = document.getElementById("enemyCount");
    const unitLine = document.getElementById("unitLine");
    const guardButton = document.getElementById("guardButton");
    const specialButton = document.getElementById("specialButton");
    const endButton = document.getElementById("endButton");
    const upgradeOverlay = document.getElementById("upgradeOverlay");
    const upgradeCards = document.getElementById("upgradeCards");
    const gameOverOverlay = document.getElementById("gameOverOverlay");
    const finalRound = document.getElementById("finalRound");
    const restartButton = document.getElementById("restartButton");

    let cells = [];
    let nextId = 1;
    let seed = (Date.now() ^ 0x9e3779b9) >>> 0;
    let selectedHeroId = null;
    let interactionMode = "normal";
    let game = null;

    function random() {
      seed ^= seed << 13;
      seed ^= seed >>> 17;
      seed ^= seed << 5;
      return (seed >>> 0) / 4294967296;
    }

    function randomInt(max) {
      return Math.floor(random() * max);
    }

    function shuffle(items) {
      const copy = items.slice();
      for (let i = copy.length - 1; i > 0; i -= 1) {
        const j = randomInt(i + 1);
        [copy[i], copy[j]] = [copy[j], copy[i]];
      }
      return copy;
    }

    function key(r, c) {
      return `${r},${c}`;
    }

    function inside(r, c) {
      return r >= 0 && r < SIZE && c >= 0 && c < SIZE;
    }

    function manhattan(a, b) {
      return Math.abs(a.r - b.r) + Math.abs(a.c - b.c);
    }

    function sameCell(a, b) {
      return a.r === b.r && a.c === b.c;
    }

    function directionSymbol(from, to) {
      const dr = to.r - from.r;
      const dc = to.c - from.c;
      if (Math.abs(dr) > Math.abs(dc)) return dr < 0 ? "↑" : "↓";
      if (dc !== 0) return dc < 0 ? "←" : "→";
      return "•";
    }

    function createBoard() {
      boardEl.innerHTML = "";
      cells = [];
      for (let r = 0; r < SIZE; r += 1) {
        for (let c = 0; c < SIZE; c += 1) {
          const cell = document.createElement("button");
          cell.type = "button";
          cell.className = "cell";
          cell.dataset.r = String(r);
          cell.dataset.c = String(c);
          cell.setAttribute("role", "gridcell");
          cell.setAttribute("aria-label", `Row ${r + 1}, column ${c + 1}`);
          cell.addEventListener("click", onCellClick);
          boardEl.appendChild(cell);
          cells.push(cell);
        }
      }
    }

    function makeHero(type, r, c) {
      return {
        id: nextId++,
        type,
        r,
        c,
        alive: true,
        wound: 0,
        acted: false,
        guard: 0,
        cooldown: 0,
        armor: 0
      };
    }

    function makeEnemy(type, r, c) {
      const data = ENEMY_DATA[type];
      return {
        id: nextId++,
        type,
        r,
        c,
        hp: data.hp,
        maxHp: data.hp,
        alive: true,
        stunned: 0,
        shieldBroken: false,
        bombArmed: false,
        bombTarget: null,
        plan: { kind: "wait" }
      };
    }

    function emptyUpgrades() {
      return {
        bladePower: 1,
        shieldDiagonal: false,
        spearFlexible: false,
        bowPierce: false,
        bannerRange: 1,
        counter: false,
        cooldownReduction: 0,
        reserve: false,
        brace: false,
        finisher: false
      };
    }

    function newGame() {
      nextId = 1;
      selectedHeroId = null;
      interactionMode = "normal";
      seed = (Date.now() ^ 0x9e3779b9) >>> 0;

      game = {
        round: 1,
        completedRounds: 0,
        phase: "player",
        heroes: [
          makeHero("blade", 3, 2),
          makeHero("shield", 3, 3),
          makeHero("spear", 2, 3),
          makeHero("bow", 4, 3),
          makeHero("banner", 3, 4)
        ],
        enemies: [
          makeEnemy("grunt", 0, 3),
          makeEnemy("grunt", 6, 3),
          makeEnemy("grunt", 3, 0)
        ],
        incoming: [],
        upgrades: emptyUpgrades(),
        upgradeRanks: {},
        reserveUsed: false,
        safeLines: 0,
        over: false
      };

      upgradeOverlay.classList.remove("show");
      gameOverOverlay.classList.remove("show");
      beginRound();
    }

    function aliveHeroes(state = game) {
      return state.heroes.filter(hero => hero.alive);
    }

    function aliveEnemies(state = game) {
      return state.enemies.filter(enemy => enemy.alive);
    }

    function heroAt(state, r, c) {
      return state.heroes.find(hero => hero.alive && hero.r === r && hero.c === c) || null;
    }

    function enemyAt(state, r, c) {
      return state.enemies.find(enemy => enemy.alive && enemy.r === r && enemy.c === c) || null;
    }

    function occupied(state, r, c, ignoreId = null) {
      return Boolean(
        state.heroes.some(hero => hero.alive && hero.id !== ignoreId && hero.r === r && hero.c === c) ||
        state.enemies.some(enemy => enemy.alive && enemy.id !== ignoreId && enemy.r === r && enemy.c === c)
      );
    }

    function selectedHero() {
      return game.heroes.find(hero => hero.id === selectedHeroId && hero.alive) || null;
    }

    function beginRound() {
      if (game.over) return;

      game.phase = "player";
      game.reserveUsed = false;
      selectedHeroId = null;
      interactionMode = "normal";

      for (const hero of game.heroes) {
        if (!hero.alive) continue;
        hero.acted = false;
        hero.guard = 0;
        if (hero.cooldown > 0) hero.cooldown -= 1;
      }

      for (const enemy of game.enemies) {
        if (!enemy.alive) continue;
        enemy.shieldBroken = false;
        enemy.plan = createEnemyPlan(game, enemy);
      }

      assignInitiative();
      ensureFlawlessLine();
      prepareIncoming();
      render();
    }

    function chooseTargetPosition(state, enemy) {
      const candidates = aliveHeroes(state).map(hero => ({
        r: hero.r,
        c: hero.c,
        weight: hero.wound ? -0.35 : 0
      }));
      candidates.push({ r: BEACON.r, c: BEACON.c, weight: 0.75 });

      candidates.sort((a, b) => {
        const da = manhattan(enemy, a) + a.weight;
        const db = manhattan(enemy, b) + b.weight;
        return da - db;
      });
      return candidates[0] || BEACON;
    }

    function nearestAlignedHero(state, enemy, minRange, maxRange) {
      const targets = aliveHeroes(state)
        .filter(hero => {
          const aligned = hero.r === enemy.r || hero.c === enemy.c;
          const distance = manhattan(hero, enemy);
          return aligned && distance >= minRange && distance <= maxRange && lineClear(state, enemy, hero, enemy.id, hero.id);
        })
        .sort((a, b) => manhattan(a, enemy) - manhattan(b, enemy));
      return targets[0] || null;
    }

    function lineClear(state, from, to, ignoreA = null, ignoreB = null) {
      if (from.r !== to.r && from.c !== to.c) return false;
      const dr = Math.sign(to.r - from.r);
      const dc = Math.sign(to.c - from.c);
      let r = from.r + dr;
      let c = from.c + dc;
      while (r !== to.r || c !== to.c) {
        if (occupied(state, r, c, ignoreA) && !(
          state.heroes.some(hero => hero.id === ignoreB && hero.alive && hero.r === r && hero.c === c) ||
          state.enemies.some(enemy => enemy.id === ignoreB && enemy.alive && enemy.r === r && enemy.c === c)
        )) return false;
        r += dr;
        c += dc;
      }
      return true;
    }

    function greedyPath(state, unit, target, maxSteps) {
      const path = [];
      let current = { r: unit.r, c: unit.c };
      for (let step = 0; step < maxSteps; step += 1) {
        const options = ORTHOGONAL
          .map(delta => ({ r: current.r + delta.r, c: current.c + delta.c }))
          .filter(pos => inside(pos.r, pos.c))
          .filter(pos => !occupied(state, pos.r, pos.c, unit.id))
          .sort((a, b) => manhattan(a, target) - manhattan(b, target));
        if (!options.length || manhattan(options[0], target) >= manhattan(current, target)) break;
        current = options[0];
        path.push({ r: current.r, c: current.c });
      }
      return path;
    }

    function createEnemyPlan(state, enemy) {
      if (enemy.stunned > 0) {
        enemy.stunned -= 1;
        return { kind: "wait", stunned: true };
      }

      if (enemy.type === "bomber") {
        if (enemy.bombArmed && enemy.bombTarget) {
          return { kind: "explode", center: { ...enemy.bombTarget } };
        }
        const target = chooseTargetPosition(state, enemy);
        return { kind: "mark", center: { r: target.r, c: target.c } };
      }

      if (enemy.type === "archer") {
        const target = nearestAlignedHero(state, enemy, 2, 5);
        if (target) return { kind: "shoot", target: { r: target.r, c: target.c } };
      }

      if (enemy.type === "hook") {
        const target = nearestAlignedHero(state, enemy, 2, 4);
        if (target) return { kind: "pull", target: { r: target.r, c: target.c } };
      }

      const adjacent = aliveHeroes(state)
        .filter(hero => manhattan(hero, enemy) === 1)
        .sort((a, b) => b.wound - a.wound)[0];

      if (adjacent) {
        if (enemy.type === "brute") {
          return { kind: "attackPush", target: { r: adjacent.r, c: adjacent.c } };
        }
        return { kind: "attack", target: { r: adjacent.r, c: adjacent.c } };
      }

      const target = chooseTargetPosition(state, enemy);

      if (enemy.type === "raider") {
        const alignedHero = nearestAlignedHero(state, enemy, 2, 2);
        if (alignedHero) {
          const dr = Math.sign(alignedHero.r - enemy.r);
          const dc = Math.sign(alignedHero.c - enemy.c);
          const path = [];
          for (let i = 1; i <= manhattan(enemy, alignedHero); i += 1) {
            path.push({ r: enemy.r + dr * i, c: enemy.c + dc * i });
          }
          return { kind: "charge", path };
        }
        const path = greedyPath(state, enemy, target, 2);
        return path.length ? { kind: "move", path } : { kind: "wait" };
      }

      const path = greedyPath(state, enemy, target, 1);
      return path.length ? { kind: "move", path } : { kind: "wait" };
    }

    function assignInitiative() {
      const ordered = aliveEnemies().slice().sort((a, b) => {
        const ia = ENEMY_DATA[a.type].initiative;
        const ib = ENEMY_DATA[b.type].initiative;
        return ia - ib || a.id - b.id;
      });
      ordered.forEach((enemy, index) => {
        enemy.order = index + 1;
      });
    }

    function cloneState(source) {
      return {
        heroes: source.heroes.map(hero => ({ ...hero })),
        enemies: source.enemies.map(enemy => ({
          ...enemy,
          bombTarget: enemy.bombTarget ? { ...enemy.bombTarget } : null,
          plan: clonePlan(enemy.plan)
        })),
        upgrades: { ...source.upgrades },
        reserveUsed: source.reserveUsed,
        damageEvents: 0
      };
    }

    function clonePlan(plan) {
      if (!plan) return { kind: "wait" };
      return {
        ...plan,
        target: plan.target ? { ...plan.target } : undefined,
        center: plan.center ? { ...plan.center } : undefined,
        path: plan.path ? plan.path.map(pos => ({ ...pos })) : undefined
      };
    }

    function getMoveTargets(state, hero) {
      return ORTHOGONAL
        .map(delta => ({ r: hero.r + delta.r, c: hero.c + delta.c }))
        .filter(pos => inside(pos.r, pos.c) && !occupied(state, pos.r, pos.c, hero.id));
    }

    function firstUnitInDirection(state, origin, delta, maxRange, allowAllyPass = false) {
      let passedAlly = false;
      for (let distance = 1; distance <= maxRange; distance += 1) {
        const r = origin.r + delta.r * distance;
        const c = origin.c + delta.c * distance;
        if (!inside(r, c)) break;
        const enemy = enemyAt(state, r, c);
        if (enemy) return { enemy, distance, delta };
        const hero = heroAt(state, r, c);
        if (hero) {
          if (allowAllyPass && !passedAlly) {
            passedAlly = true;
            continue;
          }
          break;
        }
      }
      return null;
    }

    function getAttackTargets(state, hero) {
      if (!hero.alive) return [];

      if (hero.type === "blade" || hero.type === "shield" || hero.type === "banner") {
        return ORTHOGONAL
          .map(delta => enemyAt(state, hero.r + delta.r, hero.c + delta.c))
          .filter(Boolean)
          .map(enemy => ({ r: enemy.r, c: enemy.c, enemyId: enemy.id }));
      }

      if (hero.type === "spear") {
        const ranges = state.upgrades.spearFlexible ? [1, 2] : [2];
        const targets = [];
        for (const delta of ORTHOGONAL) {
          for (const distance of ranges) {
            const r = hero.r + delta.r * distance;
            const c = hero.c + delta.c * distance;
            if (!inside(r, c)) continue;
            let blocked = false;
            for (let step = 1; step < distance; step += 1) {
              if (occupied(state, hero.r + delta.r * step, hero.c + delta.c * step, hero.id)) {
                blocked = true;
                break;
              }
            }
            if (!blocked) {
              const enemy = enemyAt(state, r, c);
              if (enemy) targets.push({ r, c, enemyId: enemy.id });
            }
          }
        }
        return targets;
      }

      if (hero.type === "bow") {
        return ORTHOGONAL
          .map(delta => firstUnitInDirection(state, hero, delta, 4, false))
          .filter(Boolean)
          .map(result => ({
            r: result.enemy.r,
            c: result.enemy.c,
            enemyId: result.enemy.id,
            delta: result.delta
          }));
      }

      return [];
    }

    function adjacentGuardian(state, target) {
      return state.enemies.find(enemy =>
        enemy.alive &&
        enemy.type === "guardian" &&
        enemy.id !== target.id &&
        manhattan(enemy, target) === 1
      ) || null;
    }

    function damageEnemy(state, enemyId, amount, sourceHero = null) {
      const enemy = state.enemies.find(unit => unit.id === enemyId && unit.alive);
      if (!enemy) return { hit: false, killed: false, blocked: false };

      const guardian = adjacentGuardian(state, enemy);
      if (guardian && !enemy.shieldBroken) {
        enemy.shieldBroken = true;
        return { hit: false, killed: false, blocked: true };
      }

      let finalAmount = amount;
      if (sourceHero && state.upgrades.finisher && enemy.hp < enemy.maxHp) finalAmount += 1;
      enemy.hp -= finalAmount;
      if (enemy.hp <= 0) {
        enemy.alive = false;
        return { hit: true, killed: true, blocked: false };
      }
      return { hit: true, killed: false, blocked: false };
    }

    function applyBasicAttack(state, hero, enemyId) {
      const target = state.enemies.find(enemy => enemy.id === enemyId && enemy.alive);
      if (!target) return;
      const direction = { r: Math.sign(target.r - hero.r), c: Math.sign(target.c - hero.c) };
      damageEnemy(state, enemyId, 1, hero);

      if (hero.type === "bow" && state.upgrades.bowPierce) {
        let foundFirst = false;
        for (let distance = 1; distance <= 5; distance += 1) {
          const r = hero.r + direction.r * distance;
          const c = hero.c + direction.c * distance;
          if (!inside(r, c)) break;
          const enemy = enemyAt(state, r, c);
          if (enemy) {
            if (!foundFirst && enemy.id === enemyId) {
              foundFirst = true;
              continue;
            }
            if (foundFirst) {
              damageEnemy(state, enemy.id, 1, hero);
              break;
            }
          }
          const ally = heroAt(state, r, c);
          if (ally && ally.id !== hero.id) break;
        }
      }
    }

    function generateSolverActions(state, hero) {
      const actions = [{ kind: "wait" }, { kind: "guard" }];
      for (const target of getMoveTargets(state, hero)) {
        actions.push({ kind: "move", r: target.r, c: target.c });
      }
      for (const target of getAttackTargets(state, hero)) {
        actions.push({ kind: "attack", enemyId: target.enemyId });
      }
      return actions;
    }

    function applySolverAction(state, heroId, action) {
      const hero = state.heroes.find(unit => unit.id === heroId && unit.alive);
      if (!hero) return;
      if (action.kind === "guard") hero.guard = 1;
      if (action.kind === "move") {
        hero.r = action.r;
        hero.c = action.c;
      }
      if (action.kind === "attack") applyBasicAttack(state, hero, action.enemyId);
    }

    function countFlawlessLines(limit = 12) {
      const initial = cloneState(game);
      const heroOrder = initial.heroes.filter(hero => hero.alive).map(hero => hero.id);
      let count = 0;

      function search(state, index) {
        if (count >= limit) return;
        if (index >= heroOrder.length) {
          const result = cloneState(state);
          simulateEnemyPhase(result);
          const beaconTaken = result.enemies.some(enemy => enemy.alive && enemy.r === BEACON.r && enemy.c === BEACON.c);
          if (result.damageEvents === 0 && !beaconTaken && result.heroes.some(hero => hero.alive)) count += 1;
          return;
        }

        const hero = state.heroes.find(unit => unit.id === heroOrder[index] && unit.alive);
        if (!hero) {
          search(state, index + 1);
          return;
        }

        const actions = generateSolverActions(state, hero);
        for (const action of actions) {
          if (count >= limit) break;
          const next = cloneState(state);
          applySolverAction(next, hero.id, action);
          search(next, index + 1);
        }
      }

      search(initial, 0);
      return count;
    }

    function planPressure(plan) {
      const values = {
        explode: 10,
        shoot: 9,
        attackPush: 8,
        charge: 7,
        attack: 6,
        pull: 5,
        move: 3,
        mark: 1,
        wait: 0
      };
      return values[plan.kind] || 0;
    }

    function ensureFlawlessLine() {
      let safe = countFlawlessLines(12);
      if (safe > 0) {
        game.safeLines = safe;
        return;
      }

      const candidates = aliveEnemies()
        .filter(enemy => enemy.plan.kind !== "wait")
        .sort((a, b) => planPressure(b.plan) - planPressure(a.plan) || b.order - a.order);

      for (const enemy of candidates) {
        enemy.plan = { kind: "wait", forced: true };
        safe = countFlawlessLines(12);
        if (safe > 0) break;
      }

      game.safeLines = Math.max(1, safe);
    }

    function damageHero(state, heroId, attackerId = null, melee = false) {
      const hero = state.heroes.find(unit => unit.id === heroId && unit.alive);
      if (!hero) return { blocked: false, killed: false };

      if (hero.guard > 0) {
        hero.guard -= 1;
        if (state.upgrades.counter && melee && attackerId) {
          const attacker = state.enemies.find(enemy => enemy.id === attackerId && enemy.alive);
          if (attacker && manhattan(attacker, hero) === 1) damageEnemy(state, attacker.id, 1, null);
        }
        return { blocked: true, killed: false };
      }

      if (hero.armor > 0) {
        hero.armor -= 1;
        return { blocked: true, killed: false };
      }

      if (state.upgrades.reserve && !state.reserveUsed) {
        state.reserveUsed = true;
        return { blocked: true, killed: false };
      }

      hero.wound += 1;
      state.damageEvents = (state.damageEvents || 0) + 1;
      if (hero.wound >= 2) {
        hero.alive = false;
        return { blocked: false, killed: true };
      }
      return { blocked: false, killed: false };
    }

    function pushHero(state, hero, enemy) {
      if (state.upgrades.brace) return;
      const dr = Math.sign(hero.r - enemy.r);
      const dc = Math.sign(hero.c - enemy.c);
      const r = hero.r + dr;
      const c = hero.c + dc;
      if (inside(r, c) && !occupied(state, r, c, hero.id)) {
        hero.r = r;
        hero.c = c;
      }
    }

    function executePlan(state, enemy, plan) {
      if (!enemy.alive || plan.kind === "wait") return;

      if (plan.kind === "move" || plan.kind === "charge") {
        for (const step of plan.path || []) {
          if (!enemy.alive) break;
          const hero = heroAt(state, step.r, step.c);
          if (hero) {
            damageHero(state, hero.id, enemy.id, true);
            break;
          }
          const blocker = enemyAt(state, step.r, step.c);
          if (blocker && blocker.id !== enemy.id) break;
          enemy.r = step.r;
          enemy.c = step.c;
        }
        return;
      }

      if (plan.kind === "attack" || plan.kind === "shoot" || plan.kind === "attackPush") {
        const hero = heroAt(state, plan.target.r, plan.target.c);
        if (!hero) return;
        const result = damageHero(state, hero.id, enemy.id, plan.kind !== "shoot");
        if (plan.kind === "attackPush" && !result.blocked && hero.alive) pushHero(state, hero, enemy);
        return;
      }

      if (plan.kind === "pull") {
        const hero = heroAt(state, plan.target.r, plan.target.c);
        if (!hero) return;
        const r = hero.r + Math.sign(enemy.r - hero.r);
        const c = hero.c + Math.sign(enemy.c - hero.c);
        if (!occupied(state, r, c, hero.id)) {
          hero.r = r;
          hero.c = c;
        }
        return;
      }

      if (plan.kind === "mark") {
        enemy.bombArmed = true;
        enemy.bombTarget = { ...plan.center };
        return;
      }

      if (plan.kind === "explode") {
        const heroIds = state.heroes
          .filter(hero => hero.alive && Math.abs(hero.r - plan.center.r) <= 1 && Math.abs(hero.c - plan.center.c) <= 1)
          .map(hero => hero.id);
        const enemyIds = state.enemies
          .filter(unit => unit.alive && Math.abs(unit.r - plan.center.r) <= 1 && Math.abs(unit.c - plan.center.c) <= 1)
          .map(unit => unit.id);

        for (const heroId of heroIds) damageHero(state, heroId, enemy.id, false);
        for (const enemyId of enemyIds) damageEnemy(state, enemyId, 2, null);
        enemy.alive = false;
      }
    }

    function simulateEnemyPhase(state) {
      const ordered = state.enemies
        .filter(enemy => enemy.alive)
        .slice()
        .sort((a, b) => (a.order || 999) - (b.order || 999));
      for (const enemy of ordered) {
        const liveEnemy = state.enemies.find(unit => unit.id === enemy.id && unit.alive);
        if (liveEnemy) executePlan(state, liveEnemy, liveEnemy.plan);
      }
    }

    function availableEnemyTypes(round) {
      const types = ["grunt"];
      if (round >= 4) types.push("raider");
      if (round >= 7) types.push("archer");
      if (round >= 10) types.push("brute");
      if (round >= 13) types.push("hook");
      if (round >= 16) types.push("guardian");
      if (round >= 20) types.push("bomber");
      return types;
    }

    function edgeCells() {
      const result = [];
      for (let i = 0; i < SIZE; i += 1) {
        result.push({ r: 0, c: i });
        result.push({ r: SIZE - 1, c: i });
      }
      for (let i = 1; i < SIZE - 1; i += 1) {
        result.push({ r: i, c: 0 });
        result.push({ r: i, c: SIZE - 1 });
      }
      return result;
    }

    function prepareIncoming() {
      const liveCount = aliveEnemies().length;
      const cap = Math.min(17, 7 + Math.floor(game.round / 2));
      let count = 1;
      if (game.round >= 4) count = 2;
      if (game.round >= 10) count = 3;
      if (game.round >= 22) count = 4;
      count = Math.max(0, Math.min(count, cap - liveCount));

      const freeEdges = shuffle(edgeCells().filter(pos => !occupied(game, pos.r, pos.c)));
      const types = availableEnemyTypes(game.round);
      const incoming = [];

      for (let i = 0; i < count && i < freeEdges.length; i += 1) {
        let type = types[randomInt(types.length)];
        if (type === "bomber" && incoming.some(item => item.type === "bomber")) type = "grunt";
        incoming.push({ ...freeEdges[i], type });
      }

      game.incoming = incoming;
    }

    function spawnIncoming() {
      for (const spawn of game.incoming) {
        if (!occupied(game, spawn.r, spawn.c)) {
          game.enemies.push(makeEnemy(spawn.type, spawn.r, spawn.c));
        }
      }
      game.incoming = [];
    }

    function planThreatCells(enemy) {
      const plan = enemy.plan || { kind: "wait" };
      if (["attack", "shoot", "attackPush", "pull"].includes(plan.kind)) return [plan.target];
      if (["move", "charge"].includes(plan.kind)) return plan.path || [];
      if (["mark", "explode"].includes(plan.kind)) {
        const area = [];
        for (let dr = -1; dr <= 1; dr += 1) {
          for (let dc = -1; dc <= 1; dc += 1) {
            const r = plan.center.r + dr;
            const c = plan.center.c + dc;
            if (inside(r, c)) area.push({ r, c });
          }
        }
        return area;
      }
      return [];
    }

    function intentSymbol(enemy) {
      const plan = enemy.plan || { kind: "wait" };
      if (plan.kind === "wait") return plan.stunned ? "×" : "·";
      if (plan.kind === "attack" || plan.kind === "attackPush") return "!";
      if (plan.kind === "shoot") return "—";
      if (plan.kind === "pull") return "↶";
      if (plan.kind === "mark") return "○";
      if (plan.kind === "explode") return "×";
      if ((plan.kind === "move" || plan.kind === "charge") && plan.path && plan.path.length) {
        return directionSymbol(enemy, plan.path[0]);
      }
      return "·";
    }

    function render() {
      const selected = selectedHero();
      const moveTargets = selected && !selected.acted && interactionMode === "normal" ? getMoveTargets(game, selected) : [];
      const attackTargets = selected && !selected.acted && interactionMode === "normal" ? getAttackTargets(game, selected) : [];
      const specialTargets = selected && !selected.acted && interactionMode === "special" ? getSpecialTargets(selected) : [];
      const moveKeys = new Set(moveTargets.map(pos => key(pos.r, pos.c)));
      const attackKeys = new Set(attackTargets.map(pos => key(pos.r, pos.c)));
      const specialKeys = new Set(specialTargets.map(pos => key(pos.r, pos.c)));
      const threatKeys = new Set();
      const markedKeys = new Set();

      for (const enemy of aliveEnemies()) {
        for (const pos of planThreatCells(enemy)) {
          threatKeys.add(key(pos.r, pos.c));
          if (enemy.plan.kind === "mark") markedKeys.add(key(pos.r, pos.c));
        }
      }

      for (const cell of cells) {
        const r = Number(cell.dataset.r);
        const c = Number(cell.dataset.c);
        const cellKey = key(r, c);
        cell.className = "cell";
        cell.innerHTML = "";

        if (threatKeys.has(cellKey)) cell.classList.add("threat");
        if (markedKeys.has(cellKey)) cell.classList.add("marked");
        if (moveKeys.has(cellKey)) cell.classList.add("move");
        if (attackKeys.has(cellKey)) cell.classList.add("attack");

        if (specialKeys.has(cellKey)) {
          const targetHero = heroAt(game, r, c);
          cell.classList.add(targetHero ? "move" : "attack");
        }

        if (r === BEACON.r && c === BEACON.c) {
          const beacon = document.createElement("div");
          beacon.className = "beacon";
          cell.appendChild(beacon);
        }

        const hero = heroAt(game, r, c);
        const enemy = enemyAt(game, r, c);
        const spawn = game.incoming.find(item => item.r === r && item.c === c);

        if (hero) cell.appendChild(renderHero(hero));
        else if (enemy) cell.appendChild(renderEnemy(enemy));
        else if (spawn) cell.appendChild(renderSpawn(spawn));
      }

      roundLabel.textContent = String(game.round).padStart(2, "0");
      enemyCount.textContent = String(aliveEnemies().length).padStart(2, "0");
      renderSquad();
      renderControls();
    }

    function renderHero(hero) {
      const unit = document.createElement("div");
      unit.className = "unit hero";
      if (hero.id === selectedHeroId) unit.classList.add("selected");
      if (hero.acted) unit.classList.add("acted");
      unit.textContent = HERO_DATA[hero.type].letter;
      unit.title = HERO_DATA[hero.type].name;

      if (hero.wound > 0) {
        const wound = document.createElement("span");
        wound.className = "wound-mark";
        unit.appendChild(wound);
      }

      if (hero.armor > 0) {
        const armor = document.createElement("span");
        armor.className = "armor-mark";
        unit.appendChild(armor);
      }

      if (hero.cooldown > 0) {
        const cooldown = document.createElement("span");
        cooldown.className = "cooldown-mark";
        cooldown.textContent = String(hero.cooldown);
        unit.appendChild(cooldown);
      }

      return unit;
    }

    function renderEnemy(enemy) {
      const unit = document.createElement("div");
      unit.className = "unit enemy";
      if (enemy.hp < enemy.maxHp) unit.classList.add("damaged");
      unit.textContent = ENEMY_DATA[enemy.type].letter;
      unit.title = enemy.type.toUpperCase();

      const intent = document.createElement("span");
      intent.className = "intent-mark";
      intent.textContent = intentSymbol(enemy);
      unit.appendChild(intent);

      const order = document.createElement("span");
      order.className = "order-mark";
      order.textContent = String(enemy.order || "");
      unit.appendChild(order);
      return unit;
    }

    function renderSpawn(spawn) {
      const unit = document.createElement("div");
      unit.className = "spawn-ghost";
      unit.textContent = ENEMY_DATA[spawn.type].letter;
      unit.title = `Incoming ${spawn.type}`;
      return unit;
    }

    function renderSquad() {
      squadStatus.innerHTML = "";
      for (const hero of game.heroes) {
        const dot = document.createElement("span");
        dot.className = "squad-dot";
        if (!hero.alive) dot.classList.add("lost");
        else if (hero.wound) dot.classList.add("wounded");
        squadStatus.appendChild(dot);
      }
    }

    function renderControls() {
      const hero = selectedHero();
      const canAct = Boolean(hero && !hero.acted && game.phase === "player");
      guardButton.disabled = !canAct;
      specialButton.disabled = !canAct || hero.cooldown > 0;
      specialButton.classList.toggle("special-ready", canAct && hero.cooldown === 0);
      endButton.disabled = game.phase !== "player";

      if (!hero) {
        unitLine.textContent = game.phase === "player" ? "SELECT A UNIT" : "";
        specialButton.textContent = "SPECIAL";
      } else {
        const data = HERO_DATA[hero.type];
        const stateText = hero.wound ? " · WOUNDED" : "";
        unitLine.textContent = `${data.name}${stateText}`;
        specialButton.textContent = hero.cooldown > 0 ? `${data.special} ${hero.cooldown}` : data.special;
      }
    }

    function onCellClick(event) {
      if (game.phase !== "player" || game.over) return;
      const cell = event.currentTarget;
      const r = Number(cell.dataset.r);
      const c = Number(cell.dataset.c);
      const clickedHero = heroAt(game, r, c);
      const clickedEnemy = enemyAt(game, r, c);
      const hero = selectedHero();

      if (interactionMode === "special" && hero) {
        if (useTargetedSpecial(hero, r, c)) return;
        interactionMode = "normal";
      }

      if (clickedHero && !clickedHero.acted) {
        selectedHeroId = clickedHero.id;
        interactionMode = "normal";
        render();
        return;
      }

      if (!hero || hero.acted) return;

      const move = getMoveTargets(game, hero).find(pos => pos.r === r && pos.c === c);
      if (move) {
        hero.r = r;
        hero.c = c;
        hero.acted = true;
        selectedHeroId = null;
        render();
        return;
      }

      const attack = getAttackTargets(game, hero).find(pos => pos.r === r && pos.c === c);
      if (attack && clickedEnemy) {
        applyBasicAttack(game, hero, clickedEnemy.id);
        hero.acted = true;
        selectedHeroId = null;
        render();
      }
    }

    guardButton.addEventListener("click", () => {
      const hero = selectedHero();
      if (!hero || hero.acted || game.phase !== "player") return;
      hero.guard = 1;
      hero.acted = true;
      selectedHeroId = null;
      render();
    });

    specialButton.addEventListener("click", () => {
      const hero = selectedHero();
      if (!hero || hero.acted || hero.cooldown > 0 || game.phase !== "player") return;

      if (hero.type === "blade") {
        for (const delta of ORTHOGONAL) {
          const enemy = enemyAt(game, hero.r + delta.r, hero.c + delta.c);
          if (enemy) damageEnemy(game, enemy.id, game.upgrades.bladePower, hero);
        }
        finishSpecial(hero);
        return;
      }

      if (hero.type === "shield") {
        const offsets = game.upgrades.shieldDiagonal
          ? [
              ...ORTHOGONAL,
              { r: -1, c: -1 }, { r: -1, c: 1 },
              { r: 1, c: -1 }, { r: 1, c: 1 },
              { r: 0, c: 0 }
            ]
          : [...ORTHOGONAL, { r: 0, c: 0 }];
        for (const delta of offsets) {
          const ally = heroAt(game, hero.r + delta.r, hero.c + delta.c);
          if (ally) ally.guard = Math.max(ally.guard, 1);
        }
        finishSpecial(hero);
        return;
      }

      interactionMode = "special";
      render();
    });

    function getSpecialTargets(hero) {
      if (hero.type === "spear") {
        const targets = [];
        for (const delta of ORTHOGONAL) {
          const result = firstUnitInDirection(game, hero, delta, 3, false);
          if (result) targets.push({ r: result.enemy.r, c: result.enemy.c, enemyId: result.enemy.id });
        }
        return targets;
      }

      if (hero.type === "bow") {
        const targets = [];
        for (const delta of ORTHOGONAL) {
          const result = firstUnitInDirection(game, hero, delta, 5, false);
          if (result) targets.push({ r: result.enemy.r, c: result.enemy.c, enemyId: result.enemy.id, delta });
        }
        return targets;
      }

      if (hero.type === "banner") {
        return aliveHeroes()
          .filter(ally => ally.id !== hero.id && ally.acted && manhattan(ally, hero) <= game.upgrades.bannerRange)
          .map(ally => ({ r: ally.r, c: ally.c, heroId: ally.id }));
      }

      return [];
    }

    function useTargetedSpecial(hero, r, c) {
      const target = getSpecialTargets(hero).find(pos => pos.r === r && pos.c === c);
      if (!target) return false;

      if (hero.type === "spear") {
        const enemy = game.enemies.find(unit => unit.id === target.enemyId && unit.alive);
        if (enemy) {
          damageEnemy(game, enemy.id, 1, hero);
          if (enemy.alive) enemy.stunned = Math.max(enemy.stunned, 1);
        }
        finishSpecial(hero);
        return true;
      }

      if (hero.type === "bow") {
        const enemy = game.enemies.find(unit => unit.id === target.enemyId && unit.alive);
        if (enemy) damageEnemy(game, enemy.id, 1, hero);
        let passedTarget = false;
        for (let distance = 1; distance <= 6; distance += 1) {
          const rr = hero.r + target.delta.r * distance;
          const cc = hero.c + target.delta.c * distance;
          if (!inside(rr, cc)) break;
          const other = enemyAt(game, rr, cc);
          if (other) {
            if (!passedTarget && other.id === target.enemyId) {
              passedTarget = true;
              continue;
            }
            if (passedTarget) {
              damageEnemy(game, other.id, 1, hero);
              break;
            }
          }
          const ally = heroAt(game, rr, cc);
          if (ally && ally.id !== hero.id) break;
        }
        finishSpecial(hero);
        return true;
      }

      if (hero.type === "banner") {
        const ally = game.heroes.find(unit => unit.id === target.heroId && unit.alive);
        if (ally) ally.acted = false;
        finishSpecial(hero);
        return true;
      }

      return false;
    }

    function finishSpecial(hero) {
      hero.cooldown = Math.max(2, 4 - game.upgrades.cooldownReduction);
      hero.acted = true;
      selectedHeroId = null;
      interactionMode = "normal";
      render();
    }

    endButton.addEventListener("click", endPlayerTurn);

    async function endPlayerTurn() {
      if (game.phase !== "player" || game.over) return;
      game.phase = "enemy";
      selectedHeroId = null;
      interactionMode = "normal";
      render();

      const ordered = aliveEnemies().slice().sort((a, b) => (a.order || 999) - (b.order || 999));
      for (const plannedEnemy of ordered) {
        if (game.over) break;
        const enemy = game.enemies.find(unit => unit.id === plannedEnemy.id && unit.alive);
        if (!enemy) continue;
        executePlan(game, enemy, enemy.plan);
        render();
        flashBoard();
        await delay(105);
        checkGameOver();
      }

      if (game.over) return;
      spawnIncoming();
      game.enemies = game.enemies.filter(enemy => enemy.alive);
      checkGameOver();
      if (game.over) return;

      game.completedRounds = game.round;
      if (game.completedRounds % 5 === 0) {
        showUpgradeChoices();
      } else {
        game.round += 1;
        beginRound();
      }
    }

    function delay(ms) {
      return new Promise(resolve => setTimeout(resolve, ms));
    }

    function flashBoard() {
      boardEl.classList.remove("flash");
      void boardEl.offsetWidth;
      boardEl.classList.add("flash");
    }

    function checkGameOver() {
      const noHeroes = !game.heroes.some(hero => hero.alive);
      const beaconTaken = game.enemies.some(enemy => enemy.alive && enemy.r === BEACON.r && enemy.c === BEACON.c);
      if (noHeroes || beaconTaken) endGame();
    }

    function endGame() {
      game.over = true;
      game.phase = "over";
      finalRound.textContent = String(game.completedRounds || Math.max(0, game.round - 1));
      gameOverOverlay.classList.add("show");
      render();
    }

    const UPGRADE_POOL = [
      {
        id: "bladePower",
        max: 2,
        symbol: "B+",
        name: "HEAVY EDGE",
        text: "Blade Cleave deals one more damage.",
        apply() { game.upgrades.bladePower += 1; }
      },
      {
        id: "shieldDiagonal",
        max: 1,
        symbol: "D+",
        name: "WIDE GUARD",
        text: "Fortress also protects diagonal allies.",
        apply() { game.upgrades.shieldDiagonal = true; }
      },
      {
        id: "spearFlexible",
        max: 1,
        symbol: "P+",
        name: "SHORT GRIP",
        text: "Spear may attack at range one or two.",
        apply() { game.upgrades.spearFlexible = true; }
      },
      {
        id: "bowPierce",
        max: 1,
        symbol: "A+",
        name: "PIERCING SHOT",
        text: "Bow basic attacks may hit a second enemy.",
        apply() { game.upgrades.bowPierce = true; }
      },
      {
        id: "bannerRange",
        max: 1,
        symbol: "N+",
        name: "LONG RALLY",
        text: "Banner may Rally an ally two spaces away.",
        apply() { game.upgrades.bannerRange = 2; }
      },
      {
        id: "counter",
        max: 1,
        symbol: "↺",
        name: "COUNTER",
        text: "A guarded adjacent attacker takes one damage.",
        apply() { game.upgrades.counter = true; }
      },
      {
        id: "cooldown",
        max: 2,
        symbol: "★",
        name: "QUICK SPECIALS",
        text: "All special cooldowns become one round shorter.",
        apply() { game.upgrades.cooldownReduction += 1; }
      },
      {
        id: "reserve",
        max: 1,
        symbol: "◇",
        name: "LAST STAND",
        text: "The first unguarded hit each round is blocked.",
        apply() { game.upgrades.reserve = true; }
      },
      {
        id: "brace",
        max: 1,
        symbol: "▣",
        name: "BRACE",
        text: "Your warriors can no longer be pushed.",
        apply() { game.upgrades.brace = true; }
      },
      {
        id: "finisher",
        max: 1,
        symbol: "×2",
        name: "FINISHER",
        text: "Attacks deal one extra damage to wounded enemies.",
        apply() { game.upgrades.finisher = true; }
      },
      {
        id: "medic",
        max: 99,
        symbol: "+",
        name: "FIELD MEDIC",
        text: "Heal every surviving wounded warrior.",
        apply() {
          for (const hero of aliveHeroes()) hero.wound = 0;
        }
      },
      {
        id: "armor",
        max: 99,
        symbol: "□",
        name: "LIGHT PLATE",
        text: "Every surviving warrior blocks one future hit.",
        apply() {
          for (const hero of aliveHeroes()) hero.armor += 1;
        }
      },
      {
        id: "focus",
        max: 99,
        symbol: "◎",
        name: "BATTLE FOCUS",
        text: "Every surviving warrior's special becomes ready.",
        apply() {
          for (const hero of aliveHeroes()) hero.cooldown = 0;
        }
      },
      {
        id: "rescue",
        max: 99,
        symbol: "●",
        name: "RESCUE",
        text: "Return one lost warrior in a wounded state.",
        available() { return game.heroes.some(hero => !hero.alive); },
        apply() { reviveOneHero(); }
      }
    ];

    function showUpgradeChoices() {
      game.phase = "upgrade";
      selectedHeroId = null;
      interactionMode = "normal";
      const options = getUpgradeOptions(3);
      upgradeCards.innerHTML = "";

      for (const upgrade of options) {
        const card = document.createElement("button");
        card.type = "button";
        card.className = "card";

        const symbol = document.createElement("div");
        symbol.className = "card-symbol";
        symbol.textContent = upgrade.symbol;

        const name = document.createElement("div");
        name.className = "card-name";
        name.textContent = upgrade.name;

        const text = document.createElement("div");
        text.className = "card-text";
        text.textContent = upgrade.text;

        card.append(symbol, name, text);
        card.addEventListener("click", () => chooseUpgrade(upgrade));
        upgradeCards.appendChild(card);
      }

      upgradeOverlay.classList.add("show");
      render();
    }

    function getUpgradeOptions(count) {
      let available = UPGRADE_POOL.filter(upgrade => {
        const rank = game.upgradeRanks[upgrade.id] || 0;
        const condition = typeof upgrade.available === "function" ? upgrade.available() : true;
        return condition && rank < upgrade.max;
      });

      if (available.length < count) {
        available = available.concat(UPGRADE_POOL.filter(upgrade => ["medic", "armor", "focus"].includes(upgrade.id)));
      }

      const choices = [];
      for (const upgrade of shuffle(available)) {
        if (!choices.some(choice => choice.id === upgrade.id)) choices.push(upgrade);
        if (choices.length >= count) break;
      }
      return choices;
    }

    function chooseUpgrade(upgrade) {
      game.upgradeRanks[upgrade.id] = (game.upgradeRanks[upgrade.id] || 0) + 1;
      upgrade.apply();
      upgradeOverlay.classList.remove("show");
      game.round += 1;
      beginRound();
    }

    function reviveOneHero() {
      const fallen = game.heroes.find(hero => !hero.alive);
      if (!fallen) return;
      const positions = [
        { r: 3, c: 3 },
        { r: 3, c: 2 }, { r: 3, c: 4 },
        { r: 2, c: 3 }, { r: 4, c: 3 },
        ...edgeCells()
      ];
      const open = positions.find(pos => inside(pos.r, pos.c) && !occupied(game, pos.r, pos.c));
      if (!open) return;
      fallen.alive = true;
      fallen.wound = 1;
      fallen.acted = true;
      fallen.guard = 0;
      fallen.cooldown = 0;
      fallen.r = open.r;
      fallen.c = open.c;
    }

    restartButton.addEventListener("click", newGame);

    createBoard();
    newGame();
  </script>
</body>

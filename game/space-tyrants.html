<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#050817">
<title>Space Tyrants: Galactic Mandate</title>
<style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#030511}</style>
</head>
<body>
<script>
(async()=>{
  const patchFiles=[
    './space-tyrants/tactical-expanse-base.js',
    './space-tyrants/tactical-expanse-strategy.js',
    './space-tyrants/tactical-expanse-combat.js',
    './space-tyrants/tactical-expanse-ui.js',
    './space-tyrants/fleet-clarity.js',
    './space-tyrants/military-trade-network.js',
    './space-tyrants/directive-impact.js',
    './space-tyrants/directive-guarantees.js',
    './space-tyrants/mandate-economy.js',
    './space-tyrants/invasion-fleet-assembly.js',
    './space-tyrants/supply-deadlocks.js',
    './space-tyrants/supply-emergency.js',
    './space-tyrants/project-priority-specialization.js',
    './space-tyrants/war-directive-balance.js',
    './space-tyrants/orbital-logistics.js',
    './space-tyrants/rival-diplomacy.js',
    './space-tyrants/enemy-war-pressure.js',
    './space-tyrants/defense-escalation-camera.js',
    './space-tyrants/fleet-command-allocation.js',
    './space-tyrants/warfare-balance-pass.js',
    './space-tyrants/fleet-retask-availability.js'
  ];
  const [core,...patchParts]=await Promise.all([
    fetch('./space-tyrants-core.html',{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error(`Core load failed: ${r.status}`);return r.text()}),
    ...patchFiles.map(path=>fetch(path,{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error(`Tactical layer load failed (${path}): ${r.status}`);return r.text()}))
  ]);
  const marker='})();\n</scr'+'ipt>';
  const at=core.lastIndexOf(marker);
  if(at<0)throw new Error('Space Tyrants core injection marker was not found');
  const patch=patchParts.join('\n');
  const html=core.slice(0,at)+`\n/* TACTICAL EXPANSE PATCH */\n${patch}\n`+core.slice(at);
  document.open();document.write(html);document.close();
})().catch(err=>{
  console.error('[Space Tyrants] loader failure',err);
  document.body.innerHTML='<div style="font:16px system-ui;color:#eef5ff;padding:32px">Space Tyrants could not load. Open the console for details.</div>';
});
</script>
</body>
</html>

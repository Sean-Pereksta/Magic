<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
  <title>🐭 Cat vs Mouse</title>
  <style>
    html,body{margin:0;min-height:100%;background:#030806;color:#ecfdf5;font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif}
    body{display:grid;place-items:center;min-height:100vh;background:radial-gradient(circle at 50% -10%,#173c27 0,#07120c 44%,#020504 100%)}
    .boot{width:min(540px,90vw);padding:26px;border:1px solid rgba(134,239,172,.24);border-radius:22px;background:rgba(4,15,10,.94);box-shadow:0 28px 76px rgba(0,0,0,.52)}
    .title{font-size:clamp(1.6rem,5vw,2.25rem);font-weight:950}.copy{margin-top:8px;color:#bbf7d0;line-height:1.45}.track{height:12px;margin-top:18px;border-radius:999px;background:#14251b;overflow:hidden}.fill{height:100%;width:38%;border-radius:inherit;background:linear-gradient(90deg,#22c55e,#bef264);animation:load 1s ease-in-out infinite alternate}.status{margin-top:10px;color:#d1fae5;font-size:.82rem}@keyframes load{to{width:88%}}
  </style>
</head>
<body>
  <main class="boot" role="status" aria-live="polite">
    <div class="title">🐭 Preparing Cat &amp; Mouse</div>
    <div class="copy">Loading the smoother battlefield and faster capped enemy simulation.</div>
    <div class="track"><div class="fill"></div></div>
    <div id="status" class="status">Loading battle engine…</div>
  </main>
<script>
(async () => {
  const CORE_URL = './catandmouse-core.html';
  const status = document.getElementById('status');
  let html = '';

  function exact(label, oldText, newText){
    const first = html.indexOf(oldText);
    if (first < 0) throw new Error('Patch target missing: ' + label);
    if (html.indexOf(oldText, first + oldText.length) >= 0) throw new Error('Patch target duplicated: ' + label);
    html = html.slice(0, first) + newText + html.slice(first + oldText.length);
  }

  function pattern(label, rx, replacement){
    rx.lastIndex = 0;
    if (!rx.test(html)) throw new Error('Patch target missing: ' + label);
    rx.lastIndex = 0;
    html = html.replace(rx, replacement);
  }

  function patch(){
    exact('hard difficulty subtitle', 'hard: { icon:"🐀", label:"Hard", subtitle:"More rats, faster cat", className:"difficulty-hard" }', 'hard: { icon:"🐀", label:"Hard", subtitle:"Faster hunters, harder hits", className:"difficulty-hard" }');
    exact('nightmare difficulty subtitle', 'insane: { icon:"💀", label:"Nightmare", subtitle:"The cat is hunting", className:"difficulty-nightmare" }', 'insane: { icon:"💀", label:"Nightmare", subtitle:"Relentless pursuit", className:"difficulty-nightmare" }');
    exact('easy difficulty settings', 'easy:   { label:"Easy",   catStartHealth:1000, ratBaseHealth:4, oxBaseHealth:18 }', 'easy:   { label:"Easy",   catStartHealth:1000, ratBaseHealth:4, oxBaseHealth:18, enemySpeed:0.92 }');
    exact('medium difficulty settings', 'medium: { label:"Medium", catStartHealth:1500, ratBaseHealth:5, oxBaseHealth:26 }', 'medium: { label:"Medium", catStartHealth:1500, ratBaseHealth:5, oxBaseHealth:26, enemySpeed:1.00 }');
    exact('hard difficulty settings', 'hard:   { label:"Hard",   catStartHealth:2000, ratBaseHealth:6, oxBaseHealth:34 }', 'hard:   { label:"Hard",   catStartHealth:2000, ratBaseHealth:6, oxBaseHealth:34, enemySpeed:1.10 }');
    exact('nightmare difficulty settings', 'insane: { label:"Insane", catStartHealth:3000, ratBaseHealth:8, oxBaseHealth:44 }', 'insane: { label:"Insane", catStartHealth:3000, ratBaseHealth:8, oxBaseHealth:44, enemySpeed:1.20 }');

    exact('MAX_RATS', 'const MAX_RATS = 18;', 'const MAX_RATS = 10;');
    exact('MAX_FLEAS', 'const MAX_FLEAS = 24;', 'const MAX_FLEAS = 8;');
    exact('MAX_TOTAL_ENEMIES', 'const MAX_TOTAL_ENEMIES = 36;', 'const MAX_TOTAL_ENEMIES = 22;');
    exact('MAX_PROJECTILES', 'const MAX_PROJECTILES = 80;', 'const MAX_PROJECTILES = 64;');
    exact('AI budget', 'const ENEMIES_AI_PER_FRAME = 6;', 'const ENEMIES_AI_PER_FRAME = 5;\n  const MAX_FRIENDLY_RABBITS = 12;');

    pattern('enemy caps', /  function getEnemyCaps\(activePlayerCount = getActivePlayerCount\(\)\)\{[\s\S]*?\n  \}\n  function getPendingEnemyCount/, `  function getEnemyCaps(activePlayerCount = getActivePlayerCount()){
    const n = Math.max(1, Math.min(4, activePlayerCount || 1));
    return {
      rat:[0,7,8,9,10][n],
      stinkrat:[0,1,2,2,2][n],
      ox:[0,2,2,3,4][n],
      ratking:1,
      vulture:[0,2,2,3,4][n],
      termite:[0,3,3,4,5][n],
      flea:[0,5,6,7,8][n],
      total:[0,15,18,20,22][n]
    };
  }
  function getPendingEnemyCount`);

    pattern('enemy scaling', /  function getEnemyScaling\(waveNumber = Math\.max\(1, catPower \|\| ratPower \|\| 1\)\)\{[^\n]*\}/, `  function getEnemyScaling(waveNumber = Math.max(1, catPower || ratPower || 1)){
    const difficultySpeed = DIFFICULTY_SETTINGS[currentDifficulty]?.enemySpeed ?? 1;
    return {
      healthMultiplier:Math.min(3.0, 1 + Math.max(0, waveNumber - 1) * 0.06),
      damageMultiplier:Math.min(2.25, 1 + Math.max(0, waveNumber - 1) * 0.035),
      speedMultiplier:Math.min(1.75, difficultySpeed * (1 + Math.max(0, waveNumber - 1) * 0.018))
    };
  }`);

    exact('initial terrain texture', '    tile.style.backgroundImage = `url("${getAssetUrl(TERRAIN_ASSETS.grass)}")`;', '    tile.style.backgroundColor = "#68b947";\n    const initialTexture = getTileTexture(x, y);\n    tile.dataset.texture = initialTexture;\n    tile.style.backgroundImage = `url("${getAssetUrl(initialTexture)}")`;');
    exact('terrain render writes', '          cell.style.backgroundColor = "#68b947";\n          cell.style.backgroundImage = `url("${getAssetUrl(getTileTexture(x, y))}")`;', '          const tileTexture = getTileTexture(x, y);\n          if (cell.dataset.texture !== tileTexture){\n            cell.dataset.texture = tileTexture;\n            cell.style.backgroundImage = `url("${getAssetUrl(tileTexture)}")`;\n          }');

    pattern('pathfinding engine', /  function findPath\(startX, startY, targetX, targetY, allowTargetWallOrPassable = false\)\{[\s\S]*?\n  \}\n\n  function getNearestReachableStructureTarget/, `  let pathQueueBuffer = null;
  let pathParentBuffer = null;
  function ensurePathBuffers(){
    const total = gridSize * gridSize;
    if (!pathQueueBuffer || pathQueueBuffer.length !== total){
      pathQueueBuffer = new Int32Array(total);
      pathParentBuffer = new Int32Array(total);
    }
    return { queue:pathQueueBuffer, parent:pathParentBuffer };
  }

  function findPath(startX, startY, targetX, targetY, allowTargetWallOrPassable = false){
    if (startX===targetX && startY===targetY) return [];
    if (startX<0 || startY<0 || targetX<0 || targetY<0 || startX>=gridSize || startY>=gridSize || targetX>=gridSize || targetY>=gridSize) return null;
    const { queue, parent } = ensurePathBuffers();
    parent.fill(-2);
    let head = 0, tail = 0;
    const startIdx = startY * gridSize + startX;
    const targetIdx = targetY * gridSize + targetX;
    queue[tail++] = startIdx;
    parent[startIdx] = -1;
    const passableFn = (typeof allowTargetWallOrPassable === "function") ? allowTargetWallOrPassable : null;
    const allowTargetWall = (typeof allowTargetWallOrPassable === "boolean") ? allowTargetWallOrPassable : false;
    const directions = [[1,0],[-1,0],[0,1],[0,-1]];
    while (head < tail){
      const idx = queue[head++];
      if (idx === targetIdx) break;
      const x = idx % gridSize;
      const y = Math.floor(idx / gridSize);
      for (const [dx,dy] of directions){
        const nx = x + dx, ny = y + dy;
        if (nx<0 || nx>=gridSize || ny<0 || ny>=gridSize) continue;
        const nextIdx = ny * gridSize + nx;
        if (parent[nextIdx] !== -2) continue;
        const isTarget = nextIdx === targetIdx;
        const cell = grid[ny][nx];
        const isWall = (cell==="🧱" || cell==="💎" || cell==="🧊");
        const ok = passableFn ? !!passableFn(nx, ny) : (!isWall || (allowTargetWall && isTarget));
        if (!ok) continue;
        parent[nextIdx] = idx;
        queue[tail++] = nextIdx;
      }
    }
    if (parent[targetIdx] === -2) return null;
    const reversed = [];
    for (let idx = targetIdx; idx !== startIdx && idx >= 0; idx = parent[idx]){
      reversed.push({ x:idx % gridSize, y:Math.floor(idx / gridSize) });
    }
    reversed.reverse();
    return reversed;
  }

  const STRUCTURE_PATH_CANDIDATE_LIMIT = 16;
  function getStructurePathCandidates(startX, startY, limit = STRUCTURE_PATH_CANDIDATE_LIMIT){
    const candidates = getAllStructures().slice();
    candidates.sort((a,b) =>
      (Math.abs(a.x-startX)+Math.abs(a.y-startY)) - (Math.abs(b.x-startX)+Math.abs(b.y-startY)) ||
      a.y-b.y || a.x-b.x
    );
    return candidates.slice(0, Math.max(1, limit));
  }

  function getNearestReachableStructureTarget`);
    exact('reachable structure shortlist', '  function getNearestReachableStructureTarget(startX, startY, passableFn = null){\n    let best = null;\n    for (const s of getAllStructures()){', '  function getNearestReachableStructureTarget(startX, startY, passableFn = null){\n    let best = null;\n    for (const s of getStructurePathCandidates(startX, startY)){');
    exact('contact structure shortlist', '  function getNearestStructureContactTarget(startX, startY, passableFn){\n    let best = null;\n    for (const s of getAllStructures()){', '  function getNearestStructureContactTarget(startX, startY, passableFn){\n    let best = null;\n    for (const s of getStructurePathCandidates(startX, startY)){');

    exact('cat speed', '    const speed = Math.max(190, Math.floor((1300 - catPower * 40) / CAT_SPEED_MULTIPLIER));', '    const difficultySpeed = DIFFICULTY_SETTINGS[currentDifficulty]?.enemySpeed ?? 1;\n    const speed = Math.max(165, Math.floor((1300 - catPower * 40) / (CAT_SPEED_MULTIPLIER * difficultySpeed)));');
    exact('rat wave budget', '    const maxRats = catPower;\n    const ratReservation = reserveEnemySpawnSlots("rat", maxRats);', '    const activePlayers = getActivePlayerCount();\n    const baseWaveRats = [0,2,3,4,5][activePlayers];\n    const lateWaveBonus = Math.min(2, Math.floor(Math.max(0, catPower - 10) / 12));\n    const waveRatBudget = Math.min(getEnemyCaps(activePlayers).rat, baseWaveRats + lateWaveBonus);\n    const ratReservation = reserveEnemySpawnSlots("rat", waveRatBudget);');
    exact('rat think budget', '    const RAT_THINK_INTERVAL_MS = 350;\n    const RAT_REPATH_JITTER_MS = 200;', '    // Fast movement is separated from expensive thinking/repathing.\n    const RAT_THINK_INTERVAL_MS = 500;\n    const RAT_REPATH_JITTER_MS = 260;');

    pattern('enemy movement loops', /    \/\/ enemy sim ticks[\s\S]*?    \}, 700\);\n\n    \/\/ phoenix revive/, `    // Speed-scaled self-scheduling loops keep enemies dangerous without raising entity count.
    const scheduleEnemyTick = (fn, baseMs, minMs, extraMultiplier = 1) => {
      const scheduleNext = () => {
        if (!hostInitialized) return;
        const scaling = getEnemyScaling(Math.max(1, catPower || ratPower || 1));
        const delay = Math.max(minMs, Math.floor(baseMs / Math.max(0.85, scaling.speedMultiplier * extraMultiplier)));
        setTimeout(async () => {
          if (canRunHostSimulation()) await fn().catch(()=>{});
          if (hostInitialized) scheduleNext();
        }, delay);
      };
      scheduleNext();
    };
    scheduleEnemyTick(hostMoveRats, 760 / RAT_SPEED_MULTIPLIER, 190, 1.05);
    scheduleEnemyTick(hostMoveOxen, 800, 430, 0.88);
    scheduleEnemyTick(hostMoveRatKings, 700, 390, 0.95);
    scheduleEnemyTick(hostMoveVultures, 600, 300, 1.08);
    scheduleEnemyTick(hostMoveStinkRats, 700, 360, 1.02);
    scheduleEnemyTick(hostMoveTermites, 400, 220, 1.12);
    scheduleEnemyTick(hostMoveFleas, 700, 360, 1.05);

    // phoenix revive`);

    exact('rabbit cap start', '  async function rabbitDenTick(){\n    // spawn rabbits from dens\n    if (!window.__lastRabbitSpawnAt) window.__lastRabbitSpawnAt = {};\n    for (const den of getStructuresByType("🐇")){', '  async function rabbitDenTick(){\n    // Friendly helpers also get a global ceiling so large den networks cannot create runaway simulation load.\n    if (!window.__lastRabbitSpawnAt) window.__lastRabbitSpawnAt = {};\n    let livingRabbitCount = rabbits.filter(r => (r.health ?? 0) > 0).length;\n    for (const den of getStructuresByType("🐇")){\n      if (livingRabbitCount >= MAX_FRIENDLY_RABBITS) break;');
    exact('rabbit cap increment', '      await runtimeSetDoc(ccRef(ID.rabbit(id)), { kind:"rabbit", id, x, y, health:5, createdAt:Date.now() }, { merge:true });\n      window.__lastRabbitSpawnAt[denKey] = Date.now();', '      await runtimeSetDoc(ccRef(ID.rabbit(id)), { kind:"rabbit", id, x, y, health:5, createdAt:Date.now() }, { merge:true });\n      livingRabbitCount++;\n      window.__lastRabbitSpawnAt[denKey] = Date.now();');

    exact('menu subtitle', '<p class="war-room-subtitle">Build a shared fortress, collect cheese, and outmaneuver an increasingly dangerous cat.</p>', '<p class="war-room-subtitle">Build smart, move fast, and survive a smaller but increasingly deadly enemy force.</p>');
    pattern('menu run preview', /      <div class="menu-feature-strip" aria-label="Game highlights">[\s\S]*?      <\/div>\n\n      <div class="menu-dashboard">/, `      <div class="menu-feature-strip" aria-label="Current run pressure">
        <div><strong id="menuThreatCap">15</strong><span>Hostile cap</span></div>
        <div><strong id="menuEnemySpeed">1.00×</strong><span>Enemy speed</span></div>
        <div><strong id="menuCatAbilities">0</strong><span>Cat abilities</span></div>
        <div><strong id="menuDifficultyPressure">Medium</strong><span>Selected danger</span></div>
      </div>

      <div class="menu-dashboard">`);
    exact('menu pressure data', '    const label = DIFFICULTY_SETTINGS[currentDifficulty]?.label || "Medium";\n    const myVoteLabel = myDifficultyVote ? (DIFFICULTY_SETTINGS[myDifficultyVote]?.label || myDifficultyVote) : "none";', '    const label = DIFFICULTY_SETTINGS[currentDifficulty]?.label || "Medium";\n    const myVoteLabel = myDifficultyVote ? (DIFFICULTY_SETTINGS[myDifficultyVote]?.label || myDifficultyVote) : "none";\n    const previewCaps = getEnemyCaps();\n    const previewScaling = getEnemyScaling(Math.max(1, catPower || ratPower || 1));\n    const threatCapEl = document.getElementById("menuThreatCap");\n    const enemySpeedEl = document.getElementById("menuEnemySpeed");\n    const catAbilitiesEl = document.getElementById("menuCatAbilities");\n    const pressureEl = document.getElementById("menuDifficultyPressure");\n    if (threatCapEl) threatCapEl.textContent = String(previewCaps.total);\n    if (enemySpeedEl) enemySpeedEl.textContent = previewScaling.speedMultiplier.toFixed(2) + "×";\n    if (catAbilitiesEl) catAbilitiesEl.textContent = currentDifficulty === "insane" ? "2" : currentDifficulty === "hard" ? "1" : "0";\n    if (pressureEl) pressureEl.textContent = label;');

    const markers = ['rat:[0,7,8,9,10][n]','total:[0,15,18,20,22][n]','speedMultiplier:Math.min(1.75','STRUCTURE_PATH_CANDIDATE_LIMIT = 16','MAX_FRIENDLY_RABBITS = 12','scheduleEnemyTick(hostMoveRats, 760 / RAT_SPEED_MULTIPLIER, 190, 1.05)','id="menuThreatCap"'];
    for (const marker of markers) if (!html.includes(marker)) throw new Error('Validation marker missing: ' + marker);
    return html;
  }

  try {
    status.textContent = 'Loading game core…';
    const response = await fetch(CORE_URL, {cache:'no-cache'});
    if (!response.ok) throw new Error('Core request failed: HTTP ' + response.status);
    html = await response.text();
    status.textContent = 'Applying performance pass…';
    const optimized = patch();
    document.open();
    document.write(optimized);
    document.close();
  } catch (error) {
    console.error('[CatMouse performance loader]', error);
    status.textContent = 'Unable to start optimized game: ' + (error?.message || String(error));
  }
})();
</script>
</body>
</html>

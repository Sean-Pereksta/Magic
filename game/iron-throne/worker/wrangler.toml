name = "iron-throne-diplomacy"
main = "worker.mjs"
compatibility_date = "2026-09-01"
# Keep unrelated dashboard variables; the known-working model is pinned below.
keep_vars = true

[vars]
# Keep in sync with DEFAULT_GEMINI_MODEL in ../gemini-model.mjs.
GEMINI_MODEL = "gemini-3.5-flash"
ALLOWED_ORIGINS = "https://catnmice.com,https://www.catnmice.com"
# Local budgets, NOT claims about Google's allowance. Set below your AI Studio limits.
DAILY_LIMIT = "1500"
REQUESTS_PER_MINUTE = "50"
CLIENT_PER_MINUTE = "50"

[[durable_objects.bindings]]
name = "BUDGET"
class_name = "DiplomacyBudget"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["DiplomacyBudget"]

# Optional: install a separate SESSION_SECRET for diplomacy session signing.
# Install GEMINI_API_KEY and TURNSTILE_SECRET with `wrangler secret put`.
# Use a Gemini Free Tier project without billing. No keys belong in this file.

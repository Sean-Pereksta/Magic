<!doctype html>
<html lang="en">
<head>
<script type="module" src="/hub/play-signal.mjs" data-catnmice-game="cat" data-confirmed="engine"></script>

  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#101f1c">
  <title>Cat &amp; Mouse · Flour Mill</title>
  <link rel="stylesheet" href="edition.css">
  <script type="module" src="app.mjs"></script>
</head>
<body>
  <main id="menu" class="menu">
    <header class="masthead">
      <a href="https://www.catnmice.com/lobby/lobby.html#live-lobbies" id="arcade-link" class="back">← Magic Arcade</a>
      <span id="edition-label">FLOUR MILL</span>
    </header>
    <div class="menu-layout">
      <div class="screen" id="screen"></div>
    </div>
    <footer class="menu-footer"><span>CAT &amp; MOUSE</span><span id="record"></span></footer>
  </main>
  <main id="battle" class="battle" hidden>
    <canvas id="field" aria-label="Flour Mill battlefield" tabindex="0"></canvas>
    <div class="hud-top">
      <section class="hud-group player-meter" aria-label="Your resources">
        <span class="hud-label">CHEESE</span><b id="cheese">0</b>
        <span class="hud-label">HEALTH</span><b id="health">0</b>
      </section>
      <section class="hud-group wave" aria-label="Wave status">
        <span id="wave-title">The Mill</span><strong id="wave-clock"></strong>
        <span id="objective"></span>
        <span id="threat-hint" hidden></span>
      </section>
      <details id="battle-overview" class="hud-group overview" open>
        <summary id="overview-toggle" aria-label="Map and teammates">Map</summary>
        <div id="overview-body">
          <canvas id="minimap" width="132" height="132" aria-label="Battlefield overview"></canvas>
          <div class="camera-controls"><button id="zoom-out" title="Zoom out" aria-label="Zoom out">−</button><button id="camera" title="Toggle camera lock" aria-label="Toggle camera lock">◎</button><button id="zoom-in" title="Zoom in" aria-label="Zoom in">+</button></div>
          <div id="teammates" aria-label="Teammates"></div>
        </div>
      </details>
    </div>
    <button id="battle-menu" class="battle-menu secondary">Menu</button>
    <div id="network-status" class="network-status" role="status" hidden></div>
    <div class="hud-bottom">
      <div id="build-aim">
        <p id="build-info" role="status">WASD or arrow keys to move · tap the floor to walk</p>
        <div class="build-aim-actions">
          <button id="build-cancel" class="secondary" type="button">Cancel</button>
          <button id="build-place" type="button" disabled>Place</button>
        </div>
      </div>
      <button id="build-toggle" type="button" aria-expanded="false" aria-controls="build-tray">Build</button>
      <div id="build-tray">
        <div id="build-bar" class="build-bar" aria-label="Build loadout"></div>
      </div>
    </div>
  </main>
  <dialog id="overlay">
    <div id="overlay-content"></div>
  </dialog>
  <noscript>This game needs JavaScript to run.</noscript>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Cheesehold 3D</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#06080d}#game{position:fixed;inset:0;width:100%;height:100%;border:0;background:#06080d}
</style>
</head>
<body>
<iframe id="game" title="Cheesehold 3D"></iframe>
<script>
(async()=>{
  const frame=document.getElementById('game');
  try{
    let html=await fetch('./Cheesehold_3D_Progression_Upgrade_core.html',{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error('Core '+r.status);return r.text()});
    const expansion=await fetch('./cheesehold-three-wave-expansion.js',{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error('Expansion '+r.status);return r.text()});
    const lateGame=await fetch('./cheesehold-late-game-expansion.js',{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error('Late game '+r.status);return r.text()});
    const saveSystem=await fetch('./cheesehold-save-system.js',{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error('Save system '+r.status);return r.text()});
    const progressiveBuildCosts=await fetch('./cheesehold-progressive-build-costs.js',{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error('Build costs '+r.status);return r.text()});
    const waveSpawnPatch=`
function minionUpdate(){
 const w=game.wave;
 if(!w||w.clearAt!=null||w.spawned>=w.quota)return;
 if(game.time>=game.nextMinion){
   spawnEnemy();
   if(game.round>=4&&Math.random()<.22&&enemies.length<enemyCap()&&w.spawned<w.quota)spawnEnemy();
   game.nextMinion=game.time+Math.max(.78,2.9-game.round*.07-(w.number-1)*.18);
 }
}`;

    const sizeToken='const COLS=21,ROWS=17,CELL=1.22;';
    if(!html.includes(sizeToken))throw new Error('Arena-size patch target not found');
    html=html.replace(sizeToken,'const COLS=27,ROWS=21,CELL=1.22;');

    const hudCss=`
#hud{top:max(6px,env(safe-area-inset-top));left:7px;right:7px;gap:5px;align-items:flex-start}
#hud .row{gap:4px;flex-wrap:nowrap}
#hud .pill{min-width:0;padding:5px 7px;border-radius:9px;box-shadow:0 6px 18px rgba(0,0,0,.18)}
#hud .k{font-size:6px;letter-spacing:.03em;line-height:1;text-transform:none}
#hud .v{font-size:12px;line-height:1.05;margin-top:1px}
#hud .bar{width:64px;height:7px;margin-top:3px}
#hud .xpbar{width:58px;height:4px;margin-top:3px}
#hud #xpPill{min-width:68px}
#hud .row:last-child .pill:nth-child(2){display:none!important}
#abilityPill{min-width:76px!important;max-width:92px}
#catAbility{font-size:10px!important;max-width:82px!important}
#theme{top:43px;padding:5px 10px;max-width:68vw}
#theme .themeName{font-size:7px}
#theme .themeSub{display:block;font-size:7px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:62vw}
@media(max-width:760px){#hud{top:max(4px,env(safe-area-inset-top));left:4px;right:4px}#hud .pill{padding:4px 5px}#hud .k{font-size:5px}#hud .v{font-size:10px}#hud .bar{width:50px}#hud .xpbar{width:48px}#theme{top:38px;max-width:76vw}#theme .themeSub{max-width:70vw;font-size:6px}}
`;
    html=html.replace('</style>',hudCss+'</style>');
    html=html.replace('>Cheese<','>🧀<').replace('>Round<','>R<').replace('>Kills<','>K<').replace('>Mouse HP<','>♥<').replace('>Cat Power<','>CAT<').replace('XP · Lv ','Lv ');
    html=html.replace("ui.catAbilityTime.textContent='Unlocks round 2'","ui.catAbilityTime.textContent='R2'")
             .replace("ui.catAbilityTime.textContent='ACTIVATING'","ui.catAbilityTime.textContent='NOW'")
             .replace("ui.catAbilityTime.textContent='Boss defeated'","ui.catAbilityTime.textContent='DONE'");

    const fixedCamera=`let playerSilhouette=null,silhouetteFor=null,occlusionRay=new THREE.Raycaster(),silhouetteMaterialCache=new Map();
function makeMouseSilhouette(){const g=mouseMesh();g.traverse(n=>{if(!n.isMesh)return;n.castShadow=false;n.receiveShadow=false;n.renderOrder=999;n.frustumCulled=false;const mats=Array.isArray(n.material)?n.material:[n.material];n.material=mats.map((m,i)=>{const key=(m?.uuid||'mat')+':'+i;let sm=silhouetteMaterialCache.get(key);if(!sm){sm=new THREE.MeshBasicMaterial({color:0x160608,transparent:true,opacity:.9,depthTest:false,depthWrite:false,side:THREE.DoubleSide,toneMapped:false});silhouetteMaterialCache.set(key,sm)}return sm});if(n.material.length===1)n.material=n.material[0]});const outline=g.clone(true);outline.traverse(n=>{if(!n.isMesh)return;n.renderOrder=998;n.frustumCulled=false;n.material=new THREE.MeshBasicMaterial({color:0xff2738,transparent:true,opacity:.98,depthTest:false,depthWrite:false,side:THREE.BackSide,toneMapped:false});n.scale.multiplyScalar(1.13)});g.add(outline);g.scale.multiplyScalar(1.05);g.visible=false;return g;}
function meshOccludesPlayer(root,targetDistance){if(!root?.visible)return false;occlusionRay.camera=camera;const targets=[];root.traverse(n=>{if(n.visible!==false&&n.isMesh)targets.push(n)});if(!targets.length)return false;const hits=occlusionRay.intersectObjects(targets,false);return hits.some(h=>h.distance<targetDistance-.18);}
function mouseOccluded(){if(!player?.mesh)return false;const target=player.mesh.position.clone().add(new THREE.Vector3(0,.4,0)),ray=target.clone().sub(camera.position),distance=ray.length();if(distance<=.2)return false;occlusionRay.set(camera.position,ray.normalize());if(meshOccludesPlayer(terrainGroup,distance))return true;for(const b of buildings){if(!b.dead&&meshOccludesPlayer(b.mesh,distance))return true}return false;}
function updateMouseSilhouette(){if(!player?.mesh){if(playerSilhouette)playerSilhouette.visible=false;return}if(!playerSilhouette||silhouetteFor!==player.mesh.uuid){if(playerSilhouette){entityGroup.remove(playerSilhouette);disposeObject(playerSilhouette)}playerSilhouette=makeMouseSilhouette();silhouetteFor=player.mesh.uuid;entityGroup.add(playerSilhouette)}playerSilhouette.position.copy(player.mesh.position);playerSilhouette.quaternion.copy(player.mesh.quaternion);playerSilhouette.visible=mouseOccluded();}
function cameraUpdate(dt){if(!player)return;const p=player.mesh.position,target=new THREE.Vector3(p.x,0,p.z),portrait=innerHeight>innerWidth,base=portrait?new THREE.Vector3(9.2,12.4,12.5):new THREE.Vector3(10.2,11.3,12.8),desired=target.clone().add(base);camera.position.lerp(desired,1-Math.pow(.001,dt));const look=target.clone().add(new THREE.Vector3(0,.35,-1.0));camera.lookAt(look);dirLight.target.position.lerp(target,.08);pointLight.position.lerp(target.clone().add(new THREE.Vector3(0,4.6,0)),.05);updateMouseSilhouette();}`;

    const cameraPattern=/function cameraObstructionScore\(corner\)\{[\s\S]*?function cameraUpdate\(dt\)\{[\s\S]*?\nfunction updateUI\(\)\{/;
    if(!cameraPattern.test(html))throw new Error('Camera patch target not found');
    html=html.replace(cameraPattern,fixedCamera+'\nfunction updateUI(){');

    const safeBuild=`function buildDirection(dirIndex=player?.lastDir){
 if(!game.running||game.paused||!player||dirIndex==null)return false;const d=DIRS[dirIndex],x=player.gx+d.x,y=player.gy+d.y,def=BUILDINGS[activeBuild],existing=buildAt(x,y);
 if(existing)return upgradeBuilding(existing);if(!inside(x,y)){buildFail('Outside the arena');return false}if(terrain.has(K(x,y))){buildFail('Terrain blocks that cell');return false}const cost=structureCost(activeBuild);if(game.cheese<cost){buildFail('Need '+cost+' cheese');return false}if((cat&&!cat.dead&&cat.gx===x&&cat.gy===y)||enemies.some(e=>!e.dead&&e.gx===x&&e.gy===y)){buildFail('An enemy occupies that cell');return false}
 let mesh=null,b=null;try{mesh=buildingMesh(activeBuild,1,null,null);mesh.position.copy(worldPos(x,y));const bar=healthBar(activeBuild==='superwall'?1.15:.92);b={id:idCounter++,type:activeBuild,level:1,evolution:null,capstone:null,gx:x,gy:y,mesh,hp:1,maxHp:1,dead:false,next:game.time+.5,repairNext:0,charges:activeBuild==='poison'?5+game.mods.poisonCharges:0,bar,hitFlashUntil:0};b.maxHp=buildingMaxHp(b);b.hp=b.maxHp;bar.position.y=activeBuild==='superwall'?1.55:(activeBuild==='wall'?1.18:1.32);mesh.add(bar);registerHitMaterials(mesh);entityGroup.add(mesh);buildings.push(b);game.cheese-=cost;noteStructureBuilt();pulse(x,y,def.color,.75);toast(def.name+' built · next base cost rises');updateUI();return true}catch(err){console.error('[Cheesehold] build failed',err);if(b){buildings=buildings.filter(v=>v!==b)}if(mesh){try{entityGroup.remove(mesh);disposeObject(mesh)}catch{}}buildFail('Build failed safely');return false}
}`;
    const buildPattern=/function buildDirection\(dirIndex=player\?\.lastDir\)\{[\s\S]*?\n\}\nfunction buildFacing\(\)/;
    if(!buildPattern.test(html))throw new Error('Build patch target not found');
    html=html.replace(buildPattern,safeBuild+'\nfunction buildFacing()');

    const scopeClose=/\}\)\(\);\s*<\/script>\s*<\/body>\s*<\/html>\s*$/;
    if(!scopeClose.test(html))throw new Error('Expansion scope target not found');
    html=html.replace(scopeClose,expansion+'\n'+waveSpawnPatch+'\n'+lateGame+'\n'+saveSystem+'\n'+progressiveBuildCosts+'\nconst progressiveBeginRound=beginRound;beginRound=function(first=false){resetRoundStructurePricing();return progressiveBeginRound(first);};\n})();\n<'+'/script>\n</body>\n</html>');

    frame.srcdoc=html;
  }catch(err){
    document.body.innerHTML='<div style="font:16px system-ui;color:white;padding:24px">Cheesehold failed to load: '+String(err.message||err)+'</div>';
  }
})();
</script>
</body>
</html>
